function showLesson(){let l=lessons[lesson];app.innerHTML=`<div class="panel"><div class="count">บทเรียน ${lesson+1} / ${lessons.length}</div><h1 class="lesson-title">${l[1]} · ${l[0]}</h1><div class="lead">${l[2]}</div><table class="table">${l[3].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table><div class="tip">💡 จุดเน้นสำหรับครู: ${l[4]}</div><div class="nav"><button class="btn ghost" onclick="lesson=Math.max(0,lesson-1);render()">⬅ ย้อนหน้า</button><span class="count">${lesson+1} / ${lessons.length}</span><button class="btn primary" onclick="${lesson===lessons.length-1?'start()':'lesson++;render()'}">${lesson===lessons.length-1?'🎮 เริ่มเกม':'หน้าถัดไป ➡'}</button></div><button class="btn ghost" onclick="page='home';render()">🏠 หน้าปก</button></div>`}
function start(){answers=Array(25).fill(null);idx=0;page='quiz';play('tap');render()}
function quiz(){let q=bank[idx],ans=answers[idx],count=answers.filter(a=>a!==null).length;app.innerHTML=`<div class="panel"><div class="nav"><span class="count">🧪 ภารกิจ ${idx+1} / 25 · ตอบแล้ว ${count}/25</span><button class="btn ghost" onclick="lesson=0;page='lesson';render()">📚 กลับไปทบทวน</button></div><div class="chips">${answers.map((a,i)=>`<button class="chip ${a===null?'':a===bank[i][5]?'ok':'bad'} ${i===idx?'current':''}" onclick="idx=${i};render()">${i+1}</button>`).join('')}</div><div class="question">ข้อ ${idx+1}. ${q[0]}</div><div class="answers">${q.slice(1,5).map((a,i)=>`<button class="answer ${ans===null?'':i===q[5]?'correct':i===ans?'wrong':''}" ${ans!==null?'disabled':''} onclick="choose(${i})"><b>${'ABCD'[i]}</b><span>${a}</span></button>`).join('')}</div>${ans===null?'':`<div class="explain">${ans===q[5]?'✅ ตอบถูกด้วยตัวเอง!':'❌ คำตอบที่เลือก: '+ 'ABCD'[ans] +' · คำตอบที่ถูก: '+ 'ABCD'[q[5]]}<div>🔍 ${q[6]}</div></div>`}<div class="nav"><button class="btn ghost" onclick="idx=Math.max(0,idx-1);render()">⬅ ข้อก่อนหน้า</button><button class="btn primary" onclick="next()">${idx===24?'🏆 สรุปผล':'ข้อถัดไป ➡'}</button></div><div class="small">ย้อนดูคำตอบได้ทุกข้อ แต่คะแนนคิดจากคำตอบแรกเท่านั้น · ไม่จับเวลาเพื่อฝึกคิดวิเคราะห์</div></div>`}
function choose(a){if(answers[idx]!==null)return;answers[idx]=a;play(a===bank[idx][5]?'ok':'bad');render();if(a===bank[idx][5]){let el=document.createElement('div');el.className='spark';el.textContent='✨🧪✨';el.style.left='48%';el.style.top='65%';document.body.appendChild(el);setTimeout(()=>el.remove(),1100)}}
function next(){if(idx===24){page='results';play('end')}else idx++;render()}
function results(){let done=answers.filter(a=>a!==null).length,score=answers.filter((a,i)=>a===bank[i][5]).length;app.innerHTML=`<div class="panel"><h1 class="lesson-title" style="text-align:center">🏆 สรุปผลการทดลอง</h1><div class="score">${score} / 25 ⭐</div><p class="lead" style="text-align:center">ตอบถูกเอง ${score} ข้อ · ตอบผิด ${done-score} ข้อ · ยังไม่ตอบ ${25-done} ข้อ</p><div class="tip">แตะหมายเลขข้อเพื่อย้อนดูโจทย์ คำตอบที่เลือก และเหตุผลได้ทุกข้อ</div><div class="chips">${answers.map((a,i)=>`<button class="chip ${a===null?'':a===bank[i][5]?'ok':'bad'}" onclick="idx=${i};page='quiz';render()">${i+1} ${a===null?'—':a===bank[i][5]?'✓':'✕'}</button>`).join('')}</div><div class="nav"><button class="btn ghost" onclick="page='home';render()">🏠 หน้าปก</button><button class="btn primary" onclick="start()">🔄 ฝึกใหม่</button></div></div>`}
render();
</script></body></html>
