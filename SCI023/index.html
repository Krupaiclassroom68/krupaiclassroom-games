function start(x=false){if(!x&&!nm())return;$('home').classList.add('hide');$('rev').classList.add('hide');$('game').classList.remove('hide');order=sh([...Q.keys()]);render()}function id(){return order[idx]}function sc(){return Object.values(done).filter(Boolean).length}function nav(){$('nums').innerHTML=order.map((k,i)=>`<button class="num ${i===idx?'cur':''} ${done[k]===true?'ok':done[k]===false?'no':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function render(){let k=id(),x=Q[k];$('hud').textContent=`ข้อ ${idx+1} / 40 • คะแนน ${sc()}`;$('chip').textContent='👤 '+name;$('qchip').textContent='ผู้ทดสอบ: '+name;$('bar').style.width=((idx+1)/40*100)+'%';$('qno').textContent='ECO MISSION '+String(idx+1).padStart(2,'0');$('q').textContent=x.q;$('opts').innerHTML=x.o.map((o,i)=>`<button class="opt ${ans[k]===i?'sel':''}" onclick="sel(${i})" ${k in done?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('');let f=$('fb');if(k in done){f.className='feedback '+(done[k]?'ok':'no');f.innerHTML=`<b>${done[k]?'✓ ถูกต้อง':'✗ ยังไม่ถูก'}</b><br>${x.e}<br><b>คำตอบ: ${x.o[x.a]}</b>`;$('chk').classList.add('hide');$('nxt').classList.remove('hide')}else{f.className='feedback hide';f.innerHTML='';$('chk').classList.remove('hide');$('nxt').classList.add('hide')}nav();scrollTo({top:0,behavior:'smooth'})}
function sel(i){if(!(id() in done)){ans[id()]=i;render()}}function check(){let k=id();if(ans[k]===undefined)return alert('เลือกคำตอบก่อนนะจ๊ะ');done[k]=ans[k]===Q[k].a;done[k]?okS():noS();render()}function go(i){idx=i;render()}function prev(){if(idx){idx--;render()}}function skip(){if(idx<39){idx++;render()}else finishCheck()}function next(){if(idx<39){idx++;render()}else finishCheck()}function finishCheck(){let u=order.findIndex(k=>!(k in done));if(u>=0){idx=u;alert('ยังมีข้อที่ค้าง ระบบพากลับไปทำก่อนค่ะ 🌿');render()}else finish()}function finish(){$('game').classList.add('hide');$('res').classList.remove('hide');let s=sc(),p=Math.round(s/40*100);$('score').textContent=`${s} / 40 • ${p}%`;$('meta').textContent=`ผู้ทดสอบ: ${name} • ${p>=80?'ผ่านเกณฑ์ 80% ✓':'ยังไม่ผ่านเกณฑ์ 80%'}`;$('report').innerHTML=order.map((k,i)=>{let x=Q[k],ok=done[k];return `<div class="ri ${ok?'ok':'no'}"><b>ข้อ ${i+1} ${ok?'✓':'✗'} ${x.q}</b><br>ตอบ: ${x.o[ans[k]]}<br>เฉลย: <b>${x.o[x.a]}</b><br>${x.e}</div>`}).join('');scrollTo(0,0)}
</script></body></html>
