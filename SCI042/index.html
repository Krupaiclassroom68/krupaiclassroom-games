function choose(i){if(answers[quizIndex]!==undefined)return;answers[quizIndex]=i;beep(i===qs[quizIndex][2]);render()}function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('');let h='';if(page===0)h=`<div class="hero"><span class="chip">INTERACTIVE SCIENCE LESSON</span><h1>⚖️ LEVER LAB<br>ภารกิจพิชิต “คาน”</h1><p class="lead">คานช่วยผ่อนแรงได้อย่างไร? ทำไมตำแหน่งจุดหมุนจึงสำคัญ? เรียนรู้ผ่านภาพ ทดลองปรับระยะ และทดสอบความเข้าใจ</p>${leverSVG(1,.5,2)}<div class="row"><button class="primary big" onclick="go(1)">เริ่มเรียนกันเลย 🚀</button><span class="chip">เหมาะกับมือถือ • iPad • ทีวี</span></div></div>`;if(page===1)h=`<h2>🔎 คานคืออะไร?</h2><p class="lead">คานคือเครื่องกลอย่างง่ายที่หมุนรอบ <b>จุดหมุน</b> เพื่อช่วยยก งัด หรือเคลื่อนย้ายวัตถุ</p>${leverSVG()}<div class="cards"><div class="card"><strong>🟠 F = Fulcrum</strong><br>จุดหมุน คือจุดที่คานหมุน</div><div class="card"><strong>🟢 E = Effort</strong><br>แรงพยายาม คือแรงที่เราออก</div><div class="card"><strong>🔴 W = Load</strong><br>แรงต้านทาน คือแรงที่ต้องเอาชนะ</div></div><p class="lead">📏 <b>แขนพยายาม</b> และ <b>แขนต้านทาน</b> วัดจากจุดหมุนถึงแนวแรงในแนวตั้งฉาก</p>`;if(page===2)h=`<h2>🎯 คาน 3 อันดับ • ตัวอย่างครบทุกประเภท</h2><p class="lead">ทบทวนเครื่องมือทั้ง <b>27 ตัวอย่าง</b> พร้อมตำแหน่ง F • E • W แล้วลองเลือกดูเฉพาะอันดับที่อยากจำ</p><div class="row leverTabs"><button class="${kind===0?'primary':''}" onclick="kind=0;render();beep()">🌈 ดูครบทั้ง 3 อันดับ</button>${[1,2,3].map(k=>`<button class="${kind===k?'primary':''}" onclick="kind=${k};render();beep()">คานอันดับ ${k}</button>`).join('')}</div>${(kind===0?[1,2,3]:[kind]).map(k=>`<section class="leverGroup rank${k}"><div class="leverGroupHead"><div class="rankBubble">${k}</div><div><h3>คานอันดับ ${k} — ${['','จุดหมุน (F)','แรงต้านทาน (W)','แรงพยายาม (E)'][k]} อยู่ตรงกลาง</h3><p>${['','อาจผ่อนแรงหรือไม่ผ่อนแรง ขึ้นกับระยะจากจุดหมุน','ผ่อนแรงในคานอุดมคติ','เพิ่มระยะทางหรือความเร็วของปลายคาน แต่ไม่ผ่อนแรง'][k]}</p></div></div>${leverSVG(k,1,2)}${leverExamples(k)}</section>`).join('')}<div class="memoryLine">🧠 จำให้แม่น: <b>อันดับ 1 = F กลาง</b> · <b>อันดับ 2 = W กลาง</b> · <b>อันดับ 3 = E กลาง</b></div><p class="muted">หมายเหตุ: การจัดอันดับขึ้นกับตำแหน่งออกแรง จุดหมุน และแรงต้านทานตามวิธีใช้จริง บางเครื่องมืออาจจัดได้ต่างกันเมื่อเปลี่ยนวิธีใช้งาน</p>`;if(page===3){let e=load*loadArm/effortArm;h=`<h2>🧪 ทดลองคานแบบปรับค่าได้</h2><p class="lead">เลื่อนแถบเพื่อดูว่า <b>แขนพยายามยาวขึ้น</b> จะช่วยลดแรงที่ต้องใช้อย่างไร</p>${leverSVG(1,loadArm,effortArm)}<div class="controls"><div class="control"><label>🔴 แรงต้านทาน W: <span id="vW">${load}</span> N</label><input type="range" min="20" max="300" step="10" value="${load}" oninput="load=+this.value;render()"></div><div class="control"><label>🔴 แขนต้านทาน: ${loadArm} m</label><input type="range" min="0.5" max="2" step="0.5" value="${loadArm}" oninput="loadArm=+this.value;render()"></div><div class="control"><label>🟢 แขนพยายาม: ${effortArm} m</label><input type="range" min="0.5" max="4" step="0.5" value="${effortArm}" oninput="effortArm=+this.value;render()"></div></div><div class="stat">ต้องใช้แรงพยายาม E = ${fmt(e)} นิวตัน</div><div class="formula">${fmt(e)} × ${effortArm} = ${load} × ${loadArm}</div><p class="muted">แบบจำลองคานอุดมคติ คำนวณแรงที่ทำให้สมดุล โดยไม่คิดน้ำหนักคานและแรงเสียดทาน ภาพประกอบไม่แสดงสัดส่วนระยะจริง</p>`}function balanceDiagram(e=30){let left=120*.5,right=e*2,delta=right-left,angle=Math.max(-12,Math.min(12,delta*.3));let state=Math.abs(delta)<.001?'สมดุล — คานไม่เริ่มหมุน':delta>0?'ไม่สมดุล — ด้านแรงพยายามหมุนลง':'ไม่สมดุล — ด้านวัตถุหมุนลง';return `<svg viewBox="0 0 680 255" class="diagram" role="img" aria-label="ภาพคานเปรียบเทียบโมเมนต์สองด้าน"><rect width="680" height="255" rx="22" fill="#eef6ff"/><g transform="rotate(${angle} 340 125)"><line x1="60" y1="125" x2="620" y2="125" stroke="#2563eb" stroke-width="17" stroke-linecap="round"/><path d="M200 125V182" stroke="#dc2626" stroke-width="5"/><path d="M190 171l10 13 10-13" stroke="#dc2626" fill="none" stroke-width="5"/><path d="M585 125V182" stroke="#16a34a" stroke-width="5"/><path d="M575 171l10 13 10-13" stroke="#16a34a" fill="none" stroke-width="5"/><circle cx="200" cy="125" r="17" fill="#dc2626"/><circle cx="585" cy="125" r="17" fill="#16a34a"/><text x="200" y="131" fill="white" font-size="18" text-anchor="middle" font-weight="bold">W</text><text x="585" y="131" fill="white" font-size="18" text-anchor="middle" font-weight="bold">E</text></g><path d="M340 125l-35 83h70z" fill="#f59e0b"/><circle cx="340" cy="125" r="14" fill="#f59e0b"/><text x="200" y="55" fill="#b91c1c" text-anchor="middle" font-size="19" font-weight="bold">W = 120 N</text><text x="585" y="55" fill="#15803d" text-anchor="middle" font-size="19" font-weight="bold">E = ${e} N</text><text x="340" y="235" fill="#854d0e" text-anchor="middle" font-size="17" font-weight="bold">F จุดหมุน</text></svg><div class="cards"><div class="card">🔴 โมเมนต์ด้านวัตถุ<br><strong>120 × 0.5 = 60 N·m</strong></div><div class="card">🟢 โมเมนต์ด้านแรงพยายาม<br><strong>${e} × 2 = ${e*2} N·m</strong></div></div><div class="stat" style="margin-top:12px">${Math.abs(delta)<.001?'⚖️':'↪️'} ${state}</div>`}
function balanceExample(e){document.getElementById('balanceVisual').innerHTML=balanceDiagram(e);document.querySelectorAll('.balanceBtn').forEach(b=>b.classList.toggle('primary',+b.dataset.force===e))}
if(page===4)h=`<h2>📐 หลักโมเมนต์ของแรง</h2><p class="lead">โมเมนต์ของแรง = แรง × ระยะตั้งฉากจากจุดหมุนถึงแนวแรง</p><div class="formula">โมเมนต์ = F × d</div><div class="card" style="background:#fff9e9;border-color:#f9cf80"><strong>⚖️ ภาวะสมดุลคืออะไร?</strong><br>คือสภาวะที่ <b>โมเมนต์ตามเข็มนาฬิกาเท่ากับโมเมนต์ทวนเข็มนาฬิกา</b> หรือโมเมนต์รวมรอบจุดหมุนเป็นศูนย์ คานที่เริ่มต้นอยู่นิ่งจึงไม่หมุน<br><b>อย่าสับสน!</b> F คือจุดหมุนที่คานหมุนรอบได้ ไม่ใช่ “จุดสมดุล” ที่ต้องหาในทุกโจทย์</div><h3>🔬 ลองเปลี่ยนแรง แล้วดูคานเอียง</h3><p>วัตถุหนัก 120 N อยู่ห่างจุดหมุน 0.5 m ส่วนแรงพยายามกระทำที่ระยะ 2 m ต้องใช้แรงเท่าไรจึงสมดุล?</p><div class="row" style="margin-bottom:12px"><button class="balanceBtn" data-force="20" onclick="balanceExample(20)">20 N</button><button class="balanceBtn primary" data-force="30" onclick="balanceExample(30)">30 N</button><button class="balanceBtn" data-force="40" onclick="balanceExample(40)">40 N</button></div><div id="balanceVisual">${balanceDiagram(30)}</div><p class="muted">ภาพจำลองแสดงแนวโน้มการหมุนเมื่อคานเริ่มจากหยุดนิ่ง โดยไม่คิดน้ำหนักคานและแรงเสียดทาน</p><p class="lead">เมื่อคานสมดุล และไม่มีโมเมนต์อื่นมากระทบ:</p><div class="formula">E × L<sub>E</sub> = W × L<sub>W</sub></div><div class="cards"><div class="card"><b>E</b> = แรงพยายาม (N)<br><b>L<sub>E</sub></b> = แขนพยายาม (m)</div><div class="card"><b>W</b> = แรงต้านทาน (N)<br><b>L<sub>W</sub></b> = แขนต้านทาน (m)</div></div><p class="lead">⭐ หน่วยโมเมนต์คือ <b>นิวตัน·เมตร (N·m)</b><br>ยิ่งเพิ่มแขนพยายาม โดยอย่างอื่นคงที่ ยิ่งใช้แรงน้อยลง</p>`;if(page===5)h=`<h2>📝 ฝึกทำโจทย์ทีละขั้น</h2><p class="lead">🎯 ทุกข้อต่อไปนี้สมมติว่า <b>คานอยู่ในภาวะสมดุล</b> จึงใช้โมเมนต์ทั้งสองด้านเท่ากันเพื่อหาแรงหรือระยะที่ไม่ทราบค่า</p><div class="card"><b>โจทย์ที่ 1</b> วัตถุหนัก 120 N อยู่ห่างจุดหมุน 0.5 m ออกแรงที่ระยะ 2 m ต้องใช้แรงเท่าไร?<div class="formula">E × 2 = 120 × 0.5</div><div class="stat">E = 60 ÷ 2 = 30 N ✅</div></div><br><div class="card"><b>โจทย์ที่ 2</b> ออกแรง 40 N ที่ระยะ 1.5 m เพื่อยกวัตถุหนัก 150 N แขนต้านทานยาวเท่าไร?<div class="formula">40 × 1.5 = 150 × L<sub>W</sub></div><div class="stat">L<sub>W</sub> = 60 ÷ 150 = 0.4 m ✅</div></div>`;if(page===6){let q=qs[quizIndex],a=answers[quizIndex],done=Object.keys(answers).length===qs.length;h=`<h2>🏆 Mini Quiz — 5 ข้อ</h2><div class="row between"><span class="chip">ข้อ ${quizIndex+1} / ${qs.length}</span><span class="chip">ตอบแล้ว ${Object.keys(answers).length} ข้อ</span></div><p class="lead"><b>${q[0]}</b></p><div class="choice">${q[1].map((c,i)=>`<button class="${a===i?'selected ':''}${a!==undefined&&i===q[2]?'correct':''} ${a===i&&a!==q[2]?'wrong':''}" onclick="choose(${i})">${'ABCD'[i]}. ${c}</button>`).join('')}</div>${a!==undefined?`<div class="feedback"><b>${a===q[2]?'✅ ถูกต้อง เก่งมาก!':'❌ ยังไม่ถูกนะ'}</b><br>${q[3]}</div>`:''}<div class="bottom"><button onclick="quizIndex=Math.max(0,quizIndex-1);render()">← ข้อก่อนหน้า</button><button class="primary" onclick="quizIndex=Math.min(${qs.length-1},quizIndex+1);render()">ข้อถัดไป →</button></div>${done?`<div class="stat">คะแนนรวม ${qs.filter((q,i)=>answers[i]===q[2]).length} / ${qs.length} 🎉 <button onclick="answers={};quizIndex=0;render()">ลองใหม่</button></div>`:''}`;}if(page===7)h=`<h2>🌟 สรุปก่อนสอบ</h2><div class="cards"><div class="card"><strong>คานอันดับ 1</strong><br>F อยู่ตรงกลาง<br>เช่น กรรไกร ไม้กระดก</div><div class="card"><strong>คานอันดับ 2</strong><br>W อยู่ตรงกลาง<br>เช่น รถเข็นดิน</div><div class="card"><strong>คานอันดับ 3</strong><br>E อยู่ตรงกลาง<br>เช่น แหนบ ไม้กวาด</div></div><div class="formula">E × L<sub>E</sub> = W × L<sub>W</sub></div><p class="lead">จำง่าย ๆ: <b>แขนพยายามยาว → ใช้แรงน้อย</b> และคานช่วยแลกแรงกับระยะทาง ไม่ได้สร้างพลังงานเพิ่ม</p><button class="primary" onclick="go(3)">🔬 กลับไปทดลองคาน</button> <button onclick="answers={};quizIndex=0;go(6)">🧠 ทำ Mini Quiz ใหม่</button>`;document.getElementById('main').innerHTML=frame(h)}render();
// Pen Engine V5 — adapted from verified Equation Scratch Mission; iPad Gesture Lock retained.
const penEl=document.getElementById('penCanvas'),penCtx=penEl.getContext('2d');
let penEnabled=false,penInk='#111827',mode='pen',current=null,drawing=false,activePointer=null;
let strokes=Array.from({length:8},()=>[]);
const penStorageKey='kp_lever_lab_pen_v5_pages';
try{let old=JSON.parse(localStorage.getItem(penStorageKey));if(Array.isArray(old)&&old.length===8)strokes=old}catch(e){}
function savePaper(){try{localStorage.setItem(penStorageKey,JSON.stringify(strokes))}catch(e){}}
function penToggle(){if(current)finishStroke(true);penEnabled=!penEnabled;document.body.classList.toggle('pen-active',penEnabled);document.getElementById('penBar').classList.toggle('expanded',penEnabled);document.getElementById('penToggle').textContent=penEnabled?'✏️ กำลังเขียน':'✏️ เปิดปากกา';redraw()}
function penColor(c,btn){penInk=c;mode='pen';document.querySelectorAll('#penTools .swatch').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function penUndo(){strokes[page].pop();redraw();savePaper()}
function penClear(){if(confirm('ลบลายมือทั้งหมดในหน้านี้หรือไม่?')){strokes[page]=[];redraw();savePaper()}}
function resizeCanvas(){let r=penEl.getBoundingClientRect();let d=Math.min(devicePixelRatio||1,2);penEl.width=Math.round(r.width*d);penEl.height=Math.round(r.height*d);penCtx.setTransform(d,0,0,d,0,0)}
function pos(e){let r=penEl.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}
function px(p){let r=penEl.getBoundingClientRect();return{x:p.x*r.width,y:p.y*r.height}}
function strokeStyle(s){penCtx.globalCompositeOperation=s.erase?'destination-out':'source-over';penCtx.strokeStyle=s.color||'#263238';penCtx.fillStyle=s.color||'#263238';penCtx.lineWidth=s.erase?18:2.7;penCtx.lineCap='round';penCtx.lineJoin='round'}
function drawSegment(a,b,s){strokeStyle(s);penCtx.beginPath();penCtx.moveTo(a.x,a.y);penCtx.lineTo(b.x,b.y);penCtx.stroke();penCtx.globalCompositeOperation='source-over'}
function drawDot(p,s){strokeStyle(s);penCtx.beginPath();penCtx.arc(p.x,p.y,(s.erase?18:2.7)/2,0,Math.PI*2);penCtx.fill();penCtx.globalCompositeOperation='source-over'}
function addPoint(p){if(!current)return;let prev=current.pts.length?px(current.pts[current.pts.length-1]):null;if(prev){let dx=p.x-prev.x,dy=p.y-prev.y;if(dx*dx+dy*dy<.08)return;drawSegment(prev,p,current)}else drawDot(p,current);let r=penEl.getBoundingClientRect();current.pts.push({x:p.x/r.width,y:p.y/r.height})}
function feed(e){let es=(typeof e.getCoalescedEvents==='function'&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];for(const ev of es)addPoint(pos(ev))}
function finishStroke(save=true){if(current&&current.pts.length===0)strokes[page].pop();drawing=false;current=null;activePointer=null;if(save)savePaper()}
function penDown(e){if(!penEnabled)return;if(e.cancelable)e.preventDefault();if(current)finishStroke(false);drawing=true;activePointer=e.pointerId;current={erase:mode==='eraser',color:penInk,pts:[]};strokes[page].push(current);feed(e)}
function penMove(e){if(!drawing||!current||e.pointerId!==activePointer)return;if(e.cancelable)e.preventDefault();feed(e)}
function penUp(e){if(!current||e.pointerId!==activePointer)return;if(e.cancelable)e.preventDefault();feed(e);finishStroke(true)}
function penCancel(e){if(activePointer===null||e.pointerId===activePointer)finishStroke(true)}
function redraw(){let r=penEl.getBoundingClientRect();penCtx.clearRect(0,0,r.width,r.height);for(const s of strokes[page]){if(!s.pts.length)continue;let pts=s.pts.map(px);if(pts.length===1){drawDot(pts[0],s);continue}strokeStyle(s);penCtx.beginPath();penCtx.moveTo(pts[0].x,pts[0].y);for(let k=1;k<pts.length;k++)penCtx.lineTo(pts[k].x,pts[k].y);penCtx.stroke();penCtx.globalCompositeOperation='source-over'}}
/* Pen Engine V5 — iPad Gesture Lock. Keep this block intact. */
const paperEl=penEl;
const blockGesture=e=>{if(paperEl.contains(e.target)){if(e.cancelable)e.preventDefault();e.stopPropagation()}};
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','gestureend'].forEach(type=>paperEl.addEventListener(type,blockGesture,{capture:true,passive:false}));
document.addEventListener('selectionchange',()=>{const sel=window.getSelection&&window.getSelection();if(sel&&sel.rangeCount&&!sel.isCollapsed){const a=sel.anchorNode,f=sel.focusNode;const inside=n=>n&&paperEl.contains(n.nodeType===1?n:n.parentNode);if(inside(a)||inside(f))sel.removeAllRanges()}});
