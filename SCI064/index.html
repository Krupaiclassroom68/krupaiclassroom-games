<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KPC UNIT 05 | ECLIPSE LAB</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#f4f7ff;background:#070f27}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 15%,#24326d 0,transparent 42%),#070f27;min-height:100vh}button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:13px 20px;background:#1c376d;color:white;font-weight:800}button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid #ffdc77}.primary{background:linear-gradient(120deg,#00b4d8,#6656f5)}.shell{max-width:1500px;margin:auto;padding:clamp(12px,2vw,28px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:1px;color:#80eaff}.tag{border:1px solid #526b9b;border-radius:99px;padding:7px 14px;color:#bed5ff}.panel{background:#101d40e8;border:1px solid #354c80;border-radius:28px;padding:clamp(18px,3vw,44px);box-shadow:0 18px 55px #0005;min-height:72vh}.hero{text-align:center;padding:5vh 10px}h1{font-size:clamp(38px,5vw,80px);margin:15px 0;line-height:1.12}h2{font-size:clamp(29px,3.2vw,50px);margin:5px 0 20px}p,li{font-size:clamp(19px,2vw,30px);line-height:1.6}.sub{color:#b5d2ff}.kicker{color:#ffdc77;font-weight:900;letter-spacing:2px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.actions button{font-size:clamp(17px,1.5vw,23px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.tile{border-radius:22px;background:#172b57;padding:20px;border:1px solid #405b91}.tile strong{color:#8deaff;font-size:clamp(22px,2.1vw,32px)}.big{font-size:clamp(24px,2.5vw,38px);font-weight:900}.note{background:#23375f;border-left:6px solid #fdd16e;padding:18px 22px;border-radius:12px;font-size:clamp(18px,1.8vw,26px);margin:18px 0}.diagram{width:100%;height:auto;display:block;background:radial-gradient(ellipse,#1d2a56,#080e24);border:1px solid #435889;border-radius:20px;margin:16px 0}.simbuttons{display:flex;flex-wrap:wrap;gap:10px}.simbuttons button[aria-pressed=true]{background:#f2c660;color:#101a35}.progress{height:8px;background:#1c2e56;border-radius:20px;margin:15px 0 25px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#0ee7d2,#a98dff);transition:width .2s}.option{display:block;width:100%;margin:10px 0;text-align:left;background:#1a315e;border:2px solid #3c5b90;font-size:clamp(19px,1.9vw,28px)}.option:disabled{opacity:.85;cursor:default}.correct{background:#176d55!important;border-color:#62ffc0!important}.wrong{background:#843749!important;border-color:#ff9a9a!important}.feedback{font-size:clamp(19px,1.9vw,28px);padding:18px;border-radius:18px;background:#263c64;margin-top:15px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.pill{display:inline-block;border-radius:99px;padding:7px 16px;background:#223d70;color:#c9e7ff;font-weight:700}.hidden{display:none!important}.stars{font-size:clamp(75px,12vw,165px);line-height:1.3}.small{font-size:clamp(16px,1.4vw,22px)}@media(max-width:700px){.panel{min-height:75vh}.diagram{min-height:190px}.actions button{flex:1}}
</style></head><body><div class="shell"><header><div class="brand">🚀 KRU PAI CLASSROOM · ASTRONOMY ACADEMY</div><div class="tag">UNIT 05 · ECLIPSE LAB</div></header><div class="progress"><div id="bar" style="width:0%"></div></div><main class="panel" id="screen"></main></div><script>
const pages=[
{title:'สุริยุปราคาเกิดอย่างไร?',tag:'LESSON 01',html:`<p>สุริยุปราคาเกิดเมื่อ <b>ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลก</b> และเรียงตัวอยู่ในแนวที่เหมาะสม จนเงาของดวงจันทร์ตกบนพื้นโลก</p><div class="note">☀️ ดวงอาทิตย์ → 🌑 ดวงจันทร์ → 🌍 โลก</div><p>เกิดได้ในช่วง <b>วันเดือนดับ (จันทร์ดับ)</b> แต่ไม่ใช่ทุกวันเดือนดับจะเกิดสุริยุปราคา</p>`},
{title:'จันทรุปราคาเกิดอย่างไร?',tag:'LESSON 02',html:`<p>จันทรุปราคาเกิดเมื่อ <b>โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์</b> และเงาของโลกทอดไปบนดวงจันทร์</p><div class="note">☀️ ดวงอาทิตย์ → 🌍 โลก → 🌕 ดวงจันทร์</div><p>เกิดได้ในช่วง <b>วันเพ็ญ (ขึ้น 15 ค่ำโดยประมาณ)</b> และสังเกตได้จากด้านกลางคืนของโลกที่มองเห็นดวงจันทร์</p>`},
{title:'เงามืดและเงามัว',tag:'LESSON 03',html:`<div class="grid"><div class="tile"><strong>🌑 เงามืด (Umbra)</strong><p>บริเวณที่แสงจากดวงอาทิตย์ถูกบังทั้งหมด ผู้สังเกตในเงามืดของดวงจันทร์อาจเห็นสุริยุปราคาเต็มดวง</p></div><div class="tile"><strong>🌘 เงามัว (Penumbra)</strong><p>บริเวณที่แสงถูกบังเพียงบางส่วน ผู้สังเกตในเงามัวจะเห็นสุริยุปราคาบางส่วน</p></div><div class="tile"><strong>⭕ เงาต่อ (Antumbra)</strong><p>บริเวณเลยปลายเงามืด ซึ่งผู้สังเกตอาจเห็นสุริยุปราคาวงแหวน</p></div></div>`},
{title:'สุริยุปราคา 3 แบบหลัก',tag:'LESSON 04',html:`<div class="grid"><div class="tile"><strong>🌑 เต็มดวง</strong><p>ดวงจันทร์บังดวงอาทิตย์ทั้งหมดจากตำแหน่งผู้สังเกต</p></div><div class="tile"><strong>🌗 บางส่วน</strong><p>ดวงจันทร์บังดวงอาทิตย์เพียงบางส่วน</p></div><div class="tile"><strong>💍 วงแหวน</strong><p>ดวงจันทร์มีขนาดปรากฏเล็กกว่าดวงอาทิตย์ เห็นแสงเป็นวงรอบ</p></div></div><p class="small sub">เพิ่มเติม: สุริยุปราคาแบบผสมอาจเปลี่ยนระหว่างเต็มดวงกับวงแหวนตามตำแหน่งสังเกต</p>`},
{title:'จันทรุปราคา 3 แบบ',tag:'LESSON 05',html:`<div class="grid"><div class="tile"><strong>🌕 เต็มดวง</strong><p>ดวงจันทร์ทั้งดวงเข้าสู่เงามืดของโลก อาจเห็นเป็นสีแดงทองแดง</p></div><div class="tile"><strong>🌗 บางส่วน</strong><p>มีเพียงบางส่วนของดวงจันทร์เข้าสู่เงามืดของโลก</p></div><div class="tile"><strong>🌖 เงามัว</strong><p>ดวงจันทร์ผ่านบริเวณเงามัวของโลก ความสว่างลดลงเล็กน้อย</p></div></div>`},
{title:'ทำไมไม่เกิดอุปราคาทุกเดือน?',tag:'LESSON 06',html:`<p>ระนาบวงโคจรของดวงจันทร์เอียงจากระนาบการโคจรของโลกรอบดวงอาทิตย์ประมาณ <b>5°</b> ทำให้ดวงจันทร์มักผ่านเหนือหรือใต้แนวเงา</p><div class="note">🧠 ต้องเป็นช่วงจันทร์ดับหรือวันเพ็ญ <b>และ</b> อยู่ใกล้จุดตัดระนาบวงโคจร จึงเกิดอุปราคาได้</div>`},
{title:'ห้องทดลอง ECLIPSE LAB',tag:'LESSON 07',sim:true,html:`<p>กดเลือกปรากฏการณ์เพื่อสลับตำแหน่งโลกและดวงจันทร์ สังเกตว่าใครอยู่ตรงกลาง และเงาตกบนวัตถุใด</p><div class="simbuttons"><button id="solar" aria-pressed="true" onclick="setSim('solar')">☀️ สุริยุปราคา</button><button id="lunar" aria-pressed="false" onclick="setSim('lunar')">🌕 จันทรุปราคา</button></div><svg class="diagram" viewBox="0 0 900 320" role="img" aria-label="แผนภาพตำแหน่งดวงอาทิตย์ โลก และดวงจันทร์ ไม่ได้แสดงขนาดตามสัดส่วน"><defs><radialGradient id="sunGlow"><stop stop-color="#fff3ac"/><stop offset=".6" stop-color="#ffba35"/><stop offset="1" stop-color="#ed6526"/></radialGradient><radialGradient id="earthFill"><stop stop-color="#5de0ff"/><stop offset="1" stop-color="#1260ae"/></radialGradient></defs><circle cx="115" cy="160" r="68" fill="url(#sunGlow)"/><text x="115" y="263" text-anchor="middle" fill="white" font-size="24">ดวงอาทิตย์</text><polygon id="shadow" points="410,142 410,178 740,210 740,110" fill="#7889c8" opacity=".28"/><circle id="middle" cx="410" cy="160" r="33" fill="#bbb"/><circle id="last" cx="740" cy="160" r="55" fill="url(#earthFill)"/><text id="midlabel" x="410" y="248" text-anchor="middle" fill="white" font-size="24">ดวงจันทร์</text><text id="lastlabel" x="740" y="263" text-anchor="middle" fill="white" font-size="24">โลก</text></svg><div class="note" id="simnote">สุริยุปราคา: ดวงจันทร์อยู่ตรงกลาง เงาของดวงจันทร์ตกบนโลก</div><p class="small sub">ภาพจำลองเพื่ออธิบายตำแหน่ง ไม่ใช่ขนาด ระยะทาง หรือรูปทรงเงาตามมาตราส่วนจริง</p>`},
{title:'สรุปจำให้แม่นก่อนสอบ',tag:'LESSON 08',html:`<div class="grid"><div class="tile"><strong>☀️ สุริยุปราคา</strong><p>ดวงจันทร์อยู่กลาง · วันเดือนดับ · เงาดวงจันทร์ตกบนโลก · ดูดวงอาทิตย์โดยตรงไม่ปลอดภัย</p></div><div class="tile"><strong>🌕 จันทรุปราคา</strong><p>โลกอยู่กลาง · วันเพ็ญ · เงาโลกตกบนดวงจันทร์ · ดูด้วยตาเปล่าได้</p></div></div><div class="note">⚠️ ห้ามมองดวงอาทิตย์โดยตรงระหว่างสุริยุปราคาโดยไม่มีอุปกรณ์กรองแสงสำหรับดูดวงอาทิตย์ที่ได้มาตรฐาน แว่นกันแดดธรรมดาใช้แทนไม่ได้</div>`}
];
const quiz=[
{q:'สุริยุปราคาเกิดเมื่อวัตถุใดอยู่ตรงกลาง?',a:['โลก','ดวงจันทร์','ดาวอังคาร','ดาวศุกร์'],c:1,e:'ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลก และเงาตกบนโลก'},
{q:'จันทรุปราคาเกิดได้ในช่วงใด?',a:['วันเดือนดับ','วันเพ็ญ','ทุกคืน','เฉพาะข้างแรม 8 ค่ำ'],c:1,e:'จันทรุปราคาเกิดในช่วงวันเพ็ญเมื่อดวงจันทร์ผ่านเข้าไปในเงาโลก'},
{q:'ผู้สังเกตในเงามืดของดวงจันทร์อาจเห็นสุริยุปราคาแบบใด?',a:['เต็มดวง','เงามัว','จันทรุปราคา','ไม่มีปรากฏการณ์'],c:0,e:'เมื่ออยู่ในเงามืดและเงามืดถึงพื้นโลก ผู้สังเกตอาจเห็นสุริยุปราคาเต็มดวง'},
{q:'เหตุใดจึงไม่เกิดอุปราคาทุกเดือน?',a:['ดวงจันทร์ไม่มีแรงโน้มถ่วง','วงโคจรดวงจันทร์เอียงจากระนาบวงโคจรโลก','ดวงอาทิตย์หยุดส่องแสง','โลกหยุดหมุน'],c:1,e:'วงโคจรดวงจันทร์เอียงประมาณ 5° จึงไม่เรียงตัวตรงกันทุกเดือน'},
{q:'ข้อใดถูกต้องเกี่ยวกับการดูอุปราคา?',a:['สุริยุปราคาดูด้วยแว่นกันแดดทั่วไปได้','จันทรุปราคาดูด้วยตาเปล่าได้','มองดวงอาทิตย์ผ่านกล้องสองตาเปล่าได้','ทั้งสองชนิดห้ามดูด้วยตาเปล่าเสมอ'],c:1,e:'จันทรุปราคาดูด้วยตาเปล่าได้ แต่สุริยุปราคาต้องใช้อุปกรณ์ป้องกันดวงตาที่เหมาะสม'}
];
let page=-1,qi=0,answers=Array(quiz.length).fill(null),sim='solar';const screen=document.getElementById('screen'),bar=document.getElementById('bar');function sound(ok=true){try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:220;g.gain.value=.04;o.start();o.stop(ctx.currentTime+.1);o.onended=()=>ctx.close()}catch(e){}}function update(){bar.style.width=(page<0?0:page<pages.length?(page+1)/(pages.length+2)*100:page===pages.length?90:100)+'%'}function render(){update();if(page===-1){screen.innerHTML=`<div class="hero"><div class="stars">☀️ 🌍 🌑</div><div class="kicker">UNIT 05 · SPACE SCIENCE</div><h1>ECLIPSE LAB</h1><p class="big">ไขปริศนาสุริยุปราคาและจันทรุปราคา</p><p class="sub">บทเรียน 8 ตอน · ห้องทดลองโต้ตอบ · Mini Quiz 5 ข้อ</p><div class="actions" style="justify-content:center"><button class="primary" onclick="go(0)">🚀 เริ่มบทเรียน</button></div></div>`;return}if(page<pages.length){let d=pages[page];screen.innerHTML=`<span class="pill">${d.tag} · ${page+1}/8</span><h2>${d.title}</h2>${d.html}<div class="footer"><button onclick="go(${page-1})">← ย้อนกลับ</button><button class="primary" onclick="go(${page+1})">${page===7?'🧠 เริ่ม Mini Quiz':'บทต่อไป →'}</button></div>`;if(d.sim)setSim(sim);return}if(page===pages.length){let d=quiz[qi],sel=answers[qi];screen.innerHTML=`<span class="pill">MINI QUIZ · ${qi+1}/5</span><h2>${d.q}</h2>${d.a.map((a,i)=>`<button class="option ${sel!==null?(i===d.c?'correct':i===sel?'wrong':''):''}" ${sel!==null?'disabled':''} onclick="answer(${i})">${'ABCD'[i]}. ${a}</button>`).join('')}${sel!==null?`<div class="feedback">${sel===d.c?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง'}<div>💡 ${d.e}</div></div>`:''}<div class="footer"><button onclick="${qi===0?'go(7)':'prevQuiz()'}">← ย้อนกลับ</button><button class="primary" ${sel===null?'disabled style="opacity:.4"':''} onclick="nextQuiz()">${qi===4?'ดูผลคะแนน 🏆':'ข้อต่อไป →'}</button></div>`;return}let score=answers.filter((a,i)=>a===quiz[i].c).length;screen.innerHTML=`<div class="hero"><div class="stars">🏆</div><h1>MISSION COMPLETE</h1><p>คะแนน Mini Quiz</p><h1>${score} / 5</h1><p>${score===5?'ยอดเยี่ยม! เข้าใจอุปราคาแล้ว':score>=4?'ดีมาก! ทบทวนข้อที่พลาดอีกนิด':'ลองทบทวนบทเรียนและฝึกอีกครั้งนะ'}</p><div class="actions" style="justify-content:center"><button onclick="go(0)">📘 ทบทวนบทเรียน</button><button class="primary" onclick="restart()">🔄 ทำแบบทดสอบอีกครั้ง</button></div></div>`}function go(n){page=n;render();window.scrollTo(0,0)}function setSim(s){sim=s;let m=document.getElementById('middle'),l=document.getElementById('last'),ml=document.getElementById('midlabel'),ll=document.getElementById('lastlabel'),sh=document.getElementById('shadow');if(!m)return;let solar=s==='solar';m.setAttribute('r',solar?'33':'55');m.setAttribute('fill',solar?'#bcbecb':'url(#earthFill)');l.setAttribute('r',solar?'55':'33');l.setAttribute('fill',solar?'url(#earthFill)':'#bcbecb');ml.textContent=solar?'ดวงจันทร์':'โลก';ll.textContent=solar?'โลก':'ดวงจันทร์';sh.setAttribute('points',solar?'410,127 410,193 795,160':'410,105 410,215 795,178 795,142');document.getElementById('simnote').textContent=solar?'สุริยุปราคา: ดวงจันทร์อยู่ตรงกลาง เงาของดวงจันทร์ตกบนโลก':'จันทรุปราคา: โลกอยู่ตรงกลาง เงาของโลกตกบนดวงจันทร์';document.getElementById('solar').setAttribute('aria-pressed',solar);document.getElementById('lunar').setAttribute('aria-pressed',!solar)}function answer(i){if(answers[qi]!==null)return;answers[qi]=i;sound(i===quiz[qi].c);render()}function prevQuiz(){qi--;render()}function nextQuiz(){if(answers[qi]===null)return;if(qi===quiz.length-1)go(pages.length+1);else{qi++;render()}}function restart(){answers=Array(quiz.length).fill(null);qi=0;go(pages.length)}render();
</script></body></html>
