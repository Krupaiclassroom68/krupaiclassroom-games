<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 Math Arena · Kru Pai Classroom</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#100c27;color:#faf6ff;--mint:#bafae3;--violet:#ae91ff;--line:#514372}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#4b2866,transparent 50%),radial-gradient(ellipse at 0% 60%,#25265b,transparent 55%),#100c27}
main{width:min(1120px,100%);margin:auto;padding:clamp(12px,3vw,36px)}header{color:var(--mint);font-weight:800;letter-spacing:.07em;margin:10px 0 22px}
.panel{background:#1d1634ed;border:1px solid var(--line);border-radius:25px;padding:clamp(16px,4vw,42px);box-shadow:0 20px 60px #09051760}
.hero{position:relative;isolation:isolate;overflow:hidden}.hero::after{content:'%';position:absolute;right:5%;top:-20px;font-size:clamp(110px,25vw,350px);font-weight:950;line-height:1;color:#b69bff1b;z-index:-1;transform:rotate(-12deg)}
h1{font-size:clamp(42px,8vw,100px);line-height:1.03;margin:10px 0;color:var(--mint);letter-spacing:-.04em}h2{font-size:clamp(24px,4vw,42px);margin:10px 0}p{line-height:1.6}.muted{color:#d2c6e3}.accent{color:var(--mint);font-weight:800}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:44px;color:inherit;border:1px solid var(--line);border-radius:13px;background:#30234d;padding:9px 15px;font-weight:750}
button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.primary{background:var(--mint);color:#13382e;border-color:var(--mint)}.secondary{background:#47336e}#scratch button[aria-pressed=true],#mark[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}
input{background:#faf7ff;color:#271b40;padding:12px;border:2px solid var(--violet);border-radius:12px;max-width:100%;font-size:20px}label{display:block;margin:18px 0 7px;font-weight:750}
.cards,.choices,.scoreGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.card,.choice{text-align:left;padding:15px;background:#301f50;border:1px solid #705aa0}.card{min-height:104px;font-size:clamp(19px,3vw,27px)}.card span{display:block;font-size:16px;color:#e4d8fa;margin-top:5px}
.card:nth-child(2){background:#45224f}.choice{font-size:clamp(19px,2.7vw,28px);min-height:64px;overflow-wrap:anywhere}.choice[aria-pressed=true]{background:#59428b;border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}.letter{color:var(--mint);margin-right:9px}
nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.dot{min-width:40px;padding:5px;position:relative}.dot.done{background:#245249}.dot.current{outline:2px solid var(--mint);outline-offset:0}.dot.marked::after{content:'★';position:absolute;right:2px;top:0;color:#ffe295;font-size:10px}
.part{color:var(--mint);font-weight:850;font-size:18px}.question{font-size:clamp(23px,3.4vw,40px);font-weight:760;line-height:1.45;margin:18px 0}.fraction{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.07;margin:0 .12em}.fraction span:first-child{border-bottom:2px solid currentColor;padding:0 .15em .09em}.fraction span+span{padding-top:.08em}.numeric{width:235px}.status{color:#ffd998;min-height:1.5em}
#scratch{margin-top:15px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#30234d}#scratch .bar{padding:8px}canvas{display:block;width:100%;height:clamp(280px,55dvh,700px);background:repeating-linear-gradient(#fff 0 31px,#dfe6fa 32px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.score{font-size:clamp(45px,8vw,85px);font-weight:950;color:var(--mint);margin:4px 0}.scoreGrid>div,details.review{padding:14px;border-radius:14px;background:#30234d;border:1px solid var(--line)}details.review{margin:9px 0}summary{cursor:pointer;font-weight:750}.right{color:var(--mint)}.wrong{color:#ffb3cb}.answerKey{margin-bottom:0}dialog{background:#24193c;color:inherit;border:1px solid var(--violet);border-radius:20px;width:min(460px,92vw);padding:22px}dialog::backdrop{background:#070412bf}
[hidden]{display:none!important}@media(max-width:550px){.cards,.choices{grid-template-columns:1fr}.dot{min-width:35px}.scoreGrid{gap:6px}}@media(min-width:1400px){main{width:min(1380px,100%)}}
/* Electric game-show theme */
:root{--mint:#faff36;--violet:#faff36;--line:#46483e;background:#0e100e;color:#fffef1}
body{background:radial-gradient(ellipse at 75% -15%,#4e4c12,transparent 52%),radial-gradient(ellipse at 5% 90%,#292c0c,transparent 45%),#10120f;background-attachment:fixed}
main{padding-top:14px}
header{display:flex;align-items:center;gap:12px;color:#faff36;margin:12px 0 18px;letter-spacing:.16em;font-size:clamp(12px,1.7vw,17px)}
header::before{content:'';width:27px;height:17px;background:repeating-linear-gradient(115deg,#faff36 0 5px,transparent 5px 9px);flex:none}
.panel{background:#181b16;border-color:#46483e;border-radius:22px;box-shadow:0 16px 60px #0008}
.hero{padding:0;overflow:hidden}
.hero::after{content:none}
.hero-stage{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:center;min-height:340px;padding:clamp(22px,4.5vw,56px);color:#171a0c;background:radial-gradient(ellipse at 78% 43%,#ffffa4 0%,transparent 53%),linear-gradient(128deg,#f0ff23 10%,#faff36 60%,#e9f21c 100%);border-bottom:6px solid #79810d}
.hero-stage::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.23;background-image:radial-gradient(#242900 1px,transparent 1px);background-size:11px 11px;mask-image:linear-gradient(110deg,transparent,#000)}
.hero-copy{position:relative;z-index:2}
.hero h1{margin:0;color:#141608;font-family:Impact,"Arial Black",system-ui,sans-serif;font-style:italic;font-weight:950;text-transform:uppercase;line-height:.88;letter-spacing:-.045em;font-size:clamp(49px,8.6vw,118px)}
.hero h1 span{display:block;color:#faff36;-webkit-text-stroke:2px #171a0c;text-shadow:3px 4px 0 #171a0c;margin-top:7px}
.hero h2{margin:20px 0 0;color:#171a0c;font-size:clamp(20px,3vw,38px);line-height:1.28}
.percent-art{position:relative;display:grid;place-items:center;justify-self:center;width:min(100%,370px);aspect-ratio:1;isolation:isolate}
.percent-art::before,.percent-art::after{content:'';position:absolute;aspect-ratio:1;border-radius:50%;z-index:-1}
.percent-art::before{width:83%;border:2px dashed #333806;animation:orbit 35s linear infinite}
.percent-art::after{width:69%;background:#191c0e;box-shadow:9px 9px 0 #9ca217,0 0 0 8px #f9ff4a,0 0 0 10px #262b0b}
.percent-art strong{font-family:Impact,"Arial Black",system-ui,sans-serif;color:#faff36;font-size:clamp(86px,16.5vw,236px);line-height:1;transform:rotate(-12deg);text-shadow:5px 7px #737735}
.spark{position:absolute;color:#1b200c;font-size:clamp(24px,5vw,67px);line-height:1}.spark.one{top:4%;right:7%}.spark.two{bottom:8%;left:0%;font-size:clamp(18px,3vw,45px)}
.hero-controls{padding:clamp(16px,3.5vw,36px)}
.hero-controls p{margin:0;color:#e9ebd7;font-weight:650}
.hero-controls label{color:#faff36}
.cards{margin-bottom:0;gap:14px}
.card,.card:nth-child(2){display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:#faff36;color:#181b10;border:2px solid #faff36;box-shadow:0 4px 0 #81871a;line-height:1.24}
.card:nth-child(2){background:#2b2c14;color:#ffffda;box-shadow:0 4px 0 #41441b}
.card b{display:grid;place-items:center;border:1px solid currentColor;border-radius:10px;width:44px;height:44px;font-size:24px}
.card span{color:inherit;font-size:clamp(13px,1.7vw,16px);line-height:1.35}.card .set-copy{font-size:inherit;margin:0}.card .arrow{font-size:24px;margin:0}
.card:focus-visible,.card:hover{filter:brightness(1.14);transform:translateY(-2px)}
button{background:#262a21;border-color:#505548}
button.primary{background:#faff36;color:#181b10;border-color:#faff36;box-shadow:0 3px 0 #878c20}
button.secondary{background:#30321a;border-color:#737629;color:#feff83}
input{background:#ffffed;color:#1b1e13;border-color:#b6b84b}
#exam,#result{border-top:5px solid #faff36}
#setTitle{font-size:clamp(17px,2.25vw,26px)}#count{background:#faff36;color:#181b10;border-radius:6px;padding:5px 9px;font-variant-numeric:tabular-nums}
#navigator{margin:14px 0}
.question{max-width:42ch}
.choice{background:#252920;border-color:#535a49;border-radius:10px}.choice:hover{border-color:#faff36}.choice[aria-pressed=true]{background:#faff36;color:#171a0c;border-color:#faff36}.choice[aria-pressed=true] .letter{background:#181b10;color:#faff36}
.letter{display:inline-grid;place-items:center;background:#faff36;color:#181b10;border-radius:6px;width:1.55em;height:1.55em;font-weight:900}
.dot.done{background:#dce448;color:#181b10}.dot.current{outline-offset:2px}.dot.marked::after{color:#ffab44;filter:drop-shadow(0 1px 1px #000)}
#scratch{background:#24291e}
canvas{background:repeating-linear-gradient(#fff 0 31px,#e6e8cf 32px)}
.result-banner{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(112deg,#faff36,#f0f88c);color:#181b10;border-radius:13px;padding:clamp(15px,3vw,32px)}
.result-banner::after{content:'×';position:absolute;right:5%;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:clamp(110px,24vw,330px);font-weight:950;line-height:1;color:#262a112b;z-index:-1}
.result-banner .part,.result-banner .score{color:#171a0c}.result-banner .part,.result-banner p:last-child{margin:0}.result-banner .score{line-height:1.03}
.scoreGrid>div,details.review{background:#252920;border-color:#505548}.scoreGrid strong{font-size:clamp(24px,3.5vw,43px);color:#faff36}
.right{color:#b4fab4}.wrong{color:#ffc0cb}dialog{background:#22261d}
@keyframes orbit{to{transform:rotate(1turn)}}
@media(max-width:700px){.hero-stage{min-height:242px;gap:4px;padding:18px}.hero h1{font-size:clamp(40px,9vw,70px)}.hero h1 span{-webkit-text-stroke:1.4px #171a0c;text-shadow:2px 3px #171a0c}.hero h2{font-size:clamp(18px,3.7vw,26px);margin-top:14px}.percent-art strong{font-size:clamp(68px,15vw,130px)}}
@media(max-width:380px){.hero-stage{padding:15px;min-height:205px}.hero h1{font-size:clamp(33px,10vw,40px)}.percent-art strong{font-size:clamp(55px,17vw,68px)}}
@media(prefers-reduced-motion:reduce){.percent-art::before{animation:none}}

#questionStage{position:relative;background:#fffde9;color:#1a1d0e;border-left:6px solid #faff36;border-radius:12px;padding:clamp(13px,3vw,27px);margin:10px 0 14px}
#questionStage .question{max-width:none;margin:0}#overlay{position:absolute;inset:0;width:100%;height:100%;background:transparent;pointer-events:none}
#questionStage.inking #overlay{pointer-events:auto;cursor:crosshair}#questionStage.inking{outline:2px solid #faff36;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#inkTools{margin:8px 0}#inkTools button[aria-pressed=true],#inkToggle[aria-pressed=true]{border-color:#faff36;color:#faff36}
#feedback:not(:empty){background:#262a21;border:1px solid #505548;border-radius:13px;margin-top:12px;padding:12px 16px;font-size:clamp(17px,2.45vw,24px)}
#feedback ol,.review ol{padding-inline-start:1.4em}#feedback li,.review li{margin:.4em 0}.choice.is-right{border-color:#a3f3a3;background:#275438;color:#fff;opacity:1}
.choice.is-wrong{border-color:#ff9ca0;background:#702e35;color:#fff;opacity:1}.dot.wrong-dot{background:#702e35;color:#fff}
.hero h1{font-size:clamp(40px,7vw,96px)}@media(max-width:420px){.hero h1{font-size:clamp(27px,8vw,40px)}}

/* Arena cover */
.hero-stage{min-height:380px;background:radial-gradient(ellipse at 73% 42%,#ffffad,transparent 54%),linear-gradient(135deg,#f8ff29,#edf024 58%,#c8d319);border-bottom:0}
.hero-stage::before{opacity:.27;background-image:linear-gradient(#33390065 1px,transparent 1px),linear-gradient(90deg,#33390065 1px,transparent 1px);background-size:23px 23px}
.hero-stage::after{content:'';position:absolute;z-index:3;inset:auto 0 0;height:8px;background:repeating-linear-gradient(118deg,#15190f 0 13px,#faff36 13px 26px)}
.hero-copy h1{text-shadow:3px 3px 0 #ffffac}.hero-copy h2{display:inline-block;padding:.27em .54em;background:#161810;color:#faff36;border-left:4px solid #fb8026;transform:rotate(-2deg)}
.arena-art{width:min(100%,404px)}
.arena-art::after{width:81%;background:repeating-conic-gradient(from 15deg,#262c0b 0 2deg,transparent 2deg 12deg);box-shadow:none;opacity:.23}
.arena-art::before{width:91%;border:3px dashed #575f12}
.arena-orbit{position:absolute;width:98%;height:50%;border:2px solid #494e14;border-radius:50%;transform:rotate(-31deg);z-index:-1}
.arena-shield{display:grid;place-content:center;text-align:center;width:65%;height:73%;color:#faff36;background:linear-gradient(144deg,#31351a,#11150b 70%);clip-path:polygon(0 13%,50% 0,100% 13%,94% 72%,50% 100%,6% 72%);transform:rotate(-8deg)}
.arena-shield span{font:900 clamp(22px,5vw,72px)/.85 system-ui;color:#faff36;text-shadow:0 0 15px #d7ed4d}
.arena-shield strong{font:950 italic clamp(24px,6.1vw,90px)/1 system-ui;text-shadow:3px 3px #787b31;transform:none}
.math-token{position:absolute;display:grid;place-items:center;min-width:1.65em;min-height:1.65em;padding:0 .17em;background:#ffffa1;border:2px solid #202610;border-radius:7px;color:#181e0a;box-shadow:3px 3px #30360d;font:900 clamp(13px,2.35vw,33px)/1 system-ui}
.token-angle{left:2%;top:17%;transform:rotate(-17deg)}.token-pi{right:2%;top:28%;transform:rotate(12deg)}.token-equation{left:3%;bottom:15%;transform:rotate(-9deg)}.token-fraction{right:9%;bottom:9%;transform:rotate(13deg)}
.arena-art .spark.one{right:14%;top:1%}.arena-art .spark.two{left:8%;bottom:3%}
.hero-controls .card{min-height:69px;background:linear-gradient(110deg,#faff36,#e1ed25);width:min(100%,420px)}
@media(min-width:701px){.hero-controls .cards{grid-template-columns:1fr}}
@media(max-width:700px){.hero-stage{min-height:242px}.arena-art::before{border-width:2px}.math-token{border-width:1px;box-shadow:2px 2px #30360d}}
@media(max-width:380px){.hero-stage{min-height:205px}.token-equation{left:0}}
</style>
<main>
<header>KRU PAI CLASSROOM</header>
<section id="cover" class="panel hero">
<div class="hero-stage">
<div class="hero-copy"><h1>M.1 Math <span>Arena</span></h1><h2>สนามสอบคณิตรวมเข้ม</h2></div>
<div class="percent-art arena-art" aria-hidden="true">
<div class="arena-orbit"></div><div class="arena-shield"><span>⚡︎</span><strong>M.1</strong></div>
<span class="math-token token-angle">∠</span><span class="math-token token-pi">π</span><span class="math-token token-equation">x + y</span><span class="math-token token-fraction">⅝</span>
<span class="spark one">✦</span><span class="spark two">✦</span>
</div>
</div>
<div class="hero-controls">
<p class="muted">25 ข้อ · 4 ตัวเลือก · เฉลยทันที · ไม่จับเวลา</p>
<label for="player">ชื่อนักเรียน</label><input id="player" type="text" maxlength="65" placeholder="พิมพ์ชื่อหรือชื่อเล่น">
<div class="cards"><button class="card" data-start="0"><b aria-hidden="true">→</b><span class="set-copy">เริ่มทำข้อสอบ</span></button></div>
</div>
</section>
<section id="exam" class="panel" hidden>
<div class="bar spread"><strong id="setTitle"></strong><span id="count" class="accent"></span></div>
<details id="navigator" open><summary>เลือกข้อที่ต้องการทำ</summary><nav id="dots" aria-label="เลือกข้อสอบ"></nav></details>
<div class="bar"><button id="prev">← ก่อนหน้า</button><button id="next">ถัดไป →</button><button id="mark" aria-pressed="false">☆ ทำเครื่องหมาย</button></div>
<p class="part" id="part"></p>
<div id="questionStage"><div id="question" class="question"></div><canvas id="overlay" aria-hidden="true"></canvas></div>
<div class="bar inkActions"><button id="inkToggle" class="secondary" aria-pressed="false">✎ เขียนบนโจทย์</button>
<button id="padToggle" class="secondary" aria-expanded="false" aria-controls="scratch">✎ เปิดกระดาษทด</button></div>
<div id="inkTools" class="bar" hidden>
<button data-ink="#24314e">ปากกาดำ</button><button data-ink="#1664d8">น้ำเงิน</button><button data-ink="#e53750">แดง</button><button data-ink="erase">ยางลบ</button><button id="undo">↶ ย้อนเส้น</button><button id="clearPad">ล้างรอยเขียน</button></div>
<div id="scratch" hidden><canvas id="paper" aria-label="พื้นที่เขียนกระดาษทด"></canvas></div>
<div id="responses"></div><div id="feedback" role="status" aria-live="polite"></div>
<div class="bar spread" style="margin-top:18px"><button id="submit" class="primary">จบการทดสอบ</button><button id="exit">กลับหน้าปก</button></div>
</section>
<section id="result" class="panel" hidden>
<div class="result-banner"><p class="part" id="resultName"></p><h2>สรุปผลการทดสอบ</h2><div class="score" id="score"></div><p id="percent"></p></div>
<div class="scoreGrid" id="parts"></div>
<div class="bar"><button class="primary" id="again">เล่นอีกครั้ง</button><button id="home">กลับหน้าปก</button></div>
<h2>เฉลยและวิธีคิด</h2><div id="review"></div>
</section>
<dialog id="confirmBox"><h2 id="confirmTitle"></h2><p id="confirmMessage"></p><form method="dialog" class="bar"><button value="cancel" autofocus>ยกเลิก</button><button class="primary" value="yes" id="confirmAction"></button></form></dialog>

const names = ['สนามสอบเข้า ม.1 · คณิตรวมเข้ม'];
const $ = id => document.getElementById(id);
const paper = $('paper');

const storageKey = 'kpc-m1-math-arena-25-v1';
let state, setIndex, questions, draftKey;
let open = false, current = null, pointer = null, color = '#24314e';
let confirmCallback;
function restore() {
  try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
  catch { return {}; }
}
let drafts = restore();
function save() {
  drafts[draftKey] = state;
  try { localStorage.setItem(storageKey, JSON.stringify(drafts)); }
  catch { /* The session remains playable when storage is unavailable. */ }
}
function fresh() {
  return {i:0, name:'', answers:Array(25).fill(''), picks:Array(25).fill(''), marks:Array(25).fill(false), ink:{}, overlay:{}, submitted:false};
}
function show(id) {
  for (const section of ['cover','exam','result']) $(section).hidden = section !== id;
  window.scrollTo(0,0);
}
function start(index, restart = false) {
  setIndex = index;
  questions = BANK[index];
  const name = $('player').value.trim();
  draftKey = JSON.stringify([index, name]);
  const draft = drafts[draftKey];
  state = !restart && draft && !draft.submitted ? draft : fresh();
  state.name = name;
  if (state.name) $('player').value = state.name;
  save();
  $('navigator').open = window.innerWidth > 650;
  show('exam');
  renderQuestion();
}
function math(text) {
  return text.replace(/(\d+)\/(\d+)/g, '<span class="fraction" aria-label="$1 ส่วน $2"><span>$1</span><span>$2</span></span>');
}
function button(text, className, action) {
  const el = document.createElement('button');
  el.className = className;
  el.textContent = text;
  el.onclick = action;
  return el;
}

  [...$('dots').children].forEach((el, index) => {
    el.classList.toggle('done', state.answers[index] === questions[index].answer);
    el.classList.toggle('wrong-dot', Boolean(state.answers[index]) && state.answers[index] !== questions[index].answer);
    el.classList.toggle('marked', state.marks[index]);
    el.setAttribute('aria-label', 'ข้อ ' + (index + 1) + (state.answers[index] !== '' ? ' ตอบแล้ว' : '') + (state.marks[index] ? ' ทำเครื่องหมายแล้ว' : ''));
  });
}
function go(index) {
  if (index < 0 || index >= questions.length) return;
  finishInk();
  state.i = index;
  save();
  renderQuestion();
}
function renderQuestion() {
  const i = state.i;
  const q = questions[i];
  $('setTitle').textContent = names[setIndex];
  $('dots').replaceChildren(...questions.map((_, index) => {
    const el = button(String(index + 1), 'dot' + (i === index ? ' current' : ''), () => go(index));
    if (i === index) el.setAttribute('aria-current','step');
    return el;
  }));
  refreshDots();
  $('prev').disabled = i === 0;
  $('next').disabled = i === questions.length - 1;
  updateMark();
  $('part').textContent = 'ข้อ ' + (i + 1) + '/25';
  $('question').innerHTML = math(q.prompt);
  renderChoices();
  resize();
}
function steps(q) {
  return '<ol>' + q.explanation.split(' • ').map(step => '<li>' + math(step) + '</li>').join('') + '</ol>';
}
function renderChoices() {
  const i = state.i;
  const q = questions[i];
  const checked = Boolean(state.answers[i]);
  const choices = document.createElement('div');
  choices.className = 'choices';
  q.options.forEach((option, index) => {
    const el = button('', 'choice', () => {
      state.picks[i] = option;
      save();
      [...choices.children].forEach((item, j) => item.setAttribute('aria-pressed', String(j === index)));
      verify.disabled = false;
    });
    const isPicked = option === state.picks[i];
    el.innerHTML = '<span class="letter">' + 'ABCD'[index] + '</span>' + math(option);
    el.setAttribute('aria-pressed', String(isPicked));
    el.disabled = checked;
    el.classList.toggle('is-right', checked && option === q.answer);
    el.classList.toggle('is-wrong', checked && isPicked && option !== q.answer);
    choices.append(el);
  });
  const verify = button('ยืนยันคำตอบ', 'primary', () => {
    if (!state.picks[i] || state.answers[i]) return;
    state.answers[i] = state.picks[i];
    save();
    refreshDots();
    renderChoices();
  });
  verify.disabled = !state.picks[i];
  $('responses').replaceChildren(choices);
  if (!checked) $('responses').append(verify);
  $('feedback').innerHTML = checked
    ? '<strong class="' + (state.answers[i] === q.answer ? 'right">✓ ถูกต้อง' : 'wrong">✕ ยังไม่ถูก') +
      '</strong><p>คำตอบ ' + 'ABCD'[q.options.indexOf(q.answer)] + ' · ' + math(q.answer) + '</p>' + steps(q)
    : '';
}
function updateMark() {
  const marked = state.marks[state.i];
  $('mark').textContent = marked ? '★ ทำเครื่องหมายแล้ว' : '☆ ทำเครื่องหมาย';
  $('mark').setAttribute('aria-pressed', String(marked));
}
function ask(title, message, action, callback) {
  $('confirmTitle').textContent = title;
  $('confirmMessage').textContent = message;
  $('confirmAction').textContent = action;
  confirmCallback = callback;
  $('confirmBox').returnValue = 'cancel';
  $('confirmBox').showModal();
}
$('confirmBox').onclose = () => {
  if ($('confirmBox').returnValue === 'yes') confirmCallback();
};
function submit() {
  const missing = state.answers.filter(a => a === '').length;
  ask('จบการทดสอบหรือไม่?', missing ? 'ยังเว้นไว้ ' + missing + ' ข้อ ข้อที่เว้นจะได้ 0 คะแนน' : 'ตอบครบ 25 ข้อแล้ว', 'ส่งและดูคะแนน', () => {
    togglePad(false);
    toggleWriting(false);
    state.submitted = true;
    save();
    renderResult();
  });
}
function renderResult() {
  const grades = questions.map((q, i) => state.answers[i] === q.answer);
  const total = grades.filter(Boolean).length;
  const checked = state.answers.filter(Boolean).length;
  $('resultName').textContent = [state.name, names[setIndex]].filter(Boolean).join(' · ');
  $('score').textContent = total + ' / 25';
  $('percent').textContent = 'คิดเป็น ' + total * 4 + '%';
  $('parts').innerHTML = '<div>ตอบผิด <strong>' + (checked - total) + '</strong></div><div>เว้นไว้ <strong>' + (25 - checked) + '</strong></div>';
  $('review').replaceChildren(...questions.map((q, i) => {
    const detail = document.createElement('details');
    detail.className = 'review';
    const summary = document.createElement('summary');
    summary.className = grades[i] ? 'right' : 'wrong';
    summary.textContent = (grades[i] ? '✓ ' : '✕ ') + 'ข้อ ' + (i + 1) + ' · ' + q.skill;
    const prompt = document.createElement('p');
    prompt.innerHTML = math(q.prompt);
    const given = document.createElement('p');
    given.textContent = 'คำตอบที่ส่ง ' + (state.answers[i] || '— เว้นว่าง');
    const solution = document.createElement('p');
    solution.className = 'answerKey accent';
    solution.innerHTML = 'คำตอบ ' + math(q.answer) + (q.unit && q.unit !== 'ไม่มีหน่วย' ? (q.unit === '%' ? '%' : ' ' + q.unit) : '');
    const explanation = document.createElement('div');
    explanation.innerHTML = steps(q);
    detail.append(summary, prompt, given, solution, explanation);
    return detail;
  }));
  show('result');
}
function activeSurface() { return writing ? overlay : paper; }
function inkList(surface = activeSurface()) {
  const strokes = surface === overlay ? state.overlay : state.ink;
  return strokes[state.i] ||= [];
}
function resize() {
  resizeSurface(overlay);
  if (open) resizeSurface(paper);
}
function resizeSurface(canvas) {
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const ratio = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  redraw(canvas);
}
function redraw(canvas = activeSurface()) {
  const ctx = canvas.getContext('2d');
  const {width, height} = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, width, height);
  for (const stroke of [...inkList(canvas), ...(current && canvas === activeSurface() ? [current] : [])]) {
    ctx.globalCompositeOperation = stroke.color === 'erase' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = stroke.color === 'erase' ? '#000' : stroke.color;
    ctx.lineWidth = stroke.color === 'erase' ? 24 : 3;
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    const [x, y] = stroke.points[0];
    ctx.moveTo(x * width, y * height);
    for (const [px, py] of stroke.points.slice(1)) ctx.lineTo(px * width, py * height);
    if (stroke.points.length === 1) ctx.lineTo(x * width + .1, y * height + .1);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function point(event, rect) {
  return [(event.clientX - rect.left) / rect.width, (event.clientY - rect.top) / rect.height];
}
function finishInk() {
  if (!current) return;
  inkList().push(current);
  current = null;
  pointer = null;
  save();
  redraw();
}
function togglePad(value) {
  finishInk();
  if (value && writing) toggleWriting(false);
  open = value;
  $('scratch').hidden = !open;
  $('responses').hidden = open;
  $('padToggle').textContent = open ? '✓ พับกระดาษทด · กลับไปตอบ' : '✎ เปิดกระดาษทด';
  $('padToggle').setAttribute('aria-expanded', String(open));
  $('inkTools').hidden = !open && !writing;
  if (open) requestAnimationFrame(resize);
}
function toggleWriting(value) {
  finishInk();
  if (value && open) togglePad(false);
  writing = value;
  $('questionStage').classList.toggle('inking', writing);
  $('inkToggle').setAttribute('aria-pressed', String(writing));
  $('inkToggle').textContent = writing ? '✓ หยุดเขียนบนโจทย์' : '✎ เขียนบนโจทย์';
  $('inkTools').hidden = !writing && !open;
}
for (const canvas of [paper, overlay]) {
canvas.addEventListener('pointerdown', event => {
  if (!(canvas === overlay ? writing : open) || pointer !== null || event.button !== 0) return;
  event.preventDefault();
  pointer = event.pointerId;
  try { canvas.setPointerCapture(pointer); } catch {}
  current = {color, points:[point(event, canvas.getBoundingClientRect())]};
  redraw();
}, {passive:false});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId !== pointer || !current) return;
  event.preventDefault();
  const samples = event.getCoalescedEvents?.();
  // Coalesced samples carry coordinates but can have a null currentTarget.
  const rect = canvas.getBoundingClientRect();
  for (const sample of samples?.length ? samples : [event]) current.points.push(point(sample, rect));
  redraw();
}, {passive:false});
for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  canvas.addEventListener(type, event => { if (event.pointerId === pointer) finishInk(); });
}
for (const type of ['touchstart','touchmove','touchend','touchcancel','contextmenu','selectstart','dragstart']) {
  canvas.addEventListener(type, event => { if (event.cancelable) event.preventDefault(); }, {passive:false});
}
}
window.addEventListener('resize', resize);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe($('questionStage'));
for (const control of document.querySelectorAll('[data-ink]')) {
  control.setAttribute('aria-pressed', String(control.dataset.ink === color));
  control.onclick = () => {
    color = control.dataset.ink;
    document.querySelectorAll('[data-ink]').forEach(el => el.setAttribute('aria-pressed', String(el === control)));
  };
}
$('undo').onclick = () => { finishInk(); inkList().pop(); save(); redraw(); };
$('clearPad').onclick = () => {
  if (inkList().length) ask('ล้างรอยเขียนข้อนี้?', 'รอยเขียนในข้อนี้จะถูกล้างทั้งหมด', 'ล้างรอยเขียน', () => {
    inkList().length = 0;
    save();
    redraw();
  });
};
$('inkToggle').onclick = () => toggleWriting(!writing);
$('padToggle').onclick = () => togglePad(!open);
document.querySelectorAll('[data-start]').forEach(el => el.onclick = () => start(Number(el.dataset.start)));
$('prev').onclick = () => go(state.i - 1);
$('next').onclick = () => go(state.i + 1);
$('mark').onclick = () => { state.marks[state.i] = !state.marks[state.i]; updateMark(); save(); refreshDots(); };
$('submit').onclick = submit;
$('exit').onclick = () => { togglePad(false); toggleWriting(false); save(); show('cover'); };
$('home').onclick = () => show('cover');
$('again').onclick = () => start(setIndex, true);
</script>
</html>
