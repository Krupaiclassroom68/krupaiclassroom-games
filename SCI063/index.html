<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KPC UNIT 06 | SPACE OBJECT HUNTER</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#f5f8ff;background:#070e27}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 8%,#253d79 0,transparent 34%),radial-gradient(circle at 12% 80%,#39205c 0,transparent 40%),#070e27;min-height:100vh}button{font:inherit;cursor:pointer}header{padding:16px 4vw;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #3d5787}header b{color:#7de8ff;font-size:clamp(15px,2vw,24px)}.tag{background:#19335e;border:1px solid #4b78b0;border-radius:99px;padding:8px 14px;font-weight:800}.shell{max-width:1450px;margin:auto;padding:20px 3vw 40px}.screen{display:none}.screen.active{display:block}.panel{border:1px solid #4167a5;background:#101e40e8;border-radius:26px;padding:clamp(20px,3vw,44px);box-shadow:0 20px 60px #0005}.hero{text-align:center;min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.hero .planet{font-size:clamp(100px,15vw,210px);filter:drop-shadow(0 0 35px #4c7fe0)}h1{font-size:clamp(38px,5.5vw,76px);line-height:1.12;margin:10px 0;color:#fff}h2{font-size:clamp(29px,3.5vw,52px);margin:8px 0 18px;color:#9beeff}h3{font-size:clamp(22px,2.5vw,34px);margin:8px 0}p,li{font-size:clamp(19px,2.1vw,30px);line-height:1.7}.sub{color:#b8d2fa}.pill{display:inline-block;color:#9ff5e8;font-weight:900;letter-spacing:2px}.btn{border:0;border-radius:16px;padding:14px 26px;background:linear-gradient(135deg,#39d4f5,#6078fa);color:#07152f;font-weight:900;font-size:clamp(18px,2vw,25px);min-height:55px}.btn.secondary{background:#233b68;color:white;border:1px solid #6c8ed0}.btn:disabled{opacity:.3;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}.tile{border:1px solid #4868a4;background:#182d55;border-radius:20px;padding:18px;text-align:center}.tile .emoji{font-size:clamp(60px,7vw,100px)}.tile p{font-size:clamp(17px,1.6vw,23px);margin:4px}.fact{padding:15px 20px;background:#203f65;border-left:6px solid #66e6ef;border-radius:12px;margin:22px 0;font-size:clamp(19px,2vw,28px);line-height:1.6}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.progress{height:10px;background:#243657;border-radius:20px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:#4be2d8;transition:width .25s}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.choice{background:#1a335d;color:#fff;border:2px solid #5677ae;border-radius:17px;padding:22px;text-align:left;font-size:clamp(19px,2vw,27px);font-weight:700}.choice:hover,.choice.selected{border-color:#67edff;background:#244d7d}.choice.correct{background:#164e4a;border-color:#5df4ba}.choice.wrong{background:#5a293e;border-color:#ff8595}.answer{font-size:clamp(18px,2vw,27px);line-height:1.6;padding:18px;border-radius:14px;background:#203958;margin-top:18px}.mini{font-size:clamp(18px,1.8vw,26px)}.demo{display:flex;gap:12px;flex-wrap:wrap}.demo button{flex:1;min-width:170px}.result{font-size:clamp(32px,4vw,55px);font-weight:900;color:#8af4ce}.small{font-size:clamp(16px,1.5vw,22px)}@media(max-width:600px){header{flex-wrap:wrap}.panel{padding:18px}.nav .btn{padding:12px 15px}.grid{grid-template-columns:1fr 1fr}.tile{padding:10px}.tile .emoji{font-size:58px}}
</style></head><body><header><b>🚀 KRU PAI CLASSROOM · ASTRONOMY ACADEMY</b><span class="tag">UNIT 06 / 12</span></header><main class="shell"><section id="cover" class="screen active"><div class="panel hero"><span class="pill">SPACE SCIENCE · ป.4–ป.6 · สอบเข้า ม.1</span><div class="planet">☄️</div><h1>SPACE OBJECT<br>HUNTER</h1><h3>นักล่าวัตถุแห่งระบบสุริยะ</h3><p class="sub">บทเรียนสรุป 8 ตอน · ห้องทดลองจำแนกวัตถุ · Mini Quiz 5 ข้อ</p><button class="btn" onclick="showLesson(0)">🚀 เริ่มภารกิจ</button></div></section><section id="lesson" class="screen"><div class="panel"><div class="pill" id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="heading"></h2><div id="body"></div><div class="nav"><button class="btn secondary" onclick="back()">← ย้อนกลับ</button><button class="btn" onclick="next()" id="nextBtn">หน้าถัดไป →</button></div></div></section><section id="quiz" class="screen"><div class="panel"><div class="pill" id="qcounter"></div><div class="progress"><div class="bar" id="qbar"></div></div><h2 id="question"></h2><div class="choices" id="options"></div><div id="feedback"></div><div class="nav"><button class="btn secondary" onclick="quizBack()">← ย้อนกลับ</button><button class="btn" id="qnext" onclick="quizNext()" disabled>ข้อต่อไป →</button></div></div></section><section id="finish" class="screen"><div class="panel hero"><div style="font-size:100px">🏆</div><h1>MISSION COMPLETE!</h1><div class="result" id="score"></div><p id="summary"></p><div class="actions"><button class="btn secondary" onclick="showLesson(0)">📘 ทบทวนบทเรียน</button><button class="btn" onclick="restartQuiz()">🔄 ทำ Mini Quiz อีกครั้ง</button><button class="btn secondary" onclick="switchScreen('cover')">🏠 หน้าแรก</button></div></div></section></main><script>
const lessons=[
{title:'01 · รู้จักวัตถุในระบบสุริยะ',html:`<p>นอกจากดาวเคราะห์ 8 ดวงแล้ว ระบบสุริยะยังมี <b>ดาวเคราะห์แคระ ดาวเคราะห์น้อย ดาวหาง และวัตถุขนาดเล็กอีกมากมาย</b> ซึ่งส่วนใหญ่โคจรรอบดวงอาทิตย์</p><div class="grid"><div class="tile"><div class="emoji">🪐</div><h3>ดาวเคราะห์แคระ</h3><p>โคจรรอบดวงอาทิตย์ แต่ยังไม่กวาดบริเวณวงโคจรให้โล่ง</p></div><div class="tile"><div class="emoji">🪨</div><h3>ดาวเคราะห์น้อย</h3><p>วัตถุหินหรือโลหะขนาดเล็ก</p></div><div class="tile"><div class="emoji">☄️</div><h3>ดาวหาง</h3><p>มีน้ำแข็ง ฝุ่น และหิน</p></div><div class="tile"><div class="emoji">🌠</div><h3>ดาวตก</h3><p>แสงที่เห็นเมื่อวัตถุเข้าสู่บรรยากาศ</p></div></div><div class="fact">💡 จำให้แม่น: วัตถุเหล่านี้ไม่ใช่ดาวฤกษ์ และไม่ได้เปล่งแสงจากปฏิกิริยานิวเคลียร์แบบดวงอาทิตย์</div>`},
{title:'02 · ดาวเคราะห์แคระ (Dwarf Planets)',html:`<p>ดาวเคราะห์แคระมีรูปร่างเกือบกลมจากแรงโน้มถ่วงของตนเอง โคจรรอบดวงอาทิตย์ ไม่ใช่ดาวบริวาร แต่ <b>ยังไม่สามารถกวาดวัตถุอื่นในบริเวณวงโคจรให้โล่ง</b></p><div class="grid"><div class="tile"><div class="emoji">🧊</div><h3>พลูโต</h3><p>อยู่บริเวณแถบไคเปอร์</p></div><div class="tile"><div class="emoji">🪨</div><h3>ซีรีส</h3><p>อยู่ในแถบดาวเคราะห์น้อย</p></div><div class="tile"><div class="emoji">🌑</div><h3>อีริส</h3><p>ดาวเคราะห์แคระในบริเวณไกลออกไป</p></div><div class="tile"><div class="emoji">✨</div><h3>เฮาเมอา / มาคีมาคี</h3><p>ตัวอย่างดาวเคราะห์แคระที่ได้รับการรับรอง</p></div></div><div class="fact">🎯 ออกสอบบ่อย: พลูโตจัดเป็นดาวเคราะห์แคระ ไม่ใช่ดาวเคราะห์ดวงที่ 9 ตามการจำแนกปัจจุบัน</div>`},
{title:'03 · ดาวเคราะห์น้อย (Asteroids)',html:`<p>ดาวเคราะห์น้อยส่วนใหญ่ประกอบด้วยหินและโลหะ มีรูปร่างไม่สม่ำเสมอ หลายดวงอยู่ใน <b>แถบดาวเคราะห์น้อยระหว่างดาวอังคารกับดาวพฤหัสบดี</b></p><div class="grid"><div class="tile"><div class="emoji">🔴</div><h3>ดาวอังคาร</h3></div><div class="tile"><div class="emoji">🪨🪨🪨</div><h3>แถบดาวเคราะห์น้อย</h3></div><div class="tile"><div class="emoji">🟠</div><h3>ดาวพฤหัสบดี</h3></div></div><div class="fact">💡 แถบดาวเคราะห์น้อยไม่ได้มีหินอัดแน่นติดกันแบบในภาพยนตร์ ระยะห่างระหว่างวัตถุส่วนใหญ่กว้างมาก</div>`},
{title:'04 · ดาวหาง (Comets)',html:`<p>ดาวหางประกอบด้วยน้ำแข็ง ฝุ่น และหิน เมื่อเข้าใกล้ดวงอาทิตย์ น้ำแข็งระเหิดและปล่อยก๊าซกับฝุ่น เกิดโคมาและหางที่มองเห็นได้</p><div class="grid"><div class="tile"><div class="emoji">☀️</div><h3>ดวงอาทิตย์</h3><p>ให้พลังงานแก่ดาวหาง</p></div><div class="tile"><div class="emoji">☄️</div><h3>หางดาวหาง</h3><p>โดยทั่วไปชี้ออกจากดวงอาทิตย์</p></div></div><div class="fact">🎯 ข้อสอบหลอก: หางดาวหางไม่ได้ชี้ไปด้านหลังตามทิศที่ดาวหางเคลื่อนที่เสมอไป แต่โดยทั่วไปชี้ออกจากดวงอาทิตย์ เพราะลมสุริยะและแรงดันรังสี</div>`},
{title:'05 · สะเก็ดดาว ดาวตก และอุกกาบาต',html:`<div class="grid"><div class="tile"><div class="emoji">🪨</div><h3>สะเก็ดดาว</h3><p>Meteoroid — วัตถุขนาดเล็กในอวกาศ</p></div><div class="tile"><div class="emoji">🌠</div><h3>ดาวตก</h3><p>Meteor — ปรากฏการณ์แสงในบรรยากาศ</p></div><div class="tile"><div class="emoji">💥</div><h3>อุกกาบาต</h3><p>Meteorite — ชิ้นส่วนที่ตกถึงพื้นโลก</p></div></div><div class="fact">🧠 สูตรจำ: อยู่ในอวกาศ = สะเก็ดดาว → เห็นแสงในบรรยากาศ = ดาวตก → ตกถึงพื้น = อุกกาบาต</div>`},
{title:'06 · แถบไคเปอร์และเมฆออร์ต',html:`<p><b>แถบไคเปอร์ (Kuiper Belt)</b> เป็นบริเวณวัตถุน้ำแข็งที่อยู่เลยวงโคจรดาวเนปจูนออกไป มีพลูโตอยู่ในบริเวณนี้</p><p><b>เมฆออร์ต (Oort Cloud)</b> เป็นบริเวณสมมติฐานของวัตถุน้ำแข็งจำนวนมากที่ล้อมระบบสุริยะอยู่ไกลมาก และเชื่อว่าเป็นแหล่งกำเนิดดาวหางคาบยาวจำนวนมาก</p><div class="fact">🔭 ความแตกต่าง: แถบไคเปอร์มีลักษณะคล้ายจาน ส่วนเมฆออร์ตคาดว่ากระจายล้อมรอบระบบสุริยะเกือบเป็นทรงกลม และยังไม่มีภาพสังเกตเมฆออร์ตโดยตรง</div>`},
{title:'07 · ห้องทดลองจำแนกวัตถุ',html:`<p>อ่านสถานการณ์ แล้วลองเลือกชนิดของวัตถุ ก่อนเปิดเฉลย</p><div class="demo"><button class="btn secondary" onclick="demo(0)">🧊 พลูโต</button><button class="btn secondary" onclick="demo(1)">☄️ วัตถุมีหาง</button><button class="btn secondary" onclick="demo(2)">🌠 แสงพุ่งบนฟ้า</button><button class="btn secondary" onclick="demo(3)">🪨 หินตกถึงพื้น</button></div><div class="fact" id="demoResult">👆 กดเลือกวัตถุเพื่อดูการจำแนกและเหตุผล</div><p class="small sub">กิจกรรมนี้ใช้ฝึกจำแนกจากคำบรรยาย ไม่ใช่การจำลองทางฟิสิกส์แบบ 3 มิติ</p>`},
{title:'08 · สรุปก่อนเข้าสอบ',html:`<div class="grid"><div class="tile"><div class="emoji">🪐</div><h3>ดาวเคราะห์แคระ</h3><p>เกือบกลม แต่ยังไม่กวาดวงโคจร</p></div><div class="tile"><div class="emoji">🪨</div><h3>ดาวเคราะห์น้อย</h3><p>หิน/โลหะ พบมากระหว่างอังคาร–พฤหัสบดี</p></div><div class="tile"><div class="emoji">☄️</div><h3>ดาวหาง</h3><p>น้ำแข็งและฝุ่น หางชี้ออกจากดวงอาทิตย์</p></div><div class="tile"><div class="emoji">🌠</div><h3>ดาวตก</h3><p>แสงจากวัตถุเข้าสู่บรรยากาศ</p></div></div><div class="fact">🏆 พร้อมแล้วหรือยัง? ทดสอบ 5 ข้อ พร้อมเฉลยทันที แล้วไปต่อเกม SPACE OBJECT HUNTER ฉบับ 25 ข้อในไฟล์แยก</div>`}
];
const questions=[{q:'พลูโตถูกจัดเป็นวัตถุประเภทใด?',a:['ดาวฤกษ์','ดาวเคราะห์แคระ','ดาวบริวารของเนปจูน','ดาวเคราะห์ดวงที่ 9'],c:1,why:'พลูโตจัดเป็นดาวเคราะห์แคระ เพราะไม่ผ่านเกณฑ์การกวาดบริเวณวงโคจรให้โล่ง'},{q:'แถบดาวเคราะห์น้อยหลักอยู่ระหว่างดาวเคราะห์คู่ใด?',a:['โลก–อังคาร','ศุกร์–โลก','อังคาร–พฤหัสบดี','เสาร์–ยูเรนัส'],c:2,why:'แถบดาวเคราะห์น้อยหลักอยู่ระหว่างดาวอังคารกับดาวพฤหัสบดี'},{q:'หางของดาวหางโดยทั่วไปชี้ไปทางใด?',a:['ชี้ออกจากดวงอาทิตย์','ชี้เข้าหาดวงอาทิตย์','ชี้ไปตามทิศโคจรเสมอ','ชี้เข้าหาโลกเสมอ'],c:0,why:'ลมสุริยะและแรงดันรังสีจากดวงอาทิตย์ทำให้หางโดยทั่วไปชี้ออกจากดวงอาทิตย์'},{q:'ชิ้นส่วนจากอวกาศที่ตกถึงพื้นโลกเรียกว่าอะไร?',a:['ดาวฤกษ์','ดาวตก','ดาวหาง','อุกกาบาต'],c:3,why:'อุกกาบาต (meteorite) คือชิ้นส่วนที่รอดผ่านบรรยากาศและตกถึงพื้น'},{q:'ข้อใดถูกต้องเกี่ยวกับแถบไคเปอร์?',a:['อยู่ระหว่างโลกกับดาวอังคาร','อยู่เลยวงโคจรของดาวเนปจูน','เป็นชั้นบรรยากาศโลก','ประกอบด้วยดาวฤกษ์เป็นหลัก'],c:1,why:'แถบไคเปอร์เป็นบริเวณวัตถุน้ำแข็งที่อยู่เลยวงโคจรดาวเนปจูนออกไป'}];
let page=0,qi=0,answers={};function switchScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}function showLesson(n){page=n;document.getElementById('counter').textContent=`บทเรียน ${n+1} / ${lessons.length}`;document.getElementById('bar').style.width=`${(n+1)/lessons.length*100}%`;document.getElementById('heading').textContent=lessons[n].title;document.getElementById('body').innerHTML=lessons[n].html;document.getElementById('nextBtn').textContent=n===lessons.length-1?'🧠 เริ่ม Mini Quiz':'หน้าถัดไป →';switchScreen('lesson')}function next(){if(page===lessons.length-1){showQuiz(0)}else showLesson(page+1)}function back(){if(page===0)switchScreen('cover');else showLesson(page-1)}function demo(n){let a=[['ดาวเคราะห์แคระ','พลูโตมีรูปร่างเกือบกลมและยังไม่กวาดวงโคจรให้โล่ง'],['ดาวหาง','เมื่อเข้าใกล้ดวงอาทิตย์ ก๊าซและฝุ่นอาจก่อให้เกิดหาง'],['ดาวตก','แสงที่เห็นเกิดจากสะเก็ดดาวเข้าสู่บรรยากาศ'],['อุกกาบาต','วัตถุจากอวกาศที่ตกถึงพื้นโลก']];document.getElementById('demoResult').textContent=`✅ ${a[n][0]} — ${a[n][1]}`}
function showQuiz(n){qi=n;let q=questions[n];document.getElementById('qcounter').textContent=`MINI QUIZ · ข้อ ${n+1} / ${questions.length}`;document.getElementById('qbar').style.width=`${(n+1)/questions.length*100}%`;document.getElementById('question').textContent=q.q;document.getElementById('options').innerHTML=q.a.map((a,i)=>`<button class="choice ${answers[n]!==undefined?(i===q.c?'correct':i===answers[n]?'wrong':''):''}" onclick="choose(${i})">${'ABCD'[i]}. ${a}</button>`).join('');document.getElementById('feedback').innerHTML=answers[n]===undefined?'':`<div class="answer">${answers[n]===q.c?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง'} เฉลย: ${'ABCD'[q.c]}. ${q.a[q.c]}<p class="mini">${q.why}</p></div>`;document.getElementById('qnext').disabled=answers[n]===undefined;document.getElementById('qnext').textContent=n===questions.length-1?'🏆 ดูผลคะแนน':'ข้อต่อไป →';switchScreen('quiz')}function choose(i){if(answers[qi]!==undefined)return;answers[qi]=i;showQuiz(qi)}function quizNext(){if(qi===questions.length-1){let score=questions.reduce((s,q,i)=>s+(answers[i]===q.c?1:0),0);document.getElementById('score').textContent=`${score} / ${questions.length} คะแนน`;document.getElementById('summary').textContent=score===5?'ยอดเยี่ยม! พร้อมสำหรับข้อสอบชุดใหญ่แล้ว 🚀':'ลองทบทวนบทเรียนและกลับมาฝึกอีกครั้งนะ 🌟';switchScreen('finish')}else showQuiz(qi+1)}function quizBack(){if(qi===0)showLesson(7);else showQuiz(qi-1)}function restartQuiz(){answers={};showQuiz(0)}
</script></body></html>
