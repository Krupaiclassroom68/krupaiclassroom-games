<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kru Pai Classroom | Electricity Lab</title>
<style>
:root{--bg:#07111f;--card:#0d1c31;--line:#254361;--cyan:#67e8f9;--yellow:#fde047;--white:#f8fafc;--muted:#b8c7d9;--good:#86efac;--bad:#fda4af}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:radial-gradient(circle at 20% 0,#12345a 0,#07111f 38%,#040914 100%);color:var(--white);min-height:100vh}
button{font:inherit}.top{position:sticky;top:0;z-index:20;background:#07111fe8;backdrop-filter:blur(12px);border-bottom:1px solid #23405d;padding:10px 16px}
.topin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.5px}.brand b{color:var(--cyan)}
.progress{height:7px;flex:1;background:#14263b;border-radius:99px;overflow:hidden}.bar{height:100%;width:5%;background:linear-gradient(90deg,var(--cyan),var(--yellow));transition:.3s}
.wrap{max-width:1100px;margin:auto;padding:18px}.screen{display:none;min-height:calc(100vh - 110px);animation:in .35s ease}.screen.active{display:block}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;padding:34px 0}.kicker{color:var(--cyan);font-weight:900}.hero h1{font-size:clamp(42px,8vw,92px);line-height:.92;margin:10px 0}.hero h1 span{color:var(--yellow)}.lead{font-size:clamp(18px,2.4vw,25px);color:#dbeafe;line-height:1.6}
.orb{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(80px,15vw,160px);background:radial-gradient(circle,#fff 0 3%,#67e8f9 4% 9%,#1d4ed8 20%,#08111f 66%);box-shadow:0 0 60px #22d3ee88, inset 0 0 45px #fff3}
.card{background:linear-gradient(145deg,#10233b,#0a1627);border:1px solid #294763;border-radius:24px;padding:22px;box-shadow:0 18px 60px #0005;margin:16px 0}
h2{font-size:clamp(34px,5.4vw,58px);margin:5px 0 16px;text-shadow:0 0 22px #22d3ee33}h3{color:var(--cyan);font-size:25px;margin:4px 0 10px}.big{font-size:clamp(20px,2.7vw,29px);line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.mini{background:#0a1728;border:1px solid #27445f;border-radius:18px;padding:20px;line-height:1.65;font-size:19px}.mini b{font-size:1.08em}.mini small{font-size:16px;color:#cbd5e1}
.tag{display:inline-block;padding:7px 12px;border-radius:99px;background:#123653;color:var(--cyan);font-weight:800;margin:3px}
.memory{border-left:5px solid var(--yellow);background:#2b270e;padding:18px 20px;border-radius:14px;font-size:20px;line-height:1.6}.trap{border-left:5px solid var(--bad);background:#34151d;padding:18px 20px;border-radius:14px;font-size:20px;line-height:1.6}
.diagram{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:22px;font-size:30px}.wire{width:70px;height:5px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.bulb{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:#17283a;border:3px solid #789;transition:.25s}.bulb.on{background:#fff4a3;color:#3f3300;border-color:#fff;box-shadow:0 0 30px #fde047}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-bottom:20px}.btn{border:0;border-radius:15px;padding:13px 20px;font-weight:900;cursor:pointer;background:#17314d;color:white}.btn.primary{background:linear-gradient(135deg,#06b6d4,#2563eb);box-shadow:0 8px 25px #06b6d444}.btn:hover{transform:translateY(-1px)}
.compare{width:100%;border-collapse:collapse;font-size:19px}.compare th,.compare td{border-bottom:1px solid #29435e;padding:12px;text-align:left}.compare th{color:var(--yellow)}
.quiz button{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid #35516e;border-radius:14px;background:#0b1a2c;color:white;cursor:pointer}.quiz button.correct{background:#123b28;border-color:var(--good)}.quiz button.wrong{background:#451b24;border-color:var(--bad)}.feedback{min-height:34px;font-weight:800;margin-top:10px}
.navdots{display:flex;gap:5px;overflow:auto;padding:7px 0}.dot{min-width:28px;height:28px;border-radius:9px;border:1px solid #2b4864;background:#0b1726;color:#9fb4c8;font-size:12px}.dot.now{background:#0e7490;color:white}
@media(max-width:700px){.hero{grid-template-columns:1fr}.orb{max-width:230px;margin:auto}.grid{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:17px}.topin{flex-wrap:wrap}.progress{order:3;flex-basis:100%}.compare{font-size:14px}.compare th,.compare td{padding:8px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">⚡ <b>Kru Pai</b> Classroom</div><div id="counter">1 / 20</div><div class="progress"><div class="bar" id="bar"></div></div></div></div>
<main class="wrap" id="app"></main>
<script>
const slides=[
{t:"ELECTRICITY LAB",k:"ไฟฟ้าเบื้องต้น • ระดับประถม",body:`<div class="hero"><div><div class="kicker">⚡ SCIENCE INTERACTIVE LESSON</div><h1>POWER<br><span>THE WORLD</span></h1><p class="lead">จากประจุเล็กจิ๋ว → วงจรไฟฟ้า → บ้านทั้งหลัง<br>เรียนให้ “เข้าใจเหตุผล” พร้อมรับโจทย์วิเคราะห์สอบเข้า ม.1</p><div><span class="tag">20 ห้องเรียนรู้</span><span class="tag">มี Check Point</span><span class="tag">มีข้อสอบหลอก</span></div></div><div class="orb">⚡</div></div>`},
{t:"01 • ไฟฟ้าคืออะไร?",body:`<div class="card big">ไฟฟ้าเกี่ยวข้องกับ <b>ประจุไฟฟ้า</b> และการเคลื่อนที่ของประจุ พลังงานไฟฟ้าสามารถเปลี่ยนเป็นพลังงานรูปอื่นได้</div><div class="grid"><div class="mini">💡 หลอดไฟ<br><b>ไฟฟ้า → แสง + ความร้อน</b></div><div class="mini">🌀 พัดลม<br><b>ไฟฟ้า → การเคลื่อนที่</b></div><div class="mini">🔊 ลำโพง<br><b>ไฟฟ้า → เสียง</b></div><div class="mini">🔥 เตารีด<br><b>ไฟฟ้า → ความร้อน</b></div></div><div class="memory">💎 จำให้แม่น: พลังงานไม่ได้หายไป แต่ “เปลี่ยนรูป”</div>`},
{t:"02 • ประจุไฟฟ้า",body:`<div class="grid"><div class="mini"><h3>➕ โปรตอน</h3>ประจุบวก • อยู่ในนิวเคลียส</div><div class="mini"><h3>➖ อิเล็กตรอน</h3>ประจุลบ • เกี่ยวข้องกับการเกิดไฟฟ้า</div><div class="mini"><h3>⚪ นิวตรอน</h3>ไม่มีประจุ • อยู่ในนิวเคลียส</div><div class="mini"><h3>⚖️ อะตอมเป็นกลาง</h3>จำนวนโปรตอน = อิเล็กตรอน</div></div><div class="card big">ประจุ <b>เหมือนกันผลักกัน</b> ↔️ &nbsp; ประจุ <b>ต่างกันดึงดูดกัน</b> 🧲</div><div class="trap">⚠️ กับดัก: เวลาวัตถุมีประจุ โดยทั่วไปคือมีการ “รับหรือเสียอิเล็กตรอน” ไม่ใช่โปรตอนวิ่งข้ามวัตถุ</div>`},
{t:"03 • ไฟฟ้าสถิต",body:`<div class="card big">เมื่อถูวัตถุบางชนิด อิเล็กตรอนอาจถ่ายโอนจากวัตถุหนึ่งไปอีกวัตถุหนึ่ง ทำให้เกิด <b>ความไม่สมดุลของประจุ</b></div><div class="grid"><div class="mini">🎈 ลูกโป่งถูกับผม → ดูดเส้นผม</div><div class="mini">📄 ไม้บรรทัดพลาสติกถูผ้า → ดูดเศษกระดาษ</div><div class="mini">👕 เสื้อบางชนิดเกิดเสียงเปรี๊ยะเมื่อถอด</div><div class="mini">⚡ ฟ้าแลบ/ฟ้าผ่าเกี่ยวข้องกับการถ่ายเทประจุปริมาณมาก</div></div>`},
{t:"04 • ตัวนำ vs ฉนวน",body:`<div class="grid"><div class="mini"><h3>⚡ ตัวนำไฟฟ้า</h3>ยอมให้กระแสไฟฟ้าผ่านได้ดี<br>เช่น ทองแดง อะลูมิเนียม เหล็ก</div><div class="mini"><h3>🛡️ ฉนวนไฟฟ้า</h3>ยอมให้กระแสผ่านได้ยาก<br>เช่น ยาง พลาสติก แก้วแห้ง</div></div><div class="memory">สายไฟจึงมี “โลหะด้านใน” สำหรับนำไฟฟ้า และ “พลาสติกด้านนอก” เพื่อป้องกันการสัมผัสตัวนำ</div><div class="trap">⚠️ น้ำในชีวิตจริงมักมีสารละลาย/ไอออน จึงนำไฟฟ้าได้ อย่าใช้อุปกรณ์ไฟฟ้าใกล้น้ำ</div>`},
{t:"05 • กระแสไฟฟ้า",body:`<div class="card big"><b>กระแสไฟฟ้า</b> คือการเคลื่อนที่อย่างเป็นระเบียบของประจุไฟฟ้า ในวงจรต้องมีแหล่งกำเนิดและมีเส้นทางครบจึงเกิดกระแสต่อเนื่อง</div><div class="diagram">🔋<span class="wire"></span><div class="bulb on">💡</div><span class="wire"></span>🔁</div><div class="memory">ระดับสูงขึ้นอีกนิด: ทิศ “กระแสแบบดั้งเดิม” กำหนดจาก + → − ภายนอกแหล่งกำเนิด ส่วนอิเล็กตรอนในโลหะเคลื่อนที่สวนทิศ</div>`},
{t:"06 • เซลล์ไฟฟ้าและแบตเตอรี่",body:`<div class="grid"><div class="mini">🔋 <b>เซลล์ไฟฟ้า</b><br>เปลี่ยนพลังงานเคมีเป็นพลังงานไฟฟ้า มีขั้ว + และ −</div><div class="mini">🔋🔋 <b>แบตเตอรี่</b><br>ในทางวิทยาศาสตร์หมายถึงการรวมเซลล์ตั้งแต่หนึ่งหรือหลายเซลล์ตามบริบทการใช้งาน</div></div><div class="card big">ต่อเซลล์แบบอนุกรมในทิศทางเสริมกัน → ความต่างศักย์รวมเพิ่ม → ในวงจรง่าย ๆ หลอดอาจสว่างขึ้น</div><div class="trap">📝 ตัวอย่างข้อสอบ: เซลล์ 1.5 V จำนวน 2 ก้อนต่ออนุกรมแบบเสริมกัน จะให้ความต่างศักย์รวมประมาณ <b>3.0 V</b> แต่ถ้ากลับขั้วก้อนหนึ่ง ผลรวมจะไม่เป็น 3.0 V</div>`},
{t:"07 • วงจรไฟฟ้า",body:`<div class="card"><h3>วงจรพื้นฐานต้องมี</h3><div class="big">🔋 แหล่งกำเนิด &nbsp; • &nbsp; 🧵 ตัวนำ &nbsp; • &nbsp; 💡 อุปกรณ์ใช้ไฟ &nbsp; • &nbsp; 🎚️ สวิตช์ (ถ้ามี)</div></div><div class="grid"><div class="mini"><h3>🔒 วงจรปิด</h3>เส้นทางต่อครบ → กระแสไหล → หลอดติด</div><div class="mini"><h3>🔓 วงจรเปิด</h3>เส้นทางขาด → กระแสไม่ไหลต่อเนื่อง → หลอดดับ</div></div>`},
{t:"08 • สัญลักษณ์วงจร",body:`<div class="grid"><div class="mini">เซลล์: ─┃│─ <small>(เส้นยาว/สั้นแทนขั้ว)</small></div><div class="mini">หลอดไฟ: ─(✕)─</div><div class="mini">สวิตช์เปิด: ─o/ o─</div><div class="mini">สายไฟ: ─────</div><div class="mini">แอมมิเตอร์: ─(A)─</div><div class="mini">โวลต์มิเตอร์: ─(V)─</div></div><div class="memory">โจทย์สอบมักให้ “ภาพอุปกรณ์จริง” แล้วถามว่าแผนภาพสัญลักษณ์ข้อใดตรงกัน ต้องดูการเชื่อมต่อ ไม่ใช่ดูตำแหน่งบนกระดาษ</div>`},
{t:"09 • ต่อหลอดแบบอนุกรม",body:`<div class="diagram">🔋<span class="wire"></span><div class="bulb on">💡A</div><span class="wire"></span><div class="bulb on">💡B</div></div><div class="card big">มี <b>เส้นทางเดียว</b> กระแสต้องผ่านอุปกรณ์ทุกตัวตามเส้นทางเดียวกัน ถ้าหลอดหนึ่งขาด วงจรเปิด → หลอดอื่นในเส้นทางเดียวกันดับ</div><div class="memory">เพิ่มหลอดเหมือนกันแบบอนุกรม → ความต้านทานรวมมากขึ้น → กระแสในวงจรลดลง → โดยทั่วไปหลอดจะหรี่ลง</div>`},
{t:"10 • ต่อหลอดแบบขนาน",body:`<div class="card big">วงจรขนานมี <b>หลายแขนง</b> แต่ละหลอดมีทางเดินของกระแสของตนเอง</div><div class="grid"><div class="mini">💡 A ─────<br>🔋 ┤&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├<br>💡 B ─────</div><div class="mini">ถ้า A ขาด ❌<br>B ยังมีเส้นทางปิดของตัวเอง → <b>B ยังติดได้</b> ✅</div></div><div class="memory">เครื่องใช้ไฟฟ้าในบ้านต่อแบบขนาน เพื่อให้อุปกรณ์ทำงานค่อนข้างเป็นอิสระต่อกันและได้รับความต่างศักย์ของแหล่งจ่ายตามแขนง</div>`},
{t:"11 • อนุกรม vs ขนาน",body:`<div class="card"><table class="compare"><tr><th>สมบัติ</th><th>อนุกรม</th><th>ขนาน</th></tr><tr><td>เส้นทางกระแส</td><td>1 ทาง</td><td>หลายทาง</td></tr><tr><td>หลอดหนึ่งขาด</td><td>เส้นทางนั้นขาดทั้งหมด</td><td>แขนงอื่นยังทำงาน</td></tr><tr><td>เพิ่มหลอดเหมือนกัน</td><td>โดยทั่วไปแต่ละหลอดหรี่ลง</td><td>หลอดเดิมมักใกล้เคียงเดิม เมื่อแหล่งจ่ายเหมาะสม</td></tr><tr><td>ใช้ในบ้าน</td><td>ไม่ใช้เป็นหลัก</td><td>ใช่</td></tr></table></div><div class="trap">⚠️ อย่าตัดสินว่าอนุกรม/ขนานจาก “หน้าตาภาพ” ให้ตามเส้นสายไฟว่ามีกี่เส้นทาง</div>`},
{t:"12 • V • I • R",body:`<div class="grid"><div class="mini"><h3>V • ความต่างศักย์</h3>แรงผลักดันให้ประจุเคลื่อนที่<br>หน่วย <b>โวลต์ (V)</b></div><div class="mini"><h3>I • กระแสไฟฟ้า</h3>อัตราการไหลของประจุ<br>หน่วย <b>แอมแปร์ (A)</b></div><div class="mini"><h3>R • ความต้านทาน</h3>การขัดขวางการไหลของกระแส<br>หน่วย <b>โอห์ม (Ω)</b></div><div class="mini"><h3>🚰 คิดแบบน้ำ</h3>V ≈ แรงดันผลัก<br>I ≈ ปริมาณการไหล<br>R ≈ ความคับแคบของทาง</div></div><div class="memory">การเปรียบเทียบน้ำเป็นเพียง “แบบจำลองช่วยคิด” ไม่ใช่ว่าไฟฟ้าคือน้ำจริง ๆ</div>`},
{t:"13 • เครื่องมือวัด",body:`<div class="grid"><div class="mini"><h3>🅰️ แอมมิเตอร์</h3>วัดกระแสไฟฟ้า<br><b>ต่ออนุกรม</b>กับส่วนที่ต้องการวัด</div><div class="mini"><h3>Ⓥ โวลต์มิเตอร์</h3>วัดความต่างศักย์<br><b>ต่อขนาน</b>คร่อมอุปกรณ์ที่ต้องการวัด</div></div><div class="trap">⚠️ A กับ V ต่อไม่เหมือนกัน! จำว่า <b>A เข้าเส้นทาง</b> • <b>V คร่อมสองด้าน</b></div>`},
{t:"14 • แม่เหล็กไฟฟ้า",body:`<div class="card big">เมื่อมีกระแสไหลในลวด จะเกิด <b>สนามแม่เหล็ก</b> รอบลวด หากพันลวดเป็นขดรอบแกนเหล็ก จะสร้างแม่เหล็กไฟฟ้าที่แรงขึ้นได้</div><div class="grid"><div class="mini">🔔 กระดิ่งไฟฟ้า</div><div class="mini">🏗️ เครนแม่เหล็กยกเศษเหล็ก</div><div class="mini">🔊 ลำโพง</div><div class="mini">⚙️ มอเตอร์ไฟฟ้า</div></div><div class="memory">แม่เหล็กไฟฟ้ามีข้อดีสำคัญ: เปิด–ปิด และปรับความแรงได้ด้วยการควบคุมกระแส/ขดลวด</div>`},
{t:"15 • พลังงานและกำลังไฟฟ้า",body:`<div class="card big"><b>กำลังไฟฟ้า</b> บอกอัตราการใช้/เปลี่ยนพลังงาน หน่วย <b>วัตต์ (W)</b></div><div class="grid"><div class="mini">หลอด 10 W ใช้พลังงานต่อเวลาในอัตราน้อยกว่าอุปกรณ์ 1000 W</div><div class="mini">แต่ค่าไฟรวมยังขึ้นกับ <b>กำลัง × เวลาใช้งาน</b> ด้วย</div></div><div class="trap">⚠️ เครื่อง 1000 W ไม่จำเป็นต้องกินพลังงานรวมมากกว่าเครื่อง 100 W เสมอ ถ้าเวลาใช้งานต่างกันมาก</div>`},
{t:"16 • ถ่านไฟฉายทำงานอย่างไร?",body:`<div class="card big"><b>ถ่านไฟฉาย (เซลล์แห้ง)</b> เป็นแหล่งกำเนิดไฟฟ้าที่เปลี่ยน <b>พลังงานเคมี → พลังงานไฟฟ้า</b> จากปฏิกิริยาเคมีภายในเซลล์</div><div class="grid"><div class="mini"><h3>➕ ขั้วบวก</h3>บริเวณปลายปุ่มของถ่าน เป็นจุดต่อด้านบวกของเซลล์</div><div class="mini"><h3>➖ ขั้วลบ / กระป๋องสังกะสี</h3>ในเซลล์สังกะสี-คาร์บอนแบบดั้งเดิม สังกะสีมีส่วนร่วมในปฏิกิริยาและเป็นขั้วลบ</div><div class="mini"><h3>⚫ แท่งคาร์บอน</h3>ช่วยเป็นตัวนำ/ตัวสะสมกระแสบริเวณขั้วบวกในถ่านสังกะสี-คาร์บอน</div><div class="mini"><h3>🧪 สารอิเล็กโทรไลต์</h3>ช่วยให้ไอออนเคลื่อนที่ภายในเซลล์ ทำให้ปฏิกิริยาเคมีและการส่งผ่านประจุดำเนินต่อไปได้</div><div class="mini"><h3>🧱 สารกั้น</h3>ช่วยแยกส่วนที่ไม่ควรสัมผัสกันโดยตรง แต่ยอมให้ไอออนผ่านได้</div><div class="mini"><h3>🛡️ เปลือกหุ้ม</h3>ช่วยป้องกันส่วนประกอบภายในและลดโอกาสการรั่ว/สัมผัสโดยตรง</div></div><div class="memory">💎 ประเด็นสอบ: ถ่านไม่ได้ “เก็บกระแสไฟฟ้าไว้แล้วปล่อยออกมา” แต่ปฏิกิริยาเคมีสร้างความต่างศักย์และผลักดันให้เกิดกระแสเมื่อวงจรปิด</div><div class="trap">📝 ตัวอย่างสอบเข้า: ถ้าสารเคมีในถ่านหมดความสามารถในการเกิดปฏิกิริยาอย่างเหมาะสม ความต่างศักย์ลดลง → อุปกรณ์ทำงานอ่อนลงหรือหยุดทำงาน</div>`},
{t:"17 • ไฟฟ้าจากปฏิกิริยาเคมี",body:`<div class="card big">เซลล์ไฟฟ้าเคมีใช้ <b>ปฏิกิริยาออกซิเดชัน–รีดักชัน</b> แยกการถ่ายโอนอิเล็กตรอนให้ไหลผ่านวงจรภายนอก จึงเปลี่ยนพลังงานเคมีเป็นไฟฟ้าได้</div><div class="grid"><div class="mini">🍋 <b>แบตเตอรี่มะนาว</b><br>ใช้โลหะต่างชนิด เช่น Zn และ Cu เสียบในสารละลายที่มีไอออน เกิดความต่างศักย์ได้</div><div class="mini">🔋 <b>ถ่านไฟฉาย</b><br>สารเคมีและขั้วไฟฟ้าภายในทำปฏิกิริยาเพื่อสร้างความต่างศักย์</div><div class="mini">🚗 <b>แบตเตอรี่รถยนต์</b><br>เป็นเซลล์ไฟฟ้าเคมีที่สามารถชาร์จกลับได้</div><div class="mini">📱 <b>แบตเตอรี่ลิเทียมไอออน</b><br>ใช้ปฏิกิริยาเคมีแบบย้อนกลับได้ในการจ่ายและรับพลังงาน</div></div><div class="trap">🧠 โจทย์ชอบถาม: “มะนาวเป็นแหล่งอิเล็กตรอนเองหรือไม่?” จุดสำคัญคือระบบต้องมี <b>ขั้วไฟฟ้าต่างชนิด + อิเล็กโทรไลต์ + วงจรภายนอก</b> ไม่ใช่เพียงมีมะนาวอย่างเดียว</div>`},
{t:"18 • DC และ AC",body:`<div class="grid"><div class="mini"><h3>➡️ DC • ไฟฟ้ากระแสตรง</h3>ทิศของกระแสมีทิศเดียวตามขั้วของแหล่งจ่าย<br><b>ตัวอย่าง:</b> ถ่านไฟฉาย แบตเตอรี่ พาวเวอร์แบงก์ และวงจรอิเล็กทรอนิกส์จำนวนมาก</div><div class="mini"><h3>↔️ AC • ไฟฟ้ากระแสสลับ</h3>ทิศทางและขนาดของกระแสเปลี่ยนแปลงเป็นคาบ<br><b>ตัวอย่าง:</b> ไฟฟ้าจากเต้ารับในบ้าน</div></div><div class="card big">ทำไมบ้านใช้ AC? ⚡ ระบบไฟฟ้ากำลังสามารถปรับระดับแรงดันด้วยหม้อแปลงได้สะดวก ช่วยให้ส่งพลังงานระยะไกลอย่างมีประสิทธิภาพ แล้วจึงลดแรงดันก่อนนำมาใช้</div><div class="memory">จำง่าย: 🔋 Battery → DC &nbsp;&nbsp; | &nbsp;&nbsp; 🏠 Wall outlet → AC</div><div class="trap">⚠️ โทรศัพท์ใช้ไฟ DC ภายใน แม้ที่ชาร์จเสียบเต้ารับ AC — อะแดปเตอร์มีหน้าที่แปลง/ควบคุมไฟให้เหมาะกับอุปกรณ์</div>`},
{t:"19 • ตัวนำไฟฟ้าที่พบบ่อย",body:`<div class="grid"><div class="mini"><h3>🥇 ทองแดง (Cu)</h3>นำไฟฟ้าดี ดัดง่าย ราคาเหมาะสม → <b>สายไฟ สายมอเตอร์ แผงวงจร</b></div><div class="mini"><h3>⚪ อะลูมิเนียม (Al)</h3>เบา นำไฟฟ้าได้ดี → <b>สายส่งไฟฟ้าบางชนิด</b></div><div class="mini"><h3>✨ เงิน (Ag)</h3>นำไฟฟ้าได้ดีมาก แต่ราคาแพง → ใช้ใน <b>หน้าสัมผัส/งานเฉพาะ</b></div><div class="mini"><h3>🟡 ทองคำ (Au)</h3>นำไฟฟ้าดีและทนการกัดกร่อน → <b>ขั้วต่ออิเล็กทรอนิกส์บางชนิด</b></div><div class="mini"><h3>✏️ แกรไฟต์</h3>เป็นอโลหะที่นำไฟฟ้าได้ → ตัวอย่างสำคัญที่ทำลายความเชื่อว่า “ตัวนำต้องเป็นโลหะเสมอ”</div><div class="mini"><h3>💧 สารละลายไอออน</h3>น้ำเกลือ/สารละลายอิเล็กโทรไลต์นำไฟฟ้าได้ เพราะมี <b>ไอออนเคลื่อนที่</b></div></div><div class="trap">📝 แนวสอบ: “ข้อใดเป็นตัวนำแต่ไม่ใช่โลหะ?” → <b>แกรไฟต์</b> เป็นคำตอบที่ออกได้บ่อย</div>`},
{t:"20 • กฎของโอห์ม V = IR",body:`<div class="card big">สำหรับตัวนำโอห์มิกภายใต้สภาวะคงที่ ความต่างศักย์ กระแส และความต้านทานสัมพันธ์กันด้วย<br><div style="font-size:clamp(42px,8vw,82px);text-align:center;color:#fde047;font-weight:900;margin:15px">V = I × R</div></div><div class="grid"><div class="mini"><h3>หา V</h3>V = I × R<br>เช่น I = 2 A, R = 5 Ω<br><b>V = 2 × 5 = 10 V</b></div><div class="mini"><h3>หา I</h3>I = V ÷ R<br>เช่น V = 12 V, R = 4 Ω<br><b>I = 12 ÷ 4 = 3 A</b></div><div class="mini"><h3>หา R</h3>R = V ÷ I<br>เช่น V = 9 V, I = 3 A<br><b>R = 9 ÷ 3 = 3 Ω</b></div><div class="mini"><h3>หน่วยต้องจำ</h3>V → volt (V)<br>I → ampere (A)<br>R → ohm (Ω)</div></div><div class="memory">💡 เทคนิคสอบ: เขียน “สิ่งที่โจทย์ให้ → สิ่งที่ถาม → เลือกสูตร → แทนค่า → ใส่หน่วย” ลดความผิดพลาดได้มาก</div>`},
{t:"21 • ฝึกคำนวณความต้านทาน",body:`<div class="card quiz"><h3>🧠 ตัวอย่าง 1</h3><div class="big">หลอดหนึ่งต่อกับความต่างศักย์ 6 V มีกระแส 0.5 A ไหลผ่าน หลอดมีความต้านทานเท่าใด?</div><button onclick="ans(this,false)">3 Ω</button><button onclick="ans(this,true)">12 Ω</button><button onclick="ans(this,false)">30 Ω</button><div class="feedback"></div><div class="memory">วิธีคิด: R = V ÷ I = 6 ÷ 0.5 = <b>12 Ω</b></div></div><div class="card"><h3>🔥 ตัวอย่าง 2 • ยกระดับ</h3><div class="big">ตัวต้านทาน 10 Ω ต่อกับ 20 V → I = 20 ÷ 10 = <b>2 A</b><br>ถ้าเพิ่ม R เป็น 20 Ω แต่ V เท่าเดิม → I = 20 ÷ 20 = <b>1 A</b></div><div class="trap">สรุป: เมื่อ V คงที่ ถ้า R เพิ่ม กระแส I จะลดลง</div></div>`},
{t:"22 • โจทย์สอบเข้า: V-I-R",body:`<div class="card quiz"><h3>MISSION A ⚡</h3><div class="big">อุปกรณ์มี R = 6 Ω และมีกระแส 2 A ความต่างศักย์เท่าใด?</div><button onclick="ans(this,true)">12 V</button><button onclick="ans(this,false)">8 V</button><button onclick="ans(this,false)">3 V</button><div class="feedback"></div></div><div class="card quiz"><h3>MISSION B 🔥</h3><div class="big">ต่อแหล่งจ่าย 12 V กับ R = 4 Ω ถ้าเปลี่ยนเป็น R = 6 Ω โดย V เท่าเดิม กระแสใหม่เท่าใด?</div><button onclick="ans(this,false)">3 A</button><button onclick="ans(this,true)">2 A</button><button onclick="ans(this,false)">18 A</button><div class="feedback"></div></div><div class="memory">👑 แนวสอบเข้าไม่ได้ถามสูตรอย่างเดียว แต่อาจถาม “ถ้าเปลี่ยนตัวแปรหนึ่ง อีกตัวเปลี่ยนอย่างไร”</div>`},
{t:"23 • ความปลอดภัย",body:`<div class="grid"><div class="mini">🧯 <b>ฟิวส์</b><br>หลอมขาดเมื่อกระแสมากเกินค่าที่ออกแบบ</div><div class="mini">🛑 <b>เซอร์กิตเบรกเกอร์</b><br>ตัดวงจรเมื่อเกิดสภาวะผิดปกติตามชนิดของอุปกรณ์</div><div class="mini">🌍 <b>สายดิน</b><br>ช่วยให้กระแสผิดปกติมีเส้นทางลงดินและทำให้อุปกรณ์ป้องกันทำงาน</div><div class="mini">💥 <b>ลัดวงจร</b><br>เกิดเส้นทางความต้านทานต่ำผิดปกติ → กระแสสูง → ร้อน/อันตราย</div></div><div class="memory">มือเปียก + อุปกรณ์ไฟฟ้า = หลีกเลี่ยงเด็ดขาด ⚠️</div>`},
{t:"24 • กับดักข้อสอบ",body:`<div class="card big">❌ “กระแสถูกหลอดไฟใช้จนหมด”<br>✅ หลอดเปลี่ยน <b>พลังงานไฟฟ้า</b> เป็นรูปอื่น กระแสในวงจรอนุกรมอุดมคติไม่ได้ค่อย ๆ ถูกกินหมด</div><div class="card big">❌ “หลอดใกล้แบตเตอรี่กว่าสว่างกว่า”<br>✅ ตำแหน่งใกล้–ไกลบนภาพไม่ใช่ตัวตัดสิน ต้องดูการต่อวงจร</div><div class="card big">❌ “มีแบตเตอรี่กับหลอดก็ต้องติด”<br>✅ ต้องมีเส้นทางวงจรปิดครบจากขั้วหนึ่ง ผ่านอุปกรณ์ แล้วกลับอีกขั้ว</div>`},
{t:"25 • THINK LIKE A SCIENTIST",body:`<div class="card quiz"><h3>🧠 ถ้ามีหลอดเหมือนกัน 2 หลอดต่ออนุกรม แล้วหลอด A ขาด จะเกิดอะไรขึ้น?</h3><button onclick="ans(this,false)">B สว่างขึ้น</button><button onclick="ans(this,true)">B ดับ เพราะเส้นทางกระแสขาด</button><button onclick="ans(this,false)">B สว่างเท่าเดิม</button><div class="feedback"></div></div><div class="card quiz"><h3>บ้านควรต่อเครื่องใช้แบบใดเป็นหลัก?</h3><button onclick="ans(this,false)">อนุกรม เพื่อให้ใช้สวิตช์เดียว</button><button onclick="ans(this,true)">ขนาน เพื่อให้แต่ละแขนงทำงานได้ค่อนข้างอิสระ</button><div class="feedback"></div></div>`},
{t:"26 • BOSS REVIEW",body:`<div class="grid"><div class="mini">⚡ ประจุ: เหมือนผลัก ต่างดึงดูด</div><div class="mini">🔌 วงจรปิด: กระแสไหลต่อเนื่องได้</div><div class="mini">🛣️ อนุกรม: เส้นทางเดียว</div><div class="mini">🛤️ ขนาน: หลายแขนง</div><div class="mini">🅰️ แอมมิเตอร์: ต่ออนุกรม</div><div class="mini">Ⓥ โวลต์มิเตอร์: ต่อขนาน</div><div class="mini">🧲 กระแสสร้างสนามแม่เหล็ก</div><div class="mini">🛡️ ฟิวส์/เบรกเกอร์/สายดินช่วยเพิ่มความปลอดภัย</div></div><div class="memory">👑 ถ้าเด็กอธิบาย “ทำไม” ของทุกกล่องนี้ได้ ไม่ใช่แค่ท่องจำ ก็พร้อมไปต่อโจทย์วิเคราะห์ระดับสอบเข้า ม.1 แล้ว!</div>`},
{t:"MISSION COMPLETE ⚡",body:`<div class="hero"><div><div class="kicker">KRU PAI CLASSROOM • SCIENCE</div><h1>READY FOR<br><span>THE MISSION?</span></h1><p class="lead">ทบทวนครบแล้ว: ประจุ • วงจร • อนุกรม/ขนาน • การวัด • แม่เหล็กไฟฟ้า • ความปลอดภัย</p><div class="memory">ขั้นต่อไปที่เหมาะที่สุด: เกมวิเคราะห์วงจรไฟฟ้า 30–40 ข้อ ที่ไม่ได้ถามแค่ความจำ ⚡🧠</div></div><div class="orb">🏆</div></div>`}
];
let i=0;
function render(){
 const s=slides[i]; document.getElementById('app').innerHTML=`<section class="screen active"><div class="kicker">${s.k||"⚡ ELECTRICITY LAB"}</div><h2>${s.t}</h2>${s.body}<div class="controls"><button class="btn" onclick="go(-1)" ${i===0?'disabled':''}>← ย้อนกลับ</button><button class="btn primary" onclick="go(1)">${i===slides.length-1?'กลับหน้าแรก ↻':'ถัดไป →'}</button></div></section>`;
 document.getElementById('counter').textContent=`${i+1} / ${slides.length}`;
 document.getElementById('bar').style.width=((i+1)/slides.length*100)+'%';
 window.scrollTo({top:0,behavior:'smooth'});
}
function go(d){ if(i===slides.length-1&&d===1)i=0; else i=Math.max(0,Math.min(slides.length-1,i+d)); render();}
function ans(el,ok){const box=el.closest('.quiz'); box.querySelectorAll('button').forEach(b=>b.disabled=true);el.classList.add(ok?'correct':'wrong');box.querySelector('.feedback').innerHTML=ok?'✅ ถูกต้อง! เหตุผลสัมพันธ์กับโครงสร้างของวงจร':'❌ ยังไม่ใช่ ลองทบทวนหลักการของเส้นทางกระแสจากหน้าก่อน ๆ';}
render();
</script>
</body></html>
