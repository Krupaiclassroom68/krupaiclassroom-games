<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Time Master Galaxy EP2 - Past / To</title>
<style>
:root{
  --bg0:#050617;--bg1:#101746;--bg2:#351b80;
  --cyan:#64e9ff;--pink:#ff65d8;--yellow:#ffe96a;--green:#61ff9a;--red:#ff5571;
  --card:rgba(255,255,255,.105);--line:rgba(255,255,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#050617;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 18% 18%,rgba(100,233,255,.25),transparent 25%),
    radial-gradient(circle at 80% 22%,rgba(255,101,216,.22),transparent 25%),
    radial-gradient(circle at 52% 86%,rgba(255,233,106,.16),transparent 32%),
    linear-gradient(145deg,var(--bg2),var(--bg1),var(--bg0));
}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.52;background-image:radial-gradient(circle,#fff 1px,transparent 1.8px),radial-gradient(circle,var(--cyan) 1px,transparent 2px);background-size:120px 120px,190px 190px;animation:stars 90s linear infinite}
body:after{content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent,rgba(100,233,255,.08),transparent,rgba(255,101,216,.08),transparent);animation:nebula 30s linear infinite}
@keyframes stars{to{transform:translateY(300px)}}
@keyframes nebula{to{transform:rotate(360deg)}}
.screen{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.glass{width:min(1180px,96vw);border-radius:34px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.055));box-shadow:0 28px 90px rgba(0,0,0,.48),inset 0 0 45px rgba(100,233,255,.045);backdrop-filter:blur(14px);padding:26px}
.startGrid,.arena{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center}
.badge{display:inline-flex;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,233,106,.45);background:rgba(255,233,106,.14);color:#fff5a5;font-weight:1000;margin-bottom:12px}
.title{font-size:clamp(2.4rem,6.4vw,5.5rem);font-weight:1000;line-height:.9;letter-spacing:-2px;text-shadow:0 0 30px rgba(100,233,255,.42),0 0 60px rgba(255,101,216,.24)}
.subtitle{font-size:clamp(1rem,2vw,1.3rem);line-height:1.7;color:rgba(255,255,255,.92);font-weight:800;margin:18px 0}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.feature{padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);font-weight:1000;color:#eafdff}
input{width:100%;border:0;outline:none;border-radius:20px;padding:18px 20px;font-size:1.13rem;font-weight:1000;color:#11184a;background:rgba(255,255,255,.94);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.buttons,.options{display:flex;gap:13px;flex-wrap:wrap;justify-content:center;margin-top:18px}
button{border:0;border-radius:20px;padding:15px 22px;font-size:1rem;font-weight:1000;cursor:pointer;transition:.14s transform,.14s filter;box-shadow:0 12px 25px rgba(0,0,0,.28)}
button:hover{transform:translateY(-2px);filter:brightness(1.05)}
button:disabled{cursor:not-allowed;filter:grayscale(.2);opacity:.8}
.play{background:linear-gradient(180deg,#fff8c2,var(--yellow));color:#2d2100;border:1px solid rgba(255,255,255,.58)}
.secondary{background:linear-gradient(180deg,#ecfdff,#81f0ff);color:#06264a}
.homeBtn{background:linear-gradient(180deg,#ffffff,#ddd);color:#14142a}
.clockPanel{position:relative;overflow:hidden;text-align:center;padding:22px;border-radius:30px;background:radial-gradient(circle at 50% 28%,rgba(100,233,255,.18),rgba(255,255,255,.06) 48%,rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14)}
.clockPanel:before{content:"";position:absolute;inset:-55%;background:conic-gradient(from 0deg,transparent,rgba(255,233,106,.12),transparent,rgba(100,233,255,.15),transparent);animation:spin 13s linear infinite}
.clockContent{position:relative;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.face{width:min(64vw,330px);aspect-ratio:1;margin:0 auto;position:relative;border-radius:50%;background:radial-gradient(circle,#192567 0 45%,#0b123c 46% 64%,#080f2d 65%);border:8px solid rgba(100,233,255,.76);box-shadow:0 0 44px rgba(100,233,255,.36),inset 0 0 32px rgba(255,255,255,.10)}
.face:before{content:"";position:absolute;inset:15px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
.num{position:absolute;left:50%;top:50%;font-size:1.15rem;font-weight:1000;text-shadow:0 0 9px rgba(255,255,255,.55);transform:translate(-50%,-50%)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:999px;box-shadow:0 0 13px rgba(255,255,255,.42)}
.hour{width:9px;height:28%;background:linear-gradient(180deg,#fff,var(--yellow))}
.minute{width:6px;height:39%;background:linear-gradient(180deg,#fff,var(--cyan))}
.dot{position:absolute;left:50%;top:50%;width:21px;height:21px;background:#fff;border:4px solid var(--pink);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(255,101,216,.72)}
.digital{display:inline-block;margin-top:14px;font-size:clamp(3.1rem,8.5vw,7rem);font-weight:1000;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 30px rgba(255,233,106,.56),0 0 60px rgba(255,233,106,.22)}
.mission{font-size:clamp(1.05rem,2.2vw,1.42rem);font-weight:1000;margin-top:10px;color:#eafdff}.modeLine{font-size:.95rem;color:#c1f6ff;font-weight:900;margin-top:7px}
.hud{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid rgba(255,255,255,.13);border-radius:22px;text-align:center;padding:15px}.label{font-size:.77rem;letter-spacing:1px;font-weight:1000;opacity:.74}.value{font-size:clamp(1.35rem,3vw,2.15rem);font-weight:1000;margin-top:6px}.timeWarn{color:var(--red);animation:pulse .45s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.option{width:min(100%,520px);min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:linear-gradient(180deg,#fff,#dcf8ff);color:#11184a;border:2px solid rgba(255,255,255,.6);font-size:clamp(1.02rem,2vw,1.28rem)}
.option .mark{font-size:1.8rem;opacity:0;transform:scale(.6);transition:.18s}.option.correct{background:linear-gradient(180deg,#caffdf,#4eff97);color:#062b18;box-shadow:0 0 34px rgba(97,255,154,.55)}.option.wrong{background:linear-gradient(180deg,#ffbdc8,#ff5571);color:#fff;box-shadow:0 0 34px rgba(255,85,113,.45)}.option.correct .mark,.option.wrong .mark{opacity:1;transform:scale(1.1)}
.spinWin .minute,.spinWin .hour{animation:winSpin .9s cubic-bezier(.2,.8,.1,1)}@keyframes winSpin{to{transform:rotate(calc(var(--rot) + 360deg))}}.shake{animation:shake .44s ease-in-out 2}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(7px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99;background:rgba(0,0,0,.35);pointer-events:none}.popup.show{display:flex}.popupBox{width:min(90vw,560px);text-align:center;border-radius:34px;padding:34px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(226,249,255,.96));color:#09102e;box-shadow:0 30px 90px rgba(0,0,0,.58),0 0 56px rgba(100,233,255,.5);animation:pop .28s forwards}.popup.wrong .popupBox{background:linear-gradient(180deg,#fff,#ffdbe1);box-shadow:0 30px 90px rgba(0,0,0,.58),0 0 56px rgba(255,85,113,.55)}@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}.bigEmoji{font-size:5rem}.bigText{font-size:clamp(1.7rem,4.6vw,3rem);font-weight:1000}.smallText{margin-top:8px;color:#304050;font-weight:1000}
.summaryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px;max-height:48vh;overflow:auto;padding-right:4px}.summaryCard{padding:15px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13)}.summaryCard b{color:var(--yellow)}.answerLine{margin-top:8px;color:#c3f7ff;font-weight:1000}.ok{color:var(--green)}.bad{color:#ff9cad}.scorePill{display:inline-block;margin-top:18px;padding:16px 28px;border-radius:999px;background:linear-gradient(180deg,#fff8c2,var(--yellow));color:#2d2100;font-size:clamp(1.8rem,5vw,3.1rem);font-weight:1000}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}.piece{position:absolute;width:10px;height:18px;border-radius:4px;background:var(--yellow);animation:fall 1.35s linear forwards}.piece:nth-child(3n){background:var(--cyan)}.piece:nth-child(4n){background:var(--pink)}.piece:nth-child(5n){background:var(--green)}@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(105vh) rotate(720deg)}}
@media(max-width:900px){.startGrid,.arena{grid-template-columns:1fr}.clockPanel{order:-1}.hud{grid-template-columns:1fr 1fr}.features{grid-template-columns:1fr}.glass{padding:20px}.face{width:min(72vw,300px)}}
@media(max-width:620px){.screen{padding:10px;align-items:flex-start}.glass{border-radius:24px;padding:14px;margin-top:8px}.title{font-size:2.55rem}.subtitle{font-size:.98rem}.hud{gap:8px}.card{padding:10px}.value{font-size:1.26rem}.digital{font-size:3.25rem}.face{width:min(78vw,250px)}.option{min-height:64px}.buttons,.options{display:grid;grid-template-columns:1fr}button{width:100%}.summaryGrid{max-height:52vh}}

.kpc-report{max-width:930px;margin:auto;text-align:center}
.kpc-brand{font-size:clamp(1.45rem,4vw,2.4rem);font-weight:1000;color:#ffe96a;letter-spacing:1px}
.kpc-title{font-size:clamp(1.1rem,3vw,1.7rem);font-weight:900;margin:12px 0}
.kpc-meta{color:#e1f7ff;font-weight:800;line-height:1.9;overflow-wrap:anywhere}
.kpc-score{font-size:clamp(2.2rem,7vw,4rem);font-weight:1000;color:#ffe96a;margin:14px}
.kpc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.kpc-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);border-radius:18px;padding:13px 6px}
.kpc-stat strong{display:block;font-size:clamp(1.3rem,4vw,2.1rem);color:#ffe96a}
.kpc-stat span{font-size:clamp(.75rem,2vw,.95rem)}
.kpc-box{background:rgba(2,12,38,.45);border:1px solid rgba(100,233,255,.28);border-radius:23px;padding:18px;margin:16px 0;text-align:left}
.kpc-box h3{margin:0 0 10px;color:#ffe96a}
.kpc-chart{width:100%;height:210px}
.kpc-rounds{display:flex;flex-wrap:wrap;gap:9px}
.kpc-round{border:1px solid rgba(255,255,255,.15);border-radius:13px;padding:9px 12px;background:rgba(255,255,255,.08);font-weight:800}
.kpc-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.kpc-actions button{min-width:155px;flex:1}
.kpc-qnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px}
.kpc-qnav button{padding:10px 4px;min-width:0;border-radius:12px;font-size:1rem}
.kpc-qdetail{background:rgba(255,255,255,.08);border-radius:16px;padding:15px;margin-top:12px;line-height:1.7}
@media(max-width:580px){.kpc-stats{gap:5px}.kpc-stat{padding:9px 3px}.kpc-actions button{min-width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="popup" class="popup"><div class="popupBox"><div id="popEmoji" class="bigEmoji">✅</div><div id="popText" class="bigText">Great!</div><div id="popSmall" class="smallText"></div></div></div>
<script>
'use strict';
const QUESTIONS=[
 {time:'01:05',answer:'It is five past one.',choices:['It is five past one.','It is five to one.','It is a quarter past one.','It is ten past one.']},
 {time:'02:10',answer:'It is ten past two.',choices:['It is ten to two.','It is ten past two.','It is twenty past two.','It is half past two.']},
 {time:'03:15',answer:'It is a quarter past three.',choices:['It is a quarter to three.','It is three fifteen.','It is a quarter past three.','It is half past three.']},
 {time:'04:20',answer:'It is twenty past four.',choices:['It is twenty to four.','It is a quarter past four.','It is twenty past four.','It is twenty to five.']},
 {time:'05:25',answer:'It is twenty-five past five.',choices:['It is twenty-five to five.','It is twenty-five past five.','It is five to six.','It is half past five.']},
 {time:'06:30',answer:'It is half past six.',choices:['It is half past six.','It is a quarter past six.','It is thirty to six.','It is a quarter to seven.']},
 {time:'07:35',answer:'It is twenty-five to eight.',choices:['It is twenty-five past eight.','It is twenty-five to eight.','It is twenty-five past seven.','It is a quarter to eight.']},
 {time:'08:40',answer:'It is twenty to nine.',choices:['It is twenty past nine.','It is twenty to nine.','It is twenty past eight.','It is a quarter to nine.']},
 {time:'09:45',answer:'It is a quarter to ten.',choices:['It is a quarter past nine.','It is a quarter to ten.','It is half past nine.','It is ten to nine.']},
 {time:'10:50',answer:'It is ten to eleven.',choices:['It is ten past eleven.','It is ten to eleven.','It is a quarter to eleven.','It is five to eleven.']},
 {time:'11:55',answer:'It is five to twelve.',choices:['It is five past twelve.','It is five to twelve.','It is ten to twelve.','It is a quarter to twelve.']},
 {time:'12:00',answer:"It is twelve o'clock.",choices:["It is twelve o'clock.","It is a quarter past twelve.","It is half past twelve.","It is five to twelve."]},
 {time:'12:15',answer:'It is a quarter past twelve.',choices:['It is a quarter past twelve.','It is a quarter to twelve.','It is half past twelve.','It is twelve o\'clock.']},
 {time:'02:45',answer:'It is a quarter to three.',choices:['It is a quarter to three.','It is a quarter past two.','It is half past two.','It is ten to three.']},
 {time:'03:30',answer:'It is half past three.',choices:['It is half past three.','It is a quarter past three.','It is a quarter to four.','It is ten past three.']},
 {time:'04:40',answer:'It is twenty to five.',choices:['It is twenty past five.','It is twenty to five.','It is twenty past four.','It is a quarter to five.']},
 {time:'06:55',answer:'It is five to seven.',choices:['It is five past seven.','It is five to seven.','It is ten to seven.','It is a quarter to seven.']}
];
const PRAISES=['Excellent! 🌟','Clock Champion! 👑','Past / To Master! ⏰','Awesome! 🚀','เก่งมากเลย 👏','ปังมากจ้า ✨'];
let state={screen:'start',name:'',index:0,score:0,time:15,timer:null,history:[],locked:false,currentChoices:[]};
let audioCtx=null;
function getCtx(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,dur,type='sine',gain=.12,delay=0){const ctx=getCtx();if(!ctx)return;const now=ctx.currentTime+delay;const o=ctx.createOscillator();const g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(gain,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+dur+.04)}
function sound(type){if(type==='click')beep(520,.08,'triangle',.08);if(type==='tick')beep(920,.035,'square',.025);if(type==='correct'){[523,659,784,1046,1318].forEach((f,i)=>beep(f,.16,'sine',.13,i*.055))}if(type==='wrong'){beep(210,.32,'sawtooth',.13);setTimeout(()=>beep(110,.25,'sawtooth',.09),120)}if(type==='finish'){[392,523,659,784,1046].forEach((f,i)=>beep(f,.23,'triangle',.14,i*.08))}}
function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;window.speechSynthesis.speak(u)}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function angles(time){const parts=time.split(':').map(Number);const h=parts[0]%12,m=parts[1];return{hour:h*30+m*.5,min:m*6}}
function clockFace(time){const a=angles(time);let nums='';for(let n=1;n<=12;n++){const deg=n*30,r=42,x=50+Math.sin(deg*Math.PI/180)*r,y=50-Math.cos(deg*Math.PI/180)*r;nums+=`<div class="num" style="left:${x}%;top:${y}%">${n}</div>`}return `<div class="face" id="face">${nums}<div class="hand hour" style="--rot:${a.hour}deg;transform:rotate(${a.hour}deg)"></div><div class="hand minute" style="--rot:${a.min}deg;transform:rotate(${a.min}deg)"></div><div class="dot"></div></div>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function render(){
 const app=document.getElementById('app');
 if(state.screen==='start'){
   app.innerHTML=`<div class="screen"><div class="glass"><div class="startGrid"><div><div class="badge">EP2 • Past / To Arena ⚡</div><div class="title">Time Master<br>Galaxy</div><div class="subtitle">อ่านเวลาจากหน้าปัด แล้วเลือกคำตอบแบบ <b>past / to</b> ให้ถูกต้อง 🌌<br>รอบนี้แก้ใหม่ทั้งไฟล์: มี <b>a quarter</b>, มี 12:00, 15 วินาทีต่อข้อ และปุ่มกดได้ครบ</div><div class="features"><div class="feature">⏰ Past / To Practice</div><div class="feature">⚡ 15 seconds each</div><div class="feature">✅ Correct / Wrong sound</div><div class="feature">📱 Mobile + TV ready</div></div><input id="playerName" placeholder="Type your name"><div class="buttons"><button class="play" onclick="startGame()">START EP2 MISSION</button><button class="secondary" onclick="demoSound()">TEST SOUND 🔊</button></div></div><div class="clockPanel"><div class="clockContent">${clockFace('04:40')}<div class="digital">04:40</div><div class="mission">Answer: It is twenty to five.</div><div class="modeLine">Past / To Master Challenge</div></div></div></div></div></div>`;
   return;
 }
 if(state.screen==='game'){
   const q=QUESTIONS[state.index];
   app.innerHTML=`<div class="screen"><div class="glass" id="gameGlass"><div class="hud"><div class="card"><div class="label">PLAYER</div><div class="value">${esc(state.name)}</div></div><div class="card"><div class="label">QUESTION</div><div class="value">${state.index+1}/${QUESTIONS.length}</div></div><div class="card"><div class="label">SCORE</div><div class="value" style="color:var(--yellow)">${state.score}</div></div><div class="card"><div class="label">TIME</div><div class="value ${state.time<=5?'timeWarn':''}">${state.time}</div></div></div><div class="arena"><div class="clockPanel" id="clockPanel"><div class="clockContent">${clockFace(q.time)}<div class="digital">${q.time}</div><div class="mission">What time is it?</div><div class="modeLine">Choose the best English time expression ✨</div></div></div><div><div class="options">${state.currentChoices.map(c=>`<button class="option" data-choice="${esc(c)}" onclick="checkAnswer(this)"><span>${esc(c)}</span><span class="mark"></span></button>`).join('')}</div><div class="buttons"><button class="secondary" onclick="readQuestion()">READ TIME 🔊</button><button class="homeBtn" onclick="goHome()">HOME</button></div></div></div></div></div>`;
   return;
 }
 if(state.screen==='summary'){kpcRenderSummary();}

}
function demoSound(){sound('correct');speak('Time Master Galaxy')}
function startGame(){state.kpcSaved=false;state.kpcLatest=null;sound('click');const input=document.getElementById('playerName');state.screen='game';state.name=(input&&input.value.trim())||'Guest';state.index=0;state.score=0;state.history=[];state.locked=false;prepareRound();state.time=15;render();startTimer()}
function prepareRound(){state.currentChoices=shuffle([...QUESTIONS[state.index].choices])}
function startTimer(){clearInterval(state.timer);state.time=15;render();state.timer=setInterval(()=>{state.time--;if(state.time<=5&&state.time>0)sound('tick');if(state.time<=0){timeoutRound();return}render()},1000)}
function checkAnswer(btn){if(state.locked)return;state.locked=true;clearInterval(state.timer);const choice=btn.dataset.choice;const q=QUESTIONS[state.index];const ok=choice===q.answer;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(ok){state.score++;btn.classList.add('correct');btn.querySelector('.mark').textContent='✅';document.getElementById('face')?.classList.add('spinWin');sound('correct');showPopup('✅',PRAISES[Math.floor(Math.random()*PRAISES.length)],q.answer,false);setTimeout(()=>speak(q.answer),250)}else{btn.classList.add('wrong');btn.querySelector('.mark').textContent='❌';document.getElementById('clockPanel')?.classList.add('shake');sound('wrong');showPopup('❌','Oops! Watch the clock again',q.answer,true)}state.history.push({time:q.time,answer:q.answer,choice,ok});setTimeout(nextQuestion,ok?1900:1600)}
function timeoutRound(){if(state.locked)return;state.locked=true;clearInterval(state.timer);const q=QUESTIONS[state.index];sound('wrong');showPopup('⏳','Time is up!',q.answer,true);state.history.push({time:q.time,answer:q.answer,choice:'No answer',ok:false});setTimeout(nextQuestion,1550)}
function nextQuestion(){state.index++;state.locked=false;if(state.index>=QUESTIONS.length){state.screen='summary';sound('finish');render();return}prepareRound();startTimer()}
function readQuestion(){const q=QUESTIONS[state.index];speak('What time is it? '+q.time.replace(':',' '))}
function showPopup(emoji,text,small,wrong){const p=document.getElementById('popup');p.classList.toggle('wrong',!!wrong);document.getElementById('popEmoji').textContent=emoji;document.getElementById('popText').textContent=text;document.getElementById('popSmall').textContent=small||'';p.classList.add('show');setTimeout(()=>p.classList.remove('show'),wrong?1150:1350)}
function confetti(){const layer=document.createElement('div');layer.className='confetti';for(let i=0;i<95;i++){const e=document.createElement('div');e.className='piece';e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*0.55+'s';layer.appendChild(e)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),2300)}
function restart(){clearInterval(state.timer);state.screen='start';render()}
function goHome(){clearInterval(state.timer);state.screen='start';render()}
window.addEventListener('error',e=>{document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050617;color:white;font-family:Arial;padding:20px"><div style="max-width:720px;background:rgba(255,255,255,.1);padding:24px;border-radius:20px"><h1>Game loading error</h1><p>'+esc(e.message)+'</p></div></div>'});
render();

const KPC_RESULT_KEY='kpc_time_past_to_ep2_v1';
const KPC_RESULT_TITLE='TIME MASTER GALAXY • PAST / TO';
let kpcSelectedRound=-1,kpcSelectedQuestion=0;
function kpcEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kpcTotal(){return (state.order&&state.order.length)||QUESTIONS.length}
function kpcGetAll(){
 try{const x=JSON.parse(localStorage.getItem(KPC_RESULT_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}
}
function kpcSaveCurrent(){
 if(state.kpcSaved)return;
 const item={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:state.name||'Guest',
 date:new Date().toISOString(),score:state.score,total:kpcTotal(),
 history:(state.history||[]).map(h=>({time:h.time,ok:!!h.ok,answer:h.answer,choice:h.choice,typed:h.typed}))};
 const all=kpcGetAll();all.push(item);
 try{localStorage.setItem(KPC_RESULT_KEY,JSON.stringify(all));state.kpcSaved=true;state.kpcLatest=item}catch(e){console.warn('KPC local save failed',e);state.kpcLatest=item;state.kpcSaved=true}
}
function kpcRounds(){
 const all=kpcGetAll().filter(r=>r.name===(state.name||'Guest'));
 if(state.kpcLatest&&!all.some(x=>x.id===state.kpcLatest.id))all.push(state.kpcLatest);
 return all;
}
function kpcDate(v){return new Date(v).toLocaleString('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' น.'}
function kpcChart(rounds){
 const last=rounds.slice(-10),pts=last.map((r,i)=>({x:last.length===1?50:9+i*82/(last.length-1),y:89-75*(r.score/r.total),pct:Math.round(r.score/r.total*100),n:rounds.length-last.length+i+1}));
 return `<svg class="kpc-chart" viewBox="0 0 100 110" preserveAspectRatio="none" aria-label="กราฟเส้นคะแนนย้อนหลัง" role="img">
 ${[0,25,50,75,100].map(v=>`<line x1="8" x2="94" y1="${89-v*.75}" y2="${89-v*.75}" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="2 2" stroke-width=".4"/><text x="1" y="${91-v*.75}" font-size="4" fill="white">${v}</text>`).join('')}
 ${pts.length>1?`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#6ff2ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`:''}
 ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="#ffe96a"/><text x="${p.x}" y="${Math.max(7,p.y-5)}" text-anchor="middle" fill="#ffe96a" font-size="4.5">${p.pct}%</text><text x="${p.x}" y="103" text-anchor="middle" fill="white" font-size="4">#${p.n}</text>`).join('')}
 </svg>`;
}
function kpcRenderSummary(){
 kpcSaveCurrent();const rounds=kpcRounds(),last=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(last.score/last.total*100);
 const best=Math.max(...rounds.map(r=>Math.round(r.score/r.total*100)));
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">นักเรียน: ${kpcEsc(last.name)}<br>📅 ${kpcDate(last.date)}</div>
 <div class="kpc-score">${last.score} / ${last.total} คะแนน</div>
 <div class="kpc-stats"><div class="kpc-stat"><strong>${pct}%</strong><span>คะแนนล่าสุด</span></div><div class="kpc-stat"><strong>${rounds.length}</strong><span>ครั้งที่เล่น</span></div><div class="kpc-stat"><strong>${best}%</strong><span>คะแนนสูงสุด</span></div></div>
 <div class="kpc-box"><h3>📈 กราฟพัฒนาการ</h3>${kpcChart(rounds)}</div>
 <div class="kpc-box"><h3>📚 ประวัติคะแนน (แตะรอบเพื่อดูคำตอบ)</h3><div class="kpc-rounds">${rounds.map((r,i)=>`<button class="kpc-round" onclick="kpcShowRound(${i})">รอบ ${i+1} • ${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</button>`).join('')}</div></div>
 <div class="kpc-meta">${pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%'}</div>
 <div class="kpc-actions"><button class="secondary" onclick="kpcShare()">📸 แชร์ภาพรายงาน</button><button class="secondary" onclick="kpcShowRound(${rounds.length-1})">🔎 ดูเฉลยรายข้อ</button><button class="play" onclick="restart()">🚀 เล่นอีกครั้ง</button></div>
 <div class="kpc-meta" style="font-size:.82rem">บันทึกประวัติในเบราว์เซอร์นี้ • แชร์เฉพาะคะแนน ไม่รวมเฉลย</div>
 </div></div></div>`;
}
function kpcShowRound(n){
 const rounds=kpcRounds();kpcSelectedRound=Math.max(0,Math.min(n,rounds.length-1));kpcSelectedQuestion=0;kpcRenderReview();
}
function kpcShowQuestion(n){kpcSelectedQuestion=n;kpcRenderReview()}
function kpcRenderReview(){
 const rounds=kpcRounds(),r=rounds[kpcSelectedRound],history=r.history||[],h=history[kpcSelectedQuestion];
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">ตรวจคำตอบ • ${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">${kpcEsc(r.name)} • รอบ ${kpcSelectedRound+1} • ${kpcDate(r.date)} • ${r.score}/${r.total}</div>
 <div class="kpc-box"><h3>เลือกข้อที่ต้องการดู</h3><div class="kpc-qnav">${history.map((x,i)=>`<button class="${i===kpcSelectedQuestion?'play':'secondary'}" onclick="kpcShowQuestion(${i})">${i+1}</button>`).join('')}</div>
 <div class="kpc-qdetail">${h?`<b>ข้อ ${kpcSelectedQuestion+1} • ${kpcEsc(h.time||'')}</b><br>${h.ok?'✅ ถูกต้อง':'❌ ไม่ถูกต้อง'}<br>คำตอบของนักเรียน: ${kpcEsc(h.choice??h.typed??'ไม่ได้ตอบ')}<br><b>เฉลย: ${kpcEsc(h.answer||'')}</b>`:'ไม่มีข้อมูลรายข้อในรอบนี้'}</div></div>
 <div class="kpc-actions"><button class="play" onclick="kpcRenderSummary()">⬅ กลับหน้าสรุป</button></div></div></div></div>`;
}
function kpcCanvas(){
 const rounds=kpcRounds(),r=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(r.score/r.total*100),best=Math.max(...rounds.map(x=>Math.round(x.score/x.total*100)));
 const c=document.createElement('canvas');c.width=1080;c.height=1480;const g=c.getContext('2d');
 const grad=g.createLinearGradient(0,0,1080,1480);grad.addColorStop(0,'#153e87');grad.addColorStop(1,'#07112f');g.fillStyle=grad;g.fillRect(0,0,1080,1480);
 const rr=(x,y,w,h,r,fill)=>{g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
 const t=(v,x,y,size=30,color='white',align='center')=>{g.fillStyle=color;g.textAlign=align;g.font=`bold ${size}px Arial, sans-serif`;g.fillText(String(v),x,y)};
 rr(48,45,984,1380,32,'rgba(255,255,255,.09)');
 t('KRU PAI CLASSROOM',540,138,52,'#ffe96a');t('LEARNING ACHIEVEMENT REPORT',540,188,26,'#baf5ff');
 t(KPC_RESULT_TITLE,540,278,35);t('นักเรียน: '+r.name,540,350,33);t(kpcDate(r.date),540,405,28,'#d0edff');
 rr(290,465,500,125,40,'#ffe96a');t(`${r.score} / ${r.total} คะแนน`,540,547,58,'#1c2550');
 [{v:pct+'%',l:'คะแนนล่าสุด'},{v:rounds.length,l:'จำนวนรอบ'},{v:best+'%',l:'คะแนนสูงสุด'}].forEach((x,i)=>{let px=85+i*305;rr(px,645,290,145,20,'rgba(255,255,255,.13)');t(x.v,px+145,710,48,'#ffe96a');t(x.l,px+145,755,25)});
 rr(85,825,910,390,24,'rgba(0,0,0,.22)');t('กราฟพัฒนาการ',125,878,34,'#ffe96a','left');
 const last=rounds.slice(-10),left=170,right=945,top=928,bottom=1110;
 [0,25,50,75,100].forEach(v=>{let y=bottom-v/100*(bottom-top);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;g.beginPath();g.moveTo(left,y);g.lineTo(right,y);g.stroke();t(v+'%',left-18,y+7,20,'#d0edff','right')});
 const pts=last.map((x,i)=>({x:last.length===1?(left+right)/2:left+i*(right-left)/(last.length-1),y:bottom-(x.score/x.total)*(bottom-top),pct:Math.round(x.score/x.total*100),n:rounds.length-last.length+i+1}));
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle='#6ff2ff';g.lineWidth=6;g.stroke();
 pts.forEach(p=>{g.beginPath();g.arc(p.x,p.y,8,0,Math.PI*2);g.fillStyle='#ffe96a';g.fill();t(p.pct+'%',p.x,Math.max(920,p.y-20),20,'#ffe96a');t('#'+p.n,p.x,1160,19)});
 rr(85,1250,910,95,20,'rgba(255,255,255,.12)');t(pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%',540,1307,30,'#ffe96a');
 return c;
}
async function kpcShare(){
 try{
 const c=kpcCanvas(),blob=await new Promise(ok=>c.toBlob(ok,'image/png'));if(!blob)throw Error('PNG export failed');
 const filename=KPC_RESULT_KEY+'.png',file=new File([blob],filename,{type:'image/png'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Kru Pai Classroom'});return}catch(e){if(e.name==='AbortError')return}
 }
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
 alert('บันทึกภาพรายงานแล้ว สามารถส่งผ่าน LINE ได้จ้า');
 }catch(e){console.error(e);alert('ไม่สามารถแชร์ภาพได้ กรุณาลองอีกครั้ง')}
}
</script>
</body>
</html>
