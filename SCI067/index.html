n-width:100px}.progress>div{height:100%;background:#69e4fa;transition:width .3s}.visual{background:radial-gradient(circle at center,#213d77,#0a142c);border:1px solid #385d96;border-radius:24px;padding:20px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}.visual .symbol{font-size:clamp(58px,8vw,118px)}.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.chip{background:#213a67;border:1px solid #5a8ebc;color:white;border-radius:14px;padding:12px 18px;cursor:pointer;font-size:clamp(17px,1.5vw,23px);font-weight:700}.chip.active{background:#3a79a2;border-color:#9deeff}.note{border-left:5px solid #ffe39b;padding:12px 18px;background:#233254;border-radius:10px;font-size:clamp(18px,1.7vw,25px);margin-top:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.tile{border:1px solid #456eaa;background:#172c55;border-radius:18px;padding:18px}.tile strong{font-size:clamp(22px,2vw,30px)}.tile p{margin:7px 0;font-size:clamp(17px,1.5vw,23px)}.big{font-size:clamp(55px,8vw,110px);text-align:center}.feedback{padding:15px;border-radius:14px;background:#213b5d;font-size:clamp(18px,1.7vw,24px);margin-top:14px}.question{font-size:clamp(22px,2.4vw,36px);font-weight:800}.option{display:block;width:100%;text-align:left;margin:10px 0;background:#1b335e;border:1px solid #527eaf;color:white;border-radius:14px;padding:14px;font-size:clamp(18px,1.6vw,25px);cursor:pointer}.option.correct{border-color:#5cf3b5;background:#125d53}.option.wrong{border-color:#ff8795;background:#692c46}.hide{display:none!important}.scale{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}.scale .step{padding:12px;border:1px solid #527aa7;border-radius:15px;background:#1d3560;font-size:clamp(18px,1.7vw,26px);font-weight:800}.foot{font-size:14px;color:#a5b9d7;text-align:center}@media(max-width:600px){.panel{padding:17px}.app{gap:10px}.heroart{font-size:110px}.btn{padding:12px 16px}.nav{gap:7px}}

const screen=document.getElementById('screen');let page=-1,quizIndex=0,quizAnswers={};const pages=8;let choice=0;const facts=[
{title:'🌍 โลกของเราอยู่ที่ไหน?',sub:'เริ่มจากบ้านของเรา แล้วค่อยขยายออกไปสู่เอกภพ',body:'โลกเป็น <b class="accent">ดาวเคราะห์</b> ดวงหนึ่งในระบบสุริยะ ระบบสุริยะอยู่ใน <b class="accent">กาแล็กซีทางช้างเผือก</b> และทางช้างเผือกเป็นหนึ่งในกาแล็กซีจำนวนมหาศาลของเอกภพ',note:'จำให้แม่น: โลก → ระบบสุริยะ → กาแล็กซีทางช้างเผือก → เอกภพ',type:'scale'},
{title:'🌌 เอกภพ (Universe)',sub:'สิ่งที่ครอบคลุมทุกสิ่งในอวกาศ',body:'เอกภพประกอบด้วยอวกาศ เวลา สสาร และพลังงาน รวมถึงกาแล็กซี ดาวฤกษ์ ดาวเคราะห์ และวัตถุท้องฟ้าต่าง ๆ <b class="gold">เอกภพไม่ใช่กาแล็กซีเพียงแห่งเดียว</b>',note:'เอกภพใหญ่กว่ากาแล็กซี และมีกาแล็กซีจำนวนมหาศาล',type:'universe'},
{title:'🌠 กาแล็กซีทางช้างเผือก',sub:'บ้านขนาดใหญ่ของระบบสุริยะ',body:'กาแล็กซีคือระบบขนาดใหญ่ที่มีดาวฤกษ์ แก๊ส ฝุ่น และสสารอื่น ๆ รวมตัวกันด้วยแรงโน้มถ่วง ทางช้างเผือกเป็น <b class="accent">กาแล็กซีแบบกังหันมีคาน</b> และระบบสุริยะอยู่บริเวณแขนกังหันส่วนหนึ่ง ไม่ได้อยู่ตรงศูนย์กลาง',note:'คำถามยอดนิยม: ระบบสุริยะอยู่ในกาแล็กซีทางช้างเผือก',type:'galaxy'},
{title:'☀️ ดาวฤกษ์ (Star)',sub:'ดวงอาทิตย์ก็เป็นดาวฤกษ์',body:'ดาวฤกษ์เป็นวัตถุท้องฟ้าที่สร้างพลังงานและเปล่งแสงได้เอง โดยเกิดจากปฏิกิริยานิวเคลียร์ฟิวชันภายใน ดาวเคราะห์อย่างโลกและดาวศุกร์ไม่ได้สร้างแสงแบบดาวฤกษ์ แต่เราเห็นได้เพราะ <b class="accent">สะท้อนแสงจากดวงอาทิตย์</b>',note:'ดวงอาทิตย์ = ดาวฤกษ์ | โลก = ดาวเคราะห์',type:'star'},
{title:'🪐 ระบบสุริยะ (Solar System)',sub:'ดวงอาทิตย์และวัตถุที่อยู่ภายใต้อิทธิพลแรงโน้มถ่วง',body:'ระบบสุริยะมีดวงอาทิตย์เป็นดาวฤกษ์ศูนย์กลาง มีดาวเคราะห์ 8 ดวงโคจรรอบ ได้แก่ <b class="accent">พุธ ศุกร์ โลก อังคาร พฤหัสบดี เสาร์ ยูเรนัส เนปจูน</b> และยังมีดาวเคราะห์แคระ ดาวเคราะห์น้อย ดาวหาง และวัตถุอื่น ๆ',note:'ดาวพลูโตจัดเป็นดาวเคราะห์แคระ ไม่ใช่หนึ่งในดาวเคราะห์ 8 ดวง',type:'planets'},
{title:'🌙 ดาวเคราะห์และดาวบริวาร',sub:'วัตถุท้องฟ้าที่เคลื่อนที่สัมพันธ์กัน',body:'ดาวเคราะห์โคจรรอบดวงอาทิตย์ ส่วน <b class="accent">ดาวบริวารธรรมชาติ</b> โคจรรอบดาวเคราะห์หรือวัตถุแม่ เช่น ดวงจันทร์โคจรรอบโลก ดาวพุธและดาวศุกร์ไม่มีดวงจันทร์ธรรมชาติ',note:'โลกโคจรรอบดวงอาทิตย์ · ดวงจันทร์โคจรรอบโลก',type:'moon'},
{title:'☄️ วัตถุอื่น ๆ ในระบบสุริยะ',sub:'ไม่ใช่ทุกสิ่งที่เห็นในอวกาศจะเป็นดาวเคราะห์',body:'<b class="accent">ดาวเคราะห์แคระ</b> เช่น พลูโต · <b class="accent">ดาวเคราะห์น้อย</b> เป็นวัตถุขนาดเล็กจำนวนมากที่โคจรรอบดวงอาทิตย์ · <b class="accent">ดาวหาง</b> มีน้ำแข็ง ฝุ่น และหิน เมื่อเข้าใกล้ดวงอาทิตย์อาจเกิดโคมาและหาง · <b class="accent">สะเก็ดดาว</b> เป็นวัตถุขนาดเล็กในอวกาศ',note:'ดาวตกคือปรากฏการณ์แสงเมื่อสะเก็ดดาวเข้าสู่บรรยากาศ ไม่ใช่ดาวฤกษ์ตกลงมา',type:'objects'},
{title:'🏆 สรุปก่อนออกปฏิบัติภารกิจ',sub:'พร้อมสำหรับ Mini Quiz หรือยัง?',body:'ทบทวนความแตกต่าง: <b class="accent">เอกภพ</b> ครอบคลุมทั้งหมด · <b class="accent">กาแล็กซี</b> รวมดาวฤกษ์จำนวนมหาศาล · <b class="accent">ระบบสุริยะ</b> มีดวงอาทิตย์และวัตถุที่โคจรภายใต้อิทธิพลแรงโน้มถ่วง · <b class="accent">ดาวฤกษ์</b> สร้างแสงได้เอง · <b class="accent">ดาวเคราะห์</b> สะท้อนแสง',note:'ไปทำ Mini Quiz 5 ข้อกันเลย!',type:'summary'}];
const quiz=[{q:'ข้อใดเรียงลำดับจากเล็กไปใหญ่ได้ถูกต้อง?',o:['โลก → ระบบสุริยะ → ทางช้างเผือก → เอกภพ','โลก → ทางช้างเผือก → ระบบสุริยะ → เอกภพ','ระบบสุริยะ → โลก → เอกภพ → ทางช้างเผือก','เอกภพ → ทางช้างเผือก → โลก → ระบบสุริยะ'],a:0,e:'โลกเป็นส่วนหนึ่งของระบบสุริยะ ซึ่งอยู่ในทางช้างเผือก และทางช้างเผือกอยู่ในเอกภพ'},{q:'ข้อใดเป็นดาวฤกษ์?',o:['โลก','ดาวศุกร์','ดวงอาทิตย์','ดวงจันทร์'],a:2,e:'ดวงอาทิตย์สร้างพลังงานและเปล่งแสงได้เอง จึงเป็นดาวฤกษ์'},{q:'ระบบสุริยะอยู่ในกาแล็กซีใด?',o:['แอนดรอเมดา','ทางช้างเผือก','เมฆแมเจลแลนใหญ่','ไม่มีข้อใดถูก'],a:1,e:'ระบบสุริยะอยู่ในกาแล็กซีทางช้างเผือก'},{q:'เหตุใดเราจึงมองเห็นดาวศุกร์สว่าง?',o:['ดาวศุกร์สร้างแสงได้เอง','ดาวศุกร์สะท้อนแสงอาทิตย์','ดาวศุกร์เป็นดาวฤกษ์','ดาวศุกร์ได้รับแสงจากดาวเหนือเท่านั้น'],a:1,e:'ดาวศุกร์เป็นดาวเคราะห์ เรามองเห็นเพราะสะท้อนแสงจากดวงอาทิตย์'},{q:'ข้อใดกล่าวถูกต้อง?',o:['พลูโตเป็นดาวเคราะห์ลำดับที่ 9','ดวงจันทร์เป็นดาวฤกษ์','ดาวพุธมีดวงจันทร์หลายดวง','พลูโตเป็นดาวเคราะห์แคระ'],a:3,e:'พลูโตถูกจัดเป็นดาวเคราะห์แคระ และดาวเคราะห์ในระบบสุริยะมี 8 ดวง'}];
function visual(type){if(type==='scale')return `<div class="visual"><div class="scale">${['🌍<br>โลก','☀️<br>ระบบสุริยะ','🌌<br>ทางช้างเผือก','✨<br>เอกภพ'].map((s,i)=>`<div class="step">${s}</div>${i<3?'<b>→</b>':''}`).join('')}</div></div>`;if(type==='planets')return `<div class="visual"><div style="width:100%;text-align:center"><div class="big">☀️</div><div class="chips" style="justify-content:center">${['พุธ','ศุกร์','โลก','อังคาร','พฤหัสบดี','เสาร์','ยูเรนัส','เนปจูน'].map((n,i)=>`<button class="chip" onclick="planet(${i})">${['☿','♀','🌍','♂','♃','🪐','♅','♆'][i]} ${n}</button>`).join('')}</div><p id="planetInfo" style="margin:0">แตะชื่อดาวเคราะห์เพื่อดูตำแหน่งจากดวงอาทิตย์</p><small>ภาพสัญลักษณ์ ไม่ได้แสดงขนาดและระยะทางตามมาตราส่วน</small></div></div>`;if(type==='objects')return `<div class="grid">${[['🪐','ดาวเคราะห์แคระ'],['🪨','ดาวเคราะห์น้อย'],['☄️','ดาวหาง'],['✨','สะเก็ดดาว']].map(a=>`<div class="tile"><div class="big">${a[0]}</div><strong>${a[1]}</strong></div>`).join('')}</div>`;if(type==='summary')return `<div class="visual"><div class="scale">${['✨ เอกภพ','🌌 กาแล็กซี','☀️ ระบบสุริยะ','🌍 โลก'].map((s,i)=>`<div class="step">${s}</div>${i<3?'<b>⊃</b>':''}`).join('')}</div></div>`;return `<div class="visual"><div class="symbol">${{universe:'🌌 ✨',galaxy:'🌌',star:'☀️',moon:'🌍 🌙'}[type]}</div><small style="width:100%;text-align:center">ภาพสัญลักษณ์ประกอบการเรียนรู้</small></div>`}
window.planet=i=>{document.getElementById('planetInfo').textContent=`${['ดาวพุธ','ดาวศุกร์','โลก','ดาวอังคาร','ดาวพฤหัสบดี','ดาวเสาร์','ดาวยูเรนัส','ดาวเนปจูน'][i]} เป็นดาวเคราะห์ลำดับที่ ${i+1} จากดวงอาทิตย์`};
function render(){const home=document.getElementById('home'),prev=document.getElementById('prev'),next=document.getElementById('next'),bar=document.getElementById('bar'),count=document.getElementById('count');home.style.visibility=page===-1?'hidden':'visible';prev.disabled=page===-1;next.style.visibility='visible';if(page===-1){screen.className='panel hero';screen.innerHTML=`<div class="heroart">🌍🚀🌌</div><div class="pill">SPACE LEARNING JOURNEY · UNIT 01</div><h1>จากโลกสู่<span class="accent">เอกภพ</span></h1><p>เรียนดาราศาสตร์อย่างเข้าใจ พร้อมภาพและกิจกรรมโต้ตอบ<br>สำหรับ ป.4–ป.6 เตรียมสอบเข้า ม.1</p><button class="btn" onclick="go(0)">🚀 เริ่มภารกิจการเรียนรู้</button><p><small>8 หน้าบทเรียน + Mini Quiz 5 ข้อ · ไฟล์บทเรียนแยกจากเกมสอบจริง</small></p>`;prev.style.visibility='hidden';next.style.visibility='hidden';count.textContent='หน้าปก';bar.style.width='0%';return}prev.style.visibility='visible';if(page<8){const f=facts[page];screen.className='panel';screen.innerHTML=`<div class="pill" style="align-self:start">LESSON ${String(page+1).padStart(2,'0')} / 08</div><h2>${f.title}</h2><p class="accent" style="margin:0 0 12px">${f.sub}</p>${visual(f.type)}<p>${f.body}</p><div class="note">💡 <b>จำไว้สอบ:</b> ${f.note}</div>`;count.textContent=`${page+1} / 8`;next.textContent=page===7?'เริ่ม Mini Quiz →':'ถัดไป →';bar.style.width=`${(page+1)/9*100}%`;return}screen.className='panel';if(quizIndex>=quiz.length){let score=quiz.reduce((n,q,i)=>n+(quizAnswers[i]===q.a?1:0),0);screen.innerHTML=`<div class="big">🏆</div><h2 style="text-align:center">จบภารกิจ MINI QUIZ!</h2><h1 style="text-align:center" class="accent">${score} / 5</h1><p style="text-align:center">${score===5?'ยอดเยี่ยม! เข้าใจพื้นฐานเอกภพแล้ว':'ทบทวนหัวข้อที่ยังไม่แม่น แล้วลองใหม่ได้เลย'}</p><div class="grid">${quiz.map((q,i)=>`<div class="tile"><strong>ข้อ ${i+1} ${quizAnswers[i]===q.a?'✅':'❌'}</strong><p>${q.e}</p></div>`).join('')}</div><div style="text-align:center;margin-top:20px"><button class="btn" onclick="restartQuiz()">🔁 ทำ Mini Quiz อีกครั้ง</button></div>`;next.style.visibility='hidden';count.textContent='สรุปผล';bar.style.width='100%';return}const q=quiz[quizIndex],answer=quizAnswers[quizIndex];screen.innerHTML=`<div class="pill" style="align-self:start">MINI QUIZ · ${quizIndex+1} / 5</div><h2>🧠 ทบทวนความรู้</h2><div class="question">${q.q}</div><div>${q.o.map((s,i)=>`<button class="option ${answer===undefined?'':i===q.a?'correct':answer===i?'wrong':''}" onclick="answerQuiz(${i})" ${answer!==undefined?'disabled':''}>${'ABCD'[i]}. ${s}</button>`).join('')}</div>${answer!==undefined?`<div class="feedback">${answer===q.a?'✅ ถูกต้อง!':'❌ ยังไม่ถูก'} <b>เฉลย: ${'ABCD'[q.a]}</b><br>${q.e}</div>`:''}`;next.textContent=quizIndex===4?'ดูสรุปคะแนน 🏆':'ข้อต่อไป →';next.disabled=answer===undefined;count.textContent=`Quiz ${quizIndex+1}/5`;bar.style.width=`${(8+(quizIndex+1)/5)/9*100}%`}
window.answerQuiz=i=>{if(quizAnswers[quizIndex]===undefined){quizAnswers[quizIndex]=i;render()}};window.restartQuiz=()=>{quizIndex=0;quizAnswers={};render()};window.go=i=>{page=i;render()};document.getElementById('home').onclick=()=>go(-1);document.getElementById('prev').onclick=()=>{if(page===8){if(quizIndex>0)quizIndex--;else page=7}else page=Math.max(-1,page-1);render()};document.getElementById('next').onclick=()=>{if(page<8)page++;else quizIndex++;render()};render();
</script></body></html>
