<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPC UNIT09 SPACECRAFT & SATELLITE ACADEMY</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#f2f8ff;background:#071329}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#1a3870 0,transparent 50%),#071329}.app{max-width:1400px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{color:#83e9ff;letter-spacing:.12em;font-weight:800}h1{font-size:clamp(30px,5vw,62px);margin:12px 0}h2{font-size:clamp(27px,3.4vw,43px);margin:10px 0 20px}p,li{font-size:clamp(19px,2.1vw,28px);line-height:1.65}.sub{color:#b7c9e7}.panel{border:1px solid #41689c;background:#102446d9;border-radius:24px;padding:clamp(18px,3vw,35px);margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.tile{border:1px solid #4b76b3;border-radius:18px;background:#19345d;padding:18px;cursor:pointer;text-align:left;color:white;font-size:22px}.tile:hover,.tile:focus{outline:2px solid #8cefff}.tile b{display:block;color:#91efff;margin-bottom:8px}.tile small{display:block;font-size:17px;line-height:1.5;color:#d1e4ff}.pill{display:inline-block;background:#1d4274;color:#9aefff;border-radius:30px;padding:8px 15px;font-size:17px;font-weight:700}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:20px}button{border:0;border-radius:14px;padding:15px 22px;background:#4fe1ff;color:#071b30;font-size:21px;font-weight:800;cursor:pointer}button.secondary{background:#263d63;color:white}button:disabled{opacity:.35;cursor:default}.bar{height:9px;background:#233f65;border-radius:12px;overflow:hidden;margin:18px 0}.bar div{height:100%;background:linear-gradient(90deg,#42c9ff,#9b84ff);transition:width .2s}.hidden{display:none}.correct{border-color:#50e9a4;background:#134e48}.wrong{border-color:#ff8c98;background:#5c2739}.fact{background:#0b3456;border-left:5px solid #5ee3ff;padding:16px;border-radius:10px;font-size:clamp(18px,2vw,25px);line-height:1.6}.orbit{position:relative;min-height:250px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#203b73,#09172f);border-radius:20px}.earth{font-size:100px}.sat{position:absolute;font-size:48px;animation:circle 9s linear infinite;transform-origin:center}@keyframes circle{0%{transform:rotate(0deg) translateX(110px) rotate(0deg)}100%{transform:rotate(360deg) translateX(110px) rotate(-360deg)}}.notice{font-size:17px;color:#b7c9e7}.num{color:#91efff;font-weight:900}#feedback{margin-top:14px}footer{color:#92a9c7;font-size:15px;padding:25px 0}@media(max-width:600px){.app{padding:12px}.tile{font-size:20px}button{font-size:18px;padding:13px 16px}.orbit{min-height:200px}}</style></head><body><div class="app"><header><div class="tag">🚀 KRU PAI CLASSROOM · ASTRONOMY ACADEMY</div><span class="pill">UNIT 09 · SPACE TECHNOLOGY</span></header><div class="bar"><div id="progress"></div></div><main id="page"></main><nav class="controls"><button class="secondary" id="back">← ย้อนกลับ</button><button class="secondary" id="home">⌂ หน้าแรก</button><button id="next">ถัดไป →</button></nav><footer>บทเรียนออฟไลน์ · ตัวเลขและภาพจำลองไม่แสดงสัดส่วนจริง · สื่อการสอน ป.4–ป.6 เตรียมสอบเข้า ม.1</footer></div><script>
const topics=[
{title:'🛰️ 1. ดาวเทียมและวงโคจร',body:`<p>ดาวเทียมประดิษฐ์คือเครื่องมือที่มนุษย์ส่งให้โคจรรอบโลกหรือวัตถุท้องฟ้า ใช้รับ–ส่งข้อมูลและตรวจวัดจากอวกาศ</p><div class="orbit"><span class="earth">🌍</span><span class="sat">🛰️</span></div><div class="grid"><div class="tile"><b>LEO วงโคจรต่ำ</b><small>อยู่ใกล้โลก เหมาะกับถ่ายภาพรายละเอียดสูงและสถานีอวกาศ</small></div><div class="tile"><b>GEO วงโคจรค้างฟ้า</b><small>อยู่เหนือเส้นศูนย์สูตรสูงประมาณ 35,786 กม. มีคาบโคจรเท่าการหมุนของโลก จึงดูเหมือนอยู่ตำแหน่งเดิม</small></div><div class="tile"><b>วงโคจรขั้วโลก</b><small>ผ่านบริเวณขั้วโลก เหมาะกับการสำรวจพื้นที่ทั่วโลก</small></div></div><div class="fact">จำให้แม่น: ดาวเทียมทุกดวงไม่ได้อยู่ในวงโคจรเดียวกัน และไม่ได้มีหน้าที่เหมือนกัน</div>`},
{title:'📡 2. ดาวเทียมตามหน้าที่ พร้อมตัวอย่าง',body:`<div class="grid"><div class="tile"><b>📺 สื่อสาร</b><small>THAICOM (ไทย), Intelsat, SES — ส่งสัญญาณโทรทัศน์และข้อมูล</small></div><div class="tile"><b>🌦️ อุตุนิยมวิทยา</b><small>Himawari-8/9 (ญี่ปุ่น), GOES-16/18 (สหรัฐฯ), Meteosat (ยุโรป) — ดูเมฆและติดตามพายุ</small></div><div class="tile"><b>🗺️ สำรวจโลก</b><small>THEOS-2 (ไทย), Landsat 8/9, Sentinel-2 — ศึกษาป่า น้ำท่วม และการใช้ที่ดิน</small></div><div class="tile"><b>📍 นำทาง</b><small>GPS (สหรัฐฯ), Galileo (ยุโรป), BeiDou (จีน) — ใช้กลุ่มดาวเทียมระบุตำแหน่งและเวลา</small></div></div><div class="fact">ข้อสอบสถานการณ์: ติดตามพายุใช้ดาวเทียมอุตุนิยมวิทยา; ดูการเปลี่ยนแปลงป่าใช้ดาวเทียมสำรวจโลก</div>`},
{title:'🇹🇭 3. ดาวเทียมไทยที่ควรรู้จัก',body:`<div class="grid"><button class="tile" onclick="detail('thaicom')"><b>THAICOM</b><small>สื่อสาร / ถ่ายทอดสัญญาณ</small></button><button class="tile" onclick="detail('theos')"><b>THEOS (ไทยโชต)</b><small>สำรวจทรัพยากร</small></button><button class="tile" onclick="detail('theos2')"><b>THEOS-2</b><small>สำรวจโลกความละเอียดสูง</small></button><button class="tile" onclick="detail('knack')"><b>KNACKSAT-1</b><small>ดาวเทียมขนาดเล็กของมหาวิทยาลัย</small></button></div><div class="fact" id="detail">👆 กดแต่ละชื่อเพื่ออ่านรายละเอียด</div>`},
{title:'🌎 4. ดาวเทียมสำคัญของโลก',body:`<div class="grid"><button class="tile" onclick="detail('sputnik')"><b>Sputnik 1</b><small>ดาวเทียมประดิษฐ์ดวงแรก ปี 1957</small></button><button class="tile" onclick="detail('explorer')"><b>Explorer 1</b><small>ดาวเทียมดวงแรกของสหรัฐฯ ปี 1958</small></button><button class="tile" onclick="detail('landsat')"><b>Landsat</b><small>สำรวจโลกต่อเนื่องหลายทศวรรษ</small></button><button class="tile" onclick="detail('gps')"><b>GPS</b><small>กลุ่มดาวเทียมนำทาง</small></button></div><div class="fact" id="detail">👆 กดชื่อเพื่อดูจุดสำคัญ</div>`},
{title:'🚀 5. ส่วนประกอบของจรวด',body:`<p>จรวดสร้างแรงขับโดยพ่นแก๊สร้อนออกไปด้านหลัง จึงเคลื่อนที่ได้แม้ในอวกาศที่แทบไม่มีอากาศ</p><div class="grid"><div class="tile"><b>① หัวครอบสัมภาระ (Fairing)</b><small>ปกป้องดาวเทียมหรือยานระหว่างผ่านชั้นบรรยากาศ แล้วแยกออกเมื่อเหมาะสม</small></div><div class="tile"><b>② สัมภาระ (Payload)</b><small>ดาวเทียม ยานสำรวจ หรือยานบรรทุกมนุษย์ที่จรวดนำไปส่ง</small></div><div class="tile"><b>③ ถังเชื้อเพลิงและตัวออกซิไดซ์</b><small>เก็บสารที่ใช้ทำปฏิกิริยา จรวดหลายชนิดต้องพกตัวออกซิไดซ์เอง</small></div><div class="tile"><b>④ เครื่องยนต์ / หัวฉีด</b><small>เผาไหม้และเร่งแก๊สออกทางหัวฉีด เกิดแรงขับ</small></div><div class="tile"><b>⑤ ขั้นจรวด (Stages)</b><small>แยกส่วนที่ใช้แล้วออกเพื่อลดมวล จรวดบางแบบมีหลายขั้น</small></div><div class="tile"><b>⑥ ระบบนำร่องและควบคุม</b><small>เซนเซอร์ คอมพิวเตอร์ และกลไกปรับทิศทางให้ไปตามเส้นทาง</small></div></div><div class="fact">จำภาพรวม: หัวครอบป้องกัน → เครื่องยนต์สร้างแรงขับ → ขั้นจรวดแยก → ปล่อยสัมภาระ</div>`},
{title:'🛸 6. ส่วนประกอบของยานอวกาศ',body:`<p>ยานอวกาศมีหลายแบบ: ยานสำรวจไร้มนุษย์ ยานลงจอด ยานบรรทุกมนุษย์ และรถสำรวจ แต่ละแบบจึงมีชิ้นส่วนต่างกัน</p><div class="grid"><div class="tile"><b>โครงสร้างและฉนวน</b><small>รองรับอุปกรณ์และป้องกันความร้อนหรือความเย็นจัด</small></div><div class="tile"><b>แหล่งพลังงาน</b><small>แผงเซลล์แสงอาทิตย์ แบตเตอรี่ หรือเครื่องกำเนิดไฟฟ้าจากความร้อนของไอโซโทปรังสีในบางภารกิจ</small></div><div class="tile"><b>เสาอากาศและวิทยุ</b><small>ส่งข้อมูล ภาพ และรับคำสั่งจากโลก</small></div><div class="tile"><b>คอมพิวเตอร์ / ระบบนำทาง</b><small>ประมวลผลคำสั่งและกำหนดทิศทาง</small></div><div class="tile"><b>ระบบขับดัน / ควบคุมทิศ</b><small>ปรับวงโคจรหรือหันทิศของยาน ไม่ใช่ทุกยานมีเครื่องยนต์หลักขนาดใหญ่</small></div><div class="tile"><b>เครื่องมือวิทยาศาสตร์</b><small>กล้อง เซนเซอร์ เครื่องวัดสนามแม่เหล็ก หรือเครื่องวิเคราะห์ตัวอย่าง</small></div><div class="tile"><b>ระบบพยุงชีพ (เฉพาะยานมีมนุษย์)</b><small>ควบคุมอากาศ ความดัน อุณหภูมิ และจัดการของเสีย</small></div><div class="tile"><b>แผ่นกันความร้อน (ยานกลับโลกบางแบบ)</b><small>ช่วยปกป้องยานเมื่อกลับเข้าสู่บรรยากาศ</small></div></div>`},
{title:'🛰️ 7. ส่วนประกอบของดาวเทียม',body:`<p>ดาวเทียมประกอบด้วย <strong>สัมภาระภารกิจ</strong> (Payload) และ <strong>ระบบสนับสนุน</strong> (Bus)</p><div class="grid"><div class="tile"><b>แผงโซลาร์เซลล์และแบตเตอรี่</b><small>ผลิตและเก็บไฟฟ้าเพื่อให้ทำงานต่อในเงาโลก</small></div><div class="tile"><b>เสาอากาศ / ระบบสื่อสาร</b><small>ส่งภาพและข้อมูลลงสถานีภาคพื้นดิน รับคำสั่งจากโลก</small></div><div class="tile"><b>คอมพิวเตอร์บนดาวเทียม</b><small>ควบคุมการทำงานและจัดเก็บข้อมูล</small></div><div class="tile"><b>ระบบควบคุมทิศทาง</b><small>ใช้เซนเซอร์ วงล้อปฏิกิริยา หรืออุปกรณ์อื่นเพื่อหันกล้อง/เสาอากาศ</small></div><div class="tile"><b>ระบบควบคุมอุณหภูมิ</b><small>ฉนวนและแผงระบายความร้อน ช่วยรักษาอุณหภูมิที่เหมาะสม</small></div><div class="tile"><b>เครื่องมือภารกิจ</b><small>กล้องถ่ายภาพโลก เครื่องวัดอากาศ หรืออุปกรณ์ส่งสัญญาณตามหน้าที่</small></div><div class="tile"><b>ระบบขับดัน (บางดวง)</b><small>ปรับตำแหน่งหรือวงโคจร ดาวเทียมเล็กบางดวงไม่มีระบบนี้</small></div></div><div class="fact">ข้อสอบ: กล้องสำรวจโลกคือ Payload; แผงโซลาร์เซลล์และคอมพิวเตอร์เป็นระบบสนับสนุน</div>`},
{title:'🔭 8. ส่วนประกอบของกล้องโทรทรรศน์',body:`<div class="grid"><div class="tile"><b>กล้องหักเหแสง</b><small>เลนส์ใกล้วัตถุรวบรวมแสง → เลนส์ใกล้ตาขยายภาพ เหมาะอธิบายพื้นฐานการเกิดภาพ</small></div><div class="tile"><b>กล้องสะท้อนแสง</b><small>กระจกเว้าหลักรวบรวมแสง → กระจกรองส่งแสงไปยังตัวรับภาพ</small></div><div class="tile"><b>โครงท่อ / โครงยึด</b><small>ยึดเลนส์ กระจก และเครื่องมือให้ตรงแนว</small></div><div class="tile"><b>ฐานและระบบติดตาม</b><small>หมุนตามวัตถุบนฟ้าเพื่อลดการเลื่อนของภาพ</small></div><div class="tile"><b>กล้องตรวจจับ / สเปกโตรกราฟ</b><small>บันทึกภาพและวิเคราะห์แสง แยกสีหรือความยาวคลื่น</small></div><div class="tile"><b>กล้องอวกาศ</b><small>เพิ่มแผงกันแสงอาทิตย์ ระบบสื่อสาร แหล่งพลังงาน และควบคุมอุณหภูมิ ตามการออกแบบ</small></div></div><div class="fact">Hubble ใช้กระจกหลัก 2.4 เมตร; James Webb ใช้กระจกหลักแบ่งเป็น 18 ชิ้น รวมเส้นผ่านศูนย์กลางราว 6.5 เมตร และมีแผงกันแดด 5 ชั้น</div>`},
{title:'👩‍🚀 9. นักบินอวกาศที่ควรรู้จัก',body:`<div class="grid"><div class="tile"><b>ยูริ กาการิน · 1961</b><small>มนุษย์คนแรกในอวกาศ ภารกิจ Vostok 1</small></div><div class="tile"><b>วาเลนตินา เทเรชโควา · 1963</b><small>ผู้หญิงคนแรกในอวกาศ ภารกิจ Vostok 6</small></div><div class="tile"><b>อะเล็กเซย์ เลโอนอฟ · 1965</b><small>มนุษย์คนแรกที่ออกปฏิบัติงานนอกยาน (spacewalk)</small></div><div class="tile"><b>นีล อาร์มสตรอง · 1969</b><small>มนุษย์คนแรกที่เหยียบดวงจันทร์ ภารกิจ Apollo 11</small></div><div class="tile"><b>บัซ อัลดริน · 1969</b><small>มนุษย์คนที่สองที่เหยียบดวงจันทร์ Apollo 11</small></div><div class="tile"><b>ไมเคิล คอลลินส์ · 1969</b><small>นักบินยานบังคับการ Apollo 11 โคจรรอบดวงจันทร์ ไม่ได้ลงพื้นผิว</small></div><div class="tile"><b>แซลลี ไรด์ · 1983</b><small>ผู้หญิงชาวอเมริกันคนแรกในอวกาศ</small></div><div class="tile"><b>เม เจมิสัน · 1992</b><small>ผู้หญิงผิวดำคนแรกในอวกาศ</small></div></div><div class="fact">จุดออกสอบ: กาการิน = คนแรกในอวกาศ; อาร์มสตรอง = คนแรกบนดวงจันทร์; เทเรชโควา = ผู้หญิงคนแรกในอวกาศ</div>`},
{title:'🌕 10. ภารกิจและยานสำรวจสำคัญ',body:`<div class="grid"><button class="tile" onclick="detail('vostok')"><b>Vostok 1</b><small>มนุษย์คนแรกในอวกาศ</small></button><button class="tile" onclick="detail('apollo')"><b>Apollo 11</b><small>มนุษย์ลงดวงจันทร์</small></button><button class="tile" onclick="detail('voyager')"><b>Voyager 1 / 2</b><small>สำรวจดาวเคราะห์ชั้นนอกและอวกาศไกล</small></button><button class="tile" onclick="detail('iss')"><b>ISS</b><small>สถานีทดลองในวงโคจรโลก</small></button><button class="tile" onclick="detail('curiosity')"><b>Curiosity</b><small>รถสำรวจดาวอังคาร</small></button><button class="tile" onclick="detail('perseverance')"><b>Perseverance</b><small>รถสำรวจดาวอังคารและเก็บตัวอย่าง</small></button></div><div class="fact" id="detail">👆 กดชื่อภารกิจเพื่อดูข้อมูล</div>`},
{title:'🔭 11. กล้องโทรทรรศน์อวกาศสำคัญ',body:`<div class="grid"><button class="tile" onclick="detail('hubble')"><b>Hubble</b><small>โคจรรอบโลก ตั้งแต่ปี 1990</small></button><button class="tile" onclick="detail('webb')"><b>James Webb</b><small>ใกล้จุด L2 เน้นอินฟราเรด</small></button><div class="tile"><b>Chandra</b><small>สังเกตรังสีเอกซ์จากวัตถุพลังงานสูง</small></div><div class="tile"><b>Spitzer</b><small>กล้องอินฟราเรด (ภารกิจสิ้นสุดแล้ว)</small></div></div><div class="fact" id="detail">👆 เลือก Hubble หรือ Webb เพื่ออ่านรายละเอียด</div>`},
{title:'🧠 12. สรุปจำแนกอุปกรณ์และจุดออกสอบ',body:`<div class="grid"><div class="tile"><b>🚀 จรวด</b><small>ให้แรงขับเพื่อส่งสัมภาระขึ้นสู่อวกาศ</small></div><div class="tile"><b>🛰️ ดาวเทียม</b><small>โคจรและทำภารกิจสื่อสาร สำรวจ หรือวัดข้อมูล</small></div><div class="tile"><b>🛸 ยานสำรวจ</b><small>เดินทางไปศึกษาวัตถุท้องฟ้า เช่น Voyager</small></div><div class="tile"><b>🔭 กล้องโทรทรรศน์</b><small>รวบรวมและตรวจจับคลื่นแม่เหล็กไฟฟ้าเพื่อศึกษาวัตถุไกล</small></div><div class="tile"><b>🏠 สถานีอวกาศ</b><small>พื้นที่ให้มนุษย์อาศัยและทดลองในวงโคจร เช่น ISS</small></div><div class="tile"><b>👩‍🚀 นักบินอวกาศ</b><small>กาการิน = คนแรกในอวกาศ; อาร์มสตรอง = คนแรกบนดวงจันทร์</small></div></div><div class="fact">พร้อมแล้วกดถัดไปเพื่อทำ Mini Quiz พร้อมเฉลยทันที</div>`}
];
const info={thaicom:'ไทยคมเป็นชื่อชุดดาวเทียมสื่อสารของไทย ใช้ส่งสัญญาณโทรคมนาคมและโทรทัศน์ ไม่ใช่ดาวเทียมสำรวจทรัพยากร',theos:'THEOS หรือไทยโชต ส่งขึ้นสู่อวกาศในปี 2008 เป็นดาวเทียมสำรวจทรัพยากรดวงแรกของไทย',theos2:'THEOS-2 ส่งขึ้นสู่อวกาศในปี 2023 เป็นดาวเทียมสำรวจโลกความละเอียดสูงของไทย ใช้ติดตามพื้นที่และทรัพยากร',knack:'KNACKSAT-1 ดาวเทียมขนาดเล็กของมหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ ส่งขึ้นสู่อวกาศปี 2018',sputnik:'สหภาพโซเวียตส่ง Sputnik 1 ขึ้นสู่วงโคจรโลกเมื่อ 4 ตุลาคม 1957 เริ่มต้นยุคอวกาศ',explorer:'Explorer 1 ส่งขึ้นปี 1958 เป็นดาวเทียมดวงแรกของสหรัฐฯ และมีส่วนในการค้นพบแถบรังสีแวนอัลเลน',landsat:'Landsat เป็นโครงการดาวเทียมสำรวจโลกระยะยาว ใช้ศึกษาพื้นดิน ป่าไม้ น้ำ และการเปลี่ยนแปลงสิ่งแวดล้อม',gps:'GPS เป็นระบบนำทางด้วยกลุ่มดาวเทียม ไม่ใช่ดาวเทียมดวงเดียว ใช้คำนวณตำแหน่งจากสัญญาณดาวเทียม',vostok:'Vostok 1 นำยูริ กาการินขึ้นสู่อวกาศและโคจรรอบโลกในปี 1961',apollo:'Apollo 11 นำมนุษย์ลงจอดบนดวงจันทร์ในปี 1969 นีล อาร์มสตรองเป็นมนุษย์คนแรกที่เหยียบดวงจันทร์',voyager:'Voyager 1 และ 2 ส่งขึ้นในปี 1977 โดย Voyager 2 ได้สำรวจใกล้ดาวยูเรนัสและเนปจูนด้วย',iss:'ISS เป็นสถานีอวกาศนานาชาติในวงโคจรต่ำของโลก ใช้ทำการทดลองวิทยาศาสตร์ในสภาพแรงโน้มถ่วงจุลภาค',hubble:'Hubble เปิดตัวปี 1990 และโคจรรอบโลก ช่วยศึกษาดาว กาแล็กซี และเอกภพ',webb:'James Webb เปิดตัวปี 2021 ทำงานใกล้จุดลากร็องจ์ L2 ของระบบดวงอาทิตย์–โลก ห่างโลกประมาณ 1.5 ล้านกิโลเมตร ไม่ได้โคจรรอบโลกแบบ Hubble',curiosity:'Curiosity ลงจอดบนดาวอังคารปี 2012 ศึกษาธรณีวิทยาและสภาพแวดล้อมที่อาจเคยเอื้อต่อสิ่งมีชีวิต',perseverance:'Perseverance ลงจอดดาวอังคารปี 2021 สำรวจปล่อง Jezero และเก็บตัวอย่างหินเพื่อศึกษาร่องรอยชีวิตในอดีต'};
window.detail=(id)=>{const el=document.getElementById('detail');if(el)el.textContent='💡 '+info[id]};
const quiz=[{q:'ดาวเทียม Sputnik 1 มีความสำคัญอย่างไร?',o:['เป็นดาวเทียมประดิษฐ์ดวงแรกของโลก','เป็นดาวเทียมสำรวจทรัพยากรของไทย','เป็นยานพามนุษย์ลงดวงจันทร์','เป็นสถานีอวกาศแห่งแรก'],a:0,e:'Sputnik 1 ถูกส่งขึ้นในปี 1957 โดยสหภาพโซเวียต'},{q:'หากต้องการติดตามการเปลี่ยนแปลงพื้นที่ป่าในประเทศไทย ควรใช้ข้อมูลจากดาวเทียมใด?',o:['ไทยคม','THEOS-2','Sputnik 1','GPS เพียงอย่างเดียว'],a:1,e:'THEOS-2 เป็นดาวเทียมสำรวจโลก ใช้ภาพถ่ายติดตามทรัพยากรและการใช้ที่ดิน'},{q:'ข้อใดเป็นภารกิจที่พามนุษย์ลงเดินบนดวงจันทร์เป็นครั้งแรก?',o:['Voyager 2','Explorer 1','Apollo 11','Hubble'],a:2,e:'Apollo 11 ลงจอดบนดวงจันทร์ในปี 1969'},{q:'ข้อใดเปรียบเทียบ Hubble กับ James Webb ได้ถูกต้อง?',o:['ทั้งสองเป็นดาวเทียมนำทาง','Hubble โคจรรอบโลก ส่วน Webb ทำงานใกล้จุด L2','Webb ลงจอดบนดาวอังคาร','Hubble เป็นสถานีอวกาศสำหรับมนุษย์'],a:1,e:'Hubble โคจรรอบโลก ส่วน Webb ทำงานใกล้ L2 และเน้นสังเกตอินฟราเรด'},{q:'ข้อใดจับคู่ชื่อกับหน้าที่ได้ถูกต้อง?',o:['ไทยคม — สำรวจดาวอังคาร','ISS — ดาวเทียมพยากรณ์อากาศ','GPS — กล้องโทรทรรศน์อวกาศ','Voyager — ยานสำรวจอวกาศไกล'],a:3,e:'Voyager เป็นยานสำรวจอวกาศไร้มนุษย์ ใช้ศึกษาดาวเคราะห์ชั้นนอกและอวกาศไกล'}];
let step=0,answers={};const page=document.getElementById('page');function render(){document.getElementById('progress').style.width=(step/(topics.length+quiz.length+1)*100)+'%';document.getElementById('back').disabled=step===0;document.getElementById('next').style.display=step>=topics.length+quiz.length+1?'none':'';if(step===0){page.innerHTML=`<section class="panel"><span class="pill">SPACE TECHNOLOGY · MISSION 09</span><h1>🛰️ SPACECRAFT & SATELLITE ACADEMY</h1><h2>ยานอวกาศและดาวเทียมที่ควรรู้จัก</h2><p>สำรวจดาวเทียมหลายประเภท นักบินอวกาศ และส่วนประกอบจรวด ยาน ดาวเทียม กล้องโทรทรรศน์</p><p class="sub">📘 บทเรียน 12 ตอน · 🧠 Mini Quiz 5 ข้อ · 🎯 ป.4–ป.6 เตรียมสอบเข้า ม.1</p><div class="fact">ภารกิจของเรา: รู้จักชื่อสำคัญ แยกหน้าที่ได้ และตอบโจทย์สถานการณ์ให้ถูกต้อง!</div></section>`}else if(step<=topics.length){const t=topics[step-1];page.innerHTML=`<section class="panel"><span class="pill">LESSON ${step} / ${topics.length}</span><h2>${t.title}</h2>${t.body}</section>`}else if(step<=topics.length+quiz.length){const i=step-(topics.length+1),q=quiz[i],sel=answers[i];page.innerHTML=`<section class="panel"><span class="pill">MINI QUIZ ${i+1} / 5</span><h2>${q.q}</h2><div class="grid">${q.o.map((o,j)=>`<button class="tile ${sel!==undefined?(j===q.a?'correct':j===sel?'wrong':''):''}" onclick="answer(${i},${j})" ${sel!==undefined?'disabled':''}><b>${'ABCD'[j]}. ${o}</b></button>`).join('')}</div>${sel!==undefined?`<div class="fact" id="feedback">${sel===q.a?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง'} คำตอบ: ${'ABCD'[q.a]} — ${q.e}</div>`:'<p class="sub">เลือกคำตอบเพื่อดูเฉลยทันที</p>'}</section>`}else{let score=quiz.filter((q,i)=>answers[i]===q.a).length;page.innerHTML=`<section class="panel"><span class="pill">MISSION REPORT</span><h1>🏆 สำเร็จภารกิจ UNIT 09!</h1><h2>คะแนน ${score} / 5</h2><p>${score===5?'ยอดเยี่ยม! รู้จักเทคโนโลยีอวกาศแล้ว':'กลับไปทบทวนชื่อและหน้าที่ของภารกิจ แล้วลองอีกครั้งได้จ้า'}</p><div class="grid">${quiz.map((q,i)=>`<div class="tile"><b>${answers[i]===q.a?'✅':'❌'} ข้อ ${i+1}</b><small>${q.q}<br>เฉลย: ${q.o[q.a]}</small></div>`).join('')}</div><div class="controls"><button onclick="step=topics.length+1;answers={};render()">🔄 ทำแบบทดสอบใหม่</button><button class="secondary" onclick="step=0;render()">🏠 กลับหน้าปก</button></div></section>`}document.getElementById('next').disabled=step>=topics.length+1&&step<=topics.length+quiz.length&&answers[step-(topics.length+1)]===undefined;document.getElementById('next').textContent=step===0?'เริ่มเรียน 🚀':step===topics.length?'เริ่ม Mini Quiz 🧠':'ถัดไป →';}window.answer=(i,j)=>{if(answers[i]!==undefined)return;answers[i]=j;render()};document.getElementById('next').onclick=()=>{if(step<topics.length+quiz.length+1){step++;render();window.scrollTo(0,0)}};document.getElementById('back').onclick=()=>{if(step>0){step--;render();window.scrollTo(0,0)}};document.getElementById('home').onclick=()=>{step=0;render();window.scrollTo(0,0)};render();
</script></body></html>
