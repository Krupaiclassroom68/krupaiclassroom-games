.cover{grid-template-columns:1.08fr 1fr;background:#ffe044 radial-gradient(#e4982738 1.6px,transparent 1.7px) 0 0/12px 12px}
.cover h1{font-size:clamp(58px,8vw,112px);line-height:1.02;letter-spacing:-.055em;margin:13px 0 20px;transform:skew(-5deg);paint-order:stroke fill;-webkit-text-stroke:5px #10214a;text-shadow:4px 5px #10214a;color:#fffdf4}
.cover h1 span{display:block;color:#ff5070}
.cover .lead{font-size:clamp(22px,3vw,34px);line-height:1.22;margin-bottom:8px}
.cover .details{font-size:clamp(16px,2vw,21px);font-weight:750}
.sign-in{margin-top:16px;display:grid;gap:7px}
.sign-in label{font-weight:900;font-size:20px}
.sign-in input{width:100%;min-height:48px;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:20px;color:var(--ink)}
.sign-in .start{width:100%;margin:5px 0 0}
.name-error{font-weight:800;color:#8c0d2c;margin:0}
#playerResult{overflow-wrap:anywhere}
@media(max-width:650px){.cover{grid-template-columns:1fr}.art{min-height:clamp(165px,48vw,260px)}.cover h1{font-size:clamp(55px,13vw,82px)}}
.art{background-position:82% center}
@media(max-width:650px){.art{background-position:75% center}}
.question-map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;list-style:none;padding:0;margin:8px 0 16px}
.question-map li{display:flex;align-items:center;justify-content:center;gap:3px;min-height:31px;border:1px solid #a8bddf;border-radius:7px;background:#eef5ff;font-size:14px;font-weight:850}
.question-map .correct{background:#baf3cf;color:#14512e;border-color:#368851}
.question-map .incorrect{background:#ffd5df;color:#8d1131;border-color:#bb3557}
.question-map [aria-current="step"]{outline:2px solid var(--blue);outline-offset:1px}
.question-map .mark{font-size:.9em}
#progress{margin-bottom:2px}
.prompt{position:relative;isolation:isolate}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.web-line{position:absolute;top:66%;left:50%;width:61%;height:5px;border:1px solid #17469d;border-radius:8px;background:white;transform-origin:left;opacity:0;animation:web-pull 390ms ease-out both}
.web-line:nth-child(1){--angle:191deg}
.web-line:nth-child(2){--angle:207deg;animation-delay:35ms}
.web-line:nth-child(3){--angle:346deg;animation-delay:20ms}
.web-line:nth-child(4){--angle:333deg;animation-delay:45ms}
.burst-digit{position:absolute;top:66%;left:50%;font-size:clamp(24px,5vw,48px);font-weight:950;line-height:1;color:white;text-shadow:2px 2px #10214a,-1px -1px #10214a,1px -1px #10214a,-1px 1px #10214a;animation:digit-burst 740ms cubic-bezier(.17,.68,.33,1) 230ms both}
.burst-digit:nth-child(3n){color:#ff416d}
.burst-digit:nth-child(3n + 1){color:#78c9ff}
@keyframes web-pull{
  0%{opacity:0;transform:rotate(var(--angle)) translateX(100%) scaleX(.05)}
  54%{opacity:1;transform:rotate(var(--angle)) scaleX(1)}
  70%{opacity:1;transform:rotate(var(--angle)) scaleX(.91)}
  100%{opacity:0;transform:rotate(var(--angle)) scaleX(1.02)}
}
@keyframes digit-burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  12%{opacity:1}
  58%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--turn)) scale(.72);visibility:hidden}
}
@media(max-width:480px){.question-map li{flex-direction:column;gap:0;line-height:1.08;min-height:36px}.question-map{gap:4px}}
@media(prefers-reduced-motion:reduce){.burst{display:none}}
.cover h1 span{color:#65cfff}.cover{background-color:#fff05e}.prompt{background:#fff05e}
header .sound-tools{display:flex;flex-wrap:wrap;gap:6px}
.cover{background-color:#9ceeff}.cover h1 span{color:#d6b8ff}.prompt{background:#9ceeff}.art{background-color:#4931a4}.primary{background:#5423a2}
.cover,.prompt{background-color:#b5f6bf}.cover h1 span{color:#b5f6bf;text-shadow:4px 5px #10214a}.primary{background:#176252}
</style>
</head>
<body><main>
<header><span>KRU PAI CLASSROOM</span><div class="sound-tools"><button id="sound" type="button" aria-pressed="true">🔊 เสียงเปิด</button><button id="testSound" type="button">ทดสอบเสียง</button></div></header>
<section class="cover" id="cover">
<div class="copy"><span class="kicker">คณิตศาสตร์ ป.2 · ชุดไม่ทด</span><h1>ใยคูณ <span>พิชิตหอคอย</span></h1><p class="lead">คูณ 2 หลัก × 2 หลัก</p><p class="details">20 ข้อ · เติมคำตอบ · คูณแบบไม่ทด</p>
<form class="sign-in" id="signIn" novalidate>
<label for="playerName">ชื่อฮีโร่</label>
<input id="playerName" name="playerName" type="text" autocomplete="off" maxlength="50" placeholder="พิมพ์ชื่อหรือชื่อเล่น" aria-describedby="nameError" required>
<p class="name-error" id="nameError" role="alert" hidden>พิมพ์ชื่อฮีโร่ก่อนเริ่มภารกิจนะ</p>
<button class="primary start" id="start" type="submit">เริ่มภารกิจ ⚡</button>
</form></div>
<div class="art" role="img" aria-label="ฮีโร่ชุดแดงน้ำเงินโหนใยเหนือเมือง"></div>
</section>
<section class="board" id="game" hidden>
<div class="meta"><span id="stage"></span><span id="status"></span></div>
<progress id="progress" max="20" value="0" aria-label="จำนวนข้อที่ตอบแล้ว"></progress>
<ol class="question-map" id="questionMap" aria-label="สถานะข้อ 1 ถึง 20"></ol>
<div class="prompt"><p id="kind"></p><h2 class="equation" id="equation" tabindex="-1"></h2><div class="burst" id="burst" aria-hidden="true"></div></div>
<form id="entry" class="entry" novalidate><input id="answer" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="ใส่คำตอบ" aria-label="คำตอบตัวเลข"><button id="check" class="primary">ตรวจคำตอบ</button></form>
<div id="feedback" class="feedback" role="status" hidden></div>
<div class="actions"><button class="primary" id="next" hidden>โหนใยไปข้อถัดไป →</button></div>
</section>
<section class="board center" id="results" hidden>
<h2 id="finishTitle" tabindex="-1">🏆 ภารกิจสำเร็จ!</h2><p class="lead" id="playerResult"></p><p class="score" id="finalScore"></p><p id="percent" class="lead"></p><ol class="question-map" id="resultMap" aria-label="ผลรายข้อ"></ol><div class="review" id="review"></div><button class="primary" id="replay">เล่นอีกครั้ง ↻</button>
</section>
</main><script>
'use strict';
const pairs = [
  [31,31],[11,35],[13,21],[11,43],[11,27],
  [11,17],[13,23],[21,41],[11,45],[12,22],
  [12,33],[12,31],[11,81],[11,33],[21,33],
  [21,22],[11,42],[11,53],[11,41],[31,32]
];
const stages = ['โหนใยข้ามถนน','พิชิตยอดตึก'];
const el = id => document.getElementById(id);
let index = 0, score = 0, locked = false, mistakes = [], soundOn = true, audioContext;
const outcomes = [];
function renderMap(target, activeIndex) {
  const tiles = pairs.map((_, questionIndex) => {
    const tile = document.createElement('li');
    const number = document.createElement('span');
    const mark = document.createElement('span');
    const outcome = outcomes[questionIndex];
    const label = outcome === true ? 'ถูก' : outcome === false ? 'ผิด' : 'ยังไม่ตอบ';
    number.textContent = questionIndex + 1;
    mark.className = 'mark';
    mark.textContent = outcome === true ? '✓' : outcome === false ? '✕' : '';
    mark.setAttribute('aria-label', label);
    if (outcome !== undefined) tile.className = outcome ? 'correct' : 'incorrect';
    if (questionIndex === activeIndex) tile.setAttribute('aria-current', 'step');
    tile.append(number, mark);
    return tile;
  });
  target.replaceChildren(...tiles);
}
function burstAnswer(product) {
  const burst = el('burst');
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 4; i++) {
    const line = document.createElement('span');
    line.className = 'web-line';
    burst.append(line);
  }
  const digits = String(product);
  const directions = [[-126,-48],[-77,29],[-45,-60],[43,26],[86,-57],[126,22]];
  directions.forEach(([x,y], i) => {
    const digit = document.createElement('span');
    digit.className = 'burst-digit';
    digit.textContent = digits[i % digits.length];
    digit.style.setProperty('--dx', x + 'px');
    digit.style.setProperty('--dy', y + 'px');
    digit.style.setProperty('--turn', (i - 2.5) * 39 + 'deg');
    burst.append(digit);
  });
}
async function tone(correct) {
  if (!soundOn) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audioContext ||= new Audio();
    if (audioContext.state !== "running") await audioContext.resume();
    if (!soundOn || audioContext.state !== "running") return;
    const now = audioContext.currentTime + .015;
    (correct ? [523,659,784] : [330,247]).forEach((frequency,i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const start = now + i * .085;
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(.11,start);
      gain.gain.exponentialRampToValueAtTime(.001,start+.15);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(start);
      osc.stop(start+.16);
    });
  } catch (_) {}
}
function showQuestion() {
  locked = false;
  const [a,b] = pairs[index];
  el('stage').textContent = stages[Math.floor(index/10)];
  el('status').textContent = 'ข้อ '+(index+1)+' / 20 · ⚡ '+score+' คะแนน';
  el('kind').textContent = 'เติมตัวเลขคำตอบ';
  el('equation').textContent = a+' × '+b+' = ?';
  el('progress').value = index;
  el('burst').replaceChildren();
  renderMap(el('questionMap'), index);
  el('feedback').hidden = true;
  el('next').hidden = true;
  el('answer').value = '';
  el('answer').disabled = false;
  el('check').disabled = false;
  el('equation').focus();
}
function grade(value) {
  if (locked) return;
  locked = true;
  const [a,b] = pairs[index];
  const product = a*b;
  const correct = value === product;
  outcomes[index] = correct;
  renderMap(el('questionMap'), index);
  if (correct) {
    score++;
    burstAnswer(product);
  }
  else mistakes.push({index,a,b,value,product});
  el('answer').disabled = true;
  el('check').disabled = true;
  el('status').textContent = 'ข้อ '+(index+1)+' / 20 · ⚡ '+score+' คะแนน';
  el('progress').value = index+1;
  const tens = Math.floor(b/10)*10;
  const units = b%10;
  el('feedback').className = 'feedback '+(correct?'good':'try');
  el('feedback').textContent = correct ? '⚡ ถูกต้อง! '+a+' × '+b+' = '+product :
    '✕ คำตอบคือ '+product+' เพราะ ('+a+' × '+units+') + ('+a+' × '+tens+') = '+(a*units)+' + '+(a*tens);
  el('feedback').hidden = false;
  el('next').textContent = index === pairs.length - 1 ? 'ดูผลภารกิจ 🏆' : (index === 9 ? 'ไปด่านถัดไป →' : 'โหนใยไปข้อถัดไป →');
  el('next').hidden = false;
  el('next').focus();
  tone(correct);
}
let playerName = "";
function start() {
  index = 0;
  score = 0;
  mistakes = [];
  outcomes.length = 0;
  el('cover').hidden = true;
  el('results').hidden = true;
  el('game').hidden = false;
  showQuestion();
}
function finish() {
  el('game').hidden = true;
  el('results').hidden = false;
  el('playerResult').textContent = 'ฮีโร่ '+playerName;
  el('finalScore').textContent = score+' / 20';
  el('percent').textContent = 'ตอบถูก '+Math.round(score/pairs.length*100)+'%';
  renderMap(el('resultMap'));
  el('review').replaceChildren();
  if (mistakes.length) {
    const heading = document.createElement('h3');
    heading.textContent = 'ข้อที่ควรทบทวน';
    const list = document.createElement('ol');
    for (const {index,a,b,value,product} of mistakes) {
      const item = document.createElement('li');
      item.value = index+1;
      item.textContent = a+' × '+b+' = '+product+' (ตอบ '+value+')';
      list.append(item);
    }
    el('review').append(heading,list);
  }
  el('finishTitle').focus();
}
function setSound(enabled) {
  soundOn = enabled;
  el('sound').textContent = soundOn ? '🔊 เสียงเปิด' : '🔇 เสียงปิด';
  el('sound').setAttribute('aria-pressed',String(soundOn));
}
el('sound').onclick = () => {
  setSound(!soundOn);
  if (soundOn) void tone(true);
};
el('testSound').onclick = () => {
  setSound(true);
  void tone(true);
};
el('signIn').onsubmit = event => {
  event.preventDefault();
  const field = el('playerName');
  const name = field.value.trim();
  el('nameError').hidden = Boolean(name);
  if (!name) {
    field.setAttribute('aria-invalid','true');
    field.focus();
    return;
  }
  field.removeAttribute('aria-invalid');
  playerName = name;
  void tone(true);
  start();
};
el('playerName').oninput = () => {
  el('nameError').hidden = true;
  el('playerName').removeAttribute('aria-invalid');
};
el('replay').onclick = () => {
  el('results').hidden = true;
  el('cover').hidden = false;
  el('playerName').focus();
  el('playerName').select();
};
el('next').onclick = () => {
  if (++index < pairs.length) showQuestion();
  else finish();
};
el('entry').onsubmit = event => {
  event.preventDefault();
  const raw = el('answer').value.trim().replace(/[๐-๙]/g, digit => '๐๑๒๓๔๕๖๗๘๙'.indexOf(digit));
  if (/^[0-9]{1,4}$/.test(raw)) grade(Number(raw));
  else {
    el('feedback').className = 'feedback';
    el('feedback').textContent = 'พิมพ์ตัวเลขคำตอบก่อนตรวจนะ';
    el('feedback').hidden = false;
    el('answer').focus();
  }
};
</script></body></html>
