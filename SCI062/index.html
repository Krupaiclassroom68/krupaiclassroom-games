<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KPC STAR LIFE QUEST | Unit 07 Lesson</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#f5f9ff;background:#070d25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 10%,#20265b 0%,transparent 40%),radial-gradient(ellipse at 5% 90%,#102d50 0%,transparent 45%),#070d25;min-height:100vh}.shell{max-width:1300px;margin:auto;padding:clamp(14px,3vw,38px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:1px;color:#8cddff}.tag{border:1px solid #49759e;border-radius:100px;padding:8px 14px;color:#c3e9ff}.panel{background:linear-gradient(130deg,#101c40ed,#0d1634f2);border:1px solid #365a85;border-radius:25px;padding:clamp(20px,4vw,48px);box-shadow:0 20px 80px #0005;margin-top:22px;min-height:65vh}h1{font-size:clamp(36px,5.5vw,76px);line-height:1.15;margin:16px 0;color:#fff}h2{font-size:clamp(30px,4vw,54px);margin:8px 0 20px}p{font-size:clamp(21px,2.35vw,32px);line-height:1.65}small,.small{font-size:clamp(16px,1.45vw,21px);color:#bcd5f5}.eyebrow{color:#6fe6ff;font-size:clamp(16px,2vw,25px);font-weight:900}.big{font-size:clamp(70px,13vw,160px);filter:drop-shadow(0 0 32px #64c7ff60)}.hero{display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:25px}.note{background:#132c51;border-left:6px solid #53d7ff;padding:16px 22px;border-radius:12px;font-size:clamp(19px,2vw,27px);line-height:1.5;margin:16px 0}.warn{border-left-color:#ffcb6b;background:#3a2940}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}button{border:1px solid #5486bd;background:#152a50;color:white;padding:14px 24px;border-radius:14px;font:700 clamp(18px,1.7vw,24px) system-ui;cursor:pointer;touch-action:manipulation}button.primary{background:linear-gradient(120deg,#008bcb,#6258d9);border:0}button:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:default}.progress{height:10px;background:#1c345a;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:linear-gradient(90deg,#35d6e8,#a46eff);transition:width .3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.choice{display:block;width:100%;text-align:left;margin:12px 0;background:#14274c}.choice.selected{outline:3px solid #7bdfff}.feedback{background:#102f3b;border:1px solid #43cda8;border-radius:15px;padding:20px;margin-top:15px;font-size:clamp(18px,2vw,25px);line-height:1.5}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:20px 0}.node{background:#193761;border:1px solid #65b6f3;border-radius:16px;padding:14px 18px;font-size:clamp(17px,1.8vw,24px);font-weight:800}.arrow{color:#6ee6ff;font-size:30px}.star{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8c5,#ffc24b 35%,#f16430 70%,#b62c3b);box-shadow:0 0 40px #f9ae4e,0 0 100px #ef6e3a70;margin:12px auto}.hidden{display:none!important}.center{text-align:center}.score{font-size:clamp(70px,10vw,140px);font-weight:900;color:#75edda}footer{color:#829bbd;font-size:14px;margin-top:20px}@media(max-width:700px){.hero{grid-template-columns:1fr}.big{font-size:85px}.panel{min-height:70vh}.controls button{flex:1}button{padding:14px 12px}}</style></head><body><div class="shell"><header><div class="brand">🚀 KRU PAI CLASSROOM <span class="small">/ ASTRONOMY ACADEMY</span></div><span class="tag">UNIT 07 · LESSON</span></header><div class="progress"><div id="bar" style="width:0%"></div></div><main id="screen" class="panel" aria-live="polite"></main><footer>STAR LIFE QUEST • บทเรียนสำหรับ ป.4–ป.6 เตรียมสอบเข้า ม.1 • แผนภาพเป็นแบบจำลองเพื่อการเรียนรู้</footer></div><script>
const PAGES=[["01", "ดาวฤกษ์คืออะไร?", "⭐", "ดาวฤกษ์เป็นวัตถุท้องฟ้าที่สร้างพลังงานและเปล่งแสงได้เอง โดยพลังงานส่วนใหญ่เกิดจากปฏิกิริยานิวเคลียร์ฟิวชันในแก่นกลาง", "ดวงอาทิตย์เป็นดาวฤกษ์ที่อยู่ใกล้โลกที่สุด", "ดาวเคราะห์ไม่ใช่ดาวฤกษ์ เพราะแสงที่เราเห็นจากดาวเคราะห์ส่วนใหญ่เป็นแสงสะท้อนจากดวงอาทิตย์"], ["02", "ดาวฤกษ์เกิดได้อย่างไร?", "🌫️", "ดาวฤกษ์ก่อตัวจากบริเวณเมฆแก๊สและฝุ่นในอวกาศ เมื่อแรงโน้มถ่วงทำให้สสารรวมตัวกัน แก่นกลางร้อนขึ้นจนเกิดดาวก่อนเกิด (protostar) และเมื่อฟิวชันไฮโดรเจนเริ่มอย่างต่อเนื่องจึงเข้าสู่ช่วงดาวฤกษ์ลำดับหลัก", "เนบิวลา → ดาวก่อนเกิด → ดาวฤกษ์ลำดับหลัก", "ไม่ใช่เนบิวลาทุกแห่งจะกำลังก่อตัวเป็นดาวฤกษ์"], ["03", "สีของดาวบอกอะไร?", "🌈", "สีของดาวฤกษ์สัมพันธ์กับอุณหภูมิผิว โดยทั่วไปดาวสีน้ำเงินร้อนกว่าดาวสีขาว สีเหลือง สีส้ม และสีแดงตามลำดับ", "น้ำเงิน → ขาว → เหลือง → ส้ม → แดง (ร้อน → เย็น)", "สีแดงไม่ได้แปลว่าร้อนที่สุด แม้สีแดงจะดูเหมือนไฟ"], ["04", "ความสว่างกับระยะทาง", "✨", "ความสว่างที่เรามองเห็นขึ้นกับทั้งกำลังส่องสว่างจริงของดาวและระยะทางจากผู้สังเกต ดาวที่อยู่ใกล้อาจดูสว่างกว่าดาวที่มีกำลังส่องสว่างสูงแต่อยู่ไกล", "ความสว่างที่เห็น ≠ กำลังส่องสว่างแท้จริง", "อย่าตัดสินขนาดหรือกำลังส่องสว่างของดาวจากความสว่างที่เห็นเพียงอย่างเดียว"], ["05", "ชีวิตดาวขึ้นกับมวล", "⚖️", "มวลเริ่มต้นเป็นปัจจัยสำคัญที่กำหนดอายุและจุดจบของดาวฤกษ์ ดาวมวลมากมักใช้เชื้อเพลิงรวดเร็วและมีอายุสั้นกว่าดาวมวลน้อย", "ดาวมวลมากไม่ได้มีอายุยืนกว่าเสมอ", "ดวงอาทิตย์จะไม่กลายเป็นหลุมดำตามวิวัฒนาการปกติ"], ["06", "เส้นทางดาวคล้ายดวงอาทิตย์", "☀️", "ดาวฤกษ์มวลน้อยถึงปานกลางอย่างดวงอาทิตย์ เมื่อไฮโดรเจนในแก่นกลางลดลงจะขยายเป็นดาวยักษ์แดง ต่อมาปล่อยชั้นบรรยากาศชั้นนอกออกจนเกิดเนบิวลาดาวเคราะห์ และเหลือแก่นเป็นดาวแคระขาว", "ดาวคล้ายดวงอาทิตย์ → ยักษ์แดง → เนบิวลาดาวเคราะห์ → แคระขาว", "เนบิวลาดาวเคราะห์ไม่ใช่สถานที่เกิดดาวเคราะห์"], ["07", "เส้นทางดาวมวลมาก", "💥", "ดาวมวลมากพัฒนาเป็นดาวมหายักษ์ และอาจระเบิดเป็นซูเปอร์โนวาแบบแก่นยุบตัว เหลือซากเป็นดาวนิวตรอนหรือหลุมดำ ขึ้นกับมวลแก่นและกระบวนการระเบิด", "ดาวมวลมาก → มหายักษ์ → ซูเปอร์โนวา → ดาวนิวตรอน / หลุมดำ", "ไม่ใช่ดาวทุกดวงจะระเบิดเป็นซูเปอร์โนวา"], ["08", "ทบทวนก่อนสอบ", "🧠", "จำสามแกนหลักให้แม่น: ดาวฤกษ์สร้างแสงเอง สีสัมพันธ์กับอุณหภูมิ และมวลกำหนดเส้นทางวิวัฒนาการ จากนั้นทดลองเลือกเส้นทางดาวและทำ Mini Quiz", "สีน้ำเงินร้อนกว่าสีแดง • ดวงอาทิตย์จบเป็นดาวแคระขาว • ดาวมวลมากอาจเหลือหลุมดำ", "หลุมดำไม่ได้ดูดทุกสิ่งในเอกภพ และดาวแคระขาวไม่ใช่ดาวฤกษ์ที่ยังฟิวชันไฮโดรเจนในแก่นกลาง"]],QUESTIONS=[{"q": "ดาวฤกษ์แตกต่างจากดาวเคราะห์ในข้อใดมากที่สุด?", "a": ["ดาวฤกษ์สร้างพลังงานและเปล่งแสงเอง", "ดาวฤกษ์ทุกดวงใหญ่กว่าดาวเคราะห์ทุกดวง", "ดาวฤกษ์อยู่ใกล้โลกเสมอ", "ดาวฤกษ์ไม่มีแรงโน้มถ่วง"], "c": 0, "e": "ดาวฤกษ์สร้างพลังงานด้วยนิวเคลียร์ฟิวชัน ส่วนดาวเคราะห์ที่เรามองเห็นมักสะท้อนแสงจากดาวฤกษ์"}, {"q": "ดาวฤกษ์สีใดโดยทั่วไปมีอุณหภูมิผิวสูงที่สุด?", "a": ["แดง", "ส้ม", "เหลือง", "น้ำเงิน"], "c": 3, "e": "ดาวสีน้ำเงินโดยทั่วไปมีอุณหภูมิผิวสูงกว่าดาวสีขาว เหลือง ส้ม และแดง"}, {"q": "ดวงอาทิตย์มีแนวโน้มเหลือซากเป็นอะไรเมื่อสิ้นวิวัฒนาการ?", "a": ["ดาวนิวตรอน", "ดาวแคระขาว", "หลุมดำ", "ดาวเคราะห์แคระ"], "c": 1, "e": "ดวงอาทิตย์มีมวลไม่มากพอที่จะเกิดซูเปอร์โนวาแบบแก่นยุบตัว จึงเหลือดาวแคระขาว"}, {"q": "ข้อใดถูกต้องเกี่ยวกับอายุของดาวฤกษ์?", "a": ["ดาวมวลมากมักมีอายุสั้นกว่าดาวมวลน้อย", "ดาวมวลมากมีอายุยืนกว่าเสมอ", "ดาวทุกดวงมีอายุเท่ากัน", "ดาวสีแดงทุกดวงมีอายุเท่ากัน"], "c": 0, "e": "ดาวมวลมากใช้เชื้อเพลิงเร็วมาก จึงมักมีช่วงชีวิตสั้นกว่า"}, {"q": "ซากที่อาจเกิดหลังซูเปอร์โนวาแบบแก่นยุบตัวคือข้อใด?", "a": ["ดาวเคราะห์น้อยหรือดาวหาง", "ดวงจันทร์หรือดาวเคราะห์", "ดาวนิวตรอนหรือหลุมดำ", "ดาวแคระขาวเท่านั้น"], "c": 2, "e": "แก่นดาวมวลมากที่ยุบตัวอาจเหลือดาวนิวตรอนหรือหลุมดำ ขึ้นกับมวลและกระบวนการที่เกิดขึ้น"}];let mode='cover',idx=0,ans={},selected=null,branch='sun';const el=document.getElementById('screen'),bar=document.getElementById('bar');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function render(){bar.style.width=(mode==='lesson'?((idx+1)/PAGES.length*100):mode==='quiz'?((idx+1)/QUESTIONS.length*100):mode==='result'?100:0)+'%';if(mode==='cover'){el.innerHTML=`<div class="hero"><div><div class="eyebrow">⭐ MISSION 07 — STAR LIFE QUEST</div><h1>ชีวิตมหัศจรรย์<br>ของดาวฤกษ์</h1><p>จากเมฆฝุ่นในอวกาศ สู่ดาวยักษ์แดง ซูเปอร์โนวา และหลุมดำ</p><div class="note">📘 8 หน้าบทเรียน · 🔬 ห้องทดลองเส้นทางชีวิตดาว · 🧠 Mini Quiz 5 ข้อ</div><div class="controls">${btn('🚀 เริ่มเรียน','start()','primary')}</div></div><div class="center"><div class="star"></div><div class="big">🌌</div></div></div>`;return}if(mode==='lesson'){let p=PAGES[idx];el.innerHTML=`<div class="eyebrow">LESSON ${p[0]} / 08</div><div class="hero"><div><h2>${esc(p[1])}</h2><p>${esc(p[3])}</p></div><div class="center big">${p[2]}</div></div><div class="note">💡 จำให้แม่น: ${esc(p[4])}</div><div class="note warn">🎯 ระวังข้อสอบ: ${esc(p[5])}</div>${idx===7?'<div class="note">🔬 พร้อมทดลองเส้นทางชีวิตดาวแล้ว!</div>':''}<div class="controls">${btn('⌂ หน้าแรก','home()')}${btn('← ย้อนกลับ','prev()')}${btn(idx===7?'🔬 ทดลองวงจรชีวิตดาว':'หน้าถัดไป →','next()','primary')}</div>`;return}if(mode==='lab'){let sun=branch==='sun';el.innerHTML=`<div class="eyebrow">🔬 INTERACTIVE STAR LIFE LAB</div><h2>เลือกมวลเริ่มต้นของดาวฤกษ์</h2><p>ลองเปลี่ยนชนิดดาว แล้วสังเกตว่าจุดจบของดาวแตกต่างกันอย่างไร</p><div class="controls">${btn('☀️ ดาวคล้ายดวงอาทิตย์',"chooseBranch('sun')",sun?'primary':'')}${btn('💥 ดาวมวลมาก',"chooseBranch('massive')",!sun?'primary':'')}</div><div class="flow">${(sun?['🌫️ เนบิวลาก่อตัวดาว','⭐ ดาวลำดับหลัก','🔴 ดาวยักษ์แดง','🫧 เนบิวลาดาวเคราะห์','⚪ ดาวแคระขาว']:['🌫️ เนบิวลาก่อตัวดาว','🔵 ดาวมวลมากลำดับหลัก','🔴 ดาวมหายักษ์','💥 ซูเปอร์โนวา','🌀 ดาวนิวตรอน / หลุมดำ']).map((x,i)=>`<span class="node">${x}</span>${i<4?'<span class="arrow">→</span>':''}`).join('')}</div><div class="note">${sun?'ดวงอาทิตย์มีมวลไม่พอที่จะกลายเป็นหลุมดำตามเส้นทางปกติ':'ซากหลังซูเปอร์โนวาแบบแก่นยุบตัวอาจเป็นดาวนิวตรอนหรือหลุมดำ ทั้งนี้ขึ้นกับมวลแก่นและการระเบิด'}</div><div class="controls">${btn('← กลับบทเรียน','backLesson()')}${btn('🧠 เริ่ม Mini Quiz 5 ข้อ','startQuiz()','primary')}</div>`;return}if(mode==='quiz'){let q=QUESTIONS[idx],a=ans[idx];el.innerHTML=`<div class="eyebrow">🧠 MINI QUIZ · QUESTION ${idx+1} / ${QUESTIONS.length}</div><h2>${esc(q.q)}</h2>${q.a.map((t,i)=>`<button class="choice ${a===i?'selected':''}" onclick="answer(${i})">${'ABCD'[i]}. ${esc(t)}</button>`).join('')}${a!==undefined?`<div class="feedback">${a===q.c?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง'}<div>คำตอบ: ${'ABCD'[q.c]}. ${esc(q.a[q.c])}</div><div>${esc(q.e)}</div></div>`:''}<div class="controls">${btn('⌂ หน้าแรก','home()')}${btn('← ข้อก่อนหน้า','prevQuiz()')}${btn(idx===QUESTIONS.length-1?'🏆 สรุปคะแนน':'ข้อต่อไป →','nextQuiz()','primary')}</div>`;return}if(mode==='result'){let score=QUESTIONS.filter((q,i)=>ans[i]===q.c).length;el.innerHTML=`<div class="center"><div class="eyebrow">🏆 MISSION COMPLETE</div><h1>STAR LIFE REPORT</h1><div class="score">${score} / ${QUESTIONS.length}</div><p>${score===5?'สุดยอด! เข้าใจชีวิตดาวฤกษ์ครบทุกข้อ':score>=4?'เก่งมาก! ผ่านเกณฑ์ 80%':'ลองทบทวนบทเรียน แล้วกลับมาทดสอบอีกครั้งนะ'}</p></div><div class="grid">${QUESTIONS.map((q,i)=>`<div class="note">ข้อ ${i+1}: ${ans[i]===q.c?'✅ ถูก':'❌ ผิด / ยังไม่ตอบ'}<div class="small">${esc(q.e)}</div></div>`).join('')}</div><div class="controls">${btn('📘 ทบทวนบทเรียน','start()')}${btn('🔁 ทำแบบทดสอบอีกครั้ง','restartQuiz()','primary')}${btn('⌂ หน้าแรก','home()')}</div>`;return}}function start(){mode='lesson';idx=0;render()}function home(){mode='cover';idx=0;render()}function prev(){idx=Math.max(0,idx-1);render()}function next(){if(idx<7)idx++;else mode='lab';render()}function chooseBranch(x){branch=x;render()}function backLesson(){mode='lesson';idx=7;render()}function startQuiz(){mode='quiz';idx=0;render()}function answer(i){ans[idx]=i;render()}function prevQuiz(){idx=Math.max(0,idx-1);render()}function nextQuiz(){if(idx<QUESTIONS.length-1)idx++;else mode='result';render()}function restartQuiz(){ans={};mode='quiz';idx=0;render()}render();
</script></body></html>
