<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Time Master Galaxy EP3 - Type Answer</title>
<style>
:root{
  --bg1:#050716;--bg2:#11184a;--bg3:#3c1f8f;--cyan:#55e7ff;--pink:#ff5fd7;--yellow:#ffe96a;--green:#62ff9f;--red:#ff4c6a;--white:#f8fbff;--dark:#07102a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial, Helvetica, sans-serif;color:white;background:#060914;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 12% 15%, rgba(85,231,255,.26), transparent 24%),
    radial-gradient(circle at 88% 18%, rgba(255,95,215,.24), transparent 28%),
    radial-gradient(circle at 50% 95%, rgba(255,233,106,.16), transparent 34%),
    linear-gradient(150deg,var(--bg3),var(--bg2),var(--bg1));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.42;background-image:radial-gradient(circle,rgba(255,255,255,.85) 1px,transparent 1.8px),radial-gradient(circle,rgba(85,231,255,.75) 1px,transparent 2px);background-size:115px 115px,185px 185px;animation:starMove 80s linear infinite}
body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:conic-gradient(from 0deg,transparent,rgba(85,231,255,.07),transparent,rgba(255,95,215,.06),transparent);animation:rotateNebula 30s linear infinite}
@keyframes starMove{to{transform:translateY(260px)}}
@keyframes rotateNebula{to{transform:rotate(360deg)}}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;z-index:2}
.glass{width:min(1180px,97vw);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 80px rgba(0,0,0,.48), inset 0 0 50px rgba(85,231,255,.045);border-radius:34px;padding:24px;backdrop-filter:blur(14px)}
.start-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:28px;align-items:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;background:rgba(255,233,106,.16);border:1px solid rgba(255,233,106,.45);font-weight:1000;color:#fff6ab;margin-bottom:14px}
.title{font-size:clamp(2.25rem,6.1vw,5.4rem);font-weight:1000;line-height:.9;letter-spacing:-2px;text-shadow:0 0 28px rgba(85,231,255,.45),0 0 54px rgba(255,95,215,.22)}
.subtitle{font-size:clamp(1rem,2.1vw,1.25rem);line-height:1.68;color:rgba(255,255,255,.92);font-weight:800;margin-top:18px}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.feature{padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-weight:1000;color:#eefdff}
input.name{width:100%;padding:18px 20px;border:2px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(255,255,255,.94);font-size:1.12rem;font-weight:1000;margin-top:18px;color:#11184a;outline:none}
.buttons{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px}
button{border:0;border-radius:20px;padding:15px 22px;font-size:1.02rem;font-weight:1000;cursor:pointer;transition:.16s transform,.16s filter;box-shadow:0 10px 24px rgba(0,0,0,.28)}
button:hover{transform:translateY(-2px) scale(1.015);filter:brightness(1.05)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.play{background:linear-gradient(180deg,#fff8c1,var(--yellow));color:#2c2100;border:1px solid rgba(255,255,255,.55)}
.secondary{background:linear-gradient(180deg,#e9fbff,#7ff0ff);color:#06264a}.danger{background:linear-gradient(180deg,#ffd7dd,#ff6a84);color:#3b0010}
.hud{display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:12px;margin-bottom:14px}.card{padding:14px;border-radius:22px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12);text-align:center}.label{font-size:.75rem;letter-spacing:1px;opacity:.72;font-weight:1000}.value{font-size:clamp(1.35rem,3vw,2.05rem);font-weight:1000;margin-top:6px}.timeWarn{color:var(--red);animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.07)}}
.arena{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px;align-items:center}.clock-panel{position:relative;text-align:center;padding:18px;border-radius:30px;background:radial-gradient(circle at 50% 30%,rgba(85,231,255,.18),rgba(255,255,255,.06) 46%,rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);overflow:hidden}.clock-panel::before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent,rgba(255,233,106,.12),transparent,rgba(85,231,255,.16),transparent);animation:spin 12s linear infinite}.clock-content{position:relative;z-index:2}.digital{display:inline-block;font-size:clamp(2.75rem,8.6vw,6.5rem);font-weight:1000;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 28px rgba(255,233,106,.58),0 0 56px rgba(255,233,106,.22);margin-top:10px}.mission{font-size:clamp(1.05rem,2.2vw,1.35rem);font-weight:1000;color:#eafeff;margin-top:10px}.modeLine{font-size:.95rem;color:#bff5ff;font-weight:900;margin-top:8px}.face{width:min(62vw,310px);aspect-ratio:1;margin:0 auto;position:relative;border-radius:50%;background:radial-gradient(circle,#182365 0 45%,#0a113a 46% 64%,#09102e 65% 100%);border:8px solid rgba(85,231,255,.75);box-shadow:0 0 40px rgba(85,231,255,.35), inset 0 0 34px rgba(255,255,255,.1)}
.face::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}.num{position:absolute;left:50%;top:50%;font-weight:1000;color:#fff;transform:translate(-50%,-50%);font-size:1.12rem;text-shadow:0 0 10px rgba(255,255,255,.5)}.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:999px;box-shadow:0 0 12px rgba(255,255,255,.4)}.hour{width:9px;height:28%;background:linear-gradient(180deg,#fff,var(--yellow));}.minute{width:6px;height:38%;background:linear-gradient(180deg,#fff,var(--cyan));}.centerDot{position:absolute;left:50%;top:50%;width:20px;height:20px;background:#fff;border:4px solid var(--pink);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(255,95,215,.7)}
.answer-panel{padding:20px;border-radius:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.prompt-title{font-size:clamp(1.25rem,2.8vw,2.1rem);font-weight:1000;text-align:center;color:#fff;text-shadow:0 0 18px rgba(85,231,255,.4)}
.sentence-box{margin-top:16px;padding:18px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(226,248,255,.92));color:#081339;font-weight:1000;font-size:clamp(1.25rem,3vw,2rem);line-height:1.55;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.word-slots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px}
.slot-word{width:118px;min-height:54px;padding:10px 8px;border-radius:14px;border:3px solid #55e7ff;background:#fff;color:#07102a;font-size:clamp(1rem,2.25vw,1.38rem);font-weight:1000;text-align:center;outline:none;box-shadow:0 0 18px rgba(85,231,255,.28)}
.slot-word.short{width:86px}.slot-word.medium{width:128px}.slot-word.long{width:158px}
.slot-word:focus{border-color:var(--pink);box-shadow:0 0 24px rgba(255,95,215,.36)}
.fixed-word{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:10px 14px;border-radius:14px;background:#07102a;color:#ffe96a;border:2px solid rgba(255,233,106,.55);font-weight:1000;font-size:clamp(1rem,2.25vw,1.38rem)}
.dot-end{font-size:2rem;font-weight:1000;color:#07102a}
.tip{margin-top:12px;text-align:center;color:#dffaff;font-weight:900;line-height:1.55}.result-line{min-height:40px;margin-top:14px;text-align:center;font-weight:1000;font-size:clamp(1rem,2vw,1.25rem)}.ok{color:var(--green)}.bad{color:#ffb4c0}.show-answer{margin-top:10px;padding:13px;border-radius:18px;background:rgba(255,233,106,.13);border:1px solid rgba(255,233,106,.35);color:#fff8c1;font-weight:1000;text-align:center;display:none}.show-answer.show{display:block}
.shake{animation:shake .42s ease-in-out 2}.spinWin .minute,.spinWin .hour{animation:winSpin .85s cubic-bezier(.2,.8,.1,1)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes winSpin{to{transform:rotate(calc(var(--rot) + 360deg))}}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px;max-height:48vh;overflow:auto;padding-right:4px}.summary-card{padding:15px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.summary-card b{color:var(--yellow)}.answerLine{margin-top:8px;color:#bff5ff;font-weight:1000}.scorePill{display:inline-block;margin-top:16px;padding:16px 28px;border-radius:999px;background:linear-gradient(180deg,#fff8c1,var(--yellow));color:#2c2100;font-size:clamp(1.7rem,5vw,3rem);font-weight:1000}.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}.piece{position:absolute;width:10px;height:18px;border-radius:4px;background:var(--yellow);animation:fall 1.35s linear forwards}.piece:nth-child(3n){background:var(--cyan)}.piece:nth-child(4n){background:var(--pink)}.piece:nth-child(5n){background:var(--green)}@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(105vh) rotate(720deg)}}
@media(max-width:900px){.start-grid,.arena{grid-template-columns:1fr}.hud{grid-template-columns:1fr 1fr}.features{grid-template-columns:1fr}.clock-panel{order:-1}.glass{padding:18px}.face{width:min(70vw,285px)}.answer-panel{padding:16px}.sentence-box{font-size:1.28rem}.slot-word{width:108px}.slot-word.short{width:78px}.slot-word.medium{width:118px}.slot-word.long{width:145px}}
@media(max-width:620px){.screen{padding:9px;align-items:flex-start}.glass{border-radius:24px;padding:14px;margin-top:6px}.hud{gap:8px;margin-bottom:10px}.card{padding:9px;border-radius:16px}.label{font-size:.68rem}.value{font-size:1.18rem}.title{font-size:2.55rem}.buttons{display:grid;grid-template-columns:1fr;gap:10px}button{width:100%;padding:14px}.digital{font-size:3.05rem}.face{width:min(74vw,230px);border-width:6px}.num{font-size:.92rem}.clock-panel{padding:12px}.arena{gap:12px}.sentence-box{padding:14px;font-size:1.14rem;line-height:1.75}.word-slots{gap:8px}.slot-word{width:calc(50% - 8px);min-height:50px;font-size:1.08rem}.slot-word.short,.slot-word.medium,.slot-word.long{width:calc(50% - 8px)}.fixed-word{width:calc(50% - 8px);min-height:50px}.prompt-title{font-size:1.28rem}.tip{font-size:.9rem}.summary-grid{max-height:52vh}}
@media(max-height:620px) and (orientation:landscape){.screen{align-items:flex-start;padding:8px}.glass{padding:12px}.hud{grid-template-columns:repeat(4,1fr);gap:8px}.card{padding:8px}.face{width:185px}.digital{font-size:2.8rem}.sentence-box{font-size:1.1rem;padding:12px}.answer-panel{padding:12px}.buttons{margin-top:10px}.prompt-title{font-size:1.25rem}}

.kpc-report{max-width:930px;margin:auto;text-align:center}
.kpc-brand{font-size:clamp(1.45rem,4vw,2.4rem);font-weight:1000;color:#ffe96a;letter-spacing:1px}
.kpc-title{font-size:clamp(1.1rem,3vw,1.7rem);font-weight:900;margin:12px 0}
.kpc-meta{color:#e1f7ff;font-weight:800;line-height:1.9;overflow-wrap:anywhere}
.kpc-score{font-size:clamp(2.2rem,7vw,4rem);font-weight:1000;color:#ffe96a;margin:14px}
.kpc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.kpc-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);border-radius:18px;padding:13px 6px}
.kpc-stat strong{display:block;font-size:clamp(1.3rem,4vw,2.1rem);color:#ffe96a}
.kpc-stat span{font-size:clamp(.75rem,2vw,.95rem)}
.kpc-box{background:rgba(2,12,38,.45);border:1px solid rgba(100,233,255,.28);border-radius:23px;padding:18px;margin:16px 0;text-align:left}
.kpc-box h3{margin:0 0 10px;color:#ffe96a}
.kpc-chart{width:100%;height:210px}
.kpc-rounds{display:flex;flex-wrap:wrap;gap:9px}
.kpc-round{border:1px solid rgba(255,255,255,.15);border-radius:13px;padding:9px 12px;background:rgba(255,255,255,.08);font-weight:800}
.kpc-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.kpc-actions button{min-width:155px;flex:1}
.kpc-qnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px}
.kpc-qnav button{padding:10px 4px;min-width:0;border-radius:12px;font-size:1rem}
.kpc-qdetail{background:rgba(255,255,255,.08);border-radius:16px;padding:15px;margin-top:12px;line-height:1.7}
@media(max-width:580px){.kpc-stats{gap:5px}.kpc-stat{padding:9px 3px}.kpc-actions button{min-width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS=[
 {time:"01:05", mode:"past", parts:["five","one"], answer:"It is five past one."},
 {time:"02:10", mode:"past", parts:["ten","two"], answer:"It is ten past two."},
 {time:"03:15", mode:"past", parts:["a quarter","three"], answer:"It is a quarter past three."},
 {time:"04:20", mode:"past", parts:["twenty","four"], answer:"It is twenty past four."},
 {time:"05:25", mode:"past", parts:["twenty-five","five"], answer:"It is twenty-five past five."},
 {time:"06:30", mode:"half", parts:["half","six"], answer:"It is half past six."},
 {time:"07:35", mode:"to", parts:["twenty-five","eight"], answer:"It is twenty-five to eight."},
 {time:"08:40", mode:"to", parts:["twenty","nine"], answer:"It is twenty to nine."},
 {time:"09:45", mode:"to", parts:["a quarter","ten"], answer:"It is a quarter to ten."},
 {time:"10:50", mode:"to", parts:["ten","eleven"], answer:"It is ten to eleven."},
 {time:"11:55", mode:"to", parts:["five","twelve"], answer:"It is five to twelve."},
 {time:"12:00", mode:"oclock", parts:["twelve"], answer:"It is twelve o'clock."},
 {time:"12:15", mode:"past", parts:["a quarter","twelve"], answer:"It is a quarter past twelve."},
 {time:"02:45", mode:"to", parts:["a quarter","three"], answer:"It is a quarter to three."},
 {time:"03:30", mode:"half", parts:["half","three"], answer:"It is half past three."},
 {time:"04:40", mode:"to", parts:["twenty","five"], answer:"It is twenty to five."},
 {time:"06:55", mode:"to", parts:["five","seven"], answer:"It is five to seven."},
 {time:"07:15", mode:"past", parts:["a quarter","seven"], answer:"It is a quarter past seven."},
 {time:"08:30", mode:"half", parts:["half","eight"], answer:"It is half past eight."},
 {time:"11:45", mode:"to", parts:["a quarter","twelve"], answer:"It is a quarter to twelve."}
];
let state={screen:'start',name:'',index:0,score:0,time:60,timer:null,locked:false,history:[],order:[],skipAutoFocus:false};
let audioCtx=null;
function getCtx(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,dur,type='sine',gain=.12,delay=0){const ctx=getCtx();if(!ctx)return;const now=ctx.currentTime+delay;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(gain,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+dur+.04)}
function sound(type){if(type==='click')beep(520,.1,'triangle',.08);if(type==='correct'){[523,659,784,1046].forEach((f,i)=>beep(f,.18,'sine',.13,i*.06))}if(type==='wrong'){beep(210,.32,'sawtooth',.12);setTimeout(()=>beep(105,.25,'sawtooth',.09),120)}if(type==='finish'){[392,523,659,784,1046].forEach((f,i)=>beep(f,.28,'triangle',.14,i*.09))}if(type==='tick')beep(900,.035,'square',.024)}
function speak(text,slow=false){if(!('speechSynthesis' in window))return;const msg=new SpeechSynthesisUtterance(text);msg.lang='en-US';msg.rate=slow?.68:.84;speechSynthesis.cancel();speechSynthesis.speak(msg)}
function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function angles(t){const [h,m]=t.split(':').map(Number);return{hour:((h%12)*30)+(m*.5),min:m*6}}
function clockFace(time='10:10'){const a=angles(time);let nums='';for(let n=1;n<=12;n++){const deg=n*30;const r=42;const x=50+Math.sin(deg*Math.PI/180)*r;const y=50-Math.cos(deg*Math.PI/180)*r;nums+=`<div class="num" style="left:${x}%;top:${y}%">${n}</div>`}return `<div class="face" id="face">${nums}<div class="hand hour" style="--rot:${a.hour}deg;transform:rotate(${a.hour}deg)"></div><div class="hand minute" style="--rot:${a.min}deg;transform:rotate(${a.min}deg)"></div><div class="centerDot"></div></div>`}
function wordsFromAnswer(q){
 return q.answer.replace('It is ','').replace('.','').split(' ');
}
function slotClass(word){
 const clean=word.replace(/[^a-zA-Z]/g,'');
 if(clean.length<=3)return 'short';
 if(clean.length>=8)return 'long';
 return 'medium';
}
function sentenceInputs(q){
 const words=wordsFromAnswer(q);
 return `<div class="word-slots"><span class="fixed-word">It</span><span class="fixed-word">is</span>${words.map((w,i)=>`<input class="slot-word ${slotClass(w)}" id="ans${i}" autocomplete="off" inputmode="text" placeholder="${i+1}">`).join('')}<span class="dot-end">.</span></div>`;
}
function normalize(s){return (s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/-/g,' ').replace(/\s+/g,' ')}
function acceptable(input, target){
 const a=normalize(input), b=normalize(target);
 if(a===b)return true;
 if(b==='twenty-five' && (a==='twenty five' || a==='25'))return true;
 if(b==='o\'clock' && (a==='oclock' || a==='o clock'))return true;
 const nums={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',twenty:'20',half:'30'};
 if(nums[b] && a===nums[b])return true;
 return false;
}
function getInputs(){return [...document.querySelectorAll('.slot-word')].map(x=>x.value)}
function focusFirst(){if(state.skipAutoFocus)return;setTimeout(()=>{const el=document.querySelector('.slot-word');if(el)el.focus()},80)}
function render(){const app=document.getElementById('app');
 if(state.screen==='start'){
  app.innerHTML=`<div class="screen"><div class="glass"><div class="start-grid"><div><div class="badge">EP3 • Type Answer Mission 🚀</div><div class="title">Time Master<br>Galaxy</div><div class="subtitle">ดูนาฬิกา แล้วพิมพ์คำตอบเองในช่องว่าง ✍️<br>ฝึกแบบ <b>past / to / half past / o'clock</b> พร้อมระบบตรวจคำตอบอัตโนมัติ</div><div class="features"><div class="feature">⌨️ Type the missing words</div><div class="feature">⏰ 20 questions</div><div class="feature">⚡ 60 seconds each</div><div class="feature">✅ Flexible answer check</div></div><input class="name" id="playerName" placeholder="Type your name"><div class="buttons"><button class="play" onclick="startGame()">START TYPE MISSION</button><button class="secondary" onclick="demoSound()">TEST SOUND 🔊</button></div></div><div class="clock-panel"><div class="clock-content">${clockFace('03:15')}<div class="digital">03:15</div><div class="mission">It is ___ past ___.</div><div class="modeLine">Type: a quarter / three</div></div></div></div></div></div>`;
 }
 if(state.screen==='game'){
  const q=state.order[state.index];
  app.innerHTML=`<div class="screen"><div class="glass" id="gameGlass"><div class="hud"><div class="card"><div class="label">PLAYER</div><div class="value">${state.name}</div></div><div class="card"><div class="label">QUESTION</div><div class="value">${state.index+1}/${state.order.length}</div></div><div class="card"><div class="label">SCORE</div><div class="value" style="color:var(--yellow)">${state.score}</div></div><div class="card"><div class="label">TIME</div><div class="value ${state.time<=5?'timeWarn':''}">${state.time}</div></div></div><div class="arena"><div class="clock-panel" id="clockPanel"><div class="clock-content">${clockFace(q.time)}<div class="digital">${q.time}</div><div class="mission">Look at the clock and type.</div><div class="modeLine">Past / To / Half Past / O'clock ✨</div></div></div><div class="answer-panel"><div class="prompt-title">Fill in the missing words</div><div class="sentence-box">${sentenceInputs(q)}</div><div class="tip">เติมคำลงช่องสี่เหลี่ยม <b>ช่องละ 1 คำ</b> หลังคำว่า <b>It is</b></div><div id="resultLine" class="result-line"></div><div id="showAnswer" class="show-answer"></div><div class="buttons"><button class="play" id="checkBtn" onclick="checkTyped()">CHECK ANSWER ✅</button><button class="secondary" onclick="clearInputs()">CLEAR</button><button class="secondary" onclick="listenAnswer()">LISTEN 🔊</button></div></div></div></div></div>`;
  focusFirst();
 }
 if(state.screen==='summary'){kpcRenderSummary();}

}
function demoSound(){sound('correct')}
function startGame(){state.kpcSaved=false;state.kpcLatest=null;sound('click');const name=document.getElementById('playerName').value.trim()||'Guest';state={screen:'game',name,index:0,score:0,time:60,timer:null,locked:false,history:[],order:shuffle([...QUESTIONS]),skipAutoFocus:false};state.skipAutoFocus=false;render();startTimer()}
function startTimer(){clearInterval(state.timer);state.time=60;state.timer=setInterval(()=>{state.time--; if(state.time<=5)sound('tick'); if(state.time<=0){timeoutRound();return} renderKeepInputs()},1000)}
function renderKeepInputs(){
 const active=document.activeElement;
 const activeIndex=active && active.classList && active.classList.contains('slot-word') ? [...document.querySelectorAll('.slot-word')].indexOf(active) : -1;
 const vals=getInputs();
 state.skipAutoFocus=true;
 render();
 setTimeout(()=>{
  document.querySelectorAll('.slot-word').forEach((el,i)=>el.value=vals[i]||'');
  if(activeIndex>=0){
    const target=document.querySelectorAll('.slot-word')[activeIndex];
    if(target){
      target.focus();
      const len=target.value.length;
      try{target.setSelectionRange(len,len)}catch(e){}
    }
  }
  state.skipAutoFocus=false;
 },0)
}
function checkTyped(){if(state.locked)return;state.locked=true;clearInterval(state.timer);document.getElementById('checkBtn').disabled=true;const q=state.order[state.index];const vals=getInputs();let ok=true;const words=wordsFromAnswer(q);
for(let i=0;i<words.length;i++){ if(!acceptable(vals[i], words[i])) ok=false; }const typed=vals.join(' ');const result=document.getElementById('resultLine');const ansBox=document.getElementById('showAnswer');ansBox.textContent='Correct answer: '+q.answer;ansBox.classList.add('show');if(ok){state.score++;sound('correct');document.getElementById('face')?.classList.add('spinWin');result.innerHTML='✅ Correct! เก่งมากจ้า';result.className='result-line ok';speak(q.answer);confetti(35)}else{sound('wrong');document.getElementById('clockPanel')?.classList.add('shake');result.innerHTML='❌ Not yet. ดูเฉลยแล้วไปข้อต่อไปนะ';result.className='result-line bad';speak(q.answer,true)}state.history.push({time:q.time,answer:q.answer,typed,ok});setTimeout(nextQuestion,ok?2200:2600)}
function timeoutRound(){if(state.locked)return;state.locked=true;clearInterval(state.timer);const q=state.order[state.index];const vals=getInputs();sound('wrong');const result=document.getElementById('resultLine');const ansBox=document.getElementById('showAnswer');if(result){result.innerHTML='⏳ Time out!';result.className='result-line bad'}if(ansBox){ansBox.textContent='Correct answer: '+q.answer;ansBox.classList.add('show')}speak(q.answer,true);state.history.push({time:q.time,answer:q.answer,typed:vals.join(' ')||'No answer',ok:false});setTimeout(nextQuestion,2600)}
function nextQuestion(){state.index++;state.locked=false;if(state.index>=state.order.length){state.screen='summary';sound('finish');render();return}state.skipAutoFocus=false;render();startTimer()}
function clearInputs(){sound('click');document.querySelectorAll('.slot-word').forEach(x=>x.value='');state.skipAutoFocus=false;focusFirst()}
function listenAnswer(){const q=state.order[state.index];speak(q.answer,true)}
function restart(){clearInterval(state.timer);state.skipAutoFocus=false;state.screen='start';render()}
function confetti(count=80){const layer=document.createElement('div');layer.className='confetti';for(let i=0;i<count;i++){const e=document.createElement('div');e.className='piece';e.style.left=Math.random()*100+'%';e.style.animationDelay=(Math.random()*0.45)+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;layer.appendChild(e)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),2100)}
document.addEventListener('keydown',e=>{if(e.key==='Enter' && state.screen==='game' && !state.locked)checkTyped()});
render();

const KPC_RESULT_KEY='kpc_time_type_ep4_v1';
const KPC_RESULT_TITLE='TIME MASTER GALAXY • TYPE';
let kpcSelectedRound=-1,kpcSelectedQuestion=0;
function kpcEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kpcTotal(){return (state.order&&state.order.length)||QUESTIONS.length}
function kpcGetAll(){
 try{const x=JSON.parse(localStorage.getItem(KPC_RESULT_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}
}
function kpcSaveCurrent(){
 if(state.kpcSaved)return;
 const item={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:state.name||'Guest',
 date:new Date().toISOString(),score:state.score,total:kpcTotal(),
 history:(state.history||[]).map(h=>({time:h.time,ok:!!h.ok,answer:h.answer,choice:h.choice,typed:h.typed}))};
 const all=kpcGetAll();all.push(item);
 try{localStorage.setItem(KPC_RESULT_KEY,JSON.stringify(all));state.kpcSaved=true;state.kpcLatest=item}catch(e){console.warn('KPC local save failed',e);state.kpcLatest=item;state.kpcSaved=true}
}
function kpcRounds(){
 const all=kpcGetAll().filter(r=>r.name===(state.name||'Guest'));
 if(state.kpcLatest&&!all.some(x=>x.id===state.kpcLatest.id))all.push(state.kpcLatest);
 return all;
}
function kpcDate(v){return new Date(v).toLocaleString('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' น.'}
function kpcChart(rounds){
 const last=rounds.slice(-10),pts=last.map((r,i)=>({x:last.length===1?50:9+i*82/(last.length-1),y:89-75*(r.score/r.total),pct:Math.round(r.score/r.total*100),n:rounds.length-last.length+i+1}));
 return `<svg class="kpc-chart" viewBox="0 0 100 110" preserveAspectRatio="none" aria-label="กราฟเส้นคะแนนย้อนหลัง" role="img">
 ${[0,25,50,75,100].map(v=>`<line x1="8" x2="94" y1="${89-v*.75}" y2="${89-v*.75}" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="2 2" stroke-width=".4"/><text x="1" y="${91-v*.75}" font-size="4" fill="white">${v}</text>`).join('')}
 ${pts.length>1?`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#6ff2ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`:''}
 ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="#ffe96a"/><text x="${p.x}" y="${Math.max(7,p.y-5)}" text-anchor="middle" fill="#ffe96a" font-size="4.5">${p.pct}%</text><text x="${p.x}" y="103" text-anchor="middle" fill="white" font-size="4">#${p.n}</text>`).join('')}
 </svg>`;
}
function kpcRenderSummary(){
 kpcSaveCurrent();const rounds=kpcRounds(),last=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(last.score/last.total*100);
 const best=Math.max(...rounds.map(r=>Math.round(r.score/r.total*100)));
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">นักเรียน: ${kpcEsc(last.name)}<br>📅 ${kpcDate(last.date)}</div>
 <div class="kpc-score">${last.score} / ${last.total} คะแนน</div>
 <div class="kpc-stats"><div class="kpc-stat"><strong>${pct}%</strong><span>คะแนนล่าสุด</span></div><div class="kpc-stat"><strong>${rounds.length}</strong><span>ครั้งที่เล่น</span></div><div class="kpc-stat"><strong>${best}%</strong><span>คะแนนสูงสุด</span></div></div>
 <div class="kpc-box"><h3>📈 กราฟพัฒนาการ</h3>${kpcChart(rounds)}</div>
 <div class="kpc-box"><h3>📚 ประวัติคะแนน (แตะรอบเพื่อดูคำตอบ)</h3><div class="kpc-rounds">${rounds.map((r,i)=>`<button class="kpc-round" onclick="kpcShowRound(${i})">รอบ ${i+1} • ${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</button>`).join('')}</div></div>
 <div class="kpc-meta">${pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%'}</div>
 <div class="kpc-actions"><button class="secondary" onclick="kpcShare()">📸 แชร์ภาพรายงาน</button><button class="secondary" onclick="kpcShowRound(${rounds.length-1})">🔎 ดูเฉลยรายข้อ</button><button class="play" onclick="restart()">🚀 เล่นอีกครั้ง</button></div>
 <div class="kpc-meta" style="font-size:.82rem">บันทึกประวัติในเบราว์เซอร์นี้ • แชร์เฉพาะคะแนน ไม่รวมเฉลย</div>
 </div></div></div>`;
}
function kpcShowRound(n){
 const rounds=kpcRounds();kpcSelectedRound=Math.max(0,Math.min(n,rounds.length-1));kpcSelectedQuestion=0;kpcRenderReview();
}
function kpcShowQuestion(n){kpcSelectedQuestion=n;kpcRenderReview()}
function kpcRenderReview(){
 const rounds=kpcRounds(),r=rounds[kpcSelectedRound],history=r.history||[],h=history[kpcSelectedQuestion];
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">ตรวจคำตอบ • ${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">${kpcEsc(r.name)} • รอบ ${kpcSelectedRound+1} • ${kpcDate(r.date)} • ${r.score}/${r.total}</div>
 <div class="kpc-box"><h3>เลือกข้อที่ต้องการดู</h3><div class="kpc-qnav">${history.map((x,i)=>`<button class="${i===kpcSelectedQuestion?'play':'secondary'}" onclick="kpcShowQuestion(${i})">${i+1}</button>`).join('')}</div>
 <div class="kpc-qdetail">${h?`<b>ข้อ ${kpcSelectedQuestion+1} • ${kpcEsc(h.time||'')}</b><br>${h.ok?'✅ ถูกต้อง':'❌ ไม่ถูกต้อง'}<br>คำตอบของนักเรียน: ${kpcEsc(h.choice??h.typed??'ไม่ได้ตอบ')}<br><b>เฉลย: ${kpcEsc(h.answer||'')}</b>`:'ไม่มีข้อมูลรายข้อในรอบนี้'}</div></div>
 <div class="kpc-actions"><button class="play" onclick="kpcRenderSummary()">⬅ กลับหน้าสรุป</button></div></div></div></div>`;
}
function kpcCanvas(){
 const rounds=kpcRounds(),r=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(r.score/r.total*100),best=Math.max(...rounds.map(x=>Math.round(x.score/x.total*100)));
 const c=document.createElement('canvas');c.width=1080;c.height=1480;const g=c.getContext('2d');
 const grad=g.createLinearGradient(0,0,1080,1480);grad.addColorStop(0,'#153e87');grad.addColorStop(1,'#07112f');g.fillStyle=grad;g.fillRect(0,0,1080,1480);
 const rr=(x,y,w,h,r,fill)=>{g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
 const t=(v,x,y,size=30,color='white',align='center')=>{g.fillStyle=color;g.textAlign=align;g.font=`bold ${size}px Arial, sans-serif`;g.fillText(String(v),x,y)};
 rr(48,45,984,1380,32,'rgba(255,255,255,.09)');
 t('KRU PAI CLASSROOM',540,138,52,'#ffe96a');t('LEARNING ACHIEVEMENT REPORT',540,188,26,'#baf5ff');
 t(KPC_RESULT_TITLE,540,278,35);t('นักเรียน: '+r.name,540,350,33);t(kpcDate(r.date),540,405,28,'#d0edff');
 rr(290,465,500,125,40,'#ffe96a');t(`${r.score} / ${r.total} คะแนน`,540,547,58,'#1c2550');
 [{v:pct+'%',l:'คะแนนล่าสุด'},{v:rounds.length,l:'จำนวนรอบ'},{v:best+'%',l:'คะแนนสูงสุด'}].forEach((x,i)=>{let px=85+i*305;rr(px,645,290,145,20,'rgba(255,255,255,.13)');t(x.v,px+145,710,48,'#ffe96a');t(x.l,px+145,755,25)});
 rr(85,825,910,390,24,'rgba(0,0,0,.22)');t('กราฟพัฒนาการ',125,878,34,'#ffe96a','left');
 const last=rounds.slice(-10),left=170,right=945,top=928,bottom=1110;
 [0,25,50,75,100].forEach(v=>{let y=bottom-v/100*(bottom-top);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;g.beginPath();g.moveTo(left,y);g.lineTo(right,y);g.stroke();t(v+'%',left-18,y+7,20,'#d0edff','right')});
 const pts=last.map((x,i)=>({x:last.length===1?(left+right)/2:left+i*(right-left)/(last.length-1),y:bottom-(x.score/x.total)*(bottom-top),pct:Math.round(x.score/x.total*100),n:rounds.length-last.length+i+1}));
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle='#6ff2ff';g.lineWidth=6;g.stroke();
 pts.forEach(p=>{g.beginPath();g.arc(p.x,p.y,8,0,Math.PI*2);g.fillStyle='#ffe96a';g.fill();t(p.pct+'%',p.x,Math.max(920,p.y-20),20,'#ffe96a');t('#'+p.n,p.x,1160,19)});
 rr(85,1250,910,95,20,'rgba(255,255,255,.12)');t(pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%',540,1307,30,'#ffe96a');
 return c;
}
async function kpcShare(){
 try{
 const c=kpcCanvas(),blob=await new Promise(ok=>c.toBlob(ok,'image/png'));if(!blob)throw Error('PNG export failed');
 const filename=KPC_RESULT_KEY+'.png',file=new File([blob],filename,{type:'image/png'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Kru Pai Classroom'});return}catch(e){if(e.name==='AbortError')return}
 }
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
 alert('บันทึกภาพรายงานแล้ว สามารถส่งผ่าน LINE ได้จ้า');
 }catch(e){console.error(e);alert('ไม่สามารถแชร์ภาพได้ กรุณาลองอีกครั้ง')}
}
</script>
</body>
