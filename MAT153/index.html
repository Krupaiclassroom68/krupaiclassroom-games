const $=id=>document.getElementById(id);

function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function simp(f){let g=gcd(f[0],f[1]);return [f[0]/g,f[1]/g]}
function same(a,b){return a[0]*b[1]===a[1]*b[0]}
function frac(f){return `<span class="frac"><span class="num">${f[0]}</span><span class="den">${f[1]}</span></span>`}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sound(kind){if(state.muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;let notes=kind==='win'?[660,880,1047]:kind==='lose'?[320,220]:[510];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.1);g.gain.exponentialRampToValueAtTime(.13,t+i*.1+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.17);o.connect(g);g.connect(audio.destination);o.start(t+i*.1);o.stop(t+i*.1+.18)})}catch(e){}}
function burst(){let fx=$('fx');if(!fx)return;fx.innerHTML='';for(let i=0;i<50;i++){let p=document.createElement('span');p.className='particle';p.style.background=['#ffdf65','#ff64b6','#65f0ff','#a4ffaf','#fff'][i%5];p.style.left=(30+Math.random()*40)+'%';p.style.top=(35+Math.random()*30)+'%';p.style.setProperty('--dx',(Math.random()*2-1)*600+'px');p.style.setProperty('--dy',(Math.random()*2-1)*500+'px');p.style.setProperty('--r',(Math.random()*700)+'deg');fx.appendChild(p)}for(let i=0;i<5;i++){let e=document.createElement('span');e.className='emojiFly';e.textContent=['🎈','⭐','🎉','💖','✨'][i];e.style.left=(15+i*17)+'%';e.style.top=(50+Math.random()*15)+'%';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}setTimeout(()=>fx.innerHTML='',1200)}
function header(){return `<div class="top"><div class="logo">🎈 KRU PAI CLASSROOM <span style="color:#ffe17c">/ SIMPLEST FRACTION</span></div><button class="chip" onclick="toggleSound()">${state.muted?'🔇':'🔊'}</button></div>`}
function render(){let b='';if(state.page==='home')b=`<section class="panel"><div class="hero">🎈✨🎈</div><div class="sub">FRACTION ACADEMY • BALLOON LAB</div><h1 class="big">SIMPLEST<br><span style="color:#ffe17c">FRACTION BATTLE!</span></h1><p class="sub">พิชิตเศษส่วนอย่างต่ำ • 4 ภารกิจ 20 ข้อ</p><p>✍️ เติมคำตอบ • 🎯 เลือกตอบ • 🎈 เลือก 3–4 จาก 7 • 🔎 ค้นหาเศษส่วนเดิม</p><input id="student" class="name" maxlength="40" placeholder="ชื่อนักเรียน" value="${escapeHtml(state.name)}"><div class="nav"><button class="btn" onclick="goLesson()">📚 ทบทวนก่อนเล่น</button><button class="btn secondary" onclick="start()">🚀 เริ่มประลอง</button></div></section>`;
else if(state.page==='lesson')b=`<section class="panel"><div class="sub">📚 ทบทวนก่อนประลอง</div><h1 class="big">เศษส่วนอย่างต่ำ</h1><p class="prompt">เศษส่วนอย่างต่ำ คือ เศษส่วนที่ตัวเศษและตัวส่วนไม่มีตัวหารร่วมมากกว่า 1</p><div class="lessonGrid"><div class="lessonCard"><strong>1. หารทั้งเศษและส่วน</strong><div class="math" style="font-size:30px;text-align:center">${frac([12,18])} = ${frac([2,3])}</div>ห.ร.ม. ของ 12 กับ 18 คือ 6 จึงหารทั้งสองจำนวนด้วย 6</div><div class="lessonCard"><strong>2. อย่าหารแค่ด้านเดียว</strong><div class="math" style="font-size:30px;text-align:center">${frac([15,25])} = ${frac([3,5])}</div>หารตัวเศษและตัวส่วนด้วย 5 พร้อมกัน จึงยังมีค่าเท่าเดิม</div><div class="lessonCard"><strong>3. หาคำตอบได้หลายรูป</strong><div class="math" style="font-size:30px;text-align:center">${frac([4,6])} = ${frac([6,9])} = ${frac([2,3])}</div>เศษส่วนต่างรูปสามารถมีค่าเท่ากันได้ แม้บางรูปยังไม่เป็นอย่างต่ำ</div><div class="lessonCard"><strong>4. โจทย์ย้อนกลับ</strong><div class="math" style="font-size:30px;text-align:center">${frac([3,4])} = ${frac([9,12])}</div>คูณเศษและส่วนด้วยจำนวนเดียวกัน เช่น ×3 เพื่อหาเศษส่วนก่อนลดรูป</div></div><p class="tip">🎈 ด่านลูกโป่งต้องเลือกให้ครบตามจำนวนที่กำหนดก่อนกดตรวจ • ไม่จับเวลา คิดให้รอบคอบได้เต็มที่</p><div class="nav"><button class="btn" onclick="start()">🚀 เริ่ม 20 ข้อ</button><button class="btn secondary" onclick="goHome()">⌂ หน้าปก</button></div></section>`;
else if(state.page==='game')b=gameHtml();
else if(state.page==='result')b=resultHtml();
$('app').innerHTML=header()+b+'<div class="footer">Kru Pai Classroom • Simplest Fraction Balloon Battle • 20 Questions</div>';
}
function gameHtml(){let q=Q[state.index],d=state.drafts[state.index]||{},answered=state.answers[state.index];let target=q.target;let prompt=q.type==='input'?`ทำเศษส่วน ${frac(target)} ให้เป็นอย่างต่ำ แล้วเติมตัวเศษและตัวส่วน`:q.type==='choice'?`เศษส่วนอย่างต่ำของ ${frac(target)} คือข้อใด?`:q.type==='multi'?`เลือกเศษส่วนที่มีค่าเท่ากับ ${frac(target)} ให้ครบ <span class="tip">${q.correct.length} ลูกโป่ง</span>`:`เศษส่วนอย่างต่ำคือ ${frac(target)} จงเลือกเศษส่วนก่อนทำให้อย่างต่ำ`;

else if(q.type==='multi'){content=`<p class="multiCount">เลือกแล้ว ${(d.sel||[]).length} / ${q.correct.length} ลูกโป่ง</p><div class="balloons">${q.options.map((f,i)=>`<button class="balloon mini ${((d.sel||[]).includes(i))?'active':''}" onclick="toggleMulti(${i})" aria-pressed="${(d.sel||[]).includes(i)}">${frac(f)}</button>`).join('')}</div>`}
else{content=`<div class="choiceGrid">${q.options.map((f,i)=>`<button class="choiceBtn ${d.sel===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span>${frac(f)}</button>`).join('')}</div>`}
let explanation=answered?`<div class="answerExplanation"><strong>${answered.correct?'🎉 ถูกต้อง!':'💡 ยังไม่ถูกนะจ๊ะ'}</strong><div>${explain(q)}</div><div>คำตอบที่เลือก: ${escapeHtml(answerLabel(q,answered.value))}</div></div>`:'';
return `<section class="panel gamePanel"><div class="row"><span class="chip">${labels[q.type]}</span><span class="chip">ข้อ ${state.index+1} / 20</span><span class="chip">⭐ ${state.answers.filter(x=>x?.correct).length} คะแนน</span></div><div class="progress"><div style="width:${(state.index+1)/20*100}%"></div></div><h2 class="prompt">${prompt}</h2>${content}${explanation}<div class="nav"><button class="btn secondary" onclick="move(-1)" ${state.index===0?'disabled':''}>← ย้อนกลับ</button>${answered?`<button class="btn" onclick="move(1)">${state.index===19?'🏆 สรุปคะแนน':'ข้อต่อไป →'}</button>`:`<button class="btn" onclick="check()" ${!ready(q,d)?'disabled':''}>🎯 ตรวจคำตอบ</button>`}<button class="btn secondary" onclick="move(1)" ${state.index===19?'disabled':''}>ข้ามข้อ →</button></div><p class="note">ตอบแล้วไม่เปลี่ยนคะแนนย้อนหลัง • ข้ามข้อแล้วกลับมาทำได้ • ไม่สุ่มลำดับโจทย์และตัวเลือก</p></section>`}
function ready(q,d){if(q.type==='input')return Number(d.n)>0&&Number(d.d)>0;if(q.type==='multi')return (d.sel||[]).length===q.correct.length;return Number.isInteger(d.sel)}
function explain(q){let t=q.target,ans=simp(t),g=gcd(t[0],t[1]);if(q.type==='input'||q.type==='choice')return `${frac(t)} ÷ ห.ร.ม. ${g} = ${frac(ans)} ดังนั้นคำตอบอย่างต่ำคือ ${frac(ans)}`;if(q.type==='multi')return `ลูกโป่งที่ถูกต้องคือ ${q.correct.map(i=>frac(q.options[i])).join(' , ')} ซึ่งทุกลูกมีค่าเท่ากับ ${frac(t)}`;return `คำตอบคือ ${frac(q.options[q.correct])} เพราะเมื่อลดรูปจะได้ ${frac(t)} และเศษส่วนเดิมยังไม่เป็นอย่างต่ำ`}
function answerLabel(q,v){if(v==null)return 'ยังไม่ตอบ';if(q.type==='input')return `${v.n}/${v.d}`;if(q.type==='multi')return v.map(i=>`${q.options[i][0]}/${q.options[i][1]}`).join(', ');return `${'ABCD'[v+0]}: ${q.options[v][0]}/${q.options[v][1]}`}
function check(){let q=Q[state.index],d=state.drafts[state.index]||{};if(!ready(q,d)||state.answers[state.index])return;let v,correct=false;if(q.type==='input'){v={n:Number(d.n),d:Number(d.d)};let ans=simp(q.target);correct=v.n===ans[0]&&v.d===ans[1]}else if(q.type==='multi'){v=[...d.sel];correct=v.length===q.correct.length&&v.every(i=>q.correct.includes(i))}else{v=d.sel;correct=v===q.correct}state.answers[state.index]={correct,value:v};save();sound(correct?'win':'lose');render();if(correct)burst()}
function setInput(k,v){let d=state.drafts[state.index]||{};d[k]=v;state.drafts[state.index]=d;let b=document.querySelector('.nav .btn:not(.secondary)');if(b)b.disabled=!ready(Q[state.index],d);save()}
function choose(i){if(state.answers[state.index])return;state.drafts[state.index]={sel:i};sound('click');save();render()}
function toggleMulti(i){if(state.answers[state.index])return;let d=state.drafts[state.index]||{sel:[]};let s=d.sel||[];if(s.includes(i))s=s.filter(x=>x!==i);else if(s.length<Q[state.index].correct.length)s=[...s,i];d.sel=s;state.drafts[state.index]=d;sound('click');save();render()}
function move(n){if(n===1&&state.index===19){state.page='result';render();return}state.index=Math.max(0,Math.min(19,state.index+n));state.page='game';save();render()}
function resultHtml(){let count=state.answers.filter(x=>x?.correct).length,pct=Math.round(count/20*100);return `<section class="panel"><div class="hero">${pct>=80?'🏆🎈🎉':'📚🎈✨'}</div><h1 class="big">MISSION COMPLETE!</h1><p class="sub">${escapeHtml(state.name||'นักเรียน')} • ${new Date().toLocaleString('th-TH')}</p><div class="score">${count} / 20</div><p class="sub">${pct}% • ${pct>=90?'ดีเยี่ยม!':pct>=80?'ดีมาก!':pct>=70?'น่าพอใจ ควรฝึกซ้ำ':'ฝึกเพิ่มอีกนิด เก่งขึ้นได้แน่นอน'}</p><div class="nav"><button class="btn" onclick="state.review=!state.review;render()">📋 ${state.review?'ซ่อน':'ดู'}เฉลยทุกข้อ</button><button class="btn secondary" onclick="restart()">🔄 เริ่มครั้งใหม่</button></div>${state.review?`<div class="resultList">${Q.map((q,i)=>`<div class="resultItem">${i+1}. ${labels[q.type]} ${frac(q.target)} — ${state.answers[i]?(state.answers[i].correct?'✅':'❌'):'⚪ ยังไม่ตอบ'}<div>${explain(q)}</div></div>`).join('')}</div>`:''}</section>`}
function goHome(){state.page='home';render()}
function goLesson(){state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.page='lesson';sound('click');render()}
function start(){state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.index=0;state.page='game';state.answers=Array(20).fill(null);state.drafts={};state.review=false;save();sound('win');render()}
function restart(){state.page='home';state.index=0;state.answers=Array(20).fill(null);state.drafts={};state.review=false;save();render()}
function toggleSound(){state.muted=!state.muted;render()}
function save(){try{localStorage.setItem(GAME_ID+'-'+state.name,JSON.stringify({index:state.index,answers:state.answers,drafts:state.drafts,name:state.name}))}catch(e){}}
render();
</script></body></html>
