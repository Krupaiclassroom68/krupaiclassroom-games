<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KPC EARTH MOTION LAB — UNIT 03</title><style>
:root{--bg:#071329;--panel:#112447;--line:#31578a;--cyan:#58e3ff;--gold:#ffd66b;--white:#f6fbff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 12%,#1a3971,#071329 55%);color:var(--white);font-family:system-ui,'Noto Sans Thai',Tahoma,sans-serif;font-size:clamp(19px,2.1vw,30px)}body:before{content:'✦  ·  ✧      ·     ✦       ·       ✧';position:fixed;top:10px;right:5%;opacity:.3;pointer-events:none}.app{max-width:1480px;margin:auto;padding:clamp(14px,3vw,36px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(17px,2vw,26px);font-weight:900;color:var(--cyan)}.pill{background:#173a60;border:1px solid #4b80ae;padding:8px 16px;border-radius:50px;font-size:.7em}h1{font-size:clamp(35px,5vw,76px);line-height:1.13;margin:14px 0;color:#fff}h2{font-size:clamp(28px,3.5vw,49px);color:var(--gold);margin:0 0 18px}h3{font-size:1.12em;color:var(--cyan)}p,li{line-height:1.6}strong{color:var(--gold)}.panel{background:linear-gradient(135deg,#142c54e8,#0a1b36f5);border:2px solid var(--line);border-radius:25px;padding:clamp(18px,3vw,36px);box-shadow:0 18px 45px #0005}.screen{display:none;min-height:65vh}.screen.active{display:block}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center}.planet{width:min(100%,330px);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle at 27% 26%,#9ef8ff,#168dc9 27%,#075ba2 50%,#03264f 72%);box-shadow:0 0 65px #26a5ff80,inset -35px -20px 45px #00102d;position:relative;overflow:hidden}.planet:after{content:'🌎';position:absolute;font-size:clamp(150px,18vw,260px);inset:0;display:grid;place-items:center;opacity:.85}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.btn{border:2px solid #5cb5f4;background:#174e8c;color:#fff;padding:13px 24px;border-radius:15px;font:800 .85em system-ui;cursor:pointer;min-height:55px}.btn:hover,.btn:focus{background:#2371bb}.btn.primary{background:linear-gradient(110deg,#19b8d7,#2464d9)}.btn.gold{background:#aa6c14;border-color:#ffd66b}.btn:disabled{opacity:.4;cursor:default}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{background:#102c52;border:1px solid #3d74a4;border-radius:18px;padding:18px}.small{font-size:.76em;color:#b9d8f2}.tag{display:inline-block;border-radius:50px;padding:7px 16px;background:#23456d;color:#aaf2ff;font-size:.72em}.diagram{background:#06152d;border:2px solid #284e81;border-radius:20px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}.diagram svg{max-width:100%;height:auto}.sun{filter:drop-shadow(0 0 18px #ffd55a)}.orbit{stroke:#4c85c3;stroke-width:2;fill:none;stroke-dasharray:8 7}.earth{filter:drop-shadow(0 0 8px #44cfff)}.day{fill:#1a9bd4}.night{fill:#09254b}.control{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:15px 0}.control input{width:min(400px,90%);accent-color:#53ddff}.answer{display:block;width:100%;text-align:left;margin:10px 0;padding:16px 20px;border:2px solid #3d70a5;border-radius:16px;background:#122d55;color:#fff;font:inherit;cursor:pointer}.answer.selected{border-color:var(--gold);background:#36537a}.feedback{margin:14px 0;padding:16px;border-radius:15px;background:#143d58;border:1px solid #4fb5d0}.progress{height:12px;background:#142b4b;border-radius:10px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#4bdeff,#f6ca62);transition:width .25s}.note{border-left:5px solid var(--gold);padding:12px 20px;background:#24344d;border-radius:10px}.center{text-align:center}.hide{display:none!important}@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.screen{min-height:65vh}.planet{max-width:240px}.app{padding:12px}.btn{flex:1;padding:12px}.diagram{min-height:230px}}@media(prefers-reduced-motion:no-preference){.planet{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}}</style></head><body><main class="app"><header><span class="brand">🚀 KRU PAI CLASSROOM · ASTRONOMY ACADEMY</span><span class="pill" id="count">UNIT 03 · LESSON</span></header><div class="progress"><div id="bar" style="width:0%"></div></div><section class="screen active" id="cover"><div class="panel hero"><div><span class="tag">🌍 UNIT 03 · EARTH MOTION LAB</span><h1>โลกหมุนอย่างไร<br><span style="color:var(--cyan)">ทำไมจึงมีกลางวัน กลางคืน และฤดูกาล?</span></h1><p>เรียนรู้ผ่านภาพจำลองที่ปรับได้ด้วยตัวเอง พร้อมคำถามทบทวนและเฉลยทันที</p><div class="buttons"><button class="btn primary" onclick="go(1)">🚀 เริ่มเรียนเลย</button></div><p class="small">ป.4–ป.6 · เตรียมสอบเข้า ม.1 · บทเรียน 8 หน้า + Mini Quiz 5 ข้อ</p></div><div class="planet" aria-label="ภาพประกอบโลก"></div></div></section><section class="screen" id="lesson"><div class="panel"><span class="tag" id="lessonTag"></span><h2 id="lessonTitle"></h2><div id="lessonContent"></div><div class="nav"><button class="btn" onclick="prev()">← ย้อนกลับ</button><button class="btn primary" id="nextBtn" onclick="next()">หน้าถัดไป →</button></div></div></section><section class="screen" id="quiz"><div class="panel"><span class="tag" id="quizNum"></span><h2 id="quizQuestion"></h2><div id="options"></div><div id="feedback" class="feedback hide"></div><div class="nav"><button class="btn" onclick="quizBack()">← ย้อนกลับ</button><button class="btn primary" id="quizNext" onclick="quizForward()">ข้อต่อไป →</button></div></div></section><section class="screen" id="result"><div class="panel center"><div style="font-size:3em">🏆🌍</div><h1>MISSION COMPLETE!</h1><h2 id="score"></h2><p id="scoreMessage"></p><div id="review" style="text-align:left"></div><div class="buttons" style="justify-content:center"><button class="btn gold" onclick="restartQuiz()">🔁 ทดสอบอีกครั้ง</button><button class="btn" onclick="go(1)">📘 ทบทวนบทเรียน</button><button class="btn" onclick="home()">🏠 หน้าแรก</button></div></div></section></main><script>
const lessons=[
{title:'โลกเคลื่อนที่ 2 แบบ',body:`<div class="grid"><div class="tile"><h3>🔄 1. หมุนรอบตัวเอง (Rotation)</h3><p>โลกหมุนรอบแกนของตนเอง ใช้เวลาประมาณ <strong>24 ชั่วโมง</strong> ทำให้เกิดกลางวัน–กลางคืน</p></div><div class="tile"><h3>☀️ 2. โคจรรอบดวงอาทิตย์ (Revolution)</h3><p>โลกโคจรรอบดวงอาทิตย์ ใช้เวลาประมาณ <strong>365 วัน 6 ชั่วโมง</strong> หรือประมาณ 1 ปี</p></div></div><p class="note">จำให้แม่น: หมุนรอบตัวเอง = วัน / โคจรรอบดวงอาทิตย์ = ปี</p>`},
{title:'ทิศการหมุนของโลก',body:`<p>โลกหมุนรอบตัวเองจาก <strong>ทิศตะวันตกไปทิศตะวันออก</strong> เมื่อมองจากเหนือขั้วโลกเหนือจะเห็นหมุน <strong>ทวนเข็มนาฬิกา ↺</strong></p><div class="diagram"><svg viewBox="0 0 760 300" role="img" aria-label="โลกหมุนจากตะวันตกไปตะวันออก"><defs><linearGradient id="earthfill"><stop stop-color="#0b4678"/><stop offset=".7" stop-color="#27b8e2"/><stop offset="1" stop-color="#8ce5ec"/></linearGradient></defs><circle cx="370" cy="148" r="105" fill="url(#earthfill)"/><path d="M322 84 Q385 45 413 95 L395 139 433 181 385 220 347 187 319 151Z" fill="#40c58a" opacity=".8"/><path d="M222 145 A145 145 0 1 1 520 145" stroke="#ffd66b" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M502 123 L520 146 541 120" stroke="#ffd66b" stroke-width="8" fill="none"/><text x="100" y="270" fill="white" font-size="25">ตะวันตก</text><text x="570" y="270" fill="white" font-size="25">ตะวันออก</text><text x="350" y="285" fill="#b9d8f2" font-size="20">↺ มองจากเหนือขั้วโลกเหนือ</text></svg></div><p class="note">อย่าสับสน: ดวงอาทิตย์ดูเหมือนเคลื่อนจากตะวันออกไปตะวันตก เพราะโลกหมุนสวนทางกับการเคลื่อนที่ปรากฏนั้น</p>`},
{title:'กลางวัน–กลางคืน เกิดได้อย่างไร?',body:`<p>โลกได้รับแสงจากดวงอาทิตย์เพียงด้านหนึ่งในแต่ละขณะ <strong>ด้านรับแสงเป็นกลางวัน</strong> ส่วนด้านตรงข้ามเป็นกลางคืน</p><div class="diagram"><svg viewBox="0 0 800 340" role="img" aria-label="แสงอาทิตย์ส่องโลก ด้านสว่างและด้านมืด"><circle class="sun" cx="115" cy="160" r="65" fill="#ffcc4e"/><g stroke="#ffdf78" stroke-width="5" marker-end="url(#arr)"><path d="M210 105 H460"/><path d="M210 165 H460"/><path d="M210 225 H460"/></g><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#ffdf78"/></marker></defs><circle cx="570" cy="165" r="103" fill="#09254b"/><path d="M570 62 A103 103 0 0 0 570 268 Z" fill="#1a9bd4"/><path d="M540 88 l-20 35 29 24 -13 31 22 23 -13 37" stroke="#61cf89" stroke-width="18" fill="none"/><text x="480" y="305" font-size="24" fill="#fff">กลางวัน</text><text x="606" y="305" font-size="24" fill="#fff">กลางคืน</text></svg></div><p class="small">ภาพจำลองไม่แสดงขนาดหรือระยะห่างตามมาตราส่วน</p>`},
{title:'ทำไมดวงอาทิตย์ขึ้นทางตะวันออก?',body:`<div class="grid"><div class="tile"><h3>🌅 เช้า</h3><p>โดยทั่วไปเราเห็นดวงอาทิตย์ขึ้นทาง <strong>ด้านตะวันออก</strong></p></div><div class="tile"><h3>🌇 เย็น</h3><p>โดยทั่วไปเราเห็นดวงอาทิตย์ตกทาง <strong>ด้านตะวันตก</strong></p></div></div><p>เป็น <strong>การเคลื่อนที่ปรากฏ</strong> ของดวงอาทิตย์ ไม่ใช่ดวงอาทิตย์โคจรรอบโลกทุกวัน</p><p class="note">ข้อสอบวิเคราะห์: หากโลกหมุนจากตะวันตกไปตะวันออก เราจะเห็นดวงอาทิตย์เคลื่อนที่ปรากฏไปทางทิศใด? → ตะวันตก</p><p class="small">ตำแหน่งขึ้น–ตกจริงอาจเบี่ยงไปทางเหนือหรือใต้ของทิศตะวันออก–ตะวันตกตามฤดูกาลและละติจูด</p>`},
{title:'แกนโลกเอียง 23.5°',body:`<p>แกนหมุนของโลกเอียงประมาณ <strong>23.5° จากแนวตั้งฉากกับระนาบวงโคจร</strong> หรือเท่ากับ 66.5° จากระนาบวงโคจร</p><div class="diagram"><svg viewBox="0 0 760 330" role="img" aria-label="แกนโลกเอียง 23.5 องศา"><line x1="110" y1="280" x2="640" y2="280" stroke="#7da5c7" stroke-width="3"/><circle cx="380" cy="170" r="102" fill="#148ec8"/><path d="M320 103 q40 -40 84 0 l-5 52 30 40 -55 45 -48 -40Z" fill="#42bf8e"/><line x1="380" y1="35" x2="380" y2="300" stroke="#fff" stroke-width="3" stroke-dasharray="8 8"/><line x1="435" y1="45" x2="325" y2="295" stroke="#ffd66b" stroke-width="7"/><path d="M380 65 Q398 70 418 87" stroke="#ffd66b" stroke-width="4" fill="none"/><text x="442" y="83" fill="#ffd66b" font-size="30">23.5°</text><text x="470" y="300" fill="#b9d8f2" font-size="21">ระนาบวงโคจร</text></svg></div><p class="note">แกนโลกยังคงชี้เกือบไปทางเดิมในอวกาศขณะโลกโคจรรอบดวงอาทิตย์ จึงทำให้แต่ละซีกโลกได้รับแสงต่างกันตามช่วงปี</p>`},
{title:'ฤดูกาลเกิดจากอะไร?',body:`<p><strong>ฤดูกาลเกิดจากแกนโลกเอียงร่วมกับการโคจรรอบดวงอาทิตย์</strong> ไม่ใช่เพราะโลกอยู่ใกล้หรือไกลดวงอาทิตย์เป็นหลัก</p><div class="grid"><div class="tile"><h3>☀️ ซีกโลกเหนือเอียงเข้าหาดวงอาทิตย์</h3><p>ได้รับแสงค่อนข้างตรงกว่า กลางวันยาวขึ้น → ฤดูร้อนของซีกโลกเหนือ</p></div><div class="tile"><h3>❄️ ซีกโลกเหนือเอียงออกจากดวงอาทิตย์</h3><p>ได้รับแสงเฉียงกว่า กลางวันสั้นลง → ฤดูหนาวของซีกโลกเหนือ</p></div></div><p>เมื่อซีกโลกเหนือเป็นฤดูร้อน ซีกโลกใต้จะเป็นฤดูหนาว และกลับกัน</p><p class="note">ประเทศไทยอยู่เขตร้อน มีฤดูที่มักแบ่งเป็นร้อน ฝน หนาว โดยได้รับอิทธิพลสำคัญจากลมมรสุมด้วย</p>`},
{title:'ทดลองจำลองฤดูกาล',body:`<p>เลื่อนแถบเพื่อดูตำแหน่งโลกในช่วงต่าง ๆ ของปี และสังเกตว่าซีกโลกเหนือมีฤดูอะไร</p><div class="diagram"><svg viewBox="0 0 760 350" role="img" aria-label="ภาพจำลองวงโคจรของโลกและแกนโลก"><ellipse cx="375" cy="172" rx="285" ry="118" class="orbit"/><circle cx="375" cy="172" r="51" fill="#ffd45e" class="sun"/><g id="movingEarth" transform="translate(660 172)"><circle r="36" fill="#1b99d1"/><path d="M-18 -21 L9 -25 24 -8 10 7 20 24 -13 15Z" fill="#3ec98a"/><line x1="-18" y1="-54" x2="18" y2="54" stroke="#ffe58b" stroke-width="5"/></g><text x="375" y="244" text-anchor="middle" font-size="21" fill="#fff">ดวงอาทิตย์</text></svg></div><div class="control"><label for="season">🪐 เลื่อนตำแหน่งโลก</label><input id="season" type="range" min="0" max="3" step="1" value="0" oninput="updateSeason(this.value)"></div><div class="tile" id="seasonText" aria-live="polite"></div><p class="small">แผนภาพเพื่อการเรียนรู้ ไม่ใช่ขนาดจริง และแสดงวงโคจรแบบย่อเพื่อให้อ่านง่าย</p>`},
{title:'เขตเวลาและปีอธิกสุรทิน',body:`<div class="grid"><div class="tile"><h3>🕒 เขตเวลา</h3><p>โลกหมุน 360° ในประมาณ 24 ชั่วโมง จึงเท่ากับ <strong>15° ต่อ 1 ชั่วโมง</strong> หรือ 1° ต่อ 4 นาที (โดยประมาณ)</p><p>พื้นที่ที่อยู่ทางตะวันออกโดยทั่วไปมีเวลาสุริยะเร็วกว่า</p></div><div class="tile"><h3>📅 ปีอธิกสุรทิน</h3><p>โลกโคจรรอบดวงอาทิตย์ประมาณ 365.2422 วัน จึงต้องปรับปฏิทินเป็นบางปีที่มี <strong>366 วัน</strong></p><p>โดยทั่วไปปีหาร 4 ลงตัวเป็นปีอธิกสุรทิน ยกเว้นปีคริสต์ศักราชที่หาร 100 ลงตัวแต่หาร 400 ไม่ลงตัว</p></div></div><p class="note">ตัวอย่าง: หากต่างกัน 30° ของลองจิจูด เวลาสุริยะจะต่างกันประมาณ 2 ชั่วโมง (เขตเวลาทางราชการอาจไม่ตรงตามลองจิจูดเป๊ะ)</p><p>🎯 พร้อมแล้ว! เข้าสู่ Mini Quiz 5 ข้อ เพื่อทบทวนสิ่งที่เรียน</p>`}
];
const qs=[{q:'โลกหมุนรอบตัวเองจากทิศใดไปทิศใด?',a:['ตะวันออกไปตะวันตก','ตะวันตกไปตะวันออก','เหนือไปใต้','ใต้ไปเหนือ'],c:1,why:'โลกหมุนจากตะวันตกไปตะวันออก จึงเห็นดวงอาทิตย์เคลื่อนที่ปรากฏไปทางตะวันตก'},{q:'สาเหตุหลักที่ทำให้เกิดกลางวันและกลางคืนคืออะไร?',a:['โลกโคจรรอบดวงอาทิตย์','ดวงจันทร์บังแสง','โลกหมุนรอบตัวเอง','ระยะโลก–ดวงอาทิตย์เปลี่ยน'],c:2,why:'โลกหมุนรอบตัวเองทำให้พื้นที่ต่าง ๆ สลับกันรับแสงอาทิตย์'},{q:'ฤดูกาลเกิดจากปัจจัยสำคัญคู่ใด?',a:['แกนโลกเอียงและโลกโคจรรอบดวงอาทิตย์','โลกหมุนเร็วขึ้นและช้าลง','ดวงจันทร์โคจรรอบโลก','โลกใกล้ดวงอาทิตย์เท่านั้น'],c:0,why:'แกนโลกเอียงประมาณ 23.5° และโลกโคจรรอบดวงอาทิตย์ ทำให้มุมรับแสงและความยาวกลางวันเปลี่ยนตามฤดู'},{q:'เมื่อซีกโลกเหนืออยู่ในฤดูร้อน ซีกโลกใต้มักอยู่ในฤดูใด?',a:['ฤดูร้อน','ฤดูใบไม้ผลิ','ฤดูหนาว','เหมือนกันเสมอ'],c:2,why:'สองซีกโลกมีฤดูกาลตรงข้ามกันเพราะแกนโลกเอียง'},{q:'ถ้าลองจิจูดต่างกัน 45° เวลาสุริยะจะต่างกันประมาณเท่าไร?',a:['1 ชั่วโมง','2 ชั่วโมง','3 ชั่วโมง','6 ชั่วโมง'],c:2,why:'โลกหมุน 15° ต่อชั่วโมง ดังนั้น 45 ÷ 15 = 3 ชั่วโมง'}];
let page=0,qi=0,ans=Array(qs.length).fill(null);const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}function go(n){page=n;renderLesson()}function renderLesson(){show('lesson');$('lessonTag').textContent=`📘 บทเรียน ${page} / ${lessons.length}`;$('lessonTitle').textContent=lessons[page-1].title;$('lessonContent').innerHTML=lessons[page-1].body;$('nextBtn').textContent=page===lessons.length?'🧠 เริ่ม Mini Quiz →':'หน้าถัดไป →';$('bar').style.width=(page/13*100)+'%';$('count').textContent=`UNIT 03 · ${page}/8`;if(page===7)updateSeason('0')}function prev(){if(page===1)home();else go(page-1)}function next(){if(page===8){qi=0;renderQuiz()}else go(page+1)}function home(){show('cover');$('bar').style.width='0%';$('count').textContent='UNIT 03 · LESSON'}function updateSeason(v){const coords=[[660,172],[375,290],[90,172],[375,54]];const d=['ประมาณ 21 มิถุนายน — ซีกโลกเหนือฤดูร้อน ☀️','ประมาณ 22 กันยายน — วิษุวัต 🍂 กลางวันและกลางคืนใกล้เคียงกัน','ประมาณ 21 ธันวาคม — ซีกโลกเหนือฤดูหนาว ❄️','ประมาณ 20 มีนาคม — วิษุวัต 🌱 กลางวันและกลางคืนใกล้เคียงกัน'];const i=Number(v);$('movingEarth').setAttribute('transform',`translate(${coords[i][0]} ${coords[i][1]})`);$('seasonText').textContent=d[i]+' (ฤดูกาลของซีกโลกใต้ตรงข้ามกับซีกโลกเหนือในช่วงครีษมายันและเหมายัน)'}function renderQuiz(){show('quiz');$('quizNum').textContent=`🧠 MINI QUIZ · ${qi+1}/5`;$('quizQuestion').textContent=qs[qi].q;$('options').innerHTML=qs[qi].a.map((x,i)=>`<button class="answer ${ans[qi]===i?'selected':''}" onclick="choose(${i})">${'ABCD'[i]}. ${x}</button>`).join('');$('feedback').classList.toggle('hide',ans[qi]===null);if(ans[qi]!==null)$('feedback').innerHTML=(ans[qi]===qs[qi].c?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง')+`<p>เฉลย: ${'ABCD'[qs[qi].c]}. ${qs[qi].a[qs[qi].c]}</p><p>${qs[qi].why}</p>`;$('quizNext').textContent=qi===4?'🏆 ดูผลคะแนน':'ข้อต่อไป →';$('quizNext').disabled=ans[qi]===null;$('bar').style.width=((8+qi+1)/13*100)+'%';$('count').textContent=`MINI QUIZ · ${qi+1}/5`}function choose(i){ans[qi]=i;renderQuiz()}function quizBack(){if(qi===0)go(8);else{qi--;renderQuiz()}}function quizForward(){if(ans[qi]===null)return;if(qi===4)result();else{qi++;renderQuiz()}}function result(){show('result');const s=ans.reduce((n,a,i)=>n+(a===qs[i].c?1:0),0);$('score').textContent=`${s} / 5 คะแนน`;$('scoreMessage').textContent=s===5?'สุดยอด! พร้อมสำหรับเกมทดสอบ Unit 03 แล้ว 🌟':s>=3?'ทำได้ดี! ลองทบทวนข้อที่พลาดก่อนเข้าสอบจริง':'ลองกลับไปทบทวนบทเรียนอีกครั้ง แล้วมาพิชิตภารกิจใหม่นะ';$('review').innerHTML=qs.map((q,i)=>`<div class="tile" style="margin:12px 0"><b>${i+1}. ${q.q}</b><p>${ans[i]===q.c?'✅':'❌'} คำตอบที่ถูก: ${q.a[q.c]}</p><p class="small">${q.why}</p></div>`).join('');$('bar').style.width='100%';$('count').textContent='UNIT 03 · COMPLETE'}function restartQuiz(){ans=Array(qs.length).fill(null);qi=0;renderQuiz()}
</script></body></html>
