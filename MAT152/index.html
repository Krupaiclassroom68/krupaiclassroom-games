$('app').innerHTML=header()+b+'<div class="footer">Kru Pai Classroom • Simplest Fraction Number Challenge • 20 Questions</div>';
}
function questionNavigator(){return `<div class="questionLegend">🟢 ถูก &nbsp; 🔴 ผิด &nbsp; 🔵 กำลังทำ &nbsp; ⚪ ยังไม่ตอบ — แตะหมายเลขเพื่อเปิดดูคำตอบ</div><div class="questionNav" aria-label="เลือกหมายเลขข้อ">${Q.map((q,i)=>{let a=state.answers[i],d=state.drafts[i],hasDraft=d&&Object.values(d).some(v=>v!==''&&v!==null);let status=a?(a.correct?'correct':'wrong'):(hasDraft?'draft':'');return `<button type="button" class="questionDot ${status} ${state.index===i?'current':''}" onclick="jumpTo(${i})" aria-label="ข้อ ${i+1} ${a?(a.correct?'ถูก':'ผิด'):'ยังไม่ตรวจ'}" aria-current="${state.index===i?'step':'false'}">${i+1}${a?`<small>${a.correct?'✓':'✕'}</small>`:''}</button>`}).join('')}</div>`}
function jumpTo(i){state.index=i;state.page='game';save();sound('click');render()}
function gameHtml(){let q=Q[state.index],d=state.drafts[state.index]||{},answered=state.answers[state.index];let target=q.target;let prompt=q.type==='input'?`ทำเศษส่วน ${frac(target)} ให้เป็นอย่างต่ำ แล้วเติมตัวเศษและตัวส่วน`:q.type==='choice'?`เศษส่วนอย่างต่ำของ ${frac(target)} คือข้อใด?`:q.type==='multi'?`เลือกเศษส่วนที่มีค่าเท่ากับ ${frac(target)} ให้ครบ <span class="tip">${q.correct.length} ลูกโป่ง</span>`:`เศษส่วนอย่างต่ำคือ ${frac(target)} จงเลือกเศษส่วนก่อนทำให้อย่างต่ำ`;
let content='';if(q.type==='input'){content=`<div class="inputGroup"><div class="balloon">${frac(target)}</div><div class="sign">=</div><div class="inputStack"><input aria-label="ตัวเศษ" inputmode="numeric" type="number" min="1" max="999" class="fractionInput" id="num" value="${d.n??''}" oninput="setInput('n',this.value)"><div class="inputLine"></div><input aria-label="ตัวส่วน" inputmode="numeric" type="number" min="1" max="999" class="fractionInput" id="den" value="${d.d??''}" oninput="setInput('d',this.value)"></div></div>`}
else if(q.type==='multi'){content=`<p class="multiCount">เลือกแล้ว ${(d.sel||[]).length} / ${q.correct.length} ลูกโป่ง</p><div class="balloons">${q.options.map((f,i)=>`<button class="balloon mini ${((d.sel||[]).includes(i))?'active':''}" onclick="toggleMulti(${i})" aria-pressed="${(d.sel||[]).includes(i)}">${frac(f)}</button>`).join('')}</div>`}
else{content=`<div class="choiceGrid">${q.options.map((f,i)=>`<button class="choiceBtn ${d.sel===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span>${frac(f)}</button>`).join('')}</div>`}
let explanation=answered?`<div class="answerExplanation"><strong>${answered.correct?'🎉 ถูกต้อง!':'💡 ยังไม่ถูกนะจ๊ะ'}</strong><div>${explain(q)}</div><div>คำตอบที่เลือก: ${escapeHtml(answerLabel(q,answered.value))}</div></div>`:'';
return `<section class="panel gamePanel"><div class="row"><span class="chip">${labels[q.type]}</span><span class="chip">ข้อ ${state.index+1} / 20</span><span class="chip">⭐ ${state.answers.filter(x=>x?.correct).length} คะแนน</span></div><div class="progress"><div style="width:${(state.index+1)/20*100}%"></div></div>${questionNavigator()}<h2 class="prompt">${prompt}</h2>${content}${explanation}<div class="nav"><button class="btn scratchBtn" onclick="openScratch()">✍️ กระดาษทดด้านข้าง</button><button class="btn secondary" onclick="move(-1)" ${state.index===0?'disabled':''}>← ย้อนกลับ</button>${answered?`<button class="btn" onclick="move(1)">${state.index===19?'🏆 สรุปคะแนน':'ข้อต่อไป →'}</button>`:`<button class="btn" onclick="check()" ${!ready(q,d)?'disabled':''}>🎯 ตรวจคำตอบ</button>`}<button class="btn secondary" onclick="move(1)" ${state.index===19?'disabled':''}>ข้ามข้อ →</button></div><p class="note">ตอบแล้วไม่เปลี่ยนคะแนนย้อนหลัง • ข้ามข้อแล้วกลับมาทำได้ • ไม่สุ่มลำดับโจทย์และตัวเลือก</p></section>`}
function ready(q,d){if(q.type==='input')return /^\d+$/.test(String(d.n??''))&&/^\d+$/.test(String(d.d??''))&&Number(d.n)>0&&Number(d.d)>0;if(q.type==='multi')return (d.sel||[]).length===q.correct.length;return Number.isInteger(d.sel)}
function explain(q){let t=q.target,ans=simp(t),g=gcd(t[0],t[1]);if(q.type==='input'||q.type==='choice')return `ห.ร.ม. ของ ${t[0]} และ ${t[1]} คือ ${g} → ตัวเศษ ${t[0]} ÷ ${g} = ${ans[0]} และตัวส่วน ${t[1]} ÷ ${g} = ${ans[1]} ดังนั้น ${frac(t)} = ${frac(ans)}`;if(q.type==='multi')return `ลูกโป่งที่ถูกต้องคือ ${q.correct.map(i=>frac(q.options[i])).join(' , ')} ซึ่งทุกลูกมีค่าเท่ากับ ${frac(t)}`;return `คำตอบคือ ${frac(q.options[q.correct])} เพราะเมื่อลดรูปจะได้ ${frac(t)} และเศษส่วนเดิมยังไม่เป็นอย่างต่ำ`}
function answerLabel(q,v){if(v==null)return 'ยังไม่ตอบ';if(q.type==='input')return `${v.n}/${v.d}`;if(q.type==='multi')return v.map(i=>`${q.options[i][0]}/${q.options[i][1]}`).join(', ');return `${'ABCD'[v+0]}: ${q.options[v][0]}/${q.options[v][1]}`}
function check(){let q=Q[state.index],d=state.drafts[state.index]||{};if(!ready(q,d)||state.answers[state.index])return;let v,correct=false;if(q.type==='input'){v={n:Number(d.n),d:Number(d.d)};let ans=simp(q.target);correct=v.n===ans[0]&&v.d===ans[1]}else if(q.type==='multi'){v=[...d.sel];correct=v.length===q.correct.length&&v.every(i=>q.correct.includes(i))}else{v=d.sel;correct=v===q.correct}state.answers[state.index]={correct,value:v};save();sound(correct?'win':'lose');render();if(correct)burst()}
function setInput(k,v){let d=state.drafts[state.index]||{};d[k]=v;state.drafts[state.index]=d;let b=document.querySelector('.nav .btn:not(.secondary)');if(b)b.disabled=!ready(Q[state.index],d);save()}
function choose(i){if(state.answers[state.index])return;state.drafts[state.index]={sel:i};sound('click');save();render()}
function toggleMulti(i){if(state.answers[state.index])return;let d=state.drafts[state.index]||{sel:[]};let s=d.sel||[];if(s.includes(i))s=s.filter(x=>x!==i);else if(s.length<Q[state.index].correct.length)s=[...s,i];d.sel=s;state.drafts[state.index]=d;sound('click');save();render()}
function move(n){if(scratchOpen)closeScratch();if(n===1&&state.index===19){state.page='result';render();return}state.index=Math.max(0,Math.min(19,state.index+n));state.page='game';save();render()}
function resultHtml(){let count=state.answers.filter(x=>x?.correct).length,pct=Math.round(count/20*100);return `<section class="panel"><div class="hero">${pct>=80?'🏆🎈🎉':'📚🎈✨'}</div><h1 class="big">MISSION COMPLETE!</h1><p class="sub">${escapeHtml(state.name||'นักเรียน')} • ${new Date().toLocaleString('th-TH')}</p><div class="score">${count} / 20</div><p class="sub">${pct}% • ${pct>=90?'ดีเยี่ยม!':pct>=80?'ดีมาก!':pct>=70?'น่าพอใจ ควรฝึกซ้ำ':'ฝึกเพิ่มอีกนิด เก่งขึ้นได้แน่นอน'}</p><div class="nav"><button class="btn" onclick="state.review=!state.review;render()">📋 ${state.review?'ซ่อน':'ดู'}เฉลยทุกข้อ</button><button class="btn secondary" onclick="restart()">🔄 เริ่มครั้งใหม่</button></div>${state.review?`<div class="resultList">${Q.map((q,i)=>`<div class="resultItem">${i+1}. ${labels[q.type]} ${frac(q.target)} — ${state.answers[i]?(state.answers[i].correct?'✅':'❌'):'⚪ ยังไม่ตอบ'}<div>${explain(q)}</div></div>`).join('')}</div>`:''}</section>`}
function goHome(){state.page='home';render()}
function goLesson(){state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.page='lesson';sound('click');render()}
function start(){state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.index=0;state.page='game';state.answers=Array(20).fill(null);state.drafts={};state.review=false;inkData={};inkHistory={};save();sound('win');render()}
function restart(){state.page='home';state.index=0;state.answers=Array(20).fill(null);state.drafts={};state.review=false;inkData={};inkHistory={};save();render()}
function toggleSound(){state.muted=!state.muted;render()}
function save(){try{localStorage.setItem(GAME_ID+'-'+state.name,JSON.stringify({index:state.index,answers:state.answers,drafts:state.drafts,name:state.name,inkData:inkData}))}catch(e){}}

// Scratchpad: canvas uses pointer events and disables native selection/gestures.
let erasing=false;
function inkKey(){return String(state.index)}
function canvasCtx(){return $('scratchCanvas').getContext('2d',{willReadFrequently:true})}
function paintPaper(){const c=$('scratchCanvas'),r=c.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*ratio));c.height=Math.max(1,Math.round(r.height*ratio));let ctx=canvasCtx();ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineCap='round';ctx.lineJoin='round'}
function restoreInk(){const src=inkData[inkKey()];if(!src)return;let im=new Image();im.onload=()=>{if(scratchOpen){let ctx=canvasCtx();ctx.drawImage(im,0,0,$('scratchCanvas').clientWidth,$('scratchCanvas').clientHeight)}};im.src=src}
function snapshotInk(){if(!scratchOpen)return;try{inkData[inkKey()]=$('scratchCanvas').toDataURL('image/png');save()}catch(e){}}
function openScratch(){if(scratchOpen){closeScratch();return}if(state.page!=='game')return;scratchOpen=true;document.body.classList.add('padVisible');$('scratchOverlay').classList.add('open');$('scratchOverlay').setAttribute('aria-hidden','false');$('scratchTitle').textContent='✍️ กระดาษทด • ข้อ '+(state.index+1);requestAnimationFrame(()=>{paintPaper();restoreInk()})}
function closeScratch(){if(!scratchOpen)return;snapshotInk();scratchOpen=false;document.body.classList.remove('padVisible');$('scratchOverlay').classList.remove('open');$('scratchOverlay').setAttribute('aria-hidden','true')}
function setPen(color,width,eraser=false){inkColor=color;inkWidth=width;erasing=eraser;sound('click')}
function pointOf(e){let r=$('scratchCanvas').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function inkDown(e){if(!scratchOpen)return;e.preventDefault();const c=$('scratchCanvas');c.setPointerCapture(e.pointerId);let k=inkKey();(inkHistory[k]??=[]).push(c.toDataURL('image/png'));if(inkHistory[k].length>15)inkHistory[k].shift();drawing=true;lastPt=pointOf(e);let ctx=canvasCtx();ctx.beginPath();ctx.arc(lastPt.x,lastPt.y,inkWidth/2,0,Math.PI*2);ctx.fillStyle=erasing?'#fff':inkColor;ctx.fill()}
function inkMove(e){if(!drawing)return;e.preventDefault();const pt=pointOf(e),ctx=canvasCtx();ctx.globalCompositeOperation=erasing?'destination-out':'source-over';ctx.strokeStyle=inkColor;ctx.lineWidth=inkWidth;ctx.beginPath();ctx.moveTo(lastPt.x,lastPt.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();ctx.globalCompositeOperation='source-over';lastPt=pt}
function inkUp(e){if(!drawing)return;e.preventDefault();drawing=false;lastPt=null;snapshotInk()}
function undoInk(){let k=inkKey(),h=inkHistory[k]||[];if(!h.length)return;let old=h.pop(),ctx=canvasCtx();ctx.clearRect(0,0,$('scratchCanvas').clientWidth,$('scratchCanvas').clientHeight);let im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,$('scratchCanvas').clientWidth,$('scratchCanvas').clientHeight);snapshotInk()};im.src=old}
function clearInk(){let c=$('scratchCanvas'),k=inkKey();(inkHistory[k]??=[]).push(c.toDataURL('image/png'));canvasCtx().clearRect(0,0,c.clientWidth,c.clientHeight);snapshotInk()}
$('scratchCanvas').addEventListener('pointerdown',inkDown,{passive:false});$('scratchCanvas').addEventListener('pointermove',inkMove,{passive:false});$('scratchCanvas').addEventListener('pointerup',inkUp,{passive:false});$('scratchCanvas').addEventListener('pointercancel',inkUp,{passive:false});

render();
</script></body></html>
