ify-content:space-between;gap:12px}.planet-big{font-size:clamp(90px,13vw,180px);text-align:center}.foot{font-size:14px;color:#90a6c8;text-align:center;padding-bottom:5px}@media(max-width:760px){.hero,.cols{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.options{grid-template-columns:1fr}.panel{min-height:0}.orb{font-size:115px}.buttons .btn{flex:1;padding:12px}.planet .ball{font-size:55px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{nickname:'ดาวเคราะห์สีน้ำเงิน',name:'โลก',en:'Earth',emoji:'🌍',type:'หิน',fact:'มีน้ำในสถานะของเหลวบนพื้นผิวเป็นจำนวนมาก และเป็นดาวเคราะห์เดียวที่ยืนยันว่ามีสิ่งมีชีวิต',day:'ประมาณ 24 ชั่วโมง',year:'ประมาณ 365.25 วัน',extra:'มีดวงจันทร์ธรรมชาติ 1 ดวง'},
{nickname:'ดาวเคราะห์สีแดง',name:'ดาวอังคาร',en:'Mars',emoji:'🔴',type:'หิน',fact:'ดาวเคราะห์สีแดงจากสารประกอบเหล็กบนพื้นผิว',day:'ประมาณ 24 ชั่วโมง 37 นาที',year:'ประมาณ 687 วันโลก',extra:'มีดวงจันทร์ 2 ดวง คือ โฟบอสและดีมอส'},
{nickname:'ราชาแห่งดาวเคราะห์',name:'ดาวพฤหัสบดี',en:'Jupiter',emoji:'🟠',type:'ยักษ์แก๊ส',fact:'ดาวเคราะห์ที่ใหญ่ที่สุด มีพายุใหญ่ที่เรียกว่า จุดแดงใหญ่',day:'ประมาณ 10 ชั่วโมง',year:'ประมาณ 11.9 ปีโลก',extra:'มีดวงจันทร์จำนวนมาก และมีวงแหวนจาง ๆ'},
{nickname:'ดาวเคราะห์แห่งวงแหวน',name:'ดาวเสาร์',en:'Saturn',emoji:'🪐',type:'ยักษ์แก๊ส',fact:'มีระบบวงแหวนโดดเด่น ประกอบด้วยอนุภาคน้ำแข็งและเศษหิน',day:'ประมาณ 10.7 ชั่วโมง',year:'ประมาณ 29.4 ปีโลก',extra:'มีความหนาแน่นเฉลี่ยต่ำกว่าน้ำ'},
{nickname:'ดาวเคราะห์ตะแคงข้าง',name:'ดาวยูเรนัส',en:'Uranus',emoji:'🔵',type:'ยักษ์น้ำแข็ง',fact:'แกนหมุนเอียงมากจนดูคล้ายกลิ้งไปตามวงโคจร',day:'ประมาณ 17 ชั่วโมง',year:'ประมาณ 84 ปีโลก',extra:'สีฟ้าอมเขียวส่วนหนึ่งมาจากก๊าซมีเทนในบรรยากาศ'},
{nickname:'ดาวเคราะห์สีน้ำเงินเข้ม',name:'ดาวเนปจูน',en:'Neptune',emoji:'🔵',type:'ยักษ์น้ำแข็ง',fact:'อยู่ไกลดวงอาทิตย์ที่สุดในบรรดาดาวเคราะห์ 8 ดวง และมีลมแรงมาก',day:'ประมาณ 16 ชั่วโมง',year:'ประมาณ 165 ปีโลก',extra:'มีสีฟ้า และเป็นดาวเคราะห์ยักษ์น้ำแข็ง'}];
const qs=[
{q:'ดาวเคราะห์ดวงใดอยู่ใกล้ดวงอาทิตย์ที่สุด?',a:['ดาวศุกร์','ดาวพุธ','โลก','ดาวอังคาร'],c:1,why:'ดาวพุธเป็นดาวเคราะห์ลำดับที่ 1 จากดวงอาทิตย์'},
{q:'เหตุใดดาวศุกร์จึงมีอุณหภูมิพื้นผิวสูงกว่าดาวพุธ?',a:['อยู่ใกล้ดวงอาทิตย์มากกว่า','มีวงแหวน','มีบรรยากาศหนาแน่นกักเก็บความร้อน','มีดวงจันทร์หลายดวง'],c:2,why:'บรรยากาศหนาแน่นที่มีคาร์บอนไดออกไซด์มาก ทำให้เกิดปรากฏการณ์เรือนกระจกรุนแรง'},

{q:'เมื่อมองจากด้านเหนือของระบบสุริยะ ดาวเคราะห์ทั้ง 8 โคจรรอบดวงอาทิตย์ในทิศใด?',a:['ตามเข็มนาฬิกา','ทวนเข็มนาฬิกา','สลับกันตามขนาดดาว','ไม่มีทิศทางแน่นอน'],c:1,why:'ดาวเคราะห์ทั้ง 8 โคจรทวนเข็มนาฬิกาเมื่อมองจากด้านเหนือของระนาบระบบสุริยะ ต้องแยกจากการหมุนรอบตัวเอง'},
{q:'ดาวเคราะห์ดวงใดมีฉายาว่า ดาวเคราะห์สีแดง?',a:['ดาวพุธ','ดาวอังคาร','ดาวเนปจูน','ดาวเสาร์'],c:1,why:'ดาวอังคารมีสีแดงจากออกไซด์ของเหล็กบนพื้นผิว จึงได้ฉายาว่าดาวเคราะห์สีแดง'}];
let page=0,selectedPlanet=2,quizAnswers={};const $=id=>document.getElementById(id);const total=9;
function planetsGrid(){return `<div class="cards">${planets.map((p,i)=>`<button class="planet ${i===selectedPlanet?'active':''}" onclick="choosePlanet(${i})"><span class="ball">${p.emoji}</span><strong>${i+1}. ${p.name}</strong><small>${p.en}</small></button>`).join('')}</div>`}
function factCard(p){return `<div class="fact"><h3>${p.emoji} ${p.name} <span class="muted">(${p.en})</span></h3><p><span class="highlight">ลักษณะเด่น:</span> ${p.fact}</p><div class="chips"><span class="chip">ประเภท: ${p.type}</span><span class="chip">หมุนรอบตัวเอง: ${p.day}</span><span class="chip">โคจรรอบดวงอาทิตย์: ${p.year}</span></div><p>🏷️ <span class="highlight">ฉายา:</span> ${p.nickname}</p><p>🛰️ <span class="highlight">ทิศโคจรรอบดวงอาทิตย์:</span> ทวนเข็มนาฬิกา ↺ (เมื่อมองจากเหนือระนาบระบบสุริยะ)</p><p>🔄 <span class="highlight">ทิศหมุนรอบตัวเอง:</span> ${p.en==='Venus'||p.en==='Uranus'?'ตามเข็มนาฬิกา ↻ โดยประมาณ (หมุนย้อนทิศจากดาวส่วนใหญ่)':'ทวนเข็มนาฬิกา ↺'}</p><p class="mini">💡 ${p.extra}</p></div>`}
const pages=[
()=>`<div class="hero"><div><div class="eyebrow">UNIT 02 • PLANET ATLAS</div><h1>🪐 ภารกิจพิชิต<br>ดาวเคราะห์ทั้ง 8 ดวง</h1><p>รู้จักดาวเคราะห์อย่างเป็นระบบ ตั้งแต่ตำแหน่ง ลักษณะเด่น ไปจนถึงโจทย์วิเคราะห์สอบเข้า ม.1</p><p class="muted">📚 บทเรียน 8 หน้า + Mini Quiz 5 ข้อ</p><button class="btn primary" onclick="go(1)">🚀 เริ่มสำรวจดาวเคราะห์</button></div><div class="orb">🪐</div></div>`,
()=>`<div class="eyebrow">LESSON 01 / 08</div><h2>☀️ ลำดับดาวเคราะห์จากดวงอาทิตย์</h2><p>ระบบสุริยะมีดาวเคราะห์ <b class="highlight">8 ดวง</b> เรียงจากใกล้ดวงอาทิตย์ไปไกลที่สุดดังนี้</p><div class="step">☀️ ดวงอาทิตย์</div>${planets.map((p,i)=>`<span class="step">${i+1}. ${p.emoji} ${p.name}</span>`).join('')}<div class="fact"><p>🧠 <b>ท่องจำ:</b> พุธ → ศุกร์ → โลก → อังคาร → พฤหัสบดี → เสาร์ → ยูเรนัส → เนปจูน</p><p class="note">หมายเหตุ: ภาพและสัญลักษณ์ไม่แสดงขนาดหรือระยะทางตามสัดส่วนจริง</p></div>`,
()=>`<div class="eyebrow">LESSON 02 / 08</div><h2>🔭 สำรวจดาวเคราะห์ทีละดวง</h2><p>กดเลือกดาวเคราะห์เพื่ออ่านข้อมูลสำคัญสำหรับข้อสอบ</p>${planetsGrid()}${factCard(planets[selectedPlanet])}`,
()=>`<div class="eyebrow">LESSON 03 / 08</div><h2>🪨 ดาวเคราะห์หิน vs ดาวเคราะห์ยักษ์</h2><div class="cols"><div class="box"><h3>🪨 ดาวเคราะห์หิน (ชั้นใน)</h3><p>พุธ ศุกร์ โลก อังคาร</p><p>มีพื้นผิวแข็งเป็นหิน ขนาดเล็กกว่าดาวเคราะห์ยักษ์ และอยู่ใกล้ดวงอาทิตย์กว่า</p></div><div class="box"><h3>🌫️ ดาวเคราะห์ยักษ์ (ชั้นนอก)</h3><p>พฤหัสบดี เสาร์ = <b>ยักษ์แก๊ส</b></p><p>ยูเรนัส เนปจูน = <b>ยักษ์น้ำแข็ง</b></p><p>มีบรรยากาศหนาแน่นและไม่มีพื้นผิวแข็งแบบดาวเคราะห์หิน</p></div></div><div class="fact"><p>⭐ <b>ข้อสอบชอบถาม:</b> ดาวเคราะห์ชั้นนอกทั้ง 4 ดวงมีวงแหวน แต่ดาวเสาร์มีวงแหวนเด่นชัดที่สุด</p></div>`,
()=>`<div class="eyebrow">LESSON 04 / 08</div><h2>🏆 สถิติดาวเคราะห์ที่ต้องจำ</h2><div class="cols"><div class="box"><p>☀️ ใกล้ดวงอาทิตย์ที่สุด — <b class="highlight">ดาวพุธ</b></p><p>🔥 ร้อนที่สุดที่พื้นผิว — <b class="highlight">ดาวศุกร์</b></p><p>📏 เล็กที่สุด — <b class="highlight">ดาวพุธ</b></p><p>🌍 มีสิ่งมีชีวิตที่ยืนยันแล้ว — <b class="highlight">โลก</b></p></div><div class="box"><p>🟠 ใหญ่ที่สุด — <b class="highlight">ดาวพฤหัสบดี</b></p><p>🪐 วงแหวนเด่นที่สุด — <b class="highlight">ดาวเสาร์</b></p><p>↪️ แกนหมุนเอียงมาก — <b class="highlight">ดาวยูเรนัส</b></p><p>🌌 ไกลดวงอาทิตย์ที่สุด — <b class="highlight">ดาวเนปจูน</b></p></div></div><div class="fact"><p>⚠️ อย่าสับสน! <b>ดาวพุธอยู่ใกล้ดวงอาทิตย์ที่สุด แต่ดาวศุกร์ร้อนที่สุด</b> เพราะผลของบรรยากาศ</p></div>`,
()=>`<div class="eyebrow">LESSON 05 / 08</div><h2>🔄 การหมุนรอบตัวเองและการโคจร</h2><div class="cols"><div class="box"><h3>🌍 หมุนรอบตัวเอง (Rotation)</h3><p>เป็นการหมุนของดาวเคราะห์รอบแกนของตนเอง</p><p>สำหรับโลก การหมุนนี้ทำให้เกิด <b class="highlight">กลางวันและกลางคืน</b></p></div><div class="box"><h3>☀️ โคจรรอบดวงอาทิตย์ (Revolution)</h3><p>เป็นการเคลื่อนที่ของดาวเคราะห์รอบดวงอาทิตย์</p><p>โลกโคจรครบหนึ่งรอบใช้เวลาประมาณ <b class="highlight">365.25 วัน</b></p></div></div><div class="fact"><h3>🧭 ทิศทางการโคจร: ทวนเข็มหรือ ตามเข็ม?</h3><div class="cols"><div class="box"><h3>☀️ โคจรรอบดวงอาทิตย์</h3><div class="orbit-demo"><span class="sun">☀️</span><span class="orbiting">🌍</span></div><p>ดาวเคราะห์ทั้ง 8 ดวงโคจร <b class="highlight">ทวนเข็มนาฬิกา ↺</b> เมื่อมองจากด้านเหนือของระนาบระบบสุริยะ</p></div><div class="box"><h3>🪐 หมุนรอบตัวเอง</h3><p>ดาวเคราะห์ส่วนใหญ่หมุน <b class="highlight">ทวนเข็มนาฬิกา ↺</b></p><p>ข้อยกเว้นที่ควรรู้: <b>ดาวศุกร์และดาวยูเรนัส</b> หมุนย้อนทิศโดยประมาณ (มักสอนว่า <b class="highlight">ตามเข็มนาฬิกา ↻</b>)</p></div></div><p class="note">⚠️ ต้องกำหนดมุมมองก่อนเสมอ: มองจากด้านเหนือของระบบสุริยะ ถ้ามองจากด้านตรงข้าม ทิศตามเข็ม/ทวนเข็มจะกลับกัน และดาวยูเรนัสมีแกนเอียงมากเกือบอยู่ในระนาบโคจร</p><p>🧠 โดยทั่วไปดาวเคราะห์ที่ไกลดวงอาทิตย์กว่าจะใช้เวลาโคจรหนึ่งรอบนานกว่า แต่ <b>เวลาหมุนรอบตัวเอง</b> ไม่ได้เรียงตามระยะห่าง</p></div>`,
()=>`<div class="eyebrow">LESSON 06 / 08</div><h2>🌙 ดาวบริวารและวงแหวน</h2><div class="cols"><div class="box"><h3>🌙 ดาวบริวารธรรมชาติ</h3><p>วัตถุที่โคจรรอบดาวเคราะห์ เช่น ดวงจันทร์โคจรรอบโลก</p><p>ดาวพุธและดาวศุกร์ <b class="highlight">ไม่มีดวงจันทร์ธรรมชาติ</b></p></div><div class="box"><h3>🪐 วงแหวน</h3><p>วงแหวนของดาวเคราะห์ประกอบด้วยอนุภาคจำนวนมาก เช่น น้ำแข็งและเศษหิน</p><p>ดาวเคราะห์ยักษ์ทั้ง 4 ดวงมีระบบวงแหวน</p></div></div><div class="fact"><p>🔎 จำนวนดวงจันทร์ที่ค้นพบของแต่ละดาวอาจเปลี่ยนแปลงได้ตามการสำรวจ จึงเน้นความเข้าใจมากกว่าท่องตัวเลขที่เปลี่ยนได้</p></div>`,
()=>`<div class="eyebrow">LESSON 07 / 08</div><h2>🧩 เปรียบเทียบดาวเคราะห์อย่างนักวิทยาศาสตร์</h2><p>กดดาวเคราะห์ด้านล่างเพื่อดูข้อมูล แล้วลองเปรียบเทียบว่าแต่ละดวงมีจุดเด่นต่างกันอย่างไร</p>${planetsGrid()}${factCard(planets[selectedPlanet])}<div class="fact"><p>🎯 <b>โจทย์คิด:</b> หากยานสำรวจพบดาวเคราะห์ที่มีแกนหมุนเอียงมากและมีสีฟ้าอมเขียว ควรนึกถึง <b class="highlight">ดาวยูเรนัส</b></p></div>`,
()=>`<div class="eyebrow">LESSON 08 / 08</div><h2>📚 สรุปก่อนเข้าทดสอบ</h2><div class="cols"><div class="box"><h3>จำให้แม่น</h3><p>1. ดาวเคราะห์มี 8 ดวง</p><p>2. ชั้นใน = หิน 4 ดวง</p><p>3. ชั้นนอก = ยักษ์ 4 ดวง</p><p>4. ดาวศุกร์ร้อนที่สุด และมีฉายาดาวประจำเมือง/ดาวประกายพรึก</p></div><div class="box"><h3>คิดให้เป็น</h3><p>5. ดาวเคราะห์ไม่ได้เปล่งแสงแบบดาวฤกษ์</p><p>6. หมุนรอบตัวเอง ≠ โคจรรอบดวงอาทิตย์</p><p>7. ดาวเคราะห์ไกลกว่ามักมีปีที่ยาวกว่า</p><p>8. ดาวเคราะห์ทั้ง 8 โคจรทวนเข็มเมื่อมองจากเหนือระบบสุริยะ</p></div></div><div class="fact"><p>🚀 พร้อมหรือยัง? กด <b>เริ่ม Mini Quiz</b> เพื่อทบทวน 5 ข้อพร้อมเฉลยทันที</p><button class="btn primary" onclick="go(9)">🧠 เริ่ม Mini Quiz →</button></div>`,
()=>quizPage()];
let qidx=0;
function quizPage(){const q=qs[qidx],a=quizAnswers[qidx];return `<div class="quiz-head"><div class="eyebrow">MINI QUIZ • PLANET MASTER</div><span class="tag">ข้อ ${qidx+1} / ${qs.length}</span></div><h2>${q.q}</h2><div class="options">${q.a.map((x,i)=>`<button class="option ${a===i?'selected':''} ${a!==undefined&&i===q.c?'correct':''} ${a===i&&i!==q.c?'wrong':''}" onclick="answer(${i})" ${a!==undefined?'disabled':''}>${'ABCD'[i]}. ${x}</button>`).join('')}</div>${a!==undefined?`<div class="answer">${a===q.c?'✅ ถูกต้อง!':'❌ ยังไม่ถูกต้อง'}<br>เฉลย: ${'ABCD'[q.c]}. ${q.a[q.c]}<br>💡 ${q.why}</div>`:'<p class="note">เลือกคำตอบเพื่อรับเฉลยทันที</p>'}<div style="margin-top:20px" class="buttons"><button class="btn" onclick="quizBack()" ${qidx===0?'disabled':''}>← ข้อก่อน</button><button class="btn primary" onclick="quizNext()" ${a===undefined?'disabled':''}>${qidx===qs.length-1?'🏆 ดูผลคะแนน':'ข้อถัดไป →'}</button></div>`}
function resultPage(){let score=qs.reduce((s,q,i)=>s+(quizAnswers[i]===q.c?1:0),0);return `<div class="eyebrow">MISSION COMPLETE</div><h1>🏆 สรุปผล Mini Quiz</h1><div class="orb" style="font-size:100px">${score>=4?'🌟':'🪐'}</div><h2 style="text-align:center">${score} / ${qs.length} คะแนน</h2><p style="text-align:center">${score>=4?'เยี่ยมมาก! พร้อมเข้าสู่เกมทดสอบแยกไฟล์':'ลองกลับไปทบทวน แล้วทำแบบทดสอบอีกครั้งนะ'}</p><div class="fact">${qs.map((q,i)=>`<p class="mini">${quizAnswers[i]===q.c?'✅':'❌'} ข้อ ${i+1}: ${q.q}<br><span class="muted">เฉลย: ${q.a[q.c]}</span></p>`).join('')}</div><div class="buttons"><button class="btn" onclick="go(1)">📘 ทบทวนบทเรียน</button><button class="btn primary" onclick="restartQuiz()">🔄 ทำ Mini Quiz ใหม่</button></div>`}
function render(){let s=$('screen');s.innerHTML=page===10?resultPage():pages[page]();$('counter').textContent=page===0?'UNIT 02 • LESSON':page<9?`UNIT 02 • หน้า ${page}/8`:page===9?'UNIT 02 • MINI QUIZ':'UNIT 02 • RESULT';$('bar').style.width=`${Math.min(100,Math.max(0,(page/10)*100))}%`;$('prev').disabled=page===0;$('next').disabled=page>=9;$('next').textContent=page===8?'เริ่ม Mini Quiz →':'ถัดไป →';window.scrollTo({top:0,behavior:'instant'});}
function go(n){page=n;render()}function choosePlanet(i){selectedPlanet=i;render()}function answer(i){if(quizAnswers[qidx]!==undefined)return;quizAnswers[qidx]=i;render()}function quizNext(){if(quizAnswers[qidx]===undefined)return;if(qidx===qs.length-1)go(10);else{qidx++;render()}}function quizBack(){if(qidx>0){qidx--;render()}}function restartQuiz(){quizAnswers={};qidx=0;go(9)}$('home').onclick=()=>go(0);$('prev').onclick=()=>go(Math.max(0,page-1));$('next').onclick=()=>{if(page===8){qidx=0;go(9)}else go(Math.min(8,page+1))};render();
</script></body></html>
