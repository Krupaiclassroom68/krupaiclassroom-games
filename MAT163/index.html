function sound(kind){if(state.muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;let notes=kind==='win'?[660,880,1047]:kind==='lose'?[320,220]:[510];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.1);g.gain.exponentialRampToValueAtTime(.13,t+i*.1+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.17);o.connect(g);g.connect(audio.destination);o.start(t+i*.1);o.stop(t+i*.1+.18)})}catch(e){}}

function header(){return `<div class="top"><div class="logo">🎈 KRU PAI CLASSROOM <span style="color:#ffe17c">/ SUBTRACTION RIBBON</span></div><button class="chip" onclick="toggleSound()">${state.muted?'🔇':'🔊'}</button></div>`}
function render(){let b='';if(state.page==='home')b=`<section class="panel coverWow"><div class="coverStars">✦ &nbsp; ✧ &nbsp; ✦ &nbsp; ✧ &nbsp; ✦</div><div class="coverArt"><span class="coverBall c1">➖</span><span class="coverBall c2">✨</span><span class="coverBall c3">🎈</span></div><div class="coverTag">KRU PAI CLASSROOM • MATH ADVENTURE</div><h1 class="big coverTitle">SUBTRACTION<br><span>HUNDREDS RIBBON</span></h1><p class="sub">🎀 ลบเลข 3 หลักกับ 2 หลัก และ 3 หลักกับ 3 หลัก</p><p class="coverIntro">20 ภารกิจ • ฝึกการลบและการยืมพร้อมกระดาษทด • เติมคำตอบในลูกโป่ง<br>ตอบถูกแล้วลูกโป่งสลายเป็นริบบิ้นสุดอลังการ!</p><input id="student" class="name" maxlength="40" placeholder="✏️ ชื่อนักเรียน" value="${escapeHtml(state.name)}"><div class="nav"><button class="btn" onclick="goLesson()">📚 ทบทวนวิธีตั้งลบ</button><button class="btn secondary" onclick="start()">🚀 เริ่มปล่อยลูกโป่ง</button></div><div class="coverBottom">✍️ กระดาษทด • 🎉 ริบบิ้น • 🟢🔴 สถานะรายข้อ • 📱 iPad / TV</div></section>`;
else if(state.page==='lesson')b=`<section class="panel"><div class="sub">📚 ทบทวนก่อนประลอง</div><h1 class="big">ตั้งลบให้ตรงหลัก</h1><div class="lessonGrid"><div class="lessonCard"><strong>1. หลักหน่วยตรงกัน</strong><div class="additionDemo"> 583<br>− 47<br>────<br> 536</div>จัดหลักหน่วยให้ตรงกันก่อนลบ</div><div class="lessonCard"><strong>2. ยืมจากหลักสิบ</strong><div class="additionDemo"> 746<br>− 85<br>────<br> 661</div>6 ลบ 5 ได้ 1 แต่หลักสิบ 4 ลบ 8 ต้องยืมจากหลักร้อย</div><div class="lessonCard"><strong>3. ยืมข้ามศูนย์</strong><div class="additionDemo"> 902<br>− 68<br>────<br> 834</div>หลักหน่วย 2 ลบ 8 ต้องยืมผ่านหลักสิบที่เป็นศูนย์</div><div class="lessonCard"><strong>4. ตรวจด้วยการบวก</strong><div class="additionDemo"> 854<br>−326<br>────<br> 528</div>528 + 326 = 854 จึงตรวจได้ว่าลบถูกต้อง</div></div><div class="nav"><button class="btn" onclick="start()">🚀 เริ่ม 20 ข้อ</button><button class="btn secondary" onclick="goHome()">⌂ หน้าปก</button></div></section>`;
else if(state.page==='game')b=gameHtml();else if(state.page==='result')b=resultHtml();$('app').innerHTML=header()+b+'<div class="footer">Kru Pai Classroom • Subtraction Hundreds Ribbon • 20 Questions</div>'}
function questionNavigator(){return `<div class="questionLegend">🟢 ถูก &nbsp; 🔴 ผิด &nbsp; 🔵 กำลังทำ &nbsp; ⚪ ยังไม่ตอบ — แตะหมายเลขเพื่อเปิดดูคำตอบ</div><div class="questionNav" aria-label="เลือกหมายเลขข้อ">${Q.map((q,i)=>{let a=state.answers[i],d=state.drafts[i],hasDraft=d&&Object.values(d).some(v=>v!==''&&v!==null);let status=a?(a.correct?'correct':'wrong'):(hasDraft?'draft':'');return `<button type="button" class="questionDot ${status} ${state.index===i?'current':''}" onclick="jumpTo(${i})" aria-label="ข้อ ${i+1} ${a?(a.correct?'ถูก':'ผิด'):'ยังไม่ตรวจ'}" aria-current="${state.index===i?'step':'false'}">${i+1}${a?`<small>${a.correct?'✓':'✕'}</small>`:''}</button>`}).join('')}</div>`}
function jumpTo(i){if(scratchOpen)closeScratch();state.index=i;state.page='game';save();sound('click');render()}
function gameHtml(){const q=Q[state.index],d=state.drafts[state.index]||{},answered=state.answers[state.index];const [a,b]=q.target;const content=`<div class="addQuestion"><div class="subtractionNumbers"><span>${a}</span><span class="plusMark">−</span><span>${b}</span><span class="equalMark">=</span></div><div class="answerBalloon ${answered?.correct?'ribbonSuccess':''}" id="answerBalloon"><div class="balloonAnswer">${answered?escapeHtml(answerLabel(q,answered.value)):`<input aria-label="เติมผลลบ" id="sumInput" class="sumInput" type="number" inputmode="numeric" min="0" max="19998" placeholder="?" value="${escapeHtml(d.sum??'')}" oninput="setInput('sum',this.value)">`}</div><div class="balloonKnot"></div><div class="balloonString"></div></div></div>`;const explanation=answered?`<div class="answerExplanation"><strong>${answered.correct?'🎉 เยี่ยมมาก! ลูกโป่งกลายเป็นริบบิ้น!':'💡 ยังไม่ถูกนะจ๊ะ'}</strong><div>${explain(q)}</div><div>คำตอบที่กรอก: ${escapeHtml(answerLabel(q,answered.value))}</div></div>`:'';
return `<section class="panel gamePanel"><div class="row"><span class="chip">🎈 เติมคำตอบในลูกโป่ง</span><span class="chip">ข้อ ${state.index+1} / 20</span><span class="chip">⭐ ${state.answers.filter(x=>x?.correct).length} คะแนน</span></div><div class="progress"><div style="width:${state.answers.filter(Boolean).length/20*100}%"></div></div>${questionNavigator()}<h2 class="prompt">🧮 คำนวณผลลบ แล้วเติมคำตอบในลูกโป่ง</h2>${content}${explanation}<div class="nav"><button class="btn scratchBtn" onclick="openScratch()">✍️ กระดาษทดด้านข้าง</button><button class="btn secondary" onclick="move(-1)" ${state.index===0?'disabled':''}>← ย้อนกลับ</button>${answered?`<button class="btn" onclick="move(1)">${state.index===19?'🏆 สรุปคะแนน':'ข้อต่อไป →'}</button>`:`<button class="btn" id="checkBtn" onclick="check()" ${!ready(q,d)?'disabled':''}>🎯 ตรวจคำตอบ</button>`}<button class="btn secondary" onclick="move(1)" ${state.index===19?'disabled':''}>ข้ามข้อ →</button></div><p class="note">ตอบแล้วกลับมาดูได้ • รอยทดแยกตามข้อ • ไม่สุ่มโจทย์</p></section>`}
function ready(q,d){return /^\d+$/.test(String(d.sum??''))&&Number.isSafeInteger(Number(d.sum))&&Number(d.sum)>=0}
function explain(q){const [a,b]=q.target;return `${a} − ${b} = ${a-b} • ตั้งลบให้หลักหน่วยตรงกัน ลบจากขวาไปซ้าย ถ้าไม่พอให้ยืมจากหลักทางซ้าย และตรวจคำตอบด้วย ${a-b} + ${b} = ${a}`}
function answerLabel(q,v){return v==null?'ยังไม่ตอบ':String(v)}
function check(){const q=Q[state.index],d=state.drafts[state.index]||{};if(!ready(q,d)||state.answers[state.index])return;const v=Number(d.sum),correct=v===q.target[0]-q.target[1];state.answers[state.index]={correct,value:v};save();sound(correct?'win':'lose');if(correct){ribbonExplosion();setTimeout(render,1150)}else render()}
function setInput(k,v){const d=state.drafts[state.index]||{};d[k]=v;state.drafts[state.index]=d;const b=$('checkBtn');if(b)b.disabled=!ready(Q[state.index],d);save()}
function ribbonExplosion(){const balloon=$('answerBalloon');if(!balloon)return;balloon.classList.add('ribbonVanish');const rect=balloon.getBoundingClientRect();for(let i=0;i<65;i++){const ribbon=document.createElement('span');ribbon.className='ribbonPiece';ribbon.style.left=(rect.left+rect.width/2)+'px';ribbon.style.top=(rect.top+rect.height/2)+'px';ribbon.style.background=['#ffdd64','#ff5fa9','#63e6ff','#b9ff8a','#ba86ff','#fff'][i%6];ribbon.style.setProperty('--rx',((Math.random()-.5)*Math.min(innerWidth,800))+'px');ribbon.style.setProperty('--ry',((Math.random()-.5)*520)+'px');ribbon.style.setProperty('--rr',((Math.random()-.5)*1300)+'deg');document.body.append(ribbon);setTimeout(()=>ribbon.remove(),1500)}for(let i=0;i<7;i++){let em=document.createElement('span');em.className='emojiFly';em.textContent=['🎀','✨','🌟','🎉','💖','⭐','🎀'][i];em.style.left=(rect.left+rect.width/2+(Math.random()-.5)*150)+'px';em.style.top=(rect.top+rect.height/2)+'px';document.body.append(em);setTimeout(()=>em.remove(),1400)}}
function move(n){if(scratchOpen)closeScratch();if(n===1&&state.index===19){state.page='result';render();return}state.index=Math.max(0,Math.min(19,state.index+n));state.page='game';save();render()}
function resultHtml(){let count=state.answers.filter(x=>x?.correct).length,pct=Math.round(count/20*100);return `<section class="panel"><div class="hero">${pct>=80?'🎀🏆🎉':'🎈📚✨'}</div><h1 class="big">RIBBON VICTORY!</h1><p class="sub">${escapeHtml(state.name||'นักเรียน')} • ${new Date().toLocaleString('th-TH')}</p><div class="score">${count} / 20</div><p class="sub">${pct}% • ${pct>=90?'ดีเยี่ยม!':pct>=80?'ดีมาก!':pct>=70?'น่าพอใจ ควรฝึกซ้ำ':'ฝึกเพิ่มอีกนิดนะจ๊ะ'}</p><div class="nav"><button class="btn" onclick="state.review=!state.review;render()">📋 ${state.review?'ซ่อน':'ดู'}เฉลยทุกข้อ</button><button class="btn secondary" onclick="restart()">🔄 เริ่มครั้งใหม่</button></div>${state.review?`<div class="resultList">${Q.map((q,i)=>`<div class="resultItem">ข้อ ${i+1}: ${q.target[0]} + ${q.target[1]} = ${q.target[0]-q.target[1]} — ${state.answers[i]?(state.answers[i].correct?'✅':'❌'):'⚪ ยังไม่ตอบ'} ${state.answers[i]?'(ตอบ '+escapeHtml(answerLabel(q,state.answers[i].value))+')':''}</div>`).join('')}</div>`:''}</section>`}
function goHome(){state.page='home';render()}
function goLesson(){state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.page='lesson';sound('click');render()}
function start(){if(scratchOpen)closeScratch();state.name=$('student')?.value.trim()||state.name||'นักเรียน';state.index=0;state.page='game';state.answers=Array(20).fill(null);state.drafts={};state.review=false;inkData={};inkHistory={};save();sound('win');render()}
function restart(){state.page='home';state.index=0;state.answers=Array(20).fill(null);state.drafts={};state.review=false;inkData={};inkHistory={};save();render()}
function toggleSound(){state.muted=!state.muted;render()}
function save(){try{localStorage.setItem(GAME_ID+'-'+state.name,JSON.stringify({index:state.index,answers:state.answers,drafts:state.drafts,name:state.name,inkData:inkData}))}catch(e){}}

// Pen Engine V5 iPad Gesture Lock: stroke-based implementation ported from the supplied verified game.
// Normalized coordinates preserve writing when the side/bottom pad changes size.
function inkKey(){return String(state.index)}
const inkCanvas=$('scratchCanvas'), inkCtx=inkCanvas.getContext('2d');
function canvasCtx(){return inkCtx}
function inkRect(){return inkCanvas.getBoundingClientRect()}
function paintPaper(){const r=inkRect();if(!r.width||!r.height)return;const ratio=Math.min(window.devicePixelRatio||1,2);inkCanvas.width=Math.max(1,Math.round(r.width*ratio));inkCanvas.height=Math.max(1,Math.round(r.height*ratio));inkCtx.setTransform(ratio,0,0,ratio,0,0);redrawInk()}
function drawInkStroke(s,w,h){if(!s||!s.points?.length)return;inkCtx.save();inkCtx.lineCap='round';inkCtx.lineJoin='round';inkCtx.strokeStyle=s.color;inkCtx.lineWidth=s.color==='white'?23:(s.width||3.5);inkCtx.beginPath();s.points.forEach((p,i)=>i?inkCtx.lineTo(p[0]*w,p[1]*h):inkCtx.moveTo(p[0]*w,p[1]*h));if(s.points.length===1){const p=s.points[0];inkCtx.lineTo(p[0]*w+.1,p[1]*h+.1)}inkCtx.stroke();inkCtx.restore()}
function redrawInk(){if(!scratchOpen)return;const r=inkRect();if(!r.width)return;inkCtx.clearRect(0,0,r.width,r.height);for(const stroke of (inkData[inkKey()]||[]))drawInkStroke(stroke,r.width,r.height);if(currentStroke)drawInkStroke(currentStroke,r.width,r.height)}
function restoreInk(){redrawInk()}
function snapshotInk(){save()}
function openScratch(){if(scratchOpen){closeScratch();return}if(state.page!=='game')return;scratchOpen=true;document.body.classList.add('padVisible');$('scratchOverlay').classList.add('open');$('scratchOverlay').setAttribute('aria-hidden','false');$('scratchTitle').textContent='✍️ กระดาษทด • ข้อ '+(state.index+1);requestAnimationFrame(paintPaper)}
function closeScratch(){if(!scratchOpen)return;if(currentStroke){(inkData[inkKey()]??=[]).push(currentStroke);currentStroke=null;activePointer=null;save()}scratchOpen=false;document.body.classList.remove('padVisible');$('scratchOverlay').classList.remove('open');$('scratchOverlay').setAttribute('aria-hidden','true')}
function setPen(color,width,eraser=false){inkColor=color;inkWidth=width;erasing=eraser;sound('click');document.querySelectorAll('.scratchTool').forEach(b=>b.classList.remove('active'));}
function pointOf(e){const r=inkRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function preventInkGesture(e){if(e.cancelable)e.preventDefault()}
for(const eventName of ['touchstart','touchmove','touchend','touchcancel'])inkCanvas.addEventListener(eventName,preventInkGesture,{passive:false});
for(const eventName of ['contextmenu','selectstart','dragstart'])inkCanvas.addEventListener(eventName,e=>e.preventDefault());
function inkDown(e){if(!scratchOpen||activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;try{inkCanvas.setPointerCapture(e.pointerId)}catch(err){}currentStroke={color:erasing?'white':inkColor,width:inkWidth,points:[pointOf(e)]};redrawInk()}
function inkMove(e){if(!scratchOpen||e.pointerId!==activePointer||!currentStroke)return;e.preventDefault();const samples=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[e];for(const item of (samples.length?samples:[e]))currentStroke.points.push(pointOf(item));redrawInk()}
function inkUp(e){if(e.pointerId!==activePointer)return;if(e.cancelable)e.preventDefault();if(currentStroke){if(e.type==='pointerup')currentStroke.points.push(pointOf(e));(inkData[inkKey()]??=[]).push(currentStroke);currentStroke=null;save()}activePointer=null;try{if(inkCanvas.hasPointerCapture(e.pointerId))inkCanvas.releasePointerCapture(e.pointerId)}catch(err){}redrawInk()}
function undoInk(){if(!inkData[inkKey()]?.length)return;inkData[inkKey()].pop();redrawInk();save()}
function clearInk(){if(!confirm('ลบรอยทดของข้อนี้ทั้งหมด?'))return;inkData[inkKey()]=[];redrawInk();save()}
inkCanvas.addEventListener('pointerdown',inkDown,{passive:false});
inkCanvas.addEventListener('pointermove',inkMove,{passive:false});
inkCanvas.addEventListener('pointerup',inkUp,{passive:false});
inkCanvas.addEventListener('pointercancel',inkUp,{passive:false});
inkCanvas.addEventListener('lostpointercapture',e=>{if(e.pointerId===activePointer)inkUp(e)},{passive:false});
window.addEventListener('resize',()=>{if(scratchOpen)requestAnimationFrame(paintPaper)});

render();
</script></body></html>
