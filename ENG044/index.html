function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseTime(s){return s.split(":").map(Number)}
function clockSvg(time){
 const [h,m]=parseTime(time),hr=(h%12+m/60)*30,mi=m*6;
 let nums="";for(let n=1;n<=12;n++){let a=n*Math.PI/6-Math.PI/2;nums+=`<text x="${150+112*Math.cos(a)}" y="${156+112*Math.sin(a)}" text-anchor="middle" fill="#ffffff" font-size="22">${n}</text>`}

}

 if(state.page==="lesson"){const x=lessons[state.lesson];app.innerHTML=`<div class="glass"><div class="row"><span class="pill">FOR TEACH • บท ${state.lesson+1} / ${lessons.length}</span><span class="pill">ไม่มีตัวจับเวลา</span><button class="ghost" onclick="setPage('cover')">⌂ HOME</button></div><div class="progress"><div style="width:${(state.lesson+1)/lessons.length*100}%"></div></div><h2>${esc(x.title)}</h2><p class="muted">${esc(x.sub)}</p><div class="lesson"><div class="clockwrap">${clockSvg(x.time)}<div class="example">${esc(x.time)}</div><button onclick="speak('${x.sentence.replaceAll("'","\\'")}')">🔊 ฟังประโยคภาษาอังกฤษ</button></div><div><div class="example">${esc(x.sentence)}</div><h3>${esc(x.thai)}</h3><p>${esc(x.explain)}</p><div class="tip">💡 ${esc(x.tip)}</div><div class="tile" style="margin-top:15px"><h3>🎯 ลองอ่านตามครู</h3><p>ให้นักเรียนสังเกตเข็มสั้นและเข็มยาว แล้วอ่านเวลาเป็นภาษาอังกฤษ ก่อนกดฟังเสียงเพื่อตรวจคำอ่าน</p></div></div></div><div class="actions"><button class="ghost" ${state.lesson===0?"disabled":""} onclick="state.lesson--;render()">← ย้อนกลับ</button><button class="gold" onclick="${state.lesson===lessons.length-1?"startQuiz()":"state.lesson++;render()"}">${state.lesson===lessons.length-1?"📝 ทำแบบทดสอบ":"บทต่อไป →"}</button><button class="ghost" onclick="startQuiz()">ข้ามไปทดสอบ</button></div></div>`;return}
 if(state.page==="quiz"){const q=quiz[state.qi],selected=state.answers[state.qi],done=Object.keys(state.answers).length===quiz.length;app.innerHTML=`<div class="glass"><div class="row"><span class="pill">MINI ASSESSMENT</span><span class="pill">ข้อ ${state.qi+1} / ${quiz.length}</span><span class="pill">ตอบแล้ว ${Object.keys(state.answers).length} ข้อ</span><button class="ghost" onclick="setPage('cover')">⌂ HOME</button></div><div class="progress"><div style="width:${Object.keys(state.answers).length/quiz.length*100}%"></div></div><div class="lesson"><div class="clockwrap">${clockSvg(q[0])}<div class="example">${q[0]}</div></div><div><h2>What time is it?</h2><p class="muted">เลือกประโยคภาษาอังกฤษให้ตรงกับนาฬิกา</p><div class="options">${q[2].map((a,i)=>`<button class="opt ${selected===i?"selected":""}" onclick="setAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join("")}</div><div class="feedback">${selected===undefined?"เลือกคำตอบได้ 1 ข้อ แล้วกดถัดไป":"✓ บันทึกคำตอบแล้ว (เฉลยหลังจบเกม)"}</div></div></div><div class="actions"><button class="ghost" onclick="state.qi=Math.max(0,state.qi-1);render()">← ข้อก่อน</button><button class="gold" onclick="state.qi=Math.min(quiz.length-1,state.qi+1);render()">ข้อถัดไป →</button><button class="ghost" onclick="state.qi=0;render()">ข้อ 1</button><button class="gold" ${done?"":"disabled"} onclick="finish()">ส่งคำตอบและดูคะแนน</button></div><div class="quiznav">${quiz.map((x,i)=>`<button class="${i===state.qi?"active":""} ${state.answers[i]!==undefined?"answered":""}" onclick="state.qi=${i};render()">${i+1}</button>`).join("")}</div></div>`;return}
 if(state.page==="result"){const r=state.finished,items=mine(),pct=Math.round(r.score/r.total*100),best=Math.max(...items.map(x=>Math.round(x.score/x.total*100)));app.innerHTML=`<div class="glass"><div style="text-align:center"><div class="brand">KRU PAI CLASSROOM</div><h2>${state.showReview?"ANSWER REVIEW":"CLOCK ACADEMY • LEARNING REPORT"}</h2></div>${state.showReview?review():`<div class="muted" style="text-align:center">นักเรียน: <b>${esc(r.name)}</b> • 📅 ${localDate(r.date)}</div><div class="example">${r.score} / ${r.total} คะแนน</div><div class="stats"><div class="stat"><b>${pct}%</b>คะแนนล่าสุด</div><div class="stat"><b>${items.length}</b>จำนวนรอบ</div><div class="stat"><b>${best}%</b>คะแนนสูงสุด</div></div><div class="tile" style="margin-top:17px"><h3>📈 กราฟเส้นพัฒนาการ</h3>${graph(items)}</div><div class="tile" style="margin-top:15px"><h3>ประวัติคะแนน</h3><div class="row">${items.map((x,i)=>`<span class="pill">#${i+1} ${x.score}/${x.total} (${Math.round(x.score/x.total*100)}%)</span>`).join("")}</div></div><p style="text-align:center;color:${pct>=80?"#72f4b2":"#ffe578"}">${pct>=80?"ผ่านเกณฑ์ 80%":"ฝึกต่อเพื่อผ่านเกณฑ์ 80%"}</p><div class="actions"><button class="gold" onclick="shareReport()">📸 แชร์ภาพรายงาน PNG</button><button class="ghost" onclick="state.showReview=true;state.qi=0;render()">🔎 ดูเฉลยรายข้อ</button><button class="ghost" onclick="startQuiz()">🔁 เล่นอีกครั้ง</button><button class="ghost" onclick="state.lesson=0;setPage('lesson')">📖 ทบทวนบทเรียน</button><button class="ghost" onclick="setPage('cover')">⌂ HOME</button></div><p class="small">ภาพแชร์มีเฉพาะคะแนน ชื่อ วันเวลา และกราฟ • ไม่รวมเฉลย • ประวัติเก็บไว้ในเบราว์เซอร์นี้</p>`}</div>`;return}
}
render();
</script></body></html>
