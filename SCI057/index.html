const colorMap={'ดาวพุธ':'#b3aaa0','ดาวศุกร์':'#e7c68a','โลก':'#43a5f5','ดาวอังคาร':'#f46a4e','ดาวพฤหัสบดี':'#d9ad7e','ดาวเสาร์':'#e9ce85','ดาวยูเรนัส':'#81e4e9','ดาวเนปจูน':'#4773fa','พลูโต':'#b8a28c','ซีรีส':'#a6b0bc','อีริส':'#d2e4f7'};
function audioCtx(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();}catch(e){}}function tone(freq,dur=.12,type='sine',vol=.08,delay=0){if(muted||!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.01)}function sfx(ok){if(ok){[640,820,1050,1400].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.075))}else{tone(170,.5,'sawtooth',.14);tone(80,.6,'square',.055,.12)}}
function resize(){fxCanvas.width=innerWidth*devicePixelRatio;fxCanvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function blast(ok){particles=[];for(let i=0;i<(ok?110:155);i++){let a=Math.random()*Math.PI*2,s=(ok?2:4)+Math.random()*(ok?11:16);particles.push({x:innerWidth/2,y:innerHeight*.48,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40+Math.random()*35,r:1+Math.random()*5,c:ok?['#fff','#ffe877','#68e9ff','#ac7fff'][i%4]:['#ff3a35','#ffb128','#f4edbc','#b337ff'][i%4]})}if(fxFrame)cancelAnimationFrame(fxFrame);drawFx()}function drawFx(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(let p of particles){ctx.globalAlpha=Math.min(1,p.life/28);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life--}ctx.globalAlpha=1;if(particles.length)fxFrame=requestAnimationFrame(drawFx)}
function show(id){['cover','game','result'].forEach(n=>$(n).classList.toggle('hide',n!==id))}function start(){audioCtx();idx=0;score=0;history=[];show('game');render()}
function render(){if(idx>=QUESTIONS.length){finish();return}locked=false;selected=[];pairs=[];leftChoice=null;remaining=7;let q=QUESTIONS[idx];$('count').textContent=`MISSION ${String(idx+1).padStart(2,'0')} / 25`;$('type').textContent=({single:'🪐 SELECT THE PLANET',tf:'⚡ TRUE OR FALSE',multi:'🌠 COLLECT THEM ALL',match:'🔗 MATCH THE GALAXY'})[q.type];$('prompt').textContent=q.q;$('hint').textContent=q.type==='multi'?'เลือกทุกคำตอบที่ถูกต้อง แล้วกดยืนยัน':q.type==='match'?'แตะชื่อด้านซ้าย แล้วแตะคู่ด้านขวาให้ครบ':'แตะคำตอบให้ทันก่อนหมดเวลา';$('choices').innerHTML='';$('matches').innerHTML='';$('choices').classList.toggle('hide',q.type==='match');$('matches').classList.toggle('hide',q.type!=='match');$('confirm').classList.toggle('hide',q.type!=='multi');$('confirm').disabled=true;
if(q.type==='match'){let a=document.createElement('div'),b=document.createElement('div');a.className=b.className='matchCol';q.options.forEach((v,i)=>{let btn=document.createElement('button');btn.className='matchBtn';btn.textContent=v;btn.dataset.left=i;btn.onclick=()=>pickLeft(i);a.append(btn)});q.right.forEach((v,i)=>{let btn=document.createElement('button');btn.className='matchBtn';btn.textContent=v;btn.dataset.right=i;btn.onclick=()=>pickRight(i);b.append(btn)});$('matches').append(a,b)}else q.options.forEach((v,i)=>{let btn=document.createElement('button');btn.className='choice';if(colorMap[v]){let p=document.createElement('i');p.className='miniPlanet';p.style.setProperty('--planet',colorMap[v]);btn.append(p)}let t=document.createElement('span');t.textContent=v;btn.append(t);btn.onclick=()=>pick(i,btn);$('choices').append(btn)});
updateClock();clearInterval(ticker);ticker=setInterval(()=>{if(locked)return;remaining=Math.max(0,remaining-.1);updateClock();if(remaining<=0)answer(false,true)},100)}
function updateClock(){$('clock').textContent=remaining.toFixed(1)+'s';$('clock').style.color=remaining<=2?'#ff6171':'#ffe26b';$('fill').style.width=(remaining/7*100)+'%'}function pick(i,btn){if(locked)return;audioCtx();tone(470,.065,'triangle',.045);let q=QUESTIONS[idx];if(q.type==='multi'){selected.includes(i)?selected=selected.filter(n=>n!==i):selected.push(i);btn.classList.toggle('selected');$('confirm').disabled=selected.length===0}else{selected=[i];answer(selected.length===q.correct.length&&selected[0]===q.correct[0],false)}}
function pickLeft(i){if(locked||pairs.some(p=>p[0]===i))return;leftChoice=i;document.querySelectorAll('[data-left]').forEach(b=>b.classList.toggle('active',+b.dataset.left===i));tone(530,.08)}function pickRight(i){if(locked||leftChoice===null||pairs.some(p=>p[1]===i))return;let q=QUESTIONS[idx],l=leftChoice;leftChoice=null;document.querySelectorAll('[data-left]').forEach(b=>b.classList.remove('active'));if(q.correct[l]!==i){let b=document.querySelector(`[data-right="${i}"]`);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),250);tone(180,.18,'sawtooth');return}pairs.push([l,i]);document.querySelector(`[data-left="${l}"]`).classList.add('done');document.querySelector(`[data-right="${i}"]`).classList.add('done');tone(830,.12);if(pairs.length===q.options.length)answer(true,false)}
function answer(ok,timeout){if(locked)return;locked=true;clearInterval(ticker);let q=QUESTIONS[idx];if(q.type==='multi'&&!timeout){ok=selected.length===q.correct.length&&selected.every(n=>q.correct.includes(n))}if(ok)score++;history.push({q:q.q,ok,why:q.why,answer:q.type==='match'?q.options.map((v,i)=>v+' → '+q.right[q.correct[i]]).join(' | '):q.correct.map(i=>q.options[i]).join(', ')});sfx(ok);blast(ok);$('feedbackTitle').textContent=ok?'✨ STAR SHATTER!':'💥 BIG BANG!';$('feedbackTitle').style.color=ok?'#6cfde0':'#ff806c';$('feedbackWhy').textContent=(timeout?'⏰ หมดเวลา! ':'')+q.why;$('feedback').classList.remove('hide');if(!ok)$('game').classList.add('shake');setTimeout(()=>{$('feedback').classList.add('hide');$('game').classList.remove('shake');idx++;render()},1550)}
function finish(){clearInterval(ticker);show('result');$('score').textContent=score+' / 25';$('rating').textContent=score>=23?'🌟 GALAXY LEGEND!':score>=20?'🏆 SPACE MASTER!':score>=15?'🚀 SPACE EXPLORER!':'🪐 ฝึกอีกครั้งแล้วพิชิตจักรวาล!';$('who').textContent=($('player').value.trim()||'นักสำรวจอวกาศ')+' • '+new Date().toLocaleString('th-TH');$('review').innerHTML=history.map((h,i)=>`<div class="reviewItem"><b>${h.ok?'✅':'❌'} ข้อ ${i+1}. ${escapeHtml(h.q)}</b><div>เฉลย: ${escapeHtml(h.answer)}</div><div class="small">${escapeHtml(h.why)}</div></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=start;$('again').onclick=start;$('confirm').onclick=()=>{if(!locked)answer(false,false)};$('toggleReview').onclick=()=>$('review').classList.toggle('hide');$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 ปิดเสียง':'🔊 เสียง';audioCtx()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&ticker&&!locked){clearInterval(ticker);remaining=0;answer(false,true)}});
</script></body></html>
