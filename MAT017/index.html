<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Special M.1 Math Challenge | Kru Pai Classroom</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;color:#14243a;background:linear-gradient(145deg,#eefaff,#fff8e9);min-height:100vh}.page{max-width:1050px;margin:auto;padding:16px}.panel{background:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 50px #264b6b22;border:1px solid #dce8f1}.hide{display:none!important}.brand{font-weight:900;color:#17769f}.cover{text-align:center;padding:20px 8px}.icons{font-size:55px}.title{font-size:clamp(38px,7vw,72px);font-weight:1000;line-height:1.03;margin:10px;background:linear-gradient(90deg,#147aa5,#5256d8,#f29a28);background-clip:text;color:transparent}.subtitle{font-size:clamp(17px,2.4vw,24px);font-weight:800;color:#587087}.namebox{max-width:500px;margin:28px auto}.namebox label{font-size:20px;font-weight:900;display:block;margin-bottom:9px}.namebox input{width:100%;padding:16px;border:2px solid #cbdde9;border-radius:17px;font-size:22px;text-align:center;font-weight:800}.warn{height:28px;color:#c34a45;font-weight:800;padding-top:5px}.btn{border:0;border-radius:17px;padding:14px 21px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(135deg,#147ca7,#5457dc);cursor:pointer}.btn.light{background:#fff;color:#34506a;border:2px solid #d4e2ec}.btn:disabled{opacity:.35;cursor:default}.player{display:inline-block;background:#edf7ff;border-radius:99px;padding:8px 14px;font-weight:900;margin:9px 0}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#edf4f9;border-radius:99px;padding:8px 12px;font-weight:850}.nums{display:grid;grid-template-columns:repeat(13,1fr);gap:6px;margin:14px 0}.num{border:0;border-radius:9px;padding:8px 2px;font-weight:900;background:#e8eef3;color:#486075}.num.done{background:#dce4ff;color:#3447bd}.num.cur{outline:3px solid #f2a52b}.question{display:block;background:#fff;border:2px solid #d5e5ef;border-radius:22px;padding:22px;margin:17px 0;font-size:clamp(23px,3.6vw,38px);font-weight:900;line-height:1.45;min-height:125px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choice{display:block;border:2px solid #d5e3ed;background:#fff;border-radius:18px;padding:17px;text-align:left;font-size:clamp(20px,2.8vw,28px);font-weight:850;cursor:pointer;color:#14243a}.choice.chosen{border:4px solid #5966db;background:#f0f1ff}.choice:disabled{opacity:1;cursor:default}.feedback{min-height:38px;font-size:21px;font-weight:950;margin:13px 0}.nav{display:flex;justify-content:space-between;gap:10px}.lock{text-align:center;background:#fff4d7;border:2px dashed #e4a12c;border-radius:18px;padding:15px;margin-top:18px;font-weight:850}.score{font-size:70px;font-weight:1000;color:#4755ce}.answer{border:1px solid #d9e5ee;border-radius:18px;padding:16px;margin:11px 0;background:#fff}.answer h3{margin:0 0 7px;color:#4456c8}.correct{font-weight:950;color:#168255;margin-top:7px}.why{color:#536a7b;margin-top:5px}.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1;margin:0 .08em}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 .1em .06em}.frac span:last-child{padding:.06em .1em 0}@media(max-width:650px){.choices{grid-template-columns:1fr}.nums{grid-template-columns:repeat(5,1fr)}.panel{padding:15px}.page{padding:9px}.question{min-height:0}}
</style>
<style>
.qbadge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  height:64px;
  padding:0 12px;
  margin:0 0 14px 0;
  border-radius:50%;
  background:#dff3ff;
  border:3px solid #a9d9f3;
  color:#176d9a;
  font-size:25px;
  font-weight:1000;
  box-shadow:0 7px 18px rgba(45,143,193,.16);
  white-space:nowrap;
}
@media(max-width:650px){
  .qbadge{min-width:56px;height:56px;font-size:22px;border-width:2px}
}
</style>

<style>
.num{position:relative;min-height:42px}
.num.correct{background:#dff7e9!important;color:#117746!important;border:2px solid #8ed6ad}
.num.wrong{background:#ffe4e2!important;color:#b53d39!important;border:2px solid #efaaa5}
.num .mark{display:inline-flex;align-items:center;justify-content:center;margin-left:3px;font-size:13px;font-weight:1000}
.num.correct .mark{color:#11834c}.num.wrong .mark{color:#c6423d}
.num.unanswered{background:#e8eef3;color:#486075}

</style>
</head><body><div class="page">
<section id="cover" class="panel cover"><div class="brand">Kru Pai Classroom</div><div class="icons">🏆 📐 ✨</div><div class="title">SPECIAL M.1<br>MATH CHALLENGE</div><div class="subtitle">ข้อสอบคณิตศาสตร์ระดับยาก • สอบเข้า ม.1 ห้องพิเศษ • 25 ข้อ</div><div class="namebox"><label>ชื่อผู้ทำแบบทดสอบ</label><input id="nameInput" placeholder="พิมพ์ชื่อที่นี่"><div id="warn" class="warn"></div></div><button id="startBtn" class="btn">🚀 START CHALLENGE</button></section>
<section id="quiz" class="panel hide"><div class="brand">Kru Pai Classroom • SPECIAL M.1</div><div id="player" class="player"></div><div class="stats"><div id="done" class="pill"></div><div id="right" class="pill"></div><div id="wrong" class="pill"></div></div><div id="nums" class="nums"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="nav"><button id="prev" class="btn light">← ก่อนหน้า</button><button id="next" class="btn">ข้อถัดไป →</button></div><div class="lock">🔒 <span id="lockText">เฉลยจะเปิดเมื่อทำครบ 25 ข้อ</span><br><br><button id="reveal" class="btn" disabled>ดูคะแนนและเฉลย</button></div></section>
<section id="result" class="panel hide"><div class="brand">Kru Pai Classroom</div><div id="resultPlayer" class="player"></div><div class="title" style="font-size:48px">MISSION COMPLETE</div><div id="score" class="score"></div><div id="summary" class="subtitle"></div><div id="answers"></div><button class="btn" onclick="location.reload()">↻ เล่นใหม่</button></section>
</div><script>
const DATA=[{"q": "3x + 8 = 5x − 18 จงหาค่า x", "opts": ["12", "13", "11", "14"], "ans": 1, "exp": "3x+8=5x−18 ⇒ 26=2x ⇒ x=13"}, {"q": "48 ÷ [6 + 2(5 − 3)] × 5 มีค่าเท่าใด", "opts": ["40", "24", "30", "20"], "ans": 1, "exp": "5−3=2, 6+2×2=10 ⇒ 48÷10×5=24"}, {"q": "ถ้า 3/4 ของจำนวนหนึ่ง มากกว่า 2/5 ของจำนวนนั้นอยู่ 21 จำนวนนั้นมีค่าเท่าใด", "opts": ["60", "54", "48", "72"], "ans": 0, "exp": "(3/4−2/5)x=21 ⇒ 7/20x=21 ⇒ x=60"}, {"q": "จำนวนสามจำนวนเรียงกันมีผลบวก 123 ผลคูณของจำนวนที่น้อยที่สุดกับมากที่สุดเท่าใด", "opts": ["1,640", "1,680", "1,722", "1,600"], "ans": 1, "exp": "จำนวนคือ 40, 41, 42 ⇒ 40×42=1,680"}, {"q": "สินค้าราคา 800 บาท ลด 20% แล้วลดเพิ่มอีก 10% จากราคาที่ลดแล้ว ต้องจ่ายเท่าใด", "opts": ["576 บาท", "600 บาท", "560 บาท", "584 บาท"], "ans": 0, "exp": "800×0.8×0.9=576"}, {"q": "ต้นทุน 480 บาท ขายกำไร 25% ถ้าต้องการให้กำไรเหลือ 10% ของต้นทุน ต้องลดราคาขายเดิมลงกี่บาท", "opts": ["72 บาท", "60 บาท", "80 บาท", "48 บาท"], "ans": 0, "exp": "ขายเดิม=600 ราคาใหม่=528 ⇒ ลดลง72"}, {"q": "2/3 + 5/6 ÷ 5/12 มีค่าเท่าใด", "opts": ["2 1/2", "2 1/3", "3", "2 2/3"], "ans": 3, "exp": "ทำหารก่อน: 5/6÷5/12=2 แล้ว 2+2/3=2 2/3"}, {"q": "จำนวนหนึ่งเพิ่มขึ้น 20% แล้วเป็น 360 ถ้าลดจำนวนเดิมลง 20% จะเหลือเท่าใด", "opts": ["288", "260", "300", "240"], "ans": 3, "exp": "จำนวนเดิม=360÷1.2=300 แล้ว 300×0.8=240"}, {"q": "แดง:น้ำเงิน:เขียว = 3:4:5 ถ้าเพิ่มแดง 12 ลูก แล้วแดง:น้ำเงิน = 3:2 เดิมมีลูกแก้วทั้งหมดกี่ลูก", "opts": ["60", "36", "48", "42"], "ans": 2, "exp": "เดิม 3k,4k,5k; (3k+12)/(4k)=3/2 ⇒ k=4 ⇒ รวม48"}, {"q": "ชาย:หญิง = 5:7 ถ้าหญิงมากกว่าชาย 12 คน มีนักเรียนทั้งหมดกี่คน", "opts": ["66", "72", "84", "60"], "ans": 1, "exp": "2 ส่วน=12 ⇒ 1 ส่วน=6 ⇒ รวม12ส่วน=72"}, {"q": "นาฬิกาดังทุก 12, 18 และ 30 นาที ถ้าดังพร้อมกัน 08:00 จะพร้อมกันอีกครั้งเวลาใด", "opts": ["10:00", "09:30", "11:00", "10:30"], "ans": 2, "exp": "ค.ร.น.(12,18,30)=180 นาที=3 ชั่วโมง"}, {"q": "จัดดินสอ 84 ปากกา 126 ยางลบ 210 เป็นชุดเหมือนกันไม่เหลือ จะได้มากที่สุดกี่ชุด", "opts": ["42", "63", "28", "21"], "ans": 0, "exp": "ห.ร.ม.(84,126,210)=42"}, {"q": "2(x+5)+3(x−2)=49 แล้ว x เท่าใด", "opts": ["10", "7", "8", "9"], "ans": 3, "exp": "2x+10+3x−6=49 ⇒ 5x+4=49 ⇒ x=9"}, {"q": "พ่ออายุเป็น 4 เท่าของลูก อีก 8 ปี พ่อจะอายุเป็น 2 เท่าของลูก ปัจจุบันลูกอายุกี่ปี", "opts": ["4 ปี", "6 ปี", "10 ปี", "8 ปี"], "ans": 0, "exp": "4x+8=2(x+8) ⇒ x=4"}, {"q": "สี่เหลี่ยมผืนผ้ายาวกว่ากว้าง 6 ซม. เส้นรอบรูป 52 ซม. พื้นที่เท่าใด", "opts": ["160", "150", "144", "168"], "ans": 0, "exp": "กว้าง+ยาว=26 และยาว=กว้าง+6 ⇒ กว้าง10 ยาว16 ⇒ พื้นที่160"}, {"q": "สี่เหลี่ยมจัตุรัสพื้นที่ 196 ตร.ซม. เพิ่มด้านขึ้น 3 ซม. พื้นที่จะเพิ่มเท่าใด", "opts": ["93", "90", "87", "84"], "ans": 0, "exp": "ด้านเดิม14 ด้านใหม่17 ⇒ 17²−14²=93"}, {"q": "สามเหลี่ยมพื้นที่ 84 ตร.ซม. สูง 12 ซม. ฐานยาวเท่าใด", "opts": ["12", "16", "14", "18"], "ans": 2, "exp": "84=1/2×ฐาน×12 ⇒ ฐาน14"}, {"q": "วงกลมรัศมี 7 ซม. มีพื้นที่มากกว่าสี่เหลี่ยม 7×18 ซม. เท่าใด กำหนด π=22/7", "opts": ["36", "24", "28", "32"], "ans": 2, "exp": "พื้นที่วงกลม154 สี่เหลี่ยม126 ⇒ ต่าง28"}, {"q": "กล่อง 8×15×12 ซม. เติมน้ำ 3/4 ของความจุ มีน้ำกี่ ลบ.ซม.", "opts": ["960", "1,080", "1,020", "1,120"], "ans": 1, "exp": "ความจุ1,440; 3/4×1,440=1,080"}, {"q": "แบบรูป 2, 6, 12, 20, 30, … จำนวนถัดไปคือ", "opts": ["48", "40", "36", "42"], "ans": 3, "exp": "ผลต่าง4,6,8,10 ถัดไปเพิ่ม12 ⇒ 42"}, {"q": "แบบรูป 1, 2, 6, 15, 31, … จำนวนถัดไปคือ", "opts": ["63", "52", "48", "56"], "ans": 3, "exp": "เพิ่ม1²,2²,3²,4² ถัดไปเพิ่ม5²=25 ⇒ 56"}, {"q": "1 ถึง 100 มีกี่จำนวนที่หารด้วย 3 ลงตัว แต่หารด้วย 5 ไม่ลงตัว", "opts": ["30", "26", "27", "28"], "ans": 2, "exp": "หาร3ลงตัว33; หาร15ลงตัว6 ⇒ 33−6=27"}, {"q": "ใช้เลข 1,2,3,4 สร้างจำนวนสามหลักไม่ซ้ำกัน และเป็นจำนวนคู่ ได้กี่จำนวน", "opts": ["10", "12", "16", "8"], "ans": 1, "exp": "หลักหน่วย2วิธี × หลักร้อย3 × หลักสิบ2 =12"}, {"q": "ชนะได้ 5 คะแนน แพ้เสีย 2 คะแนน แข่ง 10 ครั้ง ได้รวม 29 คะแนน ไม่มีเสมอ ชนะกี่ครั้ง", "opts": ["9", "6", "8", "7"], "ans": 3, "exp": "5w−2(10−w)=29 ⇒ 7w=49 ⇒ w=7"}, {"q": "ถังมีน้ำ 3/5 ของความจุ เติมอีก 24 ลิตร กลายเป็น 9/10 ของความจุ ถังจุกี่ลิตร", "opts": ["72", "90", "80", "60"], "ans": 2, "exp": "9/10−3/5=3/10; 3/10 ของถัง=24 ⇒ ถัง=80"}];
let cur=0,picks=new Array(DATA.length).fill(null),playerName="";
const $=id=>document.getElementById(id);
function frac(v){return String(v).replace(/(\d+)\/(\d+)/g,'<span class="frac"><span>$1</span><span>$2</span></span>')}
function start(){let n=$("nameInput").value.trim();if(!n){$("warn").textContent="กรุณาพิมพ์ชื่อก่อนเริ่ม";$("nameInput").focus();return}playerName=n;$("cover").classList.add("hide");$("quiz").classList.remove("hide");$("player").textContent="👤 "+n;$("resultPlayer").textContent="👤 "+n;makeNums();render()}
function makeNums(){$("nums").innerHTML="";DATA.forEach((_,i)=>{let b=document.createElement("button");b.className="num unanswered";b.innerHTML='<span>'+(i+1)+'</span><span class="mark"></span>';b.onclick=()=>{cur=i;render()};b.id="n"+i;$("nums").appendChild(b)})}
function render(){$("question").innerHTML='<span class="qbadge">ข้อ '+(cur+1)+'</span><br>'+frac(DATA[cur].q);$("choices").innerHTML="";DATA[cur].opts.forEach((o,j)=>{let b=document.createElement("button");b.className="choice"+(picks[cur]===j?" chosen":"");b.innerHTML="<b>"+String.fromCharCode(65+j)+".</b> "+frac(o);if(picks[cur]!==null)b.disabled=true;else b.onclick=()=>choose(j);$("choices").appendChild(b)});if(picks[cur]===null){$("feedback").textContent="เลือกคำตอบ 1 ข้อ";$("feedback").style.color="#42566b"}else if(picks[cur]===DATA[cur].ans){$("feedback").textContent="✓ ถูกต้อง";$("feedback").style.color="#168255"}else{$("feedback").textContent="✗ ยังไม่ถูก";$("feedback").style.color="#c34a45"}update()}
function choose(j){if(picks[cur]!==null)return;picks[cur]=j;render()}
function move(d){cur=Math.max(0,Math.min(DATA.length-1,cur+d));render()}
function update(){let d=picks.filter(x=>x!==null).length,r=picks.reduce((n,x,i)=>n+(x===DATA[i].ans),0);$("done").textContent="ทำแล้ว "+d+"/25";$("right").textContent="ถูก "+r;$("wrong").textContent="ผิด "+(d-r);DATA.forEach((_,i)=>{let n=$("n"+i),mark=n.querySelector(".mark");if(picks[i]===null){n.className="num unanswered"+(i===cur?" cur":"");mark.textContent=""}else if(picks[i]===DATA[i].ans){n.className="num done correct"+(i===cur?" cur":"");mark.textContent="✓"}else{n.className="num done wrong"+(i===cur?" cur":"");mark.textContent="✗"}});$("reveal").disabled=d<25;$("lockText").textContent=d<25?"เฉลยจะเปิดเมื่อทำครบ 25 ข้อ":"ทำครบแล้ว เปิดเฉลยได้"}
function results(){$("quiz").classList.add("hide");$("result").classList.remove("hide");let r=picks.reduce((n,x,i)=>n+(x===DATA[i].ans),0);$("score").textContent=r+" / 25";$("summary").textContent="คะแนน "+Math.round(r/25*100)+"% • ถูก "+r+" • ผิด "+(25-r);let order=[6,19,2,14,23,8,0,17,11,24,4,21,9,15,1,18,12,5,22,10,3,20,7,16,13];$("answers").innerHTML=order.map(i=>'<div class="answer"><h3>เฉลยข้อ '+(i+1)+'</h3><div>'+frac(DATA[i].q)+'</div><div class="correct">✓ '+String.fromCharCode(65+DATA[i].ans)+'. '+frac(DATA[i].opts[DATA[i].ans])+'</div>'+'<div class="why">'+frac(DATA[i].exp)+'</div></div>').join("");window.scrollTo(0,0)}
$("startBtn").addEventListener("click",start);$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")start()});$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("reveal").addEventListener("click",results);
</script></body></html>
