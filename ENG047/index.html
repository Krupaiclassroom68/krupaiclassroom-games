<title>Time Master Galaxy EP3 - Mixed Judgment TV Final Fix</title>
<style>

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{

}
body::before{
  content:""; position:fixed; inset:-10%;

    radial-gradient(circle,rgba(255,255,255,.95) 1px,transparent 1.8px),

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

@keyframes redFlash{0%,100%{filter:none}45%{filter:drop-shadow(0 0 50px rgba(255,95,109,.9))}}

.kpc-report{max-width:930px;margin:auto;text-align:center}
.kpc-brand{font-size:clamp(1.45rem,4vw,2.4rem);font-weight:1000;color:#ffe96a;letter-spacing:1px}

<body>
<div id="app"></div>
<div id="fx" class="fx"><div class="fx-box"><div id="fxIcon" class="fx-icon">✅</div><div id="fxText" class="fx-text">TIME MASTER!</div></div></div>

<script>
const ROUND_TIME=15;

// Final fix:
// 1) ใช้ addEventListener แทน inline onclick เพื่อให้ o'clock กดได้แน่นอน
// 2) quarter ทุกประโยคที่ถูกหลัก ใส่ "a quarter" แล้ว
// 3) ไม่มีตัวเลือกที่ถูกซ้ำความหมายในข้อเดียว
const QUESTIONS=[
  {time:"04:40",mode:"Past / To",answer:"It is twenty to five.",choices:["It is twenty past five.","It is twenty to five.","It is forty past four.","It is a quarter to five."]},
  {time:"07:15",mode:"Past / To",answer:"It is a quarter past seven.",choices:["It is a quarter past seven.","It is a quarter to seven.","It is fifteen to seven.","It is a quarter past eight."]},
  {time:"09:20",mode:"Digital",answer:"It is nine twenty.",choices:["It is nine twenty.","It is nine twelve.","It is twenty nine.","It is nine forty."]},
  {time:"11:45",mode:"Past / To",answer:"It is a quarter to twelve.",choices:["It is a quarter past eleven.","It is a quarter to twelve.","It is a quarter to eleven.","It is forty-five to twelve."]},
  {time:"02:05",mode:"Digital",answer:"It is two oh five.",choices:["It is two oh five.","It is two fifty.","It is five oh two.","It is two fifteen."]},
  {time:"03:30",mode:"Digital",answer:"It is three thirty.",choices:["It is three thirty.","It is thirty to three.","It is three thirteen.","It is four thirty."]},
  {time:"06:50",mode:"Past / To",answer:"It is ten to seven.",choices:["It is ten past seven.","It is ten to seven.","It is ten to six.","It is a quarter to seven."]},
  {time:"10:10",mode:"Digital",answer:"It is ten ten.",choices:["It is ten ten.","It is ten twenty.","It is ten oh one.","It is one ten."]},
  {time:"08:35",mode:"Past / To",answer:"It is twenty-five to nine.",choices:["It is twenty-five past nine.","It is twenty-five to nine.","It is thirty-five to eight.","It is a quarter to nine."]},
  {time:"12:00",mode:"Digital",answer:"It is twelve o'clock.",choices:["It is twelve o'clock.","It is zero twelve.","It is twelve thirty.","It is a quarter to twelve."]},
  {time:"01:25",mode:"Digital",answer:"It is one twenty-five.",choices:["It is one twenty-five.","It is one fifty-two.","It is twenty-five one.","It is one fifteen."]},
  {time:"05:55",mode:"Past / To",answer:"It is five to six.",choices:["It is five past six.","It is five to six.","It is fifty-five to five.","It is ten to six."]}
];

const PRAISES=["TIME MASTER!","PERFECT!","GALAXY CLEAR!","AWESOME!","LEGENDARY!","GREAT JOB!"];
const state={screen:"start",name:"",index:0,score:0,streak:0,best:0,time:ROUND_TIME,locked:false,timer:null,history:[],currentChoices:[]};
let audioCtx=null;

function getCtx(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx;}
function tone(ctx,f1,f2,dur,type,gain,when){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,when);if(f1!==f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),when+dur);g.gain.setValueAtTime(.001,when);g.gain.exponentialRampToValueAtTime(gain,when+.015);g.gain.exponentialRampToValueAtTime(.001,when+dur);o.connect(g);g.connect(ctx.destination);o.start(when);o.stop(when+dur+.03);}
function beep(type){const ctx=getCtx();if(!ctx)return;const now=ctx.currentTime;if(type==="click")tone(ctx,520,760,.11,"triangle",.12,now);if(type==="correct")[523,659,784,1046].forEach((f,i)=>tone(ctx,f,f,.23,"sine",.15,now+i*.07));if(type==="wrong"){tone(ctx,260,70,.45,"sawtooth",.22,now);tone(ctx,130,45,.55,"square",.12,now+.05);}if(type==="timeout"){[190,150,110,75].forEach((f,i)=>tone(ctx,f,f,.18,"sawtooth",.18,now+i*.14));tone(ctx,60,35,.7,"square",.09,now+.1);}if(type==="tick")tone(ctx,860,860,.04,"square",.04,now);if(type==="win")[523,659,784,1046,1318].forEach((f,i)=>tone(ctx,f,f,.28,"sine",.14,now+i*.09));}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function parseTime(t){const p=t.split(":").map(Number);return {hh:p[0],mm:p[1]}}
function clockMarkup(idPrefix=""){const nums=`<div class="num" style="left:50%;top:12%">12</div><div class="num" style="left:88%;top:50%">3</div><div class="num" style="left:50%;top:88%">6</div><div class="num" style="left:12%;top:50%">9</div>`;return `<div class="clock-shell" id="${idPrefix}clockShell">${nums}<div class="hand hour" id="${idPrefix}hourHand"></div><div class="hand minute" id="${idPrefix}minuteHand"></div><div class="pin"></div><div class="digital-chip" id="${idPrefix}clockChip">08:35</div></div>`}
function setClock(t,idPrefix=""){const {hh,mm}=parseTime(t);const minuteDeg=mm*6;const hourDeg=(hh%12)*30+mm*.5;const h=document.getElementById(idPrefix+"hourHand");const m=document.getElementById(idPrefix+"minuteHand");const chip=document.getElementById(idPrefix+"clockChip");if(h){h.style.transform=`rotate(${hourDeg}deg)`;h.style.setProperty("--base",hourDeg+"deg")}if(m){m.style.transform=`rotate(${minuteDeg}deg)`;m.style.setProperty("--base",minuteDeg+"deg")}if(chip)chip.textContent=t}

function render(){
  const app=document.getElementById("app");
  if(state.screen==="start"){
    app.innerHTML=`<div class="screen"><div class="glass"><div class="layer start"><section><div class="badge">🌌 EP3 • Mixed Judgment • TV Mode</div><h1 class="title">TIME MASTER<br><span>GALAXY</span></h1><div class="subtitle">เลือกคำตอบที่ดีที่สุดจากรูปแบบที่ปนกัน ✨<br>บางข้อเป็น Digital Reading บางข้อเป็น Past / To — แต่มีคำตอบถูกเพียงข้อเดียวเท่านั้น</div><div class="rules"><div class="rule">🎯 One correct answer</div><div class="rule">⏳ 15 seconds each</div><div class="rule">📺 Big TV full screen</div></div><input id="playerName" placeholder="Type your name"><div class="actions"><button class="primary" id="startBtn">START EP3 🚀</button><button class="secondary" id="testBtn">TEST CLOCK ✨</button></div></section><section class="hero"><div class="orbit"></div>${clockMarkup("start")}</section></div></div></div>`;
    document.getElementById("startBtn").addEventListener("click",startGame);
    document.getElementById("testBtn").addEventListener("click",demoSpin);
    setClock("08:35","start");
  }
  if(state.screen==="game"){
    const q=QUESTIONS[state.index]; const choices=state.currentChoices.length?state.currentChoices:q.choices;
    app.innerHTML=`<div class="screen"><div class="glass" id="gameGlass"><div class="layer game"><div class="hud"><div class="hud-card"><div class="hud-label">PLAYER</div><div class="hud-value">${esc(state.name)}</div></div><div class="hud-card"><div class="hud-label">QUESTION</div><div class="hud-value">${state.index+1}/${QUESTIONS.length}</div></div><div class="hud-card"><div class="hud-label">SCORE</div><div class="hud-value">${state.score}</div></div><div class="hud-card"><div class="hud-label">STREAK</div><div class="hud-value">${state.streak}</div></div><div class="hud-card"><div class="hud-label">TIME</div><div class="hud-value" id="timeValue">${state.time}</div></div></div><div class="battle"><div class="clock-zone"><div class="stage-label">MODE HINT: ${esc(q.mode)}</div>${clockMarkup("game")}<div class="big-digital">${esc(q.time)}</div><div class="prompt">Choose the BEST time sentence</div></div><div class="options" id="optionsBox"></div></div></div></div></div>`;
    const box=document.getElementById("optionsBox");
    choices.forEach(choice=>{
      const btn=document.createElement("button");
      btn.className="option";
      btn.textContent=choice;
      btn.addEventListener("click",()=>checkAnswer(btn,choice));
      box.appendChild(btn);
    });
    setClock(q.time,"game");
  }
  if(state.screen==='summary'){kpcRenderSummary();}

}
function demoSpin(){beep("correct");const shell=document.getElementById("startclockShell");if(shell){shell.classList.add("spin-fast");setTimeout(()=>shell.classList.remove("spin-fast"),900)}}
function startGame(){state.kpcSaved=false;state.kpcLatest=null;beep("click");const input=document.getElementById("playerName");state.name=(input&&input.value.trim())||"Time Master";state.index=0;state.score=0;state.streak=0;state.best=0;state.history=[];state.currentChoices=shuffle(QUESTIONS[0].choices);state.locked=false;state.time=ROUND_TIME;state.screen="game";render();startTimer()}
function startTimer(){clearInterval(state.timer);state.time=ROUND_TIME;const tv=document.getElementById("timeValue");if(tv)tv.textContent=state.time;state.timer=setInterval(()=>{state.time--;const tv=document.getElementById("timeValue");if(tv)tv.textContent=state.time;if(state.time<=3&&state.time>0)beep("tick");if(state.time<=0){clearInterval(state.timer);timeoutAnswer()}},1000)}
function checkAnswer(btn,choice){if(state.locked)return;state.locked=true;clearInterval(state.timer);beep("click");const q=QUESTIONS[state.index];document.querySelectorAll(".option").forEach(b=>b.disabled=true);const ok=choice===q.answer;if(ok){btn.classList.add("correct");state.score++;state.streak++;state.best=Math.max(state.best,state.streak);state.history.push({time:q.time,answer:q.answer,ok:true});correctFX();setTimeout(nextQuestion,1300)}else{btn.classList.add("wrong");state.streak=0;state.history.push({time:q.time,answer:q.answer,ok:false});wrongFX();setTimeout(nextQuestion,1150)}}
function timeoutAnswer(){if(state.locked)return;state.locked=true;const q=QUESTIONS[state.index];state.streak=0;state.history.push({time:q.time,answer:q.answer,ok:false});wrongFX("TIME OUT!",true);setTimeout(nextQuestion,1250)}
function correctFX(){beep("correct");const shell=document.getElementById("gameclockShell");if(shell){shell.classList.add("spin-fast");setTimeout(()=>shell.classList.remove("spin-fast"),900)}showFX("✅",PRAISES[Math.floor(Math.random()*PRAISES.length)],900);confetti(18)}
function wrongFX(text="TRY NEXT!",isTimeout=false){beep(isTimeout?"timeout":"wrong");const shell=document.getElementById("gameclockShell");const glass=document.getElementById("gameGlass");if(shell){shell.classList.add("shake");setTimeout(()=>shell.classList.remove("shake"),460)}if(glass){glass.classList.add("flash-red");setTimeout(()=>glass.classList.remove("flash-red"),460)}showFX(isTimeout?"⏰":"❌",text,isTimeout?900:760)}
function showFX(icon,text,duration){const fx=document.getElementById("fx");document.getElementById("fxIcon").textContent=icon;document.getElementById("fxText").textContent=text;fx.classList.add("show");setTimeout(()=>fx.classList.remove("show"),duration)}
function nextQuestion(){state.index++;state.locked=false;if(state.index>=QUESTIONS.length){clearInterval(state.timer);beep("win");state.screen="summary";render();return}state.currentChoices=shuffle(QUESTIONS[state.index].choices);state.time=ROUND_TIME;render();startTimer()}
function restart(){clearInterval(state.timer);state.screen="start";render()}
function confetti(n){const colors=["#ffe66d","#6ff2ff","#ff75e6","#59f09a","#ffffff"];for(let i=0;i<n;i++){const s=document.createElement("div");s.className="confetti";s.style.left=Math.random()*100+"vw";s.style.background=colors[Math.floor(Math.random()*colors.length)];s.style.animationDelay=(Math.random()*.35)+"s";s.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(s);setTimeout(()=>s.remove(),1900)}}
render();

const KPC_RESULT_KEY='kpc_time_mixed_ep3_v1';
const KPC_RESULT_TITLE='TIME MASTER GALAXY • MIXED';
let kpcSelectedRound=-1,kpcSelectedQuestion=0;
function kpcEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kpcTotal(){return (state.order&&state.order.length)||QUESTIONS.length}
function kpcGetAll(){
 try{const x=JSON.parse(localStorage.getItem(KPC_RESULT_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}
}
function kpcSaveCurrent(){
 if(state.kpcSaved)return;
 const item={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:state.name||'Guest',
 date:new Date().toISOString(),score:state.score,total:kpcTotal(),
 history:(state.history||[]).map(h=>({time:h.time,ok:!!h.ok,answer:h.answer,choice:h.choice,typed:h.typed}))};
 const all=kpcGetAll();all.push(item);
 try{localStorage.setItem(KPC_RESULT_KEY,JSON.stringify(all));state.kpcSaved=true;state.kpcLatest=item}catch(e){console.warn('KPC local save failed',e);state.kpcLatest=item;state.kpcSaved=true}
}
function kpcRounds(){
 const all=kpcGetAll().filter(r=>r.name===(state.name||'Guest'));
 if(state.kpcLatest&&!all.some(x=>x.id===state.kpcLatest.id))all.push(state.kpcLatest);
 return all;
}
function kpcDate(v){return new Date(v).toLocaleString('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' น.'}
function kpcChart(rounds){
 const last=rounds.slice(-10),pts=last.map((r,i)=>({x:last.length===1?50:9+i*82/(last.length-1),y:89-75*(r.score/r.total),pct:Math.round(r.score/r.total*100),n:rounds.length-last.length+i+1}));
 return `<svg class="kpc-chart" viewBox="0 0 100 110" preserveAspectRatio="none" aria-label="กราฟเส้นคะแนนย้อนหลัง" role="img">
 ${[0,25,50,75,100].map(v=>`<line x1="8" x2="94" y1="${89-v*.75}" y2="${89-v*.75}" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="2 2" stroke-width=".4"/><text x="1" y="${91-v*.75}" font-size="4" fill="white">${v}</text>`).join('')}
 ${pts.length>1?`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#6ff2ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`:''}
 ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="1.8" fill="#ffe96a"/><text x="${p.x}" y="${Math.max(7,p.y-5)}" text-anchor="middle" fill="#ffe96a" font-size="4.5">${p.pct}%</text><text x="${p.x}" y="103" text-anchor="middle" fill="white" font-size="4">#${p.n}</text>`).join('')}
 </svg>`;
}
function kpcRenderSummary(){
 kpcSaveCurrent();const rounds=kpcRounds(),last=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(last.score/last.total*100);
 const best=Math.max(...rounds.map(r=>Math.round(r.score/r.total*100)));
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">นักเรียน: ${kpcEsc(last.name)}<br>📅 ${kpcDate(last.date)}</div>
 <div class="kpc-score">${last.score} / ${last.total} คะแนน</div>
 <div class="kpc-stats"><div class="kpc-stat"><strong>${pct}%</strong><span>คะแนนล่าสุด</span></div><div class="kpc-stat"><strong>${rounds.length}</strong><span>ครั้งที่เล่น</span></div><div class="kpc-stat"><strong>${best}%</strong><span>คะแนนสูงสุด</span></div></div>
 <div class="kpc-box"><h3>📈 กราฟพัฒนาการ</h3>${kpcChart(rounds)}</div>
 <div class="kpc-box"><h3>📚 ประวัติคะแนน (แตะรอบเพื่อดูคำตอบ)</h3><div class="kpc-rounds">${rounds.map((r,i)=>`<button class="kpc-round" onclick="kpcShowRound(${i})">รอบ ${i+1} • ${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</button>`).join('')}</div></div>
 <div class="kpc-meta">${pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%'}</div>
 <div class="kpc-actions"><button class="secondary" onclick="kpcShare()">📸 แชร์ภาพรายงาน</button><button class="secondary" onclick="kpcShowRound(${rounds.length-1})">🔎 ดูเฉลยรายข้อ</button><button class="play" onclick="restart()">🚀 เล่นอีกครั้ง</button></div>
 <div class="kpc-meta" style="font-size:.82rem">บันทึกประวัติในเบราว์เซอร์นี้ • แชร์เฉพาะคะแนน ไม่รวมเฉลย</div>
 </div></div></div>`;
}
function kpcShowRound(n){
 const rounds=kpcRounds();kpcSelectedRound=Math.max(0,Math.min(n,rounds.length-1));kpcSelectedQuestion=0;kpcRenderReview();
}
function kpcShowQuestion(n){kpcSelectedQuestion=n;kpcRenderReview()}
function kpcRenderReview(){
 const rounds=kpcRounds(),r=rounds[kpcSelectedRound],history=r.history||[],h=history[kpcSelectedQuestion];
 document.getElementById('app').innerHTML=`<div class="screen"><div class="glass"><div class="kpc-report">
 <div class="kpc-brand">KRU PAI CLASSROOM</div><div class="kpc-title">ตรวจคำตอบ • ${kpcEsc(KPC_RESULT_TITLE)}</div>
 <div class="kpc-meta">${kpcEsc(r.name)} • รอบ ${kpcSelectedRound+1} • ${kpcDate(r.date)} • ${r.score}/${r.total}</div>
 <div class="kpc-box"><h3>เลือกข้อที่ต้องการดู</h3><div class="kpc-qnav">${history.map((x,i)=>`<button class="${i===kpcSelectedQuestion?'play':'secondary'}" onclick="kpcShowQuestion(${i})">${i+1}</button>`).join('')}</div>
 <div class="kpc-qdetail">${h?`<b>ข้อ ${kpcSelectedQuestion+1} • ${kpcEsc(h.time||'')}</b><br>${h.ok?'✅ ถูกต้อง':'❌ ไม่ถูกต้อง'}<br>คำตอบของนักเรียน: ${kpcEsc(h.choice??h.typed??'ไม่ได้ตอบ')}<br><b>เฉลย: ${kpcEsc(h.answer||'')}</b>`:'ไม่มีข้อมูลรายข้อในรอบนี้'}</div></div>
 <div class="kpc-actions"><button class="play" onclick="kpcRenderSummary()">⬅ กลับหน้าสรุป</button></div></div></div></div>`;
}
function kpcCanvas(){
 const rounds=kpcRounds(),r=state.kpcLatest||rounds[rounds.length-1],pct=Math.round(r.score/r.total*100),best=Math.max(...rounds.map(x=>Math.round(x.score/x.total*100)));
 const c=document.createElement('canvas');c.width=1080;c.height=1480;const g=c.getContext('2d');
 const grad=g.createLinearGradient(0,0,1080,1480);grad.addColorStop(0,'#153e87');grad.addColorStop(1,'#07112f');g.fillStyle=grad;g.fillRect(0,0,1080,1480);
 const rr=(x,y,w,h,r,fill)=>{g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
 const t=(v,x,y,size=30,color='white',align='center')=>{g.fillStyle=color;g.textAlign=align;g.font=`bold ${size}px Arial, sans-serif`;g.fillText(String(v),x,y)};
 rr(48,45,984,1380,32,'rgba(255,255,255,.09)');
 t('KRU PAI CLASSROOM',540,138,52,'#ffe96a');t('LEARNING ACHIEVEMENT REPORT',540,188,26,'#baf5ff');
 t(KPC_RESULT_TITLE,540,278,35);t('นักเรียน: '+r.name,540,350,33);t(kpcDate(r.date),540,405,28,'#d0edff');
 rr(290,465,500,125,40,'#ffe96a');t(`${r.score} / ${r.total} คะแนน`,540,547,58,'#1c2550');
 [{v:pct+'%',l:'คะแนนล่าสุด'},{v:rounds.length,l:'จำนวนรอบ'},{v:best+'%',l:'คะแนนสูงสุด'}].forEach((x,i)=>{let px=85+i*305;rr(px,645,290,145,20,'rgba(255,255,255,.13)');t(x.v,px+145,710,48,'#ffe96a');t(x.l,px+145,755,25)});
 rr(85,825,910,390,24,'rgba(0,0,0,.22)');t('กราฟพัฒนาการ',125,878,34,'#ffe96a','left');
 const last=rounds.slice(-10),left=170,right=945,top=928,bottom=1110;
 [0,25,50,75,100].forEach(v=>{let y=bottom-v/100*(bottom-top);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;g.beginPath();g.moveTo(left,y);g.lineTo(right,y);g.stroke();t(v+'%',left-18,y+7,20,'#d0edff','right')});
 const pts=last.map((x,i)=>({x:last.length===1?(left+right)/2:left+i*(right-left)/(last.length-1),y:bottom-(x.score/x.total)*(bottom-top),pct:Math.round(x.score/x.total*100),n:rounds.length-last.length+i+1}));
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle='#6ff2ff';g.lineWidth=6;g.stroke();
 pts.forEach(p=>{g.beginPath();g.arc(p.x,p.y,8,0,Math.PI*2);g.fillStyle='#ffe96a';g.fill();t(p.pct+'%',p.x,Math.max(920,p.y-20),20,'#ffe96a');t('#'+p.n,p.x,1160,19)});
 rr(85,1250,910,95,20,'rgba(255,255,255,.12)');t(pct>=80?'ผ่านเกณฑ์ 80%':'ฝึกต่อเพื่อผ่านเกณฑ์ 80%',540,1307,30,'#ffe96a');
 return c;
}
async function kpcShare(){
 try{
 const c=kpcCanvas(),blob=await new Promise(ok=>c.toBlob(ok,'image/png'));if(!blob)throw Error('PNG export failed');
 const filename=KPC_RESULT_KEY+'.png',file=new File([blob],filename,{type:'image/png'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Kru Pai Classroom'});return}catch(e){if(e.name==='AbortError')return}
 }
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
 alert('บันทึกภาพรายงานแล้ว สามารถส่งผ่าน LINE ได้จ้า');
 }catch(e){console.error(e);alert('ไม่สามารถแชร์ภาพได้ กรุณาลองอีกครั้ง')}
}
</script>
