140deg,#67d7fc,#4065d7);box-shadow:0 12px 28px #0004}.slot.locked{border-style:solid;background:linear-gradient(140deg,#ffb46a,#ff5796)}.options{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px auto;max-width:850px}.option{min-width:100px;min-height:100px;padding:10px 18px;border-radius:26px;background:linear-gradient(145deg,#ffffff,#d8ecff);color:#1b3163;border:3px solid #fff;box-shadow:0 6px 0 #5b6eae;font-size:clamp(27px,4vw,40px);font-weight:950}.option.selected{background:#9ce8f0;outline:5px solid #ffdd58;transform:translateY(3px)}.option:disabled{opacity:.45}.feedback{position:fixed;inset:0;background:#091332aa;display:flex;justify-content:center;align-items:center;z-index:20;padding:15px}.feedbackBox{max-width:600px;width:100%;border:2px solid #ffffff88;border-radius:28px;background:linear-gradient(145deg,#343f9c,#682da1);padding:28px 18px;text-align:center;box-shadow:0 20px 90px #0009;animation:popin .4s both}.feedbackBox h2{font-size:clamp(32px,6vw,56px);margin:10px 0}.feedbackBox p{font-size:19px;line-height:1.6}.burst{position:fixed;z-index:22;pointer-events:none;inset:0;overflow:hidden}.particle{position:absolute;width:12px;height:16px;left:50%;top:46%;border-radius:4px;animation:explode 1.1s ease-out forwards}.deflate{animation:deflate .85s ease-in forwards!important}.explodeBall{animation:burstBall .42s ease-out forwards!important}.lessonGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}.lessonCard{border:1px solid #ffffff55;background:#ffffff18;border-radius:20px;padding:18px;text-align:left;font-size:19px;line-height:1.7}.lessonCard strong{color:#ffdf75}.footer{text-align:center;font-size:13px;opacity:.65;padding:12px}.name{background:#fff;color:#1b2752;border:0;border-radius:13px;padding:13px;font:inherit;font-size:19px;max-width:100%;margin:14px}.score{font-size:clamp(60px,10vw,110px);font-weight:1000;color:#ffe37e}.note{font-size:15px;opacity:.85}@keyframes bob{0%,100%{translat function frac(f){return `<span class="frac"><span class="num">${f.n}</span><span class="den">${f.d}</span></span>`}function val(f){return f.n/f.d}function cmp(a,b){let v=a.n*b.d-b.n*a.d;return v>0?'>':v<0?'<':'='}function sound(kind){if(state.muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;let seq=kind==='win'?[660,880,1100]:kind==='lose'?[380,240,150]:kind==='pop'?[600,250]:[520];seq.forEach((freq,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=kind==='pop'?'triangle':'sine';o.frequency.setValueAtTime(freq,t+i*.085);g.gain.setValueAtTime(.0001,t+i*.085);g.gain.exponentialRampToValueAtTime(.13,t+i*.085+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.085+.14);o.connect(g);g.connect(audio.destination);o.start(t+i*.085);o.stop(t+i*.085+.15)})}catch(e){}}function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function header(){return `<div class="top"><div class="logo">🎈 KRU PAI CLASSROOM <span style="color:#ffdf77">/ FRACTION BATTLE</span></div><button class="chip" onclick="toggleSound()" aria-label="เปิดปิดเสียง">${state.muted?'🔇':'🔊'}</button></div>`}function render(){let body='';if(state.page==='home'){body=`<section class="panel"><div class="hero">🎈⚡🎈</div><div class="sub">FRACTION ACADEMY • LEVEL 02</div><h1 class="big">COMPARE<br><span style="color:#ffe26c">BALLOON BATTLE!</span></h1><p class="sub">ศึกเครื่องหมาย &gt; &lt; = และเติมเศษส่วนลงลูกโป่ง</p><p>⚡ 10 ข้อแรก ข้อละ 10 วินาที &nbsp; 🎈 10 ข้อหลัง ข้อละ 15 วินาที</p><input class="name" id="student" maxlength="36" placeholder="ชื่อผู้เล่น" value="${escapeHtml(state.name)}"><div><button class="btn" onclick="openLesson()">📚 ทบทวนก่อนประลอง</button></div></section>`}else if(state.page==='lesson'){body=`<section class="panel"><div class="sub">📚 ห้องเรียนก่อนประลอง</div><h1 class="big">เทียบเศษส่วน<br>ให้แม่นก่อนลุย!</h1><div class="lessonGrid"><div class="lessonCard"><strong>1. ตัวส่วนเท่ากัน</strong><div class="math" style="font-size:30px;text-align:center">${frac(F(3,7))} &lt; ${frac(F(5,7))}</div>เปรียบเทียบตัวเศษได้เลย ตัวเศษมากกว่า เศษส่วนมากกว่า</div><div class="lessonCard"><strong>2. ตัวเศษเท่ากัน</strong><div class="math" style="font-size:30px;text-align:center">${frac(F(3,4))} &gt; ${frac(F(3,8))}</div>ตัวส่วนยิ่งมาก ชิ้นส่วนยิ่งเล็ก</div><div class="lessonCard"><strong>3. ตัวส่วนต่างกัน</strong><div class="math" style="font-size:30px;text-align:center">${frac(F(2,3))} &lt; ${frac(F(3,4))}</div>ทำตัวส่วนให้เท่ากัน หรือคูณไขว้เพื่อเปรียบเทียบ</div><div class="lessonCard"><strong>4. เศษส่วนที่เท่ากัน</strong><div class="math" style="font-size:30px;text-align:center">${frac(F(1,2))} = ${frac(F(2,4))}</div>คูณหรือหารตัวเศษและตัวส่วนด้วยจำนวนเดียวกันที่ไม่ใช่ศูนย์</div></div><p class="note">ด่านเติมลูกโป่ง: แตะช่องที่ต้องการก่อน แล้วแตะเศษส่วนจากตัวเลือกด้านล่าง บางข้อมีคำตอบถูกได้หลายคู่</p><button class="btn" onclick="start()">🚀 เริ่มประลอง 20 ข้อ</button></section>`}else if(state.page==='game'){let q=questions[state.index],first=q.type==='compare';body=`<section class="panel"><div class="row"><span class="chip">${first?'⚡ สนามเครื่องหมาย':'🎈 สนามเติมลูกโป่ง'}</span><span class="chip">ข้อ ${state.index+1} / 20</span><span class="chip">⭐ ${state.score} คะแนน</span></div><h1 style="font-size:clamp(22px,3.5vw,37px);margin:20px 0">${first?'เลือกเครื่องหมายที่ถูกต้อง':'เติมเศษส่วนให้สัมพันธ์กับเครื่องหมาย'}</h1><div class="time" id="clock">⏱️ ${state.remaining} วินาที</div><div class="meter"><div id="bar" class="fill" style="width:100%"></div></div>${first?`<div class="mathline math"><div class="balloon">${frac(q.a)}</div><div class="sign">?</div><div class="balloon blue">${frac(q.b)}</div></div><div class="signs"><button class="signbtn" onclick="answerSign('<')">&lt;</button><button class="signbtn" onclick="answerSign('=')">=</button><button class="signbtn" onclick="answerSign('>')">&gt;</button></div>`:`<div class="mathline math">${slotHtml(q,0)}<span class="sign">${q.sign.replace('<','&lt;')}</span>${slotHtml(q,1)}</div><div class="sub">แตะช่องว่าง แล้วเลือกเศษส่วนด้านล่าง</div><div class="options">${q.options.map((f,i)=>`<button class="option ${state.slots.includes(i)?'selected':''}" onclick="pick(${i})">${frac(f)}</button>`).join('')}</div><div class="row"><button class="btn secondary" onclick="clearSlots()">↺ ล้างคำตอบ</button><button class="btn" onclick="checkPlace()" ${((q.left||state.slots[0]!==null)&&(q.right||state.slots[1]!==null))?'':'disabled'}>🎯 ตรวจคำตอบ!</button></div>`}</section>`}else if(state.page==='result'){let pct=Math.round(state.score/20*100);body=`<section class="panel"><div class="hero">${pct>=80?'🏆🎈':'📚💪'}</div><h1 class="big">จบการประลอง!</h1><p class="sub">${escapeHtml(state.name||'นักสู้เศษส่วน')}</p><div class="score">${state.score} / 20</div><p class="sub">${pct}% • ${pct>=90?'ดีเยี่ยม!':pct>=80?'ดีมาก!':pct>=70?'น่าพอใจ ฝึกซ้ำอีกนิด':'ลองฝึกอีกครั้ง เก่งขึ้นได้แน่นอน'}</p><div class="row"><button class="btn" onclick="restart()">🔄 เล่นอีกครั้ง</button><button class="btn secondary" onclick="showReview()">📋 ดูเฉลย</button></div></section>`}else if(state.page==='review'){body=`<section class="panel"><h1 class="big">📋 เฉลย 20 ข้อ</h1><div style="text-align:left;max-width:720px;margin:auto">${questions.map((q,i)=>`<div style="padding:13px;border-bottom:1px solid #ffffff30;font-size:20px">${i+1}. ${q.type==='compare'?`${frac(q.a)} <b style="color:#ffe27b">${cmp(q.a,q.b).replace('<','&lt;')}</b> ${frac(q.b)}`:`${q.left?frac(q.left):'□'} ${q.sign.replace('<','&lt;')} ${q.right?frac(q.right):'□'} <span style="font-size:15px">(ตัวอย่าง: ${exampleAnswer(q)})</span>`} ${state.answers[i]?'✅':'❌'}</div>`).join('')}</div><br><button class="btn" onclick="restart()">เล่นใหม่</button></section>`} $('app').innerHTML=header()+body+'<div class="footer">Kru Pai Classroom • Fraction Compare Balloon Battle • Game ID: FCB-20Q</div>'}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slotHtml(q,side){let f=side===0?q.left:q.right;let s=state.slots[side];let locked=!!f;return `<button class="${locked?'slot locked':s!==null?'slot filled':'slot'}" style="font:inherit;color:white" ${locked?'disabled':`onclick="selectSlot(${side})"`} >${locked?frac(f):s!==null?frac(q.options[s]):state.activeSlot===side?'＋':'?'}</button>`}function toggleSound(){state.muted=!state.muted;unlock();sound('click');render()}function openLesson(){state.name=$('student')?.value.trim()||'นักเรียน';unlock();sound('click');state.page='lesson';render()}function start(){unlock();sound('win');state.index=0;state.score=0;state.answers=[];state.page='game';beginQuestion()}function restart(){state.page='home';state.score=0;state.index=0;state.answers=[];render()}function beginQuestion(){clearInterval(timer);state.ended=false;state.slots=[null,null];let q=questions[state.index];state.activeSlot=q.left?1:0;state.remaining=q.type==='compare'?10:15;render();const endAt=Date.now()+state.remaining*1000;timer=setInterval(()=>{if(state.ended){clearInterval(timer);return}let ms=Math.max(0,endAt-Date.now());state.remaining=Math.ceil(ms/1000);let clock=$('clock'),bar=$('bar');if(clock)clock.textContent='⏱️ '+state.remaining+' วินาที';if(bar)bar.style.width=(ms/(q.type==='compare'?10000:15000)*100)+'%';if(ms<=0)finish(false,'หมดเวลาแล้ว!')},90)}function answerSign(s){if(state.ended)return;let q=questions[state.index];finish(s===cmp(q.a,q.b),s===cmp(q.a,q.b)?'':`คำตอบคือ ${cmp(q.a,q.b)}`)}function selectSlot(i){if(state.ended)return;state.activeSlot=i;sound('click');render()}function pick(i){if(state.ended)return;let q=questions[state.index];if(state.slots.includes(i)){let k=state.slots.indexOf(i);state.slots[k]=null;state.activeSlot=k}else{let side=state.activeSlot;if(side===0&&q.left)side=1;if(side===1&&q.right)side=0;state.slots[side]=i;let other=1-side;if(!(other===0?q.left:q.right)&&state.slots[other]===null)state.activeSlot=other;}sound('click');render()}function clearSlots(){state.slots=[null,null];state.activeSlot=questions[state.index].left?1:0;sound('click');render()}function checkPlace(){if(state.ended)return;let q=questions[state.index];let a=q.left||q.options[state.slots[0]],b=q.right||q.options[state.slots[1]];if(!a||!b)return;let correct=cmp(a,b)===q.sign;finish(correct,correct?'':`ต้องเลือกให้ด้านซ้าย ${q.sign} ด้านขวา`)}function finish(correct,reason){if(state.ended)return;state.ended=true;clearInterval(timer);state.answers[state.index]=correct;if(correct)state.score++;sound(correct?'win':'lose');let q=questions[state.index];document.querySelectorAll('.balloon,.slot.filled').forEach(el=>el.classList.add(correct?'explodeBall':'deflate'));if(correct)confetti();setTimeout(()=>{let overlay=document.createElement('div');overlay.className='feedback';overlay.id='feedback';overlay.innerHTML=`<div class="feedbackBox"><div style="font-size:65px">${correct?'🎉🎈✨':'💨🎈'}</div><h2>${correct?praise[(state.index*3+state.score)%praise.length]:'ไม่เป็นไร ลองใหม่ข้อหน้า!'}</h2><p>${correct?'เยี่ยมมาก! คิดและเลือกได้ถูกต้อง':escapeHtml(reason||'ยังไม่ถูกต้อง')}<br><span style="opacity:.8">${q.type==='compare'?`เฉลย: ${frac(q.a)} ${cmp(q.a,q.b).replace('<','&lt;')} ${frac(q.b)}`:`ตัวอย่างที่ถูกต้อง: ${exampleAnswer(q)}`}</span></p><button class="btn" onclick="nextQuestion()">${state.index===19?'🏆 ดูคะแนน':'➡️ ข้อต่อไป'}</button></div>`;document.body.appendChild(overlay)},450)}function exampleAnswer(q){for(let i=0;i<q.options.length;i++)for(let j=0;j<q.options.length;j++){if(i===j)continue;let a=q.left||q.options[i],b=q.right||q.options[j];if(cmp(a,b)===q.sign)return `${a.n}/${a.d} ${q.sign} ${b.n}/${b.d}`}return 'ตรวจสอบความสัมพันธ์'}function nextQuestion(){$('feedback')?.remove();$('fx').innerHTML='';state.index++;if(state.index>=20){state.page='result';render()}else beginQuestion()}function showReview(){state.page='review';render()}function confetti(){let fx=$('fx');fx.innerHTML='';for(let i=0;i<65;i++){let p=document.createElement('span');p.className='particle';p.style.background=['#ffdb52','#ff5ab0','#4ae9ec','#91ff96','#ffffff'][i%5];p.style.left=(35+Math.random()*30)+'%';p.style.top=(30+Math.random()*30)+'%';p.style.setProperty('--dx',(Math.random()*2-1)*650+'px');p.style.setProperty('--dy',(Math.random()*2-1)*570+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');fx.appendChild(p)}setTimeout(()=>fx.innerHTML='',1200)}render();
</script></body></html>
